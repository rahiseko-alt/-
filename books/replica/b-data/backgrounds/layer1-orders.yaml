# Layer 1 生成指示（Phase 5 完コピ検証）。生成ツールは人間が指定する（system/prompts/generate-background.md）
# - size_mm・placement の座標は仕上がり（.trim、210×297mm、左上原点）の mm。出力 PNG（150dpi、塗り足し 3mm 込み 1276×1789px）で枠の位置・直径を確認済み
# - crop_mm は補正後の参考ページ（npm run ref:prep の .cache/ref-prep/nagoya-iryo-hisho-it/brochure-2/prep/page_001-l.png、1414×2000px、1mm = 6.733px）上の範囲。
#   切り出しは npm run gen:inputs -- --book replica/b-data（.cache/gen-inputs/ に出力。mask のとおり塗ってから入力する）
# - 【重要】このページの補正画像は真のページとずれている（reviews/page_001/review.md「比較の前提」）。撮影で天 約 5mm・地 約 7mm が写っておらず、
#   ノド側 約 15% が強く縮み、上半分に紙の反りによる縦のせん断があるため、補正画像は縦に 約 4.5%・中央で横に 約 7% 引き伸ばされている。
#   ページ（page.css）は「真の幾何」で組んだので、crop_mm は枠の位置と一致しない。crop_mm は補正画像そのものの上で写真の外接矩形を画素で実測した値
#   （ずれ: ページ中央〜ノド側の円形写真は 右へ +7.7〜+12.4mm、上半分の 3 点は 上へ 2.7〜4.9mm、下段の 3 点は 下へ 1.4〜5.0mm。各 notes）。
#   円形写真の切り出しは正方形にならない（反りとノド側の縮みで楕円に写る）。入力前に size_mm の縦横比（1:1）へ伸縮して正円に戻してから使う
# - Layer 1 は円形写真 6 点と切り抜き人物 1 体の 7 件。すべて人物を含む（生成人物の使用可否は【要確認】: system/rules/image-generation.md §2）。
#   参考の人物に似せない（構図・ポーズ・服の色調・光だけを参照し、顔は架空の別人にする）
# - 対象外にしたもの（Layer 1 にしない）:
#   - 外周帯（淡い水色）と方眼紙の地紙: 単色の面と 3mm の細い罫線なので Layer 2（page.css の .band / .paper）。生成不要
#   - 地図: 参考も単色の簡略シルエット（質感・写真表現なし）。Layer 2 の SVG（中立のプレースホルダ。参考の輪郭・拠点の点はなぞらない）
#   - 雲形の吹き出し 6 個・3 色の角括弧・キラキラ・角欠きパネル・吊り下げ線・ドットリーダー・ハートのノンブル: 単純な図形（Layer 2 の SVG/CSS）
#   - 色面ラベル・大数字・注記・人物の吹き出しの手書き風の文字: Layer 3（文字）
#   - 見開きの右ページ（就職先一覧）の背後の線画の透かし: この BOOK の再現範囲（左ページ）の外
#   - ロゴ・QR: このページにはない
