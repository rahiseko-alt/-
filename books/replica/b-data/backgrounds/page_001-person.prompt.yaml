prompt: |-
  Full-length studio photograph of one person standing, isolated on a plain pure white seamless background (#ffffff), framed head to toe in a tall narrow portrait (about 1:3, width:height = 22.5:68.3) with a small even margin, to be cut out to a transparent PNG.
  Pose: standing upright facing the camera, feet together, natural relaxed posture, friendly closed-mouth smile at the camera. Her left hand (on camera-right) is raised to shoulder height with the index finger pointing up and outward toward camera-right, as if pointing at something beside her; her right forearm (camera-left) is folded across her waist, supporting the raised elbow. The pointing hand and the full puff sleeves must stay inside the frame; nothing touches the edges.
  Subject (generic, fictional): an East Asian woman in her early twenties, dark brown hair (#3c2f2c) tied back with see-through bangs, light natural make-up; wearing a loose lavender-grey long-sleeve blouse (#aca8b6) with full puff sleeves and a square neckline, a thin delicate necklace, high-waisted light-wash wide straight-leg jeans (#939bad), and plain white sneakers (#f2f0f0). No bag, no props, no visible brand marks on clothes or shoes.
  Lighting: soft, even, shadowless studio lighting from the front, crisp clean silhouette edges and hair edges for easy masking, at most a very faint contact shadow under the shoes.
  Style: photorealistic fashion catalogue photo, 85mm lens, camera at chest height to avoid perspective distortion, whole body in sharp focus, sRGB.

  Use the supplied masked reference only for composition of spatial arrangement, poses, light and colour. Invent distinct fictional people and original generic objects. Do not copy the identities, brands, school-specific features or exact original artwork. Reconstruct blanked patches naturally. Match the exact requested aspect ratio and extend any white bleed strips with the surrounding scene. Deliver a clean transparent-background PNG cut-out, keeping all limbs, hair, fingers and feet intact.
  Exclude: text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption, brand, brand mark on clothes or shoes, signage, screen text, name tag, badge, emblem, props, bag, background scenery, floor texture, strong shadow, cropped feet, cropped hands, real person likeness, celebrity, extra fingers, deformed hands, distorted face, multiple people
