  Subject (generic, fictional): an East Asian woman in her early twenties, dark hair tied back with bangs, wearing a white collared shirt under a black V-neck vest (service uniform); no name tag, no badge, no emblem.
  Lighting: soft frontal light, clean whites without clipping, gentle shadows.
  Palette: background warm orange #c8743f to #c17754 and pale khaki #cabe8b, vest black #242525, shirt white #f2f0ee, folder light green #b9cf7a, natural skin tones.
  Style: photorealistic candid editorial photo, 50mm lens, eye-level, shallow depth of field, sharp eyes, sRGB.

  Use the supplied masked reference only for composition of spatial arrangement, poses, light and colour. Invent distinct fictional people and original generic objects. Do not copy the identities, brands, school-specific features or exact original artwork. Reconstruct blanked patches naturally. Match the exact requested aspect ratio and extend any white bleed strips with the surrounding scene.
