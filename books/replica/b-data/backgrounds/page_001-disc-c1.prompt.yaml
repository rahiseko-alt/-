prompt: |-
  Square 1:1 photograph that will be shown through a circular mask (the four corners are cut away), so keep the face, hands and laptop inside the central inscribed circle.
  Composition: a waist-up shot of one young adult woman seated at an office desk, body angled slightly to camera-left, head turned toward the camera with a warm natural smile. Her face sits in the upper-left third of the frame (face centre about 35% from the left and 28% from the top; hair-to-chin about one third of the frame height). Both hands are on the keyboard of a black laptop that enters from the right edge and lower right foreground, the laptop seen from the side/back so no screen content is visible. Upper right: an out-of-focus bright office interior with a pale wall and an empty desk shelf, calm and uncluttered.
  Subject (generic, fictional): an East Asian woman in her early twenties, dark hair tied in a low ponytail, light natural make-up, wearing a light cool-grey short-sleeve office uniform blouse with thin navy piping at the collar and a small navy bow; no name tag, no badge, no emblem.
  Lighting: soft, even daylight from the front-left, bright and airy, gentle shadows, clean skin tones.
  Palette: uniform cool grey #8f8d96 with navy #2d3b64 accents, background warm pale grey-beige #d5d2cc to #dddbdc, laptop near-black #141316, natural skin tones; overall light and slightly soft like a school brochure photo.
  Style: photorealistic candid editorial photo, 50mm lens, eye-level, shallow depth of field (background softly blurred), sharp eyes, sRGB.

  Use the supplied masked reference only for composition of spatial arrangement, poses, light and colour. Invent distinct fictional people and original generic objects. Do not copy the identities, brands, school-specific features or exact original artwork. Reconstruct blanked patches naturally. Match the exact requested aspect ratio and extend any white bleed strips with the surrounding scene.
  Exclude: text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption, brand, signage, screen text, readable screen, sign, label, name tag, badge, emblem, printed paper, book spines, poster, real person likeness, celebrity, circular frame, border, vignette, extra fingers, deformed hands, distorted face
