status: review             # draft | review | approved
notes: |
  完コピ検証（Phase 5）3 ラウンド済み（books/replica/b-data/reviews/page_001/review.md）。見開きの左ページ（page.side = left、ノンブルは左下）。
  寸法は補正画像（prep）ではなく「真の幾何」の推定値から実測し、全要素を .trim 基準の mm で絶対配置（prep は天地の欠けとノド側の縮みで 約 5〜7% 拡大されて見える。review.md「比較の前提」）。
  グリッド: 列グリッドは使わず、角欠きパネル 2 枚で面を割る（上 x 19.8–193.4・y 48.0–129.4 / 下 y 135.4–276.9。パネル間 6mm）。
  上のパネルは 左 = ラベル・大数字・注記（x 25–106）／右 = 地図と吹き出し、下のパネルは 上段 = ラベル・ランキング 6 行（x 25.6–124）＋右に円形写真 3 点 ／
  下段 = レール（y 199.9）と縦の区切り線（x 109.9）で左右に分け、左 = 吹き出し・人物・ラベル・データ 4 行、右 = ラベル 3 行・リード・大数字。
  Layer 2: 外周帯（10mm）と方眼紙の地紙（3mm 方眼、CSS のグラデーション）、角欠きパネル・吊り下げ線・レール・3 色の角括弧・キラキラ・地図の簡略シルエット・
  雲形の吹き出し 6 個・ノンブルのハート（page.html の SVG。viewBox = ページの mm 座標）、色面ラベル 4 枚・ドットリーダー・円形写真の枠（HTML/CSS）。
  Layer 3: すべてダミーテキスト（字数・改行位置は参考に合わせ、数字は 0）。注記・出典・吹き出し・人物の補足は最小 6.5pt を守るため字数を減らした（参考は 約 4.5〜5.7pt）。
  地図は中立の簡略シルエット（プレースホルダ。参考の輪郭・拠点の点はなぞっていない）。
  Layer 1 生成待ち・素材待ち: 円形写真 6 点（直径 31.5・28・28・25・28・24mm）、切り抜き人物 1 体（全身 約 17×64mm、灰色のシルエット）。全面背景の生成は不要。
  色は page.css 冒頭の --rep-*（撮影画像からの推定値）。Phase 8 でブランドカラーへ置き換える。
