prompt: |-
  Square 1:1, perfectly straight-on orthographic view of the face of a single blank metallic gold plaque that fills the entire frame edge to edge, with no background, no perspective and no visible side thickness or drop shadow (the 3D edge and shadow are drawn separately in CSS).
  Composition: along all four edges a narrow raised bevelled rim about 3% of the width, catching a soft bright highlight on the top and left edges and slightly deeper on the bottom and right; just inside it a thin darker recessed groove, then one fine light embossed inner border line about 5% in from the edge. Everything inside that inner border is one flat, even, calm field with no ornament, no emblem, no engraving, no pattern and no centre line: bold white lettering will be placed over the whole central area later, so the field must stay mid-to-dark in tone with low contrast and no hotspots.
  Material: satin brushed gold metal with very fine, subtle horizontal hairline brushing, a gentle warm tonal falloff from slightly lighter upper-left to slightly deeper lower-right, clean surface without scratches, dents, fingerprints or dust.
  Lighting: soft diffuse studio light from the upper left, a soft sheen only along the rim, no specular glare or reflections of objects in the field.
  Palette: field deep amber gold #93630f to #a8802c, rim highlight #d4b05a to #edcb6b, rim shadow and groove #7b5512, darkest accent #6a4a10.
  Style: photorealistic product macro of a metal nameplate blank, sharp focus, high resolution, sRGB.

  Reference is a masked, low-resolution MATERIAL/STYLE sample only. Replace its coarse photographed finish with clean high-resolution satin gold and keep only the edge bevel arrangement. The plaque must fill the entire square image.
  Exclude: text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption, kanji, characters, symbols, emblem, crest, seal, engraving, ornament, pattern, centre line, divider, brand, perspective, tilted, drop shadow, side thickness, background, frame of a picture, glare, scratches, fingerprints
