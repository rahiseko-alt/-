status: review             # draft | review | approved
notes: >-
  Phase 5 完コピ検証（3 ラウンド。記録は reviews/page_001/review.md）。
  グリッド: 版面 = 小口 24mm・ノド 2mm・天 15mm・地 12mm（book.yaml）。表は版面の左右いっぱいで、列は page.css の --rep-cols
  （学部 34 / 縦書きラベル 8.5 / 学科・コース 50.8 / 1 年次 35.2 / 2 年次 37 / 3 年次 38.6 / 4 年次 残り、年次の間に 1.5〜1.7mm の白い隙間）。
  参考の表は 12 段グリッドに乗っていないため shared/layouts/grid.css の .col-N は使っていない。
  学部ブロックの高さは実測（62.9 / 41.3 / 17.9 / 18 / 45.2mm、間 1.8mm）、各ブロックは学科・コース 3 行の等分。セルの結合は grid-row の span。
  Layer 分担: Layer 1 なし（写真・生成背景なし。金のバッジもグラデーションの CSS）／Layer 2 = 紺帯・斜線ハッチ・バッジ・枠付きラベル・表の色面と罫線／
  Layer 3 = 見出し・説明文・表の文字・参照ページ・ノンブル。文字はすべてダミー（参考と同じ文字数・改行）、数字は 0、参照ページは P.00。
  プレースホルダ: なし（写真枠を使っていない）。色は page.css 冒頭の --rep-*（学部色 d1〜d5 は 学部セル / 4 年次 / 1〜3 年次の淡色 / 文字 の 6 色組）。
  残差は参考写真のゆがみ（ノド側上部の反り）とダミー文字の字形差だけ
