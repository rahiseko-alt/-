# BOOK の設定（npm run new:book で 2026-10-08 に作成）
# - 判型・塗り足し・解像度: system/rules/output.md ／ 命名: system/rules/naming.md
# - パスはすべてリポジトリルート相対（先頭スラッシュなし・"/" 区切り）
# id は books/ からの相対パス（ディレクトリと一致させる）
id: replica/a-brochure
title: "完コピ検証 A 学科一覧"
# kind: brochure | admissions | flyer | poster | guide | event | other
kind: brochure
description: "Phase 5 完コピ検証: 学部・学科・専攻のインデックス表（見開きの左ページ）の構造を再現する。文字はすべてダミー"
format:
  # size: A3 | A4 | A5 | B4 | B5（JIS B 列）| custom（custom は width_mm / height_mm を追加）
  size: custom
  # 参考資料の実寸は不明。片ページの縦横比 0.98（表紙の撮影画像で実測）に合わせ、高さを 297mm に固定した仮の判型
  width_mm: 291
  height_mm: 297
  # orientation: portrait | landscape
  orientation: portrait
  bleed_mm: 3                   # 塗り足し（片側）
  safe_mm: 5                    # 仕上がり線から内側の安全領域（文字・ロゴ・QR・ノンブルはこの内側）
  # 参考ページの実測（補正画像で 1mm = 6.73px）: 表の左端 24mm（小口）、表の右端 289mm（ノドまで 2mm）、
  # 上部の小見出しの上端 約 16mm、表の下端 285mm
  margins_mm: { top: 15, bottom: 12, inside: 2, outside: 24 }   # 版面のマージン（inside = ノド、outside = 小口）
  columns: 12                   # 段組の段数
  gutter_mm: 4                  # 段間
  # right にしているのは 1 ページ目を「左ページ（ノド = 右）」にするため。参考の冊子は見開きの左が奇数ノンブル
  binding: right                # left（左綴じ）| right（右綴じ）| none（一枚もの: チラシ・ポスター）
# 共通 CSS（shared/layouts/README.md）。後ろほど優先。ページ固有のスタイルは pages/<pageId>/page.css に書く
styles:
  - shared/layouts/grid.css
  - shared/layouts/typography.css
  - shared/layouts/components.css
# CSS 変数の上書き（例: "--color-accent": "#d9a21b"、"--fs-body": "9pt"）。色は原則 company-data/brand/colors/colors.yaml の値を使う
theme: {}
# ページの並び順（ページ ID は識別子。並べ替えても ID は付け直さない）。追加は npm run new:page -- --book replica/a-brochure --after <pageId>
pages:
  - page_001
output:
  png_dpi: 150                  # 完コピ検証用（印刷しない）。比較には 150dpi で十分
  preview_dpi: 150              # 作業確認用の目安（npm run render -- --dpi 150 --out /tmp/<確認用>。output/ には置かない）
notes: >-
  Phase 5 の完コピ検証用 BOOK（印刷・配布しない）。参考: references/HAL-nagoya/brochure-1/page_015.jpg（見開きの写真）の左ページ。
  比較には補正指定 references/HAL-nagoya/brochure-1/prep/page_015-l.yaml を使う（回転・左ページの切り出し・台形補正）。
  参考資料の実寸は不明（撮影画像のみ）。判型 291×297mm は縦横比だけを合わせた仮の値。
  文字はすべてダミー（同じ文字数・改行）、数字は 0。写真・生成背景は使っていない（このページは Layer 2/3 だけで再現できる）。
  参考の色は page.css 冒頭の --rep-* 変数にまとめた（Phase 8 でブランドカラーへ置き換える）。
  状態と次の作業は reviews/page_001/review.md を参照
