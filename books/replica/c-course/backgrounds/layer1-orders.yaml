      顔（x 67〜80 × y 135〜149mm）は実在の人物なので、似せないようにぼかすか塗りつぶしてから入力する（構図・ポーズ・明るさだけを参照する）
    prompt: |
      Horizontal photograph, aspect ratio 48.8:35.5 (about 1.37:1, close to 4:3), a small inset photo placed beside body text in a school brochure;
      no text overlaps it, the edges are clean straight crops.
      Composition: waist-up portrait of one young adult woman (Japanese, about 20 years old, a generic person who does not resemble any specific real
      individual), slightly left of center: her face sits about 35-57% from the left in the top half, and the top of her head just touches the top edge.
      She has dark hair tied back with soft bangs and is laughing naturally with squinting eyes. She wears a plain white short-sleeved medical scrub tunic
      with no logo, no name tag and no embroidery (a thin dark trim on the chest pocket is acceptable). At chest level, in the lower center
      (about 22-63% from the left, lower half), she holds with both hands a small anatomical model of a segment of the human spine (ivory vertebrae on a
      small muted-yellow base), with no labels on it.
      Background: on the left 0-20% a warm beige / peach curtain or wall (#e8d0b9); on the right 57-100% a plain, softly out-of-focus light grey-white wall
      (#ebeaeb) with a soft vertical edge near 57% from the left. A bright practical-training room atmosphere with nothing legible anywhere, no posters,
      no signage.
      Lighting: soft, even indoor daylight, high-key, gentle shadows.
      Palette: warm skin #af8c83 in mid-tone, dark hair #382c2e, white uniform #e7e7e7, spine model #bdaa99, base #cdb688; overall average about #cfc4be.
      Style: candid editorial photo for a vocational school brochure, photorealistic, 50mm lens at eye level, shallow depth of field (about f/2.8),
      subject sharp, background softly blurred.
    negative_prompt: "text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption, brand, signage, screen text, name tag, badge, embroidery, poster, label, celebrity likeness, frame, border, vignette"
    summary: "白衣の若い女性が脊椎の模型を手に笑う、明るい演習室の上半身の写真（一般的な人物）"
    notes: >-
