# Layer 1 生成指示（Phase 5 完コピ検証）。生成ツールは人間が指定する（system/prompts/generate-background.md）
# - 寸法はすべて仕上がり線（.trim）の左上を原点とする mm。A4 縦 210 × 297mm・塗り足し 3mm・左ページ（小口 = 左、ノド = 右）
# - size_mm は page.css / components の枠を Chromium で実測した値（2026-10-08。150dpi の出力 PNG 1276 × 1789px でも確認）
# - crop_mm は補正後の参考ページ（npm run ref:prep の出力 1414 × 2000px = 6.733px/mm）上の範囲。写真の端を濃淡の行・列の切り替わりで実測し、
#   切り出して目視で確認した。上部の写真は参考では仕上がりの内側（0〜210 × 0〜81mm）しかないため、塗り足しの 3mm は参考の外（白）になる
# - 入力の切り出し: npm run gen:inputs -- --book replica/c-course（.cache/gen-inputs/replica/c-course/<id>.png。mask のとおり塗ってから入力する）
# - 必要な画素数: 上部の写真 1276 × 496px（png_dpi 150）／ 2976 × 1157px（350dpi）、回り込みの写真 各 288 × 210px（150dpi）／ 672 × 489px（350dpi）
# - 3 点とも人物を含む（生成人物は使用可。2026-10-08 決定）（system/rules/image-generation.md §2）。顔・名札・刺繍ロゴは入力前に塗る（mask）
# - 参考の写真に写る実在の人物・制服のロゴ・施設を再現しない。生成するのはリハビリ・演習の場面の一般的な人物だけ（施設名・看板・掲示物なし）
book: replica/c-course
page: page_001
reference_image: references/kokusai-igaku-gijutsu/brochure/page_006.jpg
reference_prep: references/kokusai-igaku-gijutsu/brochure/prep/page_006-l.yaml
status: pending
items:
  # ---------------------------------------------------------------------------
  # 1. 上部の裁ち落とし写真（天・小口・ノドの 3 方向に塗り足し）
  # ---------------------------------------------------------------------------
  - id: page_001-header
    kind: photo
    people: true
    optional: false
    size_mm: [216.0, 84.0]          # 仕上がり 210 × 81mm + 塗り足し（天・小口・ノド各 3mm。地は白地の本文側なので塗り足しなし）
    bleed: true
    crop_mm: [-3.0, -3.0, 216.0, 84.0]   # 参考に写っているのは 0〜210 × 0〜81mm。外側の 3mm（天・左・右）は参考の外
    placement: >-
      components/dept-header.hbs の photo-frame（.dept-header__photo。x −3〜213 × y −3〜81mm の 216 × 84mm、
      .photo-frame は height: 100%、画像は object-fit: cover）に src を渡す。部品はいま photo（company-data の写真 ID）しか受けないため、
      src 引数を足して {{> photo-frame src=src}} とし、page.html の {{> book/dept-header name="学科名ダミー" src="books/replica/c-course/backgrounds/page_001-header.jpg"}} で指定する。
      左下 x −3〜65.2 × y 69.9〜81mm（塗り足し込み 68.2 × 11.1mm）は学科名のタブ（.dept-header__notch の白い長方形）で隠れる
    reference_usage: composition
    mask: >-
      参考の学科名のタブ（白い切り欠きと学科名の文字）: 仕上がり基準 x 0〜65.2 × y 69.9〜81.0mm（入力画像の中では左下 x 3〜68.2 × y 72.9〜84mm）を
      周囲の肌色・淡い背景でなじませて塗るかマスクする。右端 x 209〜210mm のノドの影（撮影による暗い帯）も淡い背景色で塗る。
      入力画像の天・左・右の外周 3mm の白い帯は参考の外（gen:inputs が白で埋めた部分）なので、写真を自然に延長させる（アウトペイント）
    prompt: |
      Ultra-wide horizontal photograph, aspect ratio 216:84 (about 2.57:1), used as a full-bleed banner across the top of a printed brochure page.
      Composition: an extreme close-up of a physical rehabilitation session that shows only arms and hands - no faces anywhere in the frame.
      From the left edge a therapist's bare forearm enters diagonally from the lower left; its hand (center-left, about 25-45% from the left, upper half)
      gently but firmly grips the patient's forearm near the wrist. A second therapist arm reaches horizontally across the top of the frame (top 0-40%)
      from left to right, and its open hand rests on the shoulder of the patient at the right (about 60-90% from the left), who wears a plain white
      short-sleeved T-shirt. The patient's smooth bare upper arm runs diagonally from the white sleeve at the right down toward the bottom center with a
      bent elbow, so the arms form a strong diagonal, triangular rhythm across the whole width. Subjects are cropped boldly by the top, left and right edges.
      Keep the bottom-left area (left 32% of the width x bottom 17% of the height) free of any important detail: it will be covered by a white label panel,
      so only soft out-of-focus skin or pale background may continue there. Keep the bottom-right area (right 40% x bottom 30%) a bright, almost white,
      out-of-focus background. The outer edges (about 3.5% of the width on the left and right, 3.5% of the height at the top) will be trimmed, so extend
      the scene naturally to every edge and keep the hands well inside.
      Background: a bright, clean, airy room blurred into soft white and pale warm grey (#f8f8f8, #e6ddda, #b7a096 in the mid shadows), no objects,
      no equipment, no signage.
      Lighting: high-key soft daylight from the upper right, very gentle shadows, slightly overexposed creamy highlights on the skin.
      Palette: warm natural skin tones from #864f3b (deep shadow) through #b07d6a and #b6846f to #e1cdc3 (highlight), white fabric #ebe8e9 to #f7f9f9.
      Style: editorial school-brochure photography, photorealistic, 85mm lens, close-up at arm height, shallow depth of field (about f/2),
      clean skin without jewelry or watches, plain clothing without any marks.
    negative_prompt: "text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption, brand, signage, screen text, name tag, badge, embroidery, face, faces, jewelry, wristwatch, frame, border, vignette, split image"
    summary: "リハビリの場面の腕と手だけを大胆に切り取ったハイキーの超横長写真（顔なし。左下はタブで隠れるので空ける）"
    notes: >-
      参考は人物の腕と手を大胆に切ったハイキーのクローズアップ（顔は写っていない）。全体の平均色 #be9c90。参照の強さは 0.5〜0.7 程度を目安に構図・明るさを寄せ、
      手や腕の形は作り直してよい。左下 65.2 × 11.1mm（仕上がり基準。小口側の塗り足しを含めると 68.2 × 11.1mm）は学科名のタブで隠れるため、
      手指など重要なものを置かない。参考は見開きのノドで写真を止めているが、この BOOK はノド側も塗り足しまで写真を延ばす。
      参考の写真の下端がノド寄り（x 175〜210mm）で 0.5〜1mm 波打つのは紙の反りで、生成画像の下端は CSS の枠で水平に切れる。
      画像は 2976 × 1157px（350dpi）を目安に、最低 1276 × 496px（png_dpi 150）。写真調なので .jpg 可
