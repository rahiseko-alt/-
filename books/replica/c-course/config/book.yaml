# BOOK の設定（npm run new:book で 2026-10-08 に作成）
# - 判型・塗り足し・解像度: system/rules/output.md ／ 命名: system/rules/naming.md
# - パスはすべてリポジトリルート相対（先頭スラッシュなし・"/" 区切り）
# id は books/ からの相対パス（ディレクトリと一致させる）
id: replica/c-course
title: "完コピ検証 C 学科紹介"
# kind: brochure | admissions | flyer | poster | guide | event | other
kind: brochure
description: "Phase 5 完コピ検証用の BOOK（学科紹介の見開きの左ページ 1 ページ）。印刷用ではない"
format:
  # size: A3 | A4 | A5 | B4 | B5（JIS B 列）| custom（custom は width_mm / height_mm を追加）
  size: A4
  # orientation: portrait | landscape
  orientation: portrait
  bleed_mm: 3                   # 塗り足し（片側）
  safe_mm: 5                    # 仕上がり線から内側の安全領域（文字・ロゴ・QR・ノンブルはこの内側）
  # 版面のマージン（参考ページの実測: 小口 15.3mm・ノド 12.5mm。天は裁ち落とし写真があるため本文は 91mm から。地は科目リストの下端 約 278mm）
  margins_mm: { top: 12, bottom: 18, inside: 12.5, outside: 15.3 }
  columns: 12                   # 段組の段数（このページは本文 2 段・科目リスト 2 段を page.css の mm で配置）
  gutter_mm: 4                  # 段間
  # 参考の冊子は左綴じだが、この BOOK は 1 ページだけなので、page_001 を左ページ（小口 = 左、ノンブル = 左下）として出すために right にしている
  binding: right                # left（左綴じ）| right（右綴じ）| none（一枚もの: チラシ・ポスター）
# 共通 CSS（shared/layouts/README.md）。後ろほど優先。ページ固有のスタイルは pages/<pageId>/page.css に書く
styles:
  - shared/layouts/grid.css
  - shared/layouts/typography.css
  - shared/layouts/components.css
# CSS 変数の上書き（例: "--color-accent": "#d9a21b"、"--fs-body": "9pt"）。色は原則 company-data/brand/colors/colors.yaml の値を使う
theme: {}
# ページの並び順（ページ ID は識別子。並べ替えても ID は付け直さない）。追加は npm run new:page -- --book replica/c-course --after <pageId>
pages:
  - page_001
output:
  png_dpi: 150                  # 完コピ検証専用（比較用。印刷には使わない）。自社版で印刷するときは 350 に戻す
  preview_dpi: 150              # 作業確認用の目安（npm run render -- --dpi 150 --out /tmp/<確認用>。output/ には置かない）
notes: |
  - Phase 5（完コピ検証）の BOOK。参考 references/kokusai-igaku-gijutsu/brochure/page_006.jpg（見開きの撮影画像）の左ページの
    レイアウトだけを再現する。比較は references/kokusai-igaku-gijutsu/brochure/prep/page_006-l.yaml（正立・単ページ・台形補正の指定）で行う
  - 判型: 実寸は不明。表紙のフラットなスキャン（references/kokusai-igaku-gijutsu/brochure/page_002.jpg）の縦横比 1:1.413 から √2 比と判断し A4 縦とした
  - 左ページ（ノンブル左下）として出すため binding: right（上の format のコメント）
  - 学科色を page.css の --rep-dept 1 つに集約している。同型の references/kokusai-igaku-gijutsu/brochure/page_008.jpg（別の学科）は
    この変数の差し替え（青 → 深緑）で色が再現できる（縦棒・行頭記号・ラベル・学科名の淡い色は --rep-dept から color-mix で作る）
  - 文字はすべてダミー（同じ字数・行数）。数字は 0。写真はすべて photo-frame のプレースホルダ（Layer 1 生成待ち）
  - output.png_dpi は 150（比較用）。印刷用ではない
  - 経過と次の作業は reviews/page_001/review.md
