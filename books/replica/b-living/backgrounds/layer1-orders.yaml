# Layer 1 生成指示（Phase 5 完コピ検証）。生成ツールは人間が指定する（system/prompts/generate-background.md）
# - 座標・寸法は仕上がり（.trim、A4 縦 210×297mm、左上原点）の mm。crop_mm は補正後の参考ページ
#   （reference_prep を npm run ref:prep で補正した .cache/ref-prep/ 以下の page_002-r.png、1414×2000px、1mm = 6.733px）上の範囲
# - 入力画像の切り出しは npm run gen:inputs -- --book replica/b-living（.cache/gen-inputs/ に出力。mask のとおり塗ってから入力する）
# - mask の座標は、切り出し範囲（crop_mm）の左上を原点とする mm
# - size_mm は page.css の値を出力 PNG（150dpi・塗り足し 3mm 込み 1276×1789px）の灰色のプレースホルダの外接矩形で確認した（差 0.2mm 以内）。
#   crop_mm は補正画像を切り出して目視し、写真の端の明暗の段差でも確認した（写真 A の左右端 19.6 / 101.5mm、左下の横長の写真の左右上端 17.45 / 95.45 / 222.2mm など、差 0.3mm 以内）
# - 写真の角丸（特徴カード 1.2mm、下段の写真 1mm）は Layer 2。生成画像は角丸なしの矩形で作り、page.css で .photo-frame__img に角丸を付ける
# - 写真に重なる要素（吹き出しタグ・無線 LAN のバッジ・下端の半透明の帯・写真の左下の暗いラベル）は Layer 2/3 のまま。生成画像には描かない
# - 対象外にしたもの（Layer 1 にしない）:
#   - アプリのロゴ（7.6×8.5mm の破線の枠 .app-logo）: ロゴは生成しない（正式データを受け取る。参考のロゴは使わない）
#   - 動画サービスのロゴ: 汎用の再生アイコン（Layer 2 の SVG）に置き換え済み。ロゴは生成しない
#   - QR 2 点: Layer 3（{{qr}}）
#   - 星と親指のアイコン、無線 LAN・電話・かばんの線画、設備アイコンの格子 15 枚、右下のパネルの黄色の円と手とスマートフォンの線画:
#     参考も単色の面＋線画の単純なアイコンなので Layer 2 の SVG のまま
#   - 全面背景: 白地＋上部の薄グレーの帯＋単色のカード・ピルで、Layer 2 で再現済み（page.yaml）。
#     参考の照明むら・紙の反り・裏写り（数字の右の淡い帯・説明文の下の反転文字）は撮影の副産物なので再現しない
