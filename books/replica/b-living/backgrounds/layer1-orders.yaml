    prompt: |
      Candid lifestyle photograph, horizontal frame with an aspect ratio of 81.6:46.6 (about 7:4), of a relaxed group of eight young Japanese adults around 19 to 22 years old (mixed men and women, entirely fictional people who do not resemble any real person or celebrity) standing loosely in a row in a bright, airy modern glass-walled entrance hall, eye level from chest height, 70mm lens, shallow depth of field.
      Composition: the main subject, a young woman with long straight dark hair in a white short-sleeve blouse and a khaki pinafore dress carrying a black backpack, stands just left of centre (about 35 to 50% of the width), turned back over her shoulder and smiling toward the camera, in sharp focus. To her left a young man in a navy checked shirt (#2c2a45) looking back and smiling; at the far left edge two people partly cut off by the frame, one holding a navy tote bag. Behind her to the right, slightly out of focus, a young man in a light pink shirt and one in a light blue shirt (#818cc1); at the right a smiling young woman holding a white canvas tote and, at the far right edge, a young woman in a white blouse and a mustard-yellow pleated skirt (#ac7d4a) looking toward the main subject. Everyone is shown from about the knees or waist up, cropped by the bottom edge.
      Background: high-key, softly blurred glass wall and columns, pale grey-blue (#dfe6ea) with vertical window mullions and soft white light, slightly darker grey-green (#98a4a0) at the far left. The top-left area (about 30% of the width x 25% of the height) must contain only calm blurred background, because a label covers it.
      Lighting and style: soft natural daylight, airy and bright, natural skin tones, friendly, free and relaxed atmosphere, realistic editorial lifestyle photography, sRGB.
      No logos or prints on clothing or bags, no signs or lettering anywhere.
    negative_prompt: "text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption, brand, signage, screen text, printed t-shirt, celebrity, real person, distorted hands, extra fingers, deformed faces, uniform"
    summary: "明るいガラス張りのホールで振り返って笑う若者 8 人のスナップ（中央左の女性にピント、背景は白く飛んだガラス）"
    notes: "（生成人物は使用可。2026-10-08 決定）（system/rules/image-generation.md §2）。実在の在校生・卒業生と誤認されない表現にし、掲載前に人間が確認する。参考写真の人物（顔・髪型・服の柄の組み合わせ）を再現しない: img2img は使わず、構図参照は弱め（人数・立ち位置・視線の向きだけ）。手指・顔の破綻を拡大して確認する。必要画素: 350dpi で 1124×642px、150dpi で 482×275px。JPG（sRGB）可"

