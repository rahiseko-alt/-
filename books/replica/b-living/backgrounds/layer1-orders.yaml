    placement: 'page.html の特徴カード A（{{#> book/feature-card mod="a" ... ratio="81.6 / 62.6"}}）の写真枠。components/feature-card.hbs に任意の src パラメータを足し（{{#if src}} で photo-frame に src=src を渡す）、カード A の呼び出しに src="books/replica/b-living/backgrounds/page_001-photo-room.jpg" を渡す。page.css に .fcard__photo .photo-frame__img { border-radius: 1.2mm; } を追加。無線 LAN のバッジ・下端の半透明の帯と文字・吹き出しタグはそのまま上に重なる'
    reference_usage: composition
    mask: "吹き出しタグ（x 0–25・y 0–16mm）、右上の無線 LAN のバッジ（x 70–80・y 2–12mm）、下端の半透明の帯とその上の注記 2 行・電話のマーク・電話番号（y 53.5–62.6mm の全幅）を、周囲の壁・床に近い無地の灰色で塗りつぶす。エアコン・家具にメーカーのロゴ状のものがあれば同様に塗る"
    prompt: |
      Interior photograph of a compact, fully furnished single student-residence bedroom, horizontal frame with an aspect ratio of 81.6:62.6 (about 4:3), shot from the doorway corner at chest height looking diagonally into the room, 24mm-equivalent wide-angle lens, verticals kept straight, no people.
      Composition, left to right: on the left third a tall window / glass balcony door filled with soft bright overcast daylight (near-white #f3f3f3), sheer white lace curtains and heavy dark mauve-grey drapes (#34292d) gathered at both sides; above the window a plain white wall-mounted air conditioner with no visible markings; a white ceiling (#d9d6d8) with a round flush-mount LED ceiling light near the top centre. On the right half an accent wall of light warm wood-grain panels (#a68d7d) above a long dark-brown wooden desk (#2b221d) with a black mesh office chair, and a low black metal open shelf with a few plain storage boxes and one small blank picture frame. In the lower-left foreground the corner of a single bed with a greige duvet (#aca19b) and a pale sage throw.
      Areas to keep calm: the top-left area (about 30% of the width x 25% of the height) must be plain ceiling and upper wall only, because a label covers it; the top-right corner (about 13% x 18%) must be plain ceiling or wall for a small badge; the bottom 14% of the frame (floor and bed edge, #cdc8c7) must be low-contrast and simple, because a translucent white caption strip is laid over it.
      Lighting and style: soft natural window light from the left, gentle fill, neutral-warm white balance, clean and uncluttered, realistic real-estate / interior photography, sharp focus, sRGB.
      Do not show posters, books with titles, screens, signs or any lettering; the room must not resemble any specific real property.
    negative_prompt: "text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption, brand, signage, screen text, poster, book spines, label, people, person, clutter, fisheye distortion"
    summary: "家具付きの個室の室内写真（左に窓とカーテン、右に木目の壁・机・椅子・棚、手前にベッド。人物なし）"
    notes: "必要画素: 350dpi で 1124×863px、BOOK の png_dpi 150 で 482×370px。写真調なので JPG（sRGB）でよい（PNG なら placement の拡張子を合わせる）。参考の部屋・家具をそのまま写さない（構図と明暗の配置だけを参照し、img2img の強い参照は使わない）。生成後、下端 14% に半透明の白い帯と文字が載っても読めるか npm run render で確認する。Phase 8 では自社の写真（company-data/photos/）に差し替える前提の仮素材"

