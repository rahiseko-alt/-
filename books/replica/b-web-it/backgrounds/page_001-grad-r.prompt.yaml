prompt: |-
  Square photo, aspect ratio 1:1, eye-level three-quarter view of a young professional working at a desk against a plain white wall.
  Composition: the subject sits left of centre (between about 10% and 75% of the width) in a black mesh office chair whose backrest shows along the left edge; head in the upper-centre (top of the hair about 6% below the top edge, face between about 30% and 52% of the width), turned slightly to the right; both hands on a black keyboard and mouse on a light wooden desk in the lower-right quarter; the edge of a black PC tower runs along the right edge from about 30% to 80% of the height. The upper right is a calm, plain white wall.
  Subject: a young adult woman (early 20s) with dark hair tied back and straight bangs, wearing a plain black polo shirt, slight smile, looking at an unseen screen to the right; a generic face that does not resemble any real person.
  Lighting: bright, soft, even office light, high-key white wall, mild shadows.
  Palette: white wall #f6f5f1, black polo #1d161e, chair and tower near-black #0e090d, light wood desk #ccb097, warm skin #c3a094.
  Style: natural editorial workplace photograph, 35mm lens, f/4, realistic, sRGB.

  Use the supplied masked reference only for composition of spatial arrangement, poses, light and colour. Invent distinct fictional people and original generic objects. Do not copy the identities, brands, school-specific features or exact original artwork. Reconstruct blanked patches naturally. Match the exact requested aspect ratio and extend any white bleed strips with the surrounding scene.
  Exclude: text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption, readable screen text, keyboard legends, brand, brand logo on PC or chair, embroidered logo on polo shirt, signage, poster, book spines, name tag, lanyard, celebrity, real person likeness, extra fingers, distorted hands, frame, border
