  Landscape photo, aspect ratio 36.9:19.7 (about 1.87:1), eye-level medium shot across a desk in a dim, modern office in the evening.
  Composition: the subject sits in the centre (between about 32% and 70% of the width), head in the upper third (top of the hair about 3% below the top edge), facing the camera. In front of him, at left-centre (about 15% to 50% of the width, from 45% to 85% of the height), the plain dark-navy back of an open laptop lid with no logo. On the right 30%, a large dark monitor seen from the side with only a faint cool-blue reflection, and his hand on a mouse at the lower right. A dark navy mug on the desk at the far left. A warm grey-brown desk edge runs across the bottom 12%. Background: softly blurred office interior, brighter window light with a dark vertical frame in the left 20%, dark grey walls behind him.
  Subject: a young adult man (around 20) with short dark hair, wearing a light blue-grey chambray shirt, plain white over-ear headphones resting around his neck, calm slight smile; a generic face that does not resemble any real person.
  Lighting: low-key ambient office light, soft light on the face from the front-left, moderate contrast.
  Palette: dark greys #302e35 / #514a4c, navy laptop lid #13152d, blue-grey shirt #4d546d to #8a93a8, window light #aaa59d, desk #685655, navy mug #2d2f44.
  Style: natural editorial photograph for a vocational school brochure, 35mm lens, f/2.8, shallow depth of field, realistic, sRGB.

