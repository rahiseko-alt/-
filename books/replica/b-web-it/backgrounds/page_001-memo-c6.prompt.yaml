prompt: |-
  Landscape photo, aspect ratio 36.9:19.5 (about 1.89:1), eye-level medium shot of a programmer at a desk in a bright white office.
  Composition: in the left 30% of the frame, an open dark laptop or small monitor seen at an angle from about 30% to 90% of the height, its screen showing only a dark, heavily blurred glow (no readable code, no characters), with a muted magenta-pink base along its bottom edge. The subject is in the centre-right (between about 38% and 70% of the width), head in the upper third (top of the hair about 3% below the top edge), looking down to the right at a plain white monitor seen from its back-left side, which fills the right 30% of the frame from about 35% to 85% of the height. A clear glass of water and a light wooden tray on the desk at the bottom centre. Background: bright white shelves with soft, blurred neutral objects along the top 15%, a small mustard-yellow object behind the subject's shoulder on the left.
  Subject: a young adult man (early 20s) with short dark hair and thin-framed glasses, wearing a plain black crew-neck T-shirt, focused expression, typing; a generic face that does not resemble any real person.
  Lighting: soft high-key daylight from the right, gentle shadows, clean whites.
  Palette: off-white walls #f0ece6 / #ebe7e2, black T-shirt #0b0a0e, white monitor #dad8d5, dark screen #232020, mustard accent #dac15f, magenta accent #7d4461, warm tray tone #9d8a7d.
  Style: natural editorial photograph for a vocational school brochure, 35mm lens, f/2.8, shallow depth of field, sharp focus on the face, realistic, sRGB.

  Use the supplied masked reference only for composition of spatial arrangement, poses, light and colour. Invent distinct fictional people and original generic objects. Do not copy the identities, brands, school-specific features or exact original artwork. Reconstruct blanked patches naturally. Match the exact requested aspect ratio and extend any white bleed strips with the surrounding scene.
  Exclude: text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption, readable screen text, source code, code lines, terminal, user interface labels, keyboard legends, brand, brand logo on laptop or monitor, apple logo, signage, poster, book spines, name tag, lanyard, celebrity, real person likeness, extra fingers, distorted hands, frame, border
