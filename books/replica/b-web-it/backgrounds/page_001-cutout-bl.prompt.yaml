prompt: |-
  Full-body cut-out photo of a single standing person, isolated on a plain pure white background (#ffffff), to be cut out to a transparent PNG. Portrait aspect ratio 20.2:55 (about 0.37:1); the figure fills the frame from the top of the head to the soles of the shoes with minimal margin.
  Pose: standing straight and facing the camera, feet together; the hand on the viewer's left rests on the hip with the elbow pointing out to the left edge (about 30% from the top); the hand on the viewer's right is raised beside the head with the index finger pointing straight up (the fingertip at the right edge, about 14% from the top), as if pointing at something beside her.
  Subject: a young adult woman (around 20) with a dark shoulder-length bob with bangs, a white short-sleeve blouse with a thin black ribbon line under the chest, loose white wide-leg trousers with a sparse small dark-grey dot print and a dark fabric sash tie hanging at the hip on the viewer's left, simple dark sandals; cheerful smile; a generic face that does not resemble any real person.
  Lighting: soft, even, bright studio light, no cast shadow on the background (at most a very faint contact shadow under the shoes), crisp edges for clean masking.
  Palette: white blouse #f8f5f6, off-white trousers #dfd5d0 with dark grey dots #4a4a55, dark hair #3d322c, warm skin #d9b9a0.
  Style: realistic full-length fashion catalogue photograph, 70mm lens, camera at waist height, no perspective distortion, sRGB.

  Use the supplied masked reference only for composition of spatial arrangement, poses, light and colour. Invent distinct fictional people and original generic objects. Do not copy the identities, brands, school-specific features or exact original artwork. Reconstruct blanked patches naturally. Match the exact requested aspect ratio and extend any white bleed strips with the surrounding scene. Deliver a clean transparent-background PNG cut-out, keeping all limbs, hair, fingers and feet intact.
  Exclude: text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption, brand, brand logo on sandals, printed slogan on clothing, name tag, lanyard, background scenery, floor texture, props, second person, cropped feet, cropped head, harsh shadow, white halo, celebrity, real person likeness, extra fingers, distorted hands, frame, border
