#   参考の人物は実在の在校生・卒業生なので、参考画像は構図（姿勢・配置・画角）の参照だけに使い（reference_usage: composition）、
#   顔は入力前に塗りつぶす。顔立ち・髪型を参考の人物に寄せない
# - 画面が写る写真（memo-c1・memo-c6・memo-c7）は、画面の中身を文字のないぼけた抽象的な面にする（読める文字・コード・UI のラベルを入れない）
