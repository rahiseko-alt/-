prompt: |-
  Landscape photo, aspect ratio 37.1:20.8 (about 1.78:1), straight-on eye-level medium shot across a white desk in a bright, minimal office.
  Composition: the upper 35% of the frame is a calm, plain white wall with nothing on it. The subject sits just right of centre (between about 38% and 65% of the width), head in the upper half (top of a high hair bun about 5% below the top edge), shoulders and arms down to the desk; both hands rest on a mouse and a slim keyboard on the white desk in the bottom 15%. The right 25% of the frame is the plain back of a large all-in-one monitor in a warm terracotta-orange finish, from about 15% to 85% of the height, seen from behind so no screen is visible. In the lower-left 30%, a low olive-green sofa and a white low shelf, softly out of focus.
  Subject: a young adult woman (around 20) with dark hair in a high bun, wearing a pale yellow crew-neck T-shirt, smiling naturally and looking slightly to the left of the camera; a generic face that does not resemble any real person.
  Lighting: soft, even, high-key daylight, almost shadowless, bright clean whites.
  Palette: white wall #faf9f8, pale yellow T-shirt #c4bc92 to #ddd3a3, terracotta monitor back #c57a56, olive sofa #847c3e, warm skin #a17d72, dark hair #2a2224.
  Style: natural editorial photograph for a vocational school brochure, 35mm lens, f/4, sharp focus on the face, realistic, sRGB.

  Use the supplied masked reference only for composition of spatial arrangement, poses, light and colour. Invent distinct fictional people and original generic objects. Do not copy the identities, brands, school-specific features or exact original artwork. Reconstruct blanked patches naturally. Match the exact requested aspect ratio and extend any white bleed strips with the surrounding scene.
  Exclude: text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption, readable screen text, keyboard legends, brand, brand logo on monitor, apple logo, signage, poster, book spines, name tag, lanyard, celebrity, real person likeness, extra fingers, distorted hands, frame, border
