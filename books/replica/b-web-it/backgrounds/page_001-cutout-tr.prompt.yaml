prompt: |-
  Full-body cut-out photo of a single standing person, isolated on a plain pure white background (#ffffff), to be cut out to a transparent PNG. Portrait aspect ratio 21.5:59 (about 0.36:1); the figure fills the frame from the top of the head to the soles of the shoes with minimal margin.
  Pose: standing, body turned slightly to the viewer's left, weight on one leg, the other foot stepping out to the viewer's right so the shoes reach the right edge at the bottom; the arm on the viewer's left is raised with a light, cheerful fist beside the shoulder (the fist touches the left edge about 12% from the top); the other arm hangs relaxed at her side, partly behind the skirt.
  Subject: a young adult woman (around 20) with long straight dark hair falling past her shoulders, a plain white short-sleeve T-shirt tucked into a long black maxi skirt with a slight mermaid flare, chunky black sport sandals with pale straps; friendly smile toward the camera; a generic face that does not resemble any real person.
  Lighting: soft, even studio light from the front-left, no cast shadow on the background (at most a very faint contact shadow under the shoes), crisp edges and separated hair strands for clean masking.
  Palette: white T-shirt #f0eeea, black skirt and sandals #161413 to #272526, dark hair #2c2828, natural skin tones.
  Style: realistic full-length fashion catalogue photograph, 70mm lens, camera at waist height, no perspective distortion, sRGB.

  Use the supplied masked reference only for composition of spatial arrangement, poses, light and colour. Invent distinct fictional people and original generic objects. Do not copy the identities, brands, school-specific features or exact original artwork. Reconstruct blanked patches naturally. Match the exact requested aspect ratio and extend any white bleed strips with the surrounding scene. Deliver a clean transparent-background PNG cut-out, keeping all limbs, hair, fingers and feet intact.
  Exclude: text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption, brand, brand logo on sandals, printed slogan on clothing, name tag, lanyard, background scenery, floor texture, props, second person, cropped feet, cropped head, harsh shadow, white halo, celebrity, real person likeness, extra fingers, distorted hands, frame, border
