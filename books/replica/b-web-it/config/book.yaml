# BOOK の設定（npm run new:book で 2026-10-08 に作成）
# - 判型・塗り足し・解像度: system/rules/output.md ／ 命名: system/rules/naming.md
# - パスはすべてリポジトリルート相対（先頭スラッシュなし・"/" 区切り）
# id は books/ からの相対パス（ディレクトリと一致させる）
id: replica/b-web-it
title: "完コピ検証 B 職種チャート"
# kind: brochure | admissions | flyer | poster | guide | event | other
kind: brochure
description: "Phase 5 完コピ検証: 職種の座標チャート（縦横 2 軸の矢印＋メモカード＋卒業生ボックス）の片ページを再現する。文字はすべてダミー、写真はプレースホルダ"
format:
  # size: A3 | A4 | A5 | B4 | B5（JIS B 列）| custom（custom は width_mm / height_mm を追加）
  size: A4
  # orientation: portrait | landscape
  orientation: portrait
  bleed_mm: 3                   # 塗り足し（片側）
  safe_mm: 5                    # 仕上がり線から内側の安全領域（文字・ロゴ・QR・ノンブルはこの内側）
  margins_mm: { top: 8, bottom: 14, inside: 13.5, outside: 12.5 }   # 参考ページの実測（要素の外端: 上 8・下 14・ノド側 13.5・小口側 12.5mm）。ページ内の要素は page.css で mm の絶対配置
  columns: 12                   # 段組の段数
  gutter_mm: 4                  # 段間
  binding: left                 # left（左綴じ）| right（右綴じ）| none（一枚もの: チラシ・ポスター）
# 共通 CSS（shared/layouts/README.md）。後ろほど優先。ページ固有のスタイルは pages/<pageId>/page.css に書く
styles:
  - shared/layouts/grid.css
  - shared/layouts/typography.css
  - shared/layouts/components.css
# CSS 変数の上書き（例: "--color-accent": "#d9a21b"、"--fs-body": "9pt"）。色は原則 company-data/brand/colors/colors.yaml の値を使う
theme: {}
# ページの並び順（ページ ID は識別子。並べ替えても ID は付け直さない）。追加は npm run new:page -- --book replica/b-web-it --after <pageId>
pages:
  - page_001
output:
  png_dpi: 150                  # この完コピ検証 BOOK だけ 150（比較用。印刷用の BOOK は 350 のまま）
  preview_dpi: 150              # 作業確認用の目安（npm run render -- --dpi 150 --out /tmp/<確認用>。output/ には置かない）
notes: |
  完コピ検証（Phase 5）用の 1 ページ BOOK。参考: references/nagoya-iryo-hisho-it/brochure-web-it/page_003.jpg の左ページ
  （比較は references/nagoya-iryo-hisho-it/brochure-web-it/prep/page_003-l.yaml で正立・単ページ・台形補正した画像と行う）。
  判型: 物理サイズは不明。参考は撮影画像で、紙の端から測った片ページの縦横比は 約 0.67 だが、ページ内の正円（大きな黄色の円・ノンブルの円）が
  横 0.947 倍の楕円に写っており、撮影時の横方向の縮み（ページの反り）と判断した。円が正円になる補正後の縦横比は 約 0.71 で、
  A4 縦（0.7071）との差が 2% 以内のため A4 縦とした。
  参考ページは見開きの左ページ（ノンブルは左下）。この BOOK は 1 ページだけなので page_001 は右ページ扱いになるが、
  要素はすべて .trim 基準の mm で絶対配置しており、左右のマージン変数は使っていない。
  Layer 1: 画像生成ツールがないため、写真・切り抜き人物はすべてプレースホルダ（photo-frame・灰色のシルエット）。全面背景の生成は不要（地・円・軸はすべて単色で Layer 2）
