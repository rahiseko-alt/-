# BOOK の設定（npm run new:book で 2026-10-08 に作成）
# - 判型・塗り足し・解像度: system/rules/output.md ／ 命名: system/rules/naming.md
# - パスはすべてリポジトリルート相対（先頭スラッシュなし・"/" 区切り）
# id は books/ からの相対パス（ディレクトリと一致させる）
id: replica/a-course
title: "完コピ検証 A 学科紹介"
# kind: brochure | admissions | flyer | poster | guide | event | other
kind: brochure
description: "Phase 5 完コピ検証: 学科紹介見開き（標準形）の右ページ（講師 5 段・ピックアップ授業・4 年間のステップ表）の構造を再現する。文字はすべてダミー"
format:
  # size: A3 | A4 | A5 | B4 | B5（JIS B 列）| custom（custom は width_mm / height_mm を追加）
  size: custom
  # 参考資料の実寸は不明。books/replica/a-brochure と同じ学校案内（前半・後半の分冊）なので同じ仮の判型（片ページの縦横比 0.98、高さ 297mm）。
  # 補正画像（prep/page_001-r.yaml）のステップ表 4 枚の幅がそろう（66.0 / 65.6 / 66.2 / 66.9mm）ことで、縦横比 0.98 を確認した
  width_mm: 291
  height_mm: 297
  # orientation: portrait | landscape
  orientation: portrait
  bleed_mm: 3                   # 塗り足し（片側）
  safe_mm: 5                    # 仕上がり線から内側の安全領域（文字・ロゴ・QR・ノンブルはこの内側）
  # 参考ページの実測（補正画像で 1mm = 6.73px）: 帯見出し・講師段・ステップ表の左端 6.7mm（ノド）、ステップ表・写真の右端 271.4mm、
  # 帯見出しの上端 約 13mm、注記の下端 約 288mm。小口側の 19.6mm には縦の柱（文字は安全領域の内側）とノンブルが入る
  margins_mm: { top: 13, bottom: 9, inside: 6.7, outside: 19.6 }   # 版面のマージン（inside = ノド、outside = 小口）
  # 段組はステップ表の 4 段（パネルの間 0.8mm の白）。講師段の 5 段（段の幅 41.5mm・ピッチ 55.5mm、間に縦罫）は page.css に持つ
  columns: 4                    # 段組の段数
  gutter_mm: 0.8                # 段間
  # left（左綴じ）にしているのは 1 ページ目を「右ページ（ノド = 左）」にするため。参考の見開きの右ページ（偶数ノンブル）を再現する
  binding: left                 # left（左綴じ）| right（右綴じ）| none（一枚もの: チラシ・ポスター）
# 共通 CSS（shared/layouts/README.md）。後ろほど優先。ページ固有のスタイルは pages/<pageId>/page.css に書く
styles:
  - shared/layouts/grid.css
  - shared/layouts/typography.css
  - shared/layouts/components.css
# CSS 変数の上書き（例: "--color-accent": "#d9a21b"、"--fs-body": "9pt"）。色は原則 company-data/brand/colors/colors.yaml の値を使う
theme: {}
# ページの並び順（ページ ID は識別子。並べ替えても ID は付け直さない）。追加は npm run new:page -- --book replica/a-course --after <pageId>
pages:
  - page_001
output:
  png_dpi: 150                  # 完コピ検証用（印刷しない）。比較には 150dpi で十分
  preview_dpi: 150              # 作業確認用の目安（npm run render -- --dpi 150 --out /tmp/<確認用>。output/ には置かない）
notes: >-
  Phase 5 の完コピ検証用 BOOK（印刷・配布しない）。参考: references/HAL-nagoya/brochure-2/page_001.jpg（見開きの写真）の右ページ。
  比較には補正指定 references/HAL-nagoya/brochure-2/prep/page_001-r.yaml を使う（回転・右ページの切り出し・台形補正）。
  参考資料の実寸は不明（撮影画像のみ）。判型 291×297mm は縦横比だけを合わせた仮の値（books/replica/a-brochure と同じ）。
  文字はすべてダミー（同じ文字数・改行）、数字は 0。写真・ロゴはプレースホルダ（Layer 1 生成待ち・ロゴは company-data に正式データなし）。
  参考の色は page.css 冒頭の --rep-* 変数にまとめた（Phase 8 でブランドカラーへ置き換える）。
  状態と次の作業は reviews/page_001/review.md を参照
