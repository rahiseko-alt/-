prompt: |-
  Landscape 59.6:40.1 (about 3:2) image of a student graphic-design portfolio presentation board: a flat matte black board (#0d0b0e) holding six small product photographs in a neat grid of 3 columns by 2 rows, nothing else.
  Composition: a solid black band across the top 13% of the frame; the six photos are equal rectangles about 30% of the width and 34% of the height each; columns at about 1%-31%, 35%-64% and 68%-98% of the width (narrow black gutters, almost no margin on the left); rows at about 14%-48% and 55%-88% of the height; plain black below each row and along the bottom 12%. No captions under the photos.
  Each photo: a studio product shot on a seamless warm light-grey backdrop (#b3a399 to #d8d0c8) with a few faint scattered pale petals, showing packaging and print mock-ups decorated with original abstract dark-fantasy artwork in deep brown, black and glowing amber gold (#3a2a1e, #8a5a20, #e0a040): 1) a gallery wall with three framed dark-amber panels under a white shelf, 2) a sculptural folded black-and-brown gift box, 3) a long dark booklet above a small printed card, 4) a set of disc cases, an open booklet and a disc, 5) two printed folders fanned out, 6) a smartphone mock-up with a blank dark screen beside an art print. All artwork is abstract and pictorial only.
  Lighting: soft even studio light, gentle contact shadows, slightly warm.
  Style: photorealistic product photography composited onto a presentation board, crisp edges, high resolution.

  Use the supplied masked reference only for spatial composition and lighting, not for identity or replication of existing artwork. Invent a distinct fictional person or original generic artwork. The deliberately blanked areas contain no intended graphic elements; reconstruct natural material there. Match the requested aspect ratio exactly.
  Exclude: text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption, title lettering, labels, barcode, brand, trademark, readable screen, UI text, people, hands, faces, white border, frame around the board
