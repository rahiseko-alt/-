prompt: |-
  Portrait-format 33:34 (almost square) head-and-shoulders photograph of one generic man in his early 40s, East Asian, dark hair pulled back from the forehead and tied behind the head, relaxed neutral-to-slight smile, looking straight into the camera, wearing a plain light heather-grey hooded sweatshirt with no print.
  Composition: a very tight close-up; the face is centred horizontally (face centre at about 49% of the width), the top of the hair is about 5% below the top edge, the eyes sit at about 41% of the height and the chin at about 77%; the hair spans roughly 19% to 79% of the width. The hood and shoulders fill the bottom 20%. The bottom 8% of the frame (left 90%) will be covered by dark navy caption bars, so keep only plain clothing there.
  Background: a deep, almost black charcoal studio backdrop (#0d090a to #0e0d13) with only a faint, soft lighter falloff behind the head; nothing else in the background.
  Lighting: soft key light from the front-left, gentle fill, natural warm skin tones (the print reads about #a6776a in the mid-tones), the grey hoodie around #8a8080 to #685d5d in shadow; moderate contrast like a magazine interview portrait.
  Style: photorealistic editorial portrait, 85mm lens at eye level, f/2.8, sharp focus on the eyes, natural skin texture, no retouching artefacts. A fictional person who does not resemble any real or famous individual.

  Use the supplied masked reference only for spatial composition and lighting, not for identity or replication of existing artwork. Invent a distinct fictional person or original generic artwork. The deliberately blanked areas contain no intended graphic elements; reconstruct natural material there. Match the requested aspect ratio exactly.
  Exclude: text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption, brand, print on clothing, signage, screen text, name tag, badge, celebrity likeness, famous person, multiple people, hands, glasses, border, frame, deformed face
