  完コピ検証（Phase 5）3 ラウンド済み（books/replica/b-course/reviews/page_001/review.md）。参考ページ（見開きの左ページ）を .trim 基準の mm で実測し、全要素を絶対配置。
  グリッド: 片ページ 6 段（段 27.8mm・段間 3.9mm、小口側 17mm 〜 ノド側 203.3mm。解析 page_016.yaml の grid.columns と同じ）。授業カード = 2 段ずつ 3 枚。
  外周の帯（小口 7mm・天地 4.3mm）＋角丸の白パネル（ノド側は仕上がり線まで）。大写真と情報ボックスはノド側の塗り足しまで裁ち落とし。
  Layer 2: 帯・白パネル・タブ・アイコンの円と線画（SVG）・円バッジ・写真枠の角丸・情報ボックスとカードの淡色グラデーション・ピル 2 種と紐飾り（SVG）・箇条書きの点・マーカー・ノンブルのハート（SVG）。
