  Layer 1 生成待ち・素材待ち: 大写真 1 点（193×117mm、塗り足し込み）・授業写真 3 点（各 59.5×38.7mm）。photo-frame のプレースホルダ。全面背景の生成は不要。
  色は page.css 冒頭の --rep-*（撮影画像からの推定値）。Phase 8 でブランドカラーへ置き換える。
