# BOOK の設定（npm run new:book で 2026-10-08 に作成）
# - 判型・塗り足し・解像度: system/rules/output.md ／ 命名: system/rules/naming.md
# - パスはすべてリポジトリルート相対（先頭スラッシュなし・"/" 区切り）
# id は books/ からの相対パス（ディレクトリと一致させる）
id: replica/b-flyer
title: "完コピ検証 B イベントチラシ"
# kind: brochure | admissions | flyer | poster | guide | event | other
kind: flyer
description: "Phase 5 完コピ検証用の BOOK（イベント告知チラシ 1 ページ）。印刷用ではない"
format:
  # size: A3 | A4 | A5 | B4 | B5（JIS B 列）| custom（custom は width_mm / height_mm を追加）
  size: A4
  # orientation: portrait | landscape
  orientation: portrait
  bleed_mm: 3                   # 塗り足し（片側）
  safe_mm: 5                    # 仕上がり線から内側の安全領域（文字・ロゴ・QR・ノンブルはこの内側）
  margins_mm: { top: 10, bottom: 10, inside: 8, outside: 8 }   # 版面のマージン（参考の解析: 文字の左右端 約 4% = 8mm。写真・帯は天地左右とも裁ち落とし）
  columns: 12                   # 段組の段数
  gutter_mm: 4                  # 段間
  binding: none                 # left（左綴じ）| right（右綴じ）| none（一枚もの: チラシ・ポスター）
# 共通 CSS（shared/layouts/README.md）。後ろほど優先。ページ固有のスタイルは pages/<pageId>/page.css に書く
styles:
  - shared/layouts/grid.css
  - shared/layouts/typography.css
  - shared/layouts/components.css
# CSS 変数の上書き（例: "--color-accent": "#d9a21b"、"--fs-body": "9pt"）。色は原則 company-data/brand/colors/colors.yaml の値を使う
theme: {}
# ページの並び順（ページ ID は識別子。並べ替えても ID は付け直さない）。追加は npm run new:page -- --book replica/b-flyer --after <pageId>
pages:
  - page_001
output:
  png_dpi: 150                  # 完コピ検証専用（比較用。印刷には使わない）。自社版で印刷するときは 350 に戻す
  preview_dpi: 150              # 作業確認用の目安（npm run render -- --dpi 150 --out /tmp/<確認用>。output/ には置かない）
notes: |
  - Phase 5（完コピ検証）の BOOK。参考 references/nagoya-iryo-hisho-it/flyers/page_002.jpg（撮影画像・90° 倒れ）の
    レイアウトだけを再現する。比較は references/nagoya-iryo-hisho-it/flyers/prep/page_002.yaml（正立・台形補正の指定）で行う
  - 判型は A4 縦（補正前の実測の縦横比は 約 1:1.45。撮影のゆがみと判断し A4 として補正）
  - 文字はすべてダミー（同じ文字数・改行位置）。数字は 0。QR は company-data の URL（TODO）から {{qr}} で生成
  - 写真・切り抜きの人物・イラストはすべてプレースホルダ（Layer 1 生成待ち）
  - output.png_dpi は 150（比較用）。印刷用ではない
  - 経過と次の作業は reviews/page_001/review.md
