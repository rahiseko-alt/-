# Layer 1 生成指示（Phase 5 完コピ検証）。生成ツールは人間が指定する（system/prompts/generate-background.md）
# - 座標・寸法は仕上がり（.trim、A4 縦 210×297mm、左上原点）の mm。塗り足しは片側 3mm（x −3〜213・y −3〜300 まで）
# - size_mm は出力の枠の大きさ（page.css の値。出力 PNG 150dpi・1276×1789px（塗り足し込み 216×303mm）で各枠を ±0.2mm で確認）。
#   傾けて置く枠（ボトル・カード 3 枚）は傾ける前の大きさ。画像は正立で生成し、ページ側の CSS（transform: rotate）で傾ける
# - crop_mm は補正後の参考ページ（npm run ref:prep の出力。.cache/ref-prep/ 以下、1414×2000px、1mm = 6.733px）上の範囲。
#   塗り足しにかかる枠は x / y が負、またはページの外まで（参考にはその部分がないので、入力画像では白。生成で外側へ広げる）。
#   傾けた枠は、傾いた参考の絵を囲む軸平行の外接矩形（notes の角度で回して正立させてから入力する）。
#   行内の小さな絵 2 つは、ダミー文字で行内の位置が 1〜3mm ずれるため、参考の絵の位置（枠と同じ縦横比）
# - 入力画像の切り出しは npm run gen:inputs -- --book replica/b-flyer（.cache/gen-inputs/ に出力。mask のとおり塗ってから入力する）。
#   必要な画素数は同じコマンドの一覧（印刷相当は 350dpi の値）。写真・人物は長辺 1024px 以上で生成して縮小する
# - 写真のコラージュは隙間なしの格子（行の境界 47.5 / 93.2mm、左列 〜59.2mm（下段 〜60.7mm）、右列 150.5mm〜（下段 151mm〜））。
#   各写真は枠いっぱいの 1 枚の写真として生成する（枠線・余白・角丸・周辺減光なし）。写真の上にはイベント名（白い字＋ローズのフチ。Layer 3）が重なる
# - 人物を含む素材（people: true）は【要確認: 生成人物の使用可否の方針】。架空の人物にし、参考の人物の顔・髪型を写さない（構図参照は配置とポーズだけ）。
#   Phase 8（自社版）では写真・人物は company-data/photos の自社写真に差し替える（生成画像を本校の写真として使わない）
# - 対象外にしたもの（生成指示に入れない）:
#   - 予約の案内の右の指さし（4.4×2.2mm）: 絵文字大の単純なアイコン。Layer 2（SVG の手の形）で描く（system/rules/image-generation.md「単純なアイコンは入れない」）
#   - 右中段の写真に重なる大きなティーカップ: 写真 page_001-photo-r2 の一部として生成する（ページに別の枠はない。review.md のとおり）
#   - 中央の縦帯・フッター帯・日付の囲みの斜線の地紋と白の細罫・曜日の丸囲み・QR の白地・手描きの波線と 2 本線: 単色の面・単純な線（Layer 2）
#   - 文字・数字・QR（Layer 3）。このページにロゴはない
#   - 中段の白地に淡く見える文字と落書き風の絵: 表面（別ページ）の裏写り。原稿の要素ではない
