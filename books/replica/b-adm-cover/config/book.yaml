# BOOK の設定（npm run new:book で 2026-10-08 に作成）
# - 判型・塗り足し・解像度: system/rules/output.md ／ 命名: system/rules/naming.md
# - パスはすべてリポジトリルート相対（先頭スラッシュなし・"/" 区切り）
# id は books/ からの相対パス（ディレクトリと一致させる）
id: replica/b-adm-cover
title: "完コピ検証 B 募集要項 表紙"
# kind: brochure | admissions | flyer | poster | guide | event | other
kind: admissions
description: "Phase 5 完コピ検証: 写真なしの募集要項の表紙（縦長の色面パネル＋正方形ドット＋目次のリーダー＋告知帯・告知枠＋ロゴ位置）を再現する。文字はすべてダミー、ロゴ類はプレースホルダ。印刷用ではない"
format:
  # size: A3 | A4 | A5 | B4 | B5（JIS B 列）| custom（custom は width_mm / height_mm を追加）
  size: A4
  # orientation: portrait | landscape
  orientation: portrait
  bleed_mm: 3                   # 塗り足し（片側）
  safe_mm: 5                    # 仕上がり線から内側の安全領域（文字・ロゴ・QR・ノンブルはこの内側）
  margins_mm: { top: 8.5, bottom: 16.5, inside: 9.8, outside: 19.2 }   # 参考ページの実測（要素の外端: 色面パネルの上端 8.5・フッターの下端 16.5・パネルの左端 9.8・目次の右端 19.2mm）。ページ内の要素は page.css で mm の絶対配置
  columns: 2                    # 段組の段数（左: 色面パネル 79.8mm、右: 目次 82.3mm。実測値で絶対配置しており、.grid は使っていない）
  gutter_mm: 18.8               # 段間（パネルの右端 89.6mm → 目次の左端 108.4mm）
  binding: left                 # 横組みの冊子の表紙（1 ページ目 = 右ページ、ノド = 左）
# 共通 CSS（shared/layouts/README.md）。後ろほど優先。ページ固有のスタイルは pages/<pageId>/page.css に書く
styles:
  - shared/layouts/grid.css
  - shared/layouts/typography.css
  - shared/layouts/components.css
# CSS 変数の上書き（例: "--color-accent": "#d9a21b"、"--fs-body": "9pt"）。色は原則 company-data/brand/colors/colors.yaml の値を使う
theme: {}
# ページの並び順（ページ ID は識別子。並べ替えても ID は付け直さない）。追加は npm run new:page -- --book replica/b-adm-cover --after <pageId>
pages:
  - page_001
output:
  png_dpi: 150                  # この完コピ検証 BOOK だけ 150（比較用。印刷用の BOOK は 350 のまま）
  preview_dpi: 150              # 作業確認用の目安（npm run render -- --dpi 150 --out /tmp/<確認用>。output/ には置かない）
notes: |
  完コピ検証（Phase 5）用の 1 ページ BOOK。参考: references/nagoya-iryo-hisho-it/admissions/page_001.jpg（表紙・単ページの撮影画像）
  （比較は references/nagoya-iryo-hisho-it/admissions/prep/page_001.yaml で正立・台形補正した画像と行う）。
  判型: 物理サイズは不明。紙の端から測った縦横比は 約 0.69 だが、正円であるはずの 2 つのエンブレムが縦に 2.4〜3.6% 長い楕円に写っており、
  撮影時の横方向の縮みと判断した。円が正円になる補正後の縦横比は 約 0.71 で、A4 縦（0.7071）との差が 1% 以内のため A4 縦とした。
  天は撮影範囲の外（濃色タブが天に裁ち落とし）。
  文字はすべてダミー（字数・改行位置は参考に合わせた）。数字は 0。エンブレム・校名ロゴタイプ・法人名はロゴの正式データがないため、
  同じ大きさの無地のプレースホルダ（books/replica/b-adm-cover/components/logo-slot.hbs）。
  Layer 1: 不要（白地。色面・ドット・罫線はすべて単色で Layer 2）。
  output.png_dpi は 150（比較用）。経過と次の作業は reviews/page_001/review.md
