# Layer 1 生成指示（Phase 5 完コピ検証）。生成ツールは人間が指定する（system/prompts/generate-background.md）
# - 座標・寸法は仕上がり（.trim、A4 縦 210×297mm、左上原点）の mm。塗り足しは片側 3mm（出力 PNG は 150dpi で 1276×1789px = 216×303mm）
# - size_mm は出力した枠の実寸（Playwright で .media / .photo-bottom の外接矩形を測り、150dpi の出力 PNG で確認）
# - crop_mm は補正後の参考ページ（reference_prep を npm run ref:prep で補正した .cache/ref-prep/ 以下の page_002.png、
#   1414×2000px、1mm = 6.733px）上の範囲。レプリカは参考に合わせてあるので枠の位置と同じ。切り出して該当の写真・イラストが
#   入っていることを目視で確認した（切り抜き・イラストは参考の画素の外接矩形とも 0.5mm 以内で一致）
# - 入力画像の切り出しは npm run gen:inputs -- --book replica/c-flyer（.cache/gen-inputs/ に出力。mask のとおり塗ってから入力する）
# - 生成画像は books/replica/c-flyer/backgrounds/<id>.png（写真調は .jpg 可）+ <id>.prompt.yaml。page.html の文字・構造は変えない
# - 透過 PNG で置く素材（cutout・illustration・decoration）は、page.css に次の 1 行を足して枠の中で縦横比を保つ:
#     .media--cutout .photo-frame__img, .media--illust .photo-frame__img { object-fit: contain; }
# - 対象外にしたもの（Layer 1 にしない）:
#   - タイトル帯・細帯 2 段・フッター帯・番号の円・ピル型バッジ: 単色の色面と単純な図形（Layer 2）
#   - 補足ボックスの地（参考は縁がわずかに濃い生成りのグラデーション）: 本文量で大きさが変わる枠なので Layer 2（CSS の
#     radial-gradient や inset の box-shadow で足す）。画像にしない
#   - 特長 4 のイラストに添えられた手書き風の英字（建物の左上）: 文字なので生成しない（必要なら Layer 3）
#   - 白地に透けている表面の文字: 撮影・印刷の裏写りでデザインではない（再現対象外）
#   - 全面背景: なし（参考は白の平らな地）。ロゴ・QR はこのページにない（フッターは文字とバッジだけ）
