  - id: page_001-bottom-photo
    kind: photo
    people: true
    optional: false
    # .photo-bottom（top 206mm・高さ 77.3mm、bleed-left / bleed-right で x -3〜213mm）。下端 283.3mm でフッター帯に接する（下は塗り足しにかからない）
    size_mm: [216.0, 77.3]
    bleed: true
    # 参考の全幅写真（左右裁ち落とし）。ページ外の左右 3mm は gen:inputs で白になる
    crop_mm: [-3.0, 206.0, 216.0, 77.3]
    placement: 'page.html の .photo-bottom の {{> photo-frame}} を {{> photo-frame src="books/replica/c-flyer/backgrounds/page_001-bottom-photo.jpg"}} にする（枠は 216×77.3mm、縦横比 2.794:1。object-fit: cover・中央。左右 3mm は仕上がりで切れる）'
    reference_usage: composition
    mask: "入力前に、左右 3mm のページ外の白帯は塗り足しとして生成で延ばす（outpaint）。参考の白衣の胸の名札・刺繍の文字、右奥の掲示板と黒板（x≈148〜210mm、y≈206〜225mm）の文字状の汚れを周囲の色で塗りつぶし、写っている人物の顔はぼかす（実在の学生・教員に似せないため。構図と人物の配置だけを参照する）"
    prompt: |
      Wide panoramic photograph, aspect ratio 2.79:1, of a bright physical-therapy training room in a vocational school, eye-level camera at about 1.4 m, 28 mm lens, everything in sharp focus. The frame is a full-bleed band; nothing is overlaid on the photo, but keep faces and key hands at least 4% away from the left and right edges (they are trimmed) and keep the bottom edge on floor and furniture (it meets a solid plum band #93296a).
      Composition from left to right: far left (0-27% of the width) a short wooden training staircase with grey carpeted treads and stainless-steel handrails on both sides, one student in a white short-sleeved medical scrub top and black trousers coming down the steps on forearm crutches while a second student in the same uniform walks beside her holding the rail; centre-left background (25-50%) a pair of light natural-wood parallel bars on adjustable metal posts, two students in white scrubs standing between them practising gait support, large black-framed windows with soft daylight behind them; centre (50-88%) a low treatment plinth with a vivid royal-blue vinyl mat on a light wooden frame in the foreground, one student lying on her back on the mat in white scrubs, a second student kneeling on the mat raising and stretching her leg, and an instructor in black scrubs leaning in to guide his hands; right (78-96%) a student pushing a rolling walking frame with an orange forearm rest, observed by an older male instructor in a grey shirt; right background a plain off-white wall with a blank beige panel, a folded wheelchair and some chairs.
      Mood: natural, friendly, focused practice; people are young adults of East Asian appearance, generic and not identifiable, mid-action rather than posing.
      Lighting: even overhead fluorescent light mixed with soft window daylight from the left, neutral white balance, gentle shadows, no harsh highlights.
      Palette: floor pale warm grey #e7e1da, walls off-white #f4f6f6, scrubs white #f2f2f4 with black trousers #1f1e24, mat royal blue #4a4fa3, wood #c8a46a, stair risers #987747, walker accent orange #e08a3c.
      Style: realistic documentary school photography, high resolution, sRGB, no text anywhere (blank name badges, blank boards, no posters or signage).
    negative_prompt: "text, letters, typography, words, numbers, logo, watermark, signature, QR code, caption, name badge text, embroidered lettering, brand, signage, poster, chalkboard writing, whiteboard writing, screen text, clock numerals, celebrity, identifiable real person, distorted hands, extra limbs, blurry"
    summary: "下部の全幅写真。明るいリハビリ実習室で、階段・平行棒・青いマットのベッド・歩行器を使って白衣の学生が練習する群像（左右裁ち落とし）"
    notes: "人物を含む【要確認: 生成人物の使用可否の方針】。必要画素 1276×456px（150dpi）、印刷なら 2976×1065px（350dpi）。参考の人物の顔立ち・体格を引き継がないよう img2img ではなく構図参照にし、強さは低めにする。Phase 8 では自社写真（company-data/photos）に差し替える前提の代用。review.md の「216×80.3mm」は誤り（実寸は 216×77.3mm。下はフッター帯で止まり塗り足しにかからない）"

