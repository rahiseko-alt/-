# 書き方: company-data/README.md ／ ルール: system/rules/company-data.md

as_of: 2027年度 4月入学
source: 募集要項 V4（AIビジネス専門学校(募集要項_日本人)＿V４.docx）
audience: 日本人学生

# 募集学科（修業年限・入学定員は facts/courses.yaml）
departments:
  - course_id: international-business-ai
    program: 商業実務専門課程
    # コース名は資料によって表記が違う【要確認】:
    #   募集要項の表「国際・英語・AIビジネスコース」／ 募集要項の表紙・願書（PDF と xls の【様式１】の志望学科）「国際 英語・AI・ビジネスコース」／
    #   AO エントリーシート「国際英語・AI・ビジネスコース」
    course: "TODO: コースの正式表記を確認して記入（候補は上のコメント）"
    schedule: 昼
    classes: 2

# 教育方針（3 つのポリシー）
policies:
  admission: AIや英語などの新しいビジネススキルを学ぶ強い意欲があり、多様な人々と協力して課題解決に取り組む姿勢を持つ者。
  curriculum: 基礎的なビジネス知識からAI活用、実践的な英語力までを段階的に学び、企業連携による実学教育を通じて即戦力を育成する。
  diploma: 現代の国際ビジネスシーンで求められる専門知識とITスキルを活用し、自ら考えて行動できる実務遂行能力とコミュニケーション能力を身につけていること。

# 出願資格
eligibility:
  lead: 2027年4月1日時点、満18才以上の方で、下記のいずれかの条件を満たす方。
  conditions:
    - 高等学校卒業（2027年3月卒業見込みを含む）以上の方
    - 文部科学省高等学校卒業程度認定試験に合格している方
    - 高等専門学校の3年以上の修了者（2027年3月修了見込みを含む）
    - 外国において通常の課程による学校教育12年以上の課程を修了した方
    - 本校の校長が認める学校を卒業（2027年3月卒業見込みを含む）した方
    - その他、本校において上記と同等の学力があると認めた方

# 入学試験区分と日程・選考方法
exam_notes:
  - 定員に達し次第、募集は終了いたします。
  - 各選考後、結果の通知までは必ず3日以上の期間を設けます。
exam_types:
  - id: ao
    name: AO入試
    formal_name: 総合型選抜
    description: 本校が求める人物像と、志願者の学習意欲や目的意識を照らし合わせて総合的に評価する入試制度です。
    requirement: 本校の体験入学や学校説明会等に参加し、担任または保護者の確認署名が得られること。
    entry_from: 2026年6月1日以降
    permission: エントリー後、面接等を実施し、一定期間（3日以上）を置いて出願許可証を交付します。
    application_from: 2026年9月1日以降
    selection: 書類選考、面接、課題提出等による総合評価
    announcement: 2026年10月1日
  - id: recommendation
    name: 推薦入試
    formal_name: 学校推薦型選抜
    description: 学力や適性、これまでの経験などを幅広く評価する入試制度です。
    requirement: 出身高等学校長の推薦を受けられること。
    application_from: 2026年10月1日～
    selection: 書類選考、面接、課題提出等による総合評価
    announcement: 選考実施日より3日以上の期間を空けて随時発表
  - id: general
    name: 一般入試
    formal_name: 一般選抜
    # 募集要項 V4 では、一般入試の表の下に推薦入試と同じ説明文が置かれている【要確認: 一般入試の説明文】
    description: 学力や適性、これまでの経験などを幅広く評価する入試制度です。
    application_from: 2026年10月1日～
    selection: 書類選考、面接、筆記試験（学力検査）
    announcement: 選考実施日より3日以上の期間を空けて随時発表

# 出願書類（本校所定の封筒に入れて提出）
# 募集要項 V4 の表の番号は 1〜4・7〜9（5・6 が欠番）【要確認】。【様式３】誓約書・保証書は願書 xls にある（2026-10-08 確認）
# 書類名の【様式1】〜【様式4】は、原本（募集要項 V4・願書）では全角数字の【様式１】〜【様式４】。
#   英数字は半角にそろえる（system/rules/typography-ja.md §7。紙面で半角の「2027年」と混ざらないように）
documents:
  - name: 入学願書【様式1】         # 原本の表記: 入学願書【様式１】
    note: 本校所定用紙・黒ボールペンで記入すること
  - name: 入学検定料
    note: 振込み確認ができるもの（振込控え等）を提出書類確認表に添付
  - name: 写真（入学願書に添付）
    note: 縦4cm×横3cmの証明写真用写真・正面・無帽、無マスク、無背景であるもの・3か月以内に撮影したもの
  - name: 学歴を証明する書類（いずれか1つ）
    options:
      - 出身高校の調査書 および 卒業証書の写し（高校3年生・卒業生）
      - 合格証明書（高卒認定試験合格の方）
      - 最終学歴の卒業証明書または卒業証書の写し（大学・短大・専門学校を卒業した方）
  - name: 志望理由書【様式2】       # 原本の表記: 志望理由書【様式２】
    note: 本人が直筆で記入
  - name: 誓約書・保証書【様式3】   # 原本の表記: 誓約書・保証書【様式３】
    note: 受験者本人、保証人本人が直筆で記入
    # 願書 xls【様式３】の補足事項
    guarantor: 保証人は、経済的に独立した25歳以上の者で、学生の身分および在学中の身元保証等についての責任を負うことのできる者です。
  - name: 入学検定料振込証明書【様式4】   # 原本の表記: 入学検定料振込証明書【様式４】
    note: 振込確認できるもの（振込控え等）を添付
document_notes:
  - 出願書類は発行日から3か月以内のものをご提出ください。
  - 指定された出願書類以外に、その他必要書類を提出していただく場合があります。
  - 書類に不備がある場合は、受け付けません。
  - 出願書類に虚偽の記載があった場合は入学後であっても入学を取り消す場合があります。
  - 合格した学生であっても、入学金を期日までに納入できない場合は、辞退したものとみなします。
  - 期日までに納入ができない場合は必ず事務局までご連絡ください。
  - 入学許可書はすべての入学手続きが完了し、指定期日までに学費が納入された場合にのみ発行いたします。
  - 提出された出願書類、および納入済みの入学検定料・入学金については、いかなる理由があっても返還いたしません。
withdrawal_refund: 指定期日までに学費等を納入し入学手続きを完了した方が、本校への入学を辞退する場合、2027年3月31日までに本校所定の「入学辞退届」を提出した方に限り、納入済みの学費から「入学金」を除いた「授業料および諸経費」を返還いたします。

# 入学検定料と振込先（受験料・学費共通）
exam_fee: 20000
payment_account:
  bank: みずほ銀行
  branch: 名古屋駅前支店
  branch_code: "411"
  type: 普通
  number: "3217818"
  holder: 学校法人 海鵬学園
  holder_kana: ガク カイホウガクエン
payment_notes:
  - 振込控え（振込が確認できるもの）を指定用紙（提出書類リスト）に添付して願書と共に提出してください。
  - 振込み手数料は、志願者負担となります。

# 学費（授業料等納付金。円）
# 募集要項 V4 の表から転記。各期の合計・年次合計・総額は表の値と一致することを確認済み
tuition:
  entrance_fee: 100000
  years:
    - year: 1
      terms:
        - term: 前期
          tuition: 390000
          expenses: 50000
          total: 440000
        - term: 後期
          tuition: 390000
          expenses: 0
          total: 390000
      total: 930000          # 入学金を含む
    - year: 2
      terms:
        - term: 前期
          tuition: 390000
          expenses: 50000
          total: 440000
        - term: 後期
          tuition: 390000
          expenses: 0
          total: 390000
      total: 830000
  grand_total: 1760000
  deadlines:
    - 入学金（100,000円）につきましては、合格から10日以内納入ください。
    - 1年次授業料（390,000円）につきましては、合格から1か月以内に納入ください。
    - 2年次前期・後期の納付金支払い期日は別途通知します。
  notes:
    - すべての入学手続きが完了し、指定期日までに学費が納入された場合にのみ入学が許可されます。
    - 教科書代、実習の費用等は別途実費にて個人負担となります。
  # 募集要項 V4 の「諸費用」欄に「※1年次合計: 390,000円」という、表（1年次合計 930,000円）と合わない記載がある【要確認】

# 出願および入学に関する注意事項
important_notes:
  - title: 合否連絡について
    text: 合格発表は本人へ通知するとともに、出身高等学校長宛てに親展文書にて合否の連絡を行います。
  - title: 入学前教育について
    text: 各入試において合格決定後、進学後の学習に備えるための継続的指導（課題提出等）を必須として実施します。
  - title: 感染症対応
    text: インフルエンザ等、感染症法における感染症がまん延した場合、行政からの指導に従い適切な対応を行います。

# AO エントリーシートの記入上の注意事項（原文のまま。2026-10-08 記入）
ao_entry_notes:
  - 本校は愛知県専修学校各種学校連合会のAO入試自主運営基準を遵守しており、高校生のAOエントリーに際して確認のため署名をお願いします。
  - AO入試エントリー受付期間に合わせて面接日をご設定いたします。定員に達し次第、受付を終了します。
  - 愛知県内の高校からエントリーされる方は、できる限り高校へご報告いただきますようお願いします。
  - 記入後は下記送付先へ郵送、または窓口へ直接ご持参ください。
