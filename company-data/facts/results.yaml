# 実績（正本）: 数値指標・就職先・資格
# - BOOK からは {{#each facts.results.metrics}} ... {{num value}}{{unit}} ... {{/each}} のように参照する
# - 数値は必ず as_of（基準日・年度）と source（出典: 学校の公表資料名など）を記入する
#   出典を示せない数値は掲載しない（推測・概算・他校の数値の流用は禁止）
# - value は数値で記入する（未確定の間は "TODO: ..." 文字列）。桁区切りは {{num}} ヘルパーが付ける
# - 下の *-todo は記入例を兼ねたプレースホルダ。実際の値を記入したら削除する
# 書き方: company-data/README.md ／ ルール: system/rules/company-data.md

metrics:
  - id: metric-todo
    label: "TODO: 指標名を記入"
    value: "TODO: 値を数値で記入"
    unit: "TODO: 単位を記入（なければ行ごと削除）"
    as_of: "TODO: 基準日・年度を記入"
    source: "TODO: 出典を記入"
    note: "TODO: 算出方法などの注記を記入（なければ行ごと削除）"

# 主な就職先（掲載許可を確認した企業のみ）
employers:
  - name: "TODO: 企業名を記入"
    note: "TODO: 補足を記入（なければ行ごと削除）"

# 資格取得実績
certifications:
  - name: "TODO: 資格名を記入"
    count: "TODO: 合格者数を数値で記入"
    as_of: "TODO: 基準日・年度を記入"
