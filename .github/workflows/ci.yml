# CI: 環境診断 → 型チェック・検証・テスト → スモークレンダリング
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check / render smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
    steps:
      - name: チェックアウト（Git LFS 込み）
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージ
        run: npm ci

      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 日本語フォント・poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils

      - name: 環境診断（doctor）
        run: npm run doctor

      - name: 型チェック・検証・テスト（check）
        run: npm run check

      - name: スモークレンダリング
        run: npm run render -- --root system/fixtures/studio --book smoke --dpi 72

      - name: レンダリング結果をアップロード
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-render
          path: system/fixtures/studio/books/smoke/output/
          if-no-files-found: warn
          retention-days: 14
