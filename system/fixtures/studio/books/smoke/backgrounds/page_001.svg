<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 303" width="216mm" height="303mm" preserveAspectRatio="none">
  <!-- Layer 1（BASE VISUAL）の代替。文字は入れない -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4e89"/>
      <stop offset="0.6" stop-color="#2a9d8f"/>
      <stop offset="1" stop-color="#e9f5f3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.25" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="216" height="303" fill="url(#bg)"/>
  <rect width="216" height="303" fill="url(#glow)"/>
  <circle cx="40" cy="250" r="70" fill="#f4a261" fill-opacity="0.25"/>
  <circle cx="190" cy="60" r="30" fill="#ffffff" fill-opacity="0.15"/>
</svg>
