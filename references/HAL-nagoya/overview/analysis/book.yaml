# 参考資料の解析結果（Phase 4。system/rules/references.md §4）— 資料全体
# 対象: このディレクトリの 1 つ上にある page_001.jpg（1 枚）
# 内容: （学校名）の募集用印刷物一式（7 点）を机に並べて真上から撮った写真。元画像は 90° 回転して保存されている
#       （時計回りに 90° 回すと正位置。目視は正位置に回した確認用画像で行った）
# 寸法: 実物の採寸ではなく写真上の比率（幅:高さ）。遠近と重なりがあるため ±10% 程度の誤差を見込む
# 固有名詞・コピー・数字は伏せる（「（学校名）」「（年度）」など）

# このキットの構成（正位置の写真で 左上 → 右下 の順）
kit:
  - id: parent-book
    type: 保護者向け冊子（学校の約束・方針を保護者に伝える）
    format: 横型の冊子。写真上の比率 約 1.36:1（A4 横 / A5 横 と推定）
    cover: 白地＋左端に縦の青帯（幅の約 19%）。帯の中に白抜きのシンボルマーク。標題は細い明朝の大きな 1 行＋細罫＋明朝の副題、右下に（学校名英字＋年度）の小さなロックアップ
    tone: 静か・誠実・余白が大きい。キットで唯一の明朝体
  - id: dm-card
    type: 就職実績告知の DM / はがき型チラシ（横型）
    format: 横型の小判。写真上の比率 約 1.1〜1.2:1（下端 18% が白いコンタクト帯）
    cover: 青ベタ全面＋細線の HUD 風装飾（コーナー括弧・ドット列・十字の点・斜線ハッチ）。左上に斜めカットの白いタブ（英字スローガン）、極太ゴシックの大見出し 1 行、六角形の白バッジ（実績率）、黄色の帯（見出し補足）、角を落とした枠の中に黄色の極太数字 2 つ。下端は白帯に ロゴ・電話・CTA 枠・駅徒歩バッジ、右下にタワー校舎の切り抜き写真が帯を突き抜けて立つ
    tone: 高エネルギー・数字訴求
  - id: main-brochure
    type: 学校案内（メインのパンフレット）
    format: 縦型（写真の下端で切れているが A4 縦と推定）
    cover: 全面 3DCG キャラクター（髪がシアン・白い近未来ヘルメット）の顔アップ。背景は濃紺〜紫の宇宙空間に赤・マゼンタの光線と粒子。下 1/3 に白い極太コンデンス・サンセリフの英字タイトル（3 文字＋左に山形記号）、その下に分野名の英字列（小さな字間の広いキャップス）、さらに下に（学校名英字＋年度）
    tone: エンタメ・ゲーム／CG 系の世界観を前面に出す。文字要素は最小限
  - id: admissions-flyer
    type: 入試・願書受付開始の告知チラシ
    format: 縦型。写真上の比率 約 0.72（A4 縦 / A5 縦 と推定）
    cover: 青ベタ地。上 1/3 右に学校案内と同系統の CG キャラクター（枠の上へはみ出す）＋縦組みの白いキャッチ。中段左に白い極太イタリック風の大きな日付＋丸囲み曜日、白い平行四辺形の帯 3 段に青文字の見出し（入試区分・受付開始）、矢印付きの細線装飾。中段右に黄色のカード 3 枚を縦積み（訴求ポイント。四隅にピクセル風の黒い角飾り）。その下に白い表（選考日程・3 列 3 行）と紺の丸バッジ。最下部は黒帯に ロゴ・電話・メール・見学 CTA・駅徒歩の丸バッジ、右端にタワー校舎の切り抜き
    tone: 高エネルギー・情報量は多いが 3 ブロックに整理
  - id: admissions-guide-night
    type: 入学要項（夜間・土曜コース版）
    format: 冊子。写真上の比率 約 1.2:1 と横に広い（AB 判横〜正方形寄りの判型と推定。要実物確認）
    cover: 白地。上部中央に字間を大きく空けた極太ゴシックの標題、全幅のダークグレー帯に白抜きでコース区分、その下に「願書受付中」相当の小見出し。中央に表紙上の目次（CONTENTS ＋ リーダー罫＋ノンブル。字下げで 3 階層）。下部に（学校名英字＋年度）の大きなジオメトリック・サンセリフ、その下にロゴと住所・電話の小さな組
    tone: 実務的・モノクロ（墨＋グレー 1〜2 色）
  - id: admissions-guide-day
    type: 入学要項（昼間部版）
    format: night 版と同じ判型
    cover: night 版と同じテンプレート。違いは 地が極薄グレー＋帯が白（night 版の濃グレー帯の反転）と、右上に（学校名英字）の巨大な透かし文字。目次は 2 階層で項目が少ない
    tone: night 版と同じ
  - id: support-book
    type: 学費・住まいのサポート冊子（奨学金・ローン・学生寮などの案内。保護者も読者）
    format: 冊子。写真上の比率 約 1.13:1（入学要項と同じ系列の判型と推定）
    cover: 白地。上にリード 1 行、角丸のダークグレー帯に白抜きの大見出し＋細罫＋副題、帯の右下に「保護者もどうぞ」相当の 1 行。中央に 3 行の本文コピー（中央揃え）、薄いグレーの巨大なシンボルマーク透かし、その上に細線の枠囲み（見出し付きの箇条書き 4 項目）。下部に入学要項と同じ（学校名英字＋年度）＋ロゴ・住所の組
    tone: 実務的・モノクロ・安心感

# グリッド（実務系の表紙）
grid:
  practical_covers: 1 段・中央揃えの縦積み。標題 → 帯 → 目次 or 本文 → （学校名英字＋年度）→ ロゴ・住所 の順で、上から下まで共通
  flyers: 2 段（左 60〜65% に日付・見出し、右 35〜40% に訴求カード）＋下端の全幅コンタクト帯
  parent_book: 左端の縦帯（約 19%）＋残りの白地に右寄せの標題
# 余白（判型に対する比率）
margins:
  practical_covers: 左右 約 15〜20%（目次ブロックは中央 60% 幅）、上 約 8%、下 約 5%
  flyers: 天地左右 約 4〜5%（HUD 装飾は余白の中まで入る）。コンタクト帯は断ち切り
gutter: null
# 写真の比率と使われ方
photo_ratios:
  - 学校案内の表紙は全面の CG キャラクター 1 点（断ち切り）。実写写真は使っていない
  - 告知チラシは CG キャラクターを上 1/3 の矩形（約 1.6:1）に置き、上辺から頭がはみ出す
  - 校舎（高層タワー）の切り抜き写真をチラシ 2 点のコンタクト帯の右端に縦長で立てる（キットの共通記号）
  - 実務系（入学要項・サポート冊子・保護者向け）は写真なし
heading_hierarchy:
  - { role: 学校案内の英字タイトル, style: 白・極太コンデンス・サンセリフ, size: 表紙幅の約 85%, note: キャラクターの胸元に重ねる }
  - { role: チラシの大見出し・日付, style: 極太ゴシック／極太イタリック風数字, size: 判型幅の 60〜70% }
  - { role: 実務系表紙の標題, style: 極太ゴシック・字間 1 字分前後, size: 判型幅の約 25% }
  - { role: （学校名英字＋年度）ロックアップ, style: ジオメトリック・サンセリフ Bold, size: 判型幅の約 45〜55%, note: 実務系の全表紙で同じ位置・同じ大きさ }
  - { role: 保護者向け冊子の標題, style: 明朝 Light〜Regular, size: 判型幅の約 50% }
  - { role: 目次項目, style: ゴシック Regular, size: 7〜8pt 相当, note: リーダー罫＋右揃えノンブル }
# 色の役割と面積比（実際の色は company-data/brand/colors/colors.yaml を使う）
colors:
  brand_blue: { estimate: "#1f5fd6 前後（鮮やかなロイヤルブルー）", role: "販促物の地色・保護者向け冊子の帯。キットの『顔』の色", area: "チラシで 60〜70%、保護者向けで 約 20%" }
  accent_yellow: { estimate: "#ffe400 前後", role: "数字・訴求カード・見出し補足の帯", area: "チラシで 10〜15%" }
  black: { role: "チラシ最下部のコンタクト帯・ピクセル風の角飾り", area: "5〜10%" }
  white: { role: "見出しの白抜き・平行四辺形の帯・表の地・実務系の地色" }
  gray: { role: "実務系の帯（濃グレー / 白反転）・透かし・枠線", note: "実務系は墨 1 色＋網で刷れる設計" }
  key_visual: { role: "学校案内とチラシ 1 点だけに使う多色の CG。濃紺・紫・赤・シアン", note: "ブランド色ではなく世界観の色" }
  ratio_summary: "販促＝ブランド青＋黄（＋黒）、実務＝墨＋グレー、学校案内＝キービジュアルの多色。役割で色数をはっきり分ける"
rules:
  - 目次のリーダーは細い実線（0.25〜0.3pt 相当）
  - 保護者向け冊子は標題と副題の間に細い横罫 1 本（帯の右端から紙端近くまで）
  - チラシは HUD 風の細線（コーナー括弧・十字点・ドット列・斜線ハッチ）を装飾として多用。角を落とした八角形の枠線で数字ブロックを囲む
  - サポート冊子は細線の枠（上辺に見出しを割り込ませる）
cards:
  - チラシの訴求カード: 黄色ベタ・角丸なし・四隅にピクセル状の黒い角飾り、縦に 3 枚
  - DM の実績バッジ: 白い六角形
  - 実務系の帯: 全幅の矩形（入学要項）／角丸の矩形（サポート冊子）
density:
  main_brochure: 低（タイトルと分野名だけ）
  flyers: 高（1 面に 見出し・日付・訴求 3 点・表・連絡先）
  practical_covers: 中（表紙に目次や本文を載せる）
  parent_book: 低
page_type: cover（7 点すべて表紙面のみが見えている）
eye_flow:
  main_brochure: キャラクターの目 → 英字タイトル → 分野名 → 学校名
  flyers: 大見出し（日付 / 実績）→ 黄色の数字・カード → 表 → 下端の連絡先
  practical_covers: 標題 → 帯（区分）→ 目次 → 学校名ロックアップ
background:
  main_brochure: AI 生成向き（宇宙・光線・粒子の背景＋キャラクター）。Layer 1
  flyers: ブランド青のベタ（Layer 2 の色面）＋HUD 線画（SVG で Layer 2）。キャラクター・校舎写真は Layer 1
  practical_covers: 白 / 極薄グレーのベタ。透かしの巨大英字・シンボルマークは SVG / CSS（Layer 2）
image_crop:
  - キャラクターは顔を中心に肩まで、目が表紙の上 40% の位置
  - 校舎の切り抜きは下端の帯から上へ突き出す（枠を破る配置）
rhythm: 7 点のうち 3 系統（キービジュアル系 1 / 販促チラシ系 2 / 実務・保護者系 4）。実務系 3 点は同じ表紙テンプレートの色違い・帯違いで、区分（昼 / 夜・土曜 / 学費）を帯の濃淡だけで見分けさせる
notes:
  - 識別の統一要素は「（学校名英字＋年度）」のロックアップとシンボルマーク。実務系の全表紙の同じ位置に置き、保護者向けでは右下に小さく置く。販促物ではロゴを下端のコンタクト帯に集約する
  - キービジュアル（CG キャラクター）は学校案内と入試チラシで共有し、キットの世界観をつなぐ。実務系には使わない
  - 実務系は写真・多色を使わず墨＋グレーで統一。コストと情報の読みやすさを優先している
  - 写真の重なりのため、DM と保護者向け冊子の判型は推定。入学要項・サポート冊子は A4 縦ではなく横に広い判型に見える（要実物確認）

# 自社キット計画への示唆（AIビジネス専門学校。色・書体は company-data の正本を使う）
kit_planning:
  - キットを 3 系統に分けて設計する: ①キービジュアル系（学校案内）②販促系（チラシ・DM）③実務系（入学要項・学費サポート・保護者向け）
  - 系統ごとに色数を決める。①は Layer 1 の生成ビジュアルが主役、②は primary の全面ベタ＋accent の数字、③は text＋muted（＋surface）の 1〜2 色
  - 実務系表紙は 1 つのテンプレート（標題 → 区分帯 → 表紙目次 → 学校名ロックアップ → ロゴ・住所）を作り、区分を帯の色・濃淡だけで切り替える。shared/components に「表紙目次」「学校名＋年度ロックアップ」「ロゴ・住所フッター」のパーシャルを用意する候補
  - 販促系の下端コンタクト帯（ロゴ・電話・CTA・アクセス）は全チラシ共通の部品にする（shared/components/qr-block.hbs と組み合わせる）
  - 保護者向けは明朝＋大きな余白で他の印刷物とトーンを分ける。書体は company-data/brand/fonts/fonts.yaml に明朝系の役割があるか確認が必要
  - 学校案内のキービジュアルは AI 系の学校らしい生成ビジュアル（Layer 1）を 1 系統つくり、学校案内とチラシで共有する。生成画像に文字を入れない
  - 実績の数字（就職率など）を大きく見せる構成は使えるが、値は company-data/facts/results.yaml の正本だけ（as_of・source 付き）。未確定なら TODO のまま
