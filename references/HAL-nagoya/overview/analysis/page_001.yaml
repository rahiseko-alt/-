# 参考資料の解析結果（Phase 4）— page_001.jpg
# 内容: 印刷物 7 点を机に並べた俯瞰写真（ページではない）。画像は 90° 回転して保存されている（時計回り 90° で正位置）
# 位置は正位置での写真全体に対する比率（左上原点、幅・高さ = 1.0）。寸法は写真上の推定
# 見えている表紙の構造を記録する。固有名詞・コピー・数字は伏せる

page_type: other（キット全体の俯瞰写真。各印刷物は cover）
grid:
  photo_layout: 3 列 × 3 段の緩い並び（左列 3 点、中列 2 点、右列 2 点）。紙面同士が一部重なる
  items:
    - { pos: "左上 x0.06–0.33 y0.00–0.32", item: 保護者向け冊子（横型）, grid: "左 19% の縦帯＋右 81% の白地。標題は白地の中央より右寄せ" }
    - { pos: "左中 x0.07–0.34 y0.30–0.63", item: 就職実績 DM（横型）, grid: "上 82% の青地に見出し群を左寄せ、右上に六角バッジ、下 18% の白いコンタクト帯は 4 区画（ロゴ / 電話・メール / CTA 枠 / 駅徒歩バッジ）" }
    - { pos: "左下 x0.06–0.32 y0.63–1.00（下端で切れる）", item: 学校案内の表紙（縦型）, grid: "全面画像。下 1/3 に英字タイトル、その下に分野名の 1 行" }
    - { pos: "中上 x0.36–0.59 y0.08–0.54", item: 入試告知チラシ（縦型）, grid: "上 1/3 右 60% にキャラクター画像、中段 左 62% 日付＋見出し / 右 38% 黄色カード 3 枚、下に全幅の表、最下部 13% 黒いコンタクト帯" }
    - { pos: "中下 x0.35–0.65 y0.57–1.00", item: 入学要項（昼間部版）, grid: "1 段・中央揃え。標題 → 白帯 → 小見出し → 目次（中央 60% 幅）→ 学校名ロックアップ → ロゴ・住所" }
    - { pos: "右上 x0.62–0.99 y0.06–0.51", item: 入学要項（夜間・土曜版）, grid: "昼間部版と同じ構成。帯は濃グレー" }
    - { pos: "右下 x0.65–1.00 y0.56–1.00", item: 学費・住まいのサポート冊子, grid: "1 段・中央揃え。リード 1 行 → 角丸の濃グレー帯 → 本文 3 行 → 枠囲みの箇条書き → 学校名ロックアップ → ロゴ・住所" }
margins:
  practical_covers: 左右 約 15〜20%、上 約 8%、下 約 5%（表紙幅・高さに対する比率）
  flyers: 約 4〜5%（コンタクト帯は断ち切り）
  parent_book: 帯は断ち切り、標題ブロックの右余白 約 8%
gutter: null
photo_ratios:
  - 学校案内: 全面の CG キャラクター（断ち切り、顔のアップ）
  - 入試告知チラシ: CG キャラクターを約 1.6:1 の横長矩形に。上辺から頭部がはみ出す
  - 2 点のチラシ: 校舎（高層タワー）の縦長切り抜き（約 1:3）をコンタクト帯の右端に立てる
  - 実務系 3 点と保護者向け: 写真なし
heading_hierarchy:
  - { item: 学校案内, h1: "英字タイトル 3 文字（白・極太コンデンス、表紙幅の約 85%）", h2: "分野名の英字列（白・小さめのキャップス）" }
  - { item: DM, h1: "極太ゴシック 1 行（表紙幅の約 75%、白）", h2: "黄色帯の中の黒ゴシック", data: "黄色の極太数字＋小さい単位" }
  - { item: 入試告知チラシ, h1: "白い極太の日付（表紙幅の約 45%）", h2: "白い平行四辺形帯の青い極太ゴシック 3 段", h3: "黄色カードの黒ゴシック" }
  - { item: 入学要項, h1: "極太ゴシック・字間広め（表紙幅の約 25%）", h2: "帯の中の白抜きゴシック（区分名）", h3: "英字の CONTENTS 見出し＋目次項目" }
  - { item: サポート冊子, h1: "帯の中の白抜き極太ゴシック（表紙幅の約 75%）", h2: "帯の中の副題（細罫の下）", body: "中央揃えの 3 行" }
  - { item: 保護者向け冊子, h1: "明朝の大きな標題 1 行", h2: "細罫の下に明朝の副題（右揃え）" }
colors:
  販促（DM・入試チラシ）: "ブランド青（#1f5fd6 前後）の全面ベタ 60〜70% / 黄（#ffe400 前後）10〜15% / 白抜き文字 / 黒のコンタクト帯 5〜10%"
  学校案内: "キービジュアルの多色（濃紺・紫・赤・マゼンタの光・シアンの髪）。文字は白のみ"
  実務系: "白地＋墨＋濃グレー帯（夜間・土曜版・サポート冊子）／極薄グレー地＋白帯（昼間部版）"
  保護者向け: "白地 80% / ブランド青の縦帯 約 20% / 墨の明朝"
rules:
  - 入学要項の目次: リーダー罫（細い実線）＋右揃えのノンブル
  - 保護者向け: 標題の下に細罫 1 本
  - DM・チラシ: HUD 風の細線装飾（コーナー括弧、十字点、ドット列、斜線ハッチ、角を落とした枠）
  - サポート冊子: 細線の枠、上辺に見出しを割り込ませる
cards:
  - 入試チラシ右段の黄色カード 3 枚（角丸なし、四隅にピクセル風の黒い角飾り、縦積み・間隔小）
  - DM の六角形白バッジ（実績率）、駅徒歩の青い角丸ボックス
  - 入試チラシの選考日程表（白地・細罫・3 列 3 行。左に紺の丸バッジで見出し）
density:
  学校案内: 低
  DM・入試チラシ: 高
  入学要項・サポート冊子: 中
  保護者向け: 低
eye_flow:
  - 写真全体では、彩度の高い青いチラシ 2 点と学校案内のキャラクターに最初に目が行き、白い実務系 4 点は背景のように沈む（販促と実務で視覚の強さをはっきり分けている）
  - DM: 大見出し → 六角バッジ → 黄色の数字 → 下端の連絡先
  - 入試チラシ: キャラクター → 日付 → 見出し帯 → 黄色カード → 日程表 → 黒帯
background:
  学校案内: Layer 1（宇宙空間・光線・粒子＋キャラクターの生成ビジュアル）
  DM・入試チラシ: 青ベタ（Layer 2）＋HUD 線画（SVG・Layer 2）。キャラクターと校舎は Layer 1 の画像
  入学要項（昼間部）: 極薄グレーのベタ＋白帯＋巨大英字の透かし（Layer 2、透かしは低コントラストのテキスト or SVG）
  サポート冊子: 白地＋薄グレーの巨大シンボルマーク透かし（SVG・Layer 2）
  保護者向け: 白地＋青帯（Layer 2）
image_crop:
  - 学校案内: キャラクターの顔を中央、目の高さが上から約 40%、肩で切る
  - 入試チラシ: キャラクターの顔を右寄せ、頭頂が枠外へ出る
  - 校舎の切り抜き: 下端を帯に接地させ、上は帯より上に突き出す
rhythm: 実務系 3 点（入学要項 2・サポート冊子 1）は同じテンプレートで並べると一目で同じ系列とわかる。販促 2 点は同じ青・同じコンタクト帯で揃う
notes:
  - 写真の重なり: 保護者向け冊子の下部に DM が重なる。学校案内は写真下端で切れて、表紙下部の学校名部分は上端しか見えない
  - 紙が薄い入学要項（夜間・土曜版）は中ページの表組みが裏写りしている（表紙の背景にうっすら矩形が見える）。印刷用紙の厚さの参考
  - 再現時の切り分け: 文字（標題・目次・数字・連絡先）はすべて Layer 3、帯・枠・バッジ・HUD 線・表は Layer 2、キャラクター・校舎・宇宙背景だけ Layer 1
  - Phase 5 の候補: 実務系の表紙テンプレート（入学要項）は文字と単純な色面だけなので再現しやすい。入試チラシは Layer 1/2/3 がすべて揃う練習台として有用
