# 入手経路・利用上の注意・見開きの扱い（例: page_002 は 2〜3 ページの見開き）
notes: |
  Google Drive「専門学校パンフレット参考資料」の「HAL名古屋.pdf」（https://drive.google.com/file/d/16TAsaTdTMEOErzK4qZrIEVJZVDosyK7a/view）を 2026-10-08 に取り込み。Drive への格納日は 2026-10-07。実際の入手日は【要確認】
  元 PDF は印刷物の写真・スキャン（文字情報なし、埋め込み画像は 72ppi）。ページ画像は同じ解像度の 72dpi・JPEG（品質 85）
  ページ: 1枚の写真（テーブル上に7点の印刷物を並べて撮影）。画像全体が90°反時計回り（読むには時計回り90°）。写っているもの: ①入学要項 夜間部・土曜コース 表紙（CONTENTS） ②学費・住まいのサポートBOOK 表紙 ③入学要項 昼間部 表紙（CONTENTS） ④学校案内「>PRO」表紙（brochure-1と同じ） ⑤チラシ「ZERO to PRO 就職ならHAL」就職内定報告 ⑥チラシ「10/1(木) 推薦入試・一般入試 願書受付スタート!」 ⑦保護者向け冊子「保護者の皆さまへ HALの約束」表紙。各片の周縁はやや切れ・斜め。
  禁止語に未登録の企業名（就職先・提携先。自社でも使う可能性があるため人間が判断）【要確認】: Microsoft（チラシ「MicrosoftのAIツールを全学生に導入」）
  禁止語に未登録の候補（一般名詞と重なるため人間が判断）【要確認】: 学費援助システム（サポートBOOKの制度名。やや一般的で自社の学費案内でも使いうる）、保護者の皆さまへ（保護者向け冊子の表題だが一般的な語。登録しない方がよい）、見学・相談毎日!（チラシの定型表現で一般的）、HAL（学校の短縮ブランドのため school_terms に入れたが、大文字の英単語 CHALLENGE / HALF / HALL / SHALL / EXHALE などに部分一致する（HAL自身の紙面にも『RACING CHALLENGE』がある）。英字見出しで誤検出が出たら、HAL名古屋・HAL NAGOYA など長い形だけに絞ることを検討）、ハル（ロゴのルビ（HAL＝ハル）。2文字で『ハルシネーション』（AI用語）などに部分一致するため登録しない方がよい）
