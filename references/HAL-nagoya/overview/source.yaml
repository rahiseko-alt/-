# npm run ref:ingest で 2026-10-08 に作成。title / obtained / forbidden_terms / notes を人間が記入する
# source / kind は references/<source>/<kind>/ と同じ
source: HAL-nagoya
kind: overview
title: "HAL名古屋 2027年度 配布物一式の集合写真（入学要項2種・学費サポートBOOK・学校案内表紙・チラシ2種・保護者向け冊子）"
# 入手日（YYYY-MM-DD）
