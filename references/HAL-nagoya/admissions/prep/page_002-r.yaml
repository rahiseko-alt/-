# 比較用の補正指定（Phase 5 / npm run ref:prep。system/rules/references.md §4）
# 見開き（ノンブル 2〜3）の写真。90° 反時計回りに倒れて保存されているので時計回りに 90° 回し、
# 右ページ（ノンブル 3。上部の相談案内 + 角丸パネルの WEB 出願の流れ）だけを切り出す
# 回転後の画像は 2892×1458px。四隅は画素の実測（回転後の座標。比率は x / 2891, y / 1457）:
#   左上 (1431, 0)    … ノドの谷線（y=0〜200 で x≈1430〜1432 の暗い線）と画像の上端。天は撮影範囲の上端とほぼ一致
#   右上 (2879, 0)    … 小口の紙の端（y=20〜200 で x≈2879 の影の線）と画像の上端
#   右下 (2886, 1456) … 小口の端（y=1100〜1430 で x≈2886〜2888 の淡い線）と地の紙の端（x=2400〜2860 で y≈1455〜1457 の影の線）の交点
#   左下 (1434, 1457) … ノドの谷線（y=1300〜1440 で x≈1434）と画像の下端。地の端は x<2400 では撮影範囲の外（傾きからの推定で y≈1460）
#     なので下端で止めた（左下は約 3px = ページ高の 0.2% 欠ける）
# 紙の端から測った縦横比は 約 0.996（幅 1448〜1452px / 高さ 1456px）。表紙（page_001）も 約 0.99〜1.0 の正方形なので、
# aspect は 1.0（正方形）とした。books/replica/a-admissions が使用（判型 210×210mm の仮の値）
image: references/HAL-nagoya/admissions/page_002.jpg
rotate: 90
# 左上・右上・右下・左下（回転後の画像に対する比率）
corners:
  - [0.4950, 0.0]
  - [0.9958, 0.0]
  - [0.9983, 0.9993]
  - [0.4960, 1.0]
aspect: 1.0
height_px: 2000
notes: "右ページ（相談案内 + 略地図 + 角丸パネルの WEB 出願 3 ステップ）。補正後に上部の黒帯・パネルの上下辺・ステップ間の横罫が水平、パネルの左右辺がまっすぐであることを目視で確認"
