# page_009 — 元資料 p.16–17 の見開き（左 p.16 白ページ / 右 p.17 課題作文 1 枚目）
# 寸法は比率（%W = 片ページ幅比、%H = ページ高さ比）。判型の実寸は不明
grid:
  p16: "印刷なし（推薦書の裏）。裏写りのみ。上 約 7〜12%H に灰色の帯と綴じ穴の目印らしき円 2 つが薄く見える"
  p17: "ノド側 約 0〜39%W = 空き（灰色の右向き三角 + 太字 2 行）、小口側 約 39〜100%W = 作文用紙（上 約 2〜10%H に墨ベタのヘッダー帯）。作文の原稿用紙枠は 約 43〜96%W × 45〜77%H（20 列 × 10 行のマス）"
margins: { top: "ヘッダー帯 約 2%H", bottom: "約 20%H（マス目の下は余白）", outside: "約 2%W", inside: "約 2%W" }
gutter: "マス目は正方形（1 マス 約 2.6%W）"
photo_ratios: [ "写真なし" ]
heading_hierarchy:
  - { level: form-title, 内容: "（課題作文の名称）", size: "約 3.5%H", weight: "極太、中央揃え" }
  - { level: subtitle, 内容: "（提出対象の注記・括弧付き）", size: "約 1.6%H", weight: "太" }
  - { level: h3, 内容: "〈課題〉", size: "約 1.2%H", weight: "太" }
  - { level: body, 内容: "（課題文 2 行・字数の指示）", size: "約 1.1%H", weight: "中" }
  - { level: callout, 内容: "（提出対象の呼びかけ 2 行）", size: "約 1.4%H", weight: "太" }
  - { level: note, 内容: "字数の目盛り（マス目の右下）", size: "約 0.8%H", weight: "中、縦書き" }
colors:
  墨: "ヘッダー帯（約 5%）"
  中灰: "大きな三角（約 3%）"
  白: "地（約 90%）"
rules:
  - "原稿用紙: 外枠中太 + マス目の細線。行の右端に字数の目盛り（▲ + 数字）"
  - "氏名の記入用の下罫"
  - "キリトリ線（縦、約 39%W）"
cards: null
density: "低（p.16 は白、p.17 も余白が多い）"
page_type: { left: other, right: other, 補足: "白ページ（帳票の裏）/ 切り取り帳票（課題作文 1 枚目）" }
eye_flow: "灰色の三角 → 作文用紙のヘッダー帯 → 表題 → 課題 → マス目"
background: "白地のみ。p.16 は裏写りだけが見える"
image_crop: "裁ち落としはヘッダー帯のみ"
rhythm: "白ページ + 帳票の組み合わせ。作文は p.17（表）と p.18（裏）に続く"
notes:
  - "撮影画像はページ上端が画像の左側。時計回り 90° で正立。p.16 は白ページのため、目視で構造を読み取れるのは裏写りだけ"
  - "Layer 1: 不要"
  - "Layer 2: ヘッダー帯、原稿用紙のマス目（CSS grid または SVG のパターン）、下罫、キリトリ線、大きな三角"
  - "Layer 3: 帳票名・課題文（自社の課題は company-data で管理し、参考資料の課題文は書き写さない）・字数目盛り・ロゴマーク（正式データ）"
