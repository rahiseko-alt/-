# page_014 — 元資料 p.26–27 の見開き（左 p.26 留学生エントリーシート裏面 / 右 p.27 振込用紙 + 留学生入学願書表面）
# 寸法は比率（%W = 片ページ幅比、%H = ページ高さ比）。判型の実寸は不明
grid:
  p26: "小口側 約 2〜58%W = 帳票の裏面（学歴・職歴・保証人・就学目的・誓約の 5 ブロック、約 10〜97%H）、ノド側 約 60〜100%W = 空き（中央に大きな灰色の左向き三角 + 太字 4 行の確認の呼びかけ）。上部に横のキリトリ線と綴じ穴の目印"
  p27: "ノド側 約 0〜40%W = 振込用紙（90° 回転の縦組み帳票）、小口側 約 40〜100%W = 入学願書（上 約 3〜10%H に墨ベタのヘッダー帯）"
margins: { top: "約 2%H", bottom: "約 3%H", outside: "約 2%W", inside: "約 2%W" }
gutter: "帳票ブロック間 約 1.5%H"
photo_ratios:
  - "写真なし"
  - "写真貼付欄（約 12%W × 16%H、人物シルエット）"
heading_hierarchy:
  - { level: form-title, 内容: "（区分名 + 入学願書）", size: "約 3%H", weight: "極太" }
  - { level: form-block, 内容: "学歴 / 職歴 / 保証人 / 入学期 / 希望学科 / 本人", size: "約 1.2%H", weight: "太", 形: "淡灰の帯（ブロック幅）" }
  - { level: h3, 内容: "誓約", size: "約 1.4%H", weight: "太", 形: "帯なしの見出し + 下に記入の下罫" }
  - { level: callout, 内容: "（記入漏れの確認と記入例の参照 4 行）", size: "約 1.2%H", weight: "太" }
  - { level: field, size: "約 0.8〜0.9%H", weight: "中" }
  - { level: note, size: "約 0.7%H", weight: "中" }
colors:
  墨: "ヘッダー帯・枠（約 6%）"
  中灰: "大きな三角（約 4%）"
  淡灰: "ブロック見出し帯（約 5%）"
  白: "地（約 85%）"
rules:
  - "裏面の学歴表: 4 列（学校名 / 所在地 / 入学年月 / 卒業年月）× 5 行 + 合計行。外枠細線、内罫細線"
  - "語学の資格欄は点線で区切った 3 行"
  - "保証人欄は 2 列（和文 / 欧文表記）の格子"
  - "キリトリ線（縦 約 59%W と上部の横）"
cards:
  - "写真貼付欄"
  - "〇で囲む選択肢（角丸の小さな囲み）"
density: "高（両ページとも帳票の格子が密）。p.26 のノド側 約 40%W は空き"
page_type: { left: other, right: other, 補足: "切り取り帳票（留学生エントリーシート裏面 / 振込用紙 + 留学生入学願書表面）" }
eye_flow: "p.26: 学歴 → 職歴 → 保証人 → 就学目的 → 誓約（上から下）、空き部分の三角が帳票へ視線を戻す。p.27: 帳票名 → ヘッダー帯 → 写真欄 → 各記入ブロック"
background: "白地のみ。空き部分に裏写りあり"
image_crop: "裁ち落としは帳票ヘッダー帯のみ"
rhythm: "p.12–13（国内）と同じ 裏面 + 表面 の見開きを留学生向けで繰り返す"
notes:
  - "撮影画像はページ上端が画像の左側。時計回り 90° で正立。p.27 の帳票名は上端が切れかけている"
  - "Layer 1: 不要"
  - "Layer 2: ヘッダー帯、見出し帯、枠・点線・下罫、大きな三角（SVG）、写真欄のシルエット、キリトリ線、綴じ穴の目印"
  - "Layer 3: 帳票名・項目名・確認の呼びかけ・注記・ロゴマーク（正式データ）"
  - "表面（願書）と裏面（学歴など）は同じ用紙の両面。自社版でも表裏のページ番号の対応（右ページ = 表、次の左ページ = 裏）を崩さない"
