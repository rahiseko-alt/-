# page_013 — 元資料 p.24–25 の見開き（左 p.24 留学生の入学手続き / 右 p.25 振込用紙 + 留学生エントリーシート表面）
# 寸法は比率（%W = 片ページ幅比、%H = ページ高さ比）。判型の実寸は不明
grid:
  p24: "ラベル列（約 4〜18%W、箱ラベル 4 つ）+ 本文列（約 19〜97%W）。上端に見出し黒帯（裁ち落とし、約 0〜4%H）。中ほどに細枠の囲み（約 19〜63%W × 21〜46%H、外部機関の連絡先）。下 約 65%H 以降は余白"
  p25: "ノド側 約 0〜40%W = 振込用紙（90° 回転の縦組み帳票）、小口側 約 41〜100%W = エントリーシート（上 約 2〜11%H に墨ベタのヘッダー帯）。境界は縦のキリトリ線"
margins: { top: "黒帯が上端裁ち落とし / 帳票ヘッダー帯 約 2%H", bottom: "約 3〜4%H", outside: "約 3%W", inside: "約 2%W" }
gutter: "ラベル列と本文列の間 約 2%W"
photo_ratios:
  - "写真なし"
  - "写真貼付欄（約 12%W × 16%H、人物シルエット）"
heading_hierarchy:
  - { level: h1, 内容: "（留学生の入学手続きの章題）", size: "約 2.5%H", weight: "太白抜き", 形: "上端の墨ベタ帯（上部が撮影で切れている）" }
  - { level: side-label, 内容: "（納入 / 在留手続き / 住まい / 入学前支援のラベル）", size: "約 1.2%H", weight: "太", 形: "淡灰ベタ + 細枠 + オフセット影（約 14%W × 3%H、2 行のものは 約 5%H）" }
  - { level: box-title, 内容: "■（外部機関名）■", size: "約 1.4%H", weight: "太、中央揃え" }
  - { level: form-title, 内容: "（区分名 + エントリーシート）", size: "約 3%H", weight: "極太" }
  - { level: form-block, 内容: "入学期 / 希望学科 / 本人", size: "約 1.1%H", weight: "太", 形: "淡灰の帯" }
  - { level: body, size: "約 1.0%H", weight: "中", 行送り: "約 1.5%H" }
  - { level: note, size: "約 0.7〜0.8%H", weight: "中" }
colors:
  墨: "見出し帯・帳票ヘッダー帯・枠（約 8%）"
  淡灰: "ラベル箱・帳票見出し帯（約 5%）"
  白: "地（約 85%）"
rules:
  - "p.24 の囲み: 墨の中太枠（約 1pt）、内部に横の区切り罫 1 本、中央揃えの住所・電話（外部機関の情報なので自社版では扱いを人間に確認）"
  - "p.25 の帳票: 国籍・在留資格・出入国歴などの留学生用項目が増え、行数が国内版より多い。表の行は細罫 + 点線"
  - "振込用紙・キリトリ線は page_006 と同型"
cards:
  - "細枠の囲み（外部機関の案内）"
  - "写真貼付欄"
density: "p.24 = 中（上半分に集中）、p.25 = 高（帳票）"
page_type: { left: data, right: other, 補足: "留学生の入学手続き / 切り取り帳票（振込用紙 + 留学生エントリーシート表面）" }
eye_flow: "p.24: 見出し帯 → ラベル箱を上から（右の本文を読む）→ 囲み。p.25: 帳票名 → ヘッダー帯 → 写真欄 → 入学期 → 希望学科 → 本人の各項目 → 事務局欄"
background: "白地のみ。Layer 1 不要"
image_crop: "裁ち落としは p.24 上端の黒帯と p.25 の帳票ヘッダー帯"
rhythm: "国内向けの p.10–11（手続き + 帳票）と同じ並びを留学生向けで繰り返す"
notes:
  - "撮影画像はページ上端が画像の左側。時計回り 90° で正立。p.24 の見出し帯と p.25 の帳票名は上端が切れて文字の上半分が欠ける"
  - "p.24 の囲みは外部機関の連絡先。参考資料の住所・電話は書き写さない"
  - "Layer 1: 不要"
  - "Layer 2: 見出し帯、ラベル箱と影、囲み枠、帳票のヘッダー帯・見出し帯・枠・点線・キリトリ線・写真欄のシルエット"
  - "Layer 3: 章題・本文・ラベル名・帳票の項目名・注記・ロゴマーク（正式データ）。金額・日付は facts から"
