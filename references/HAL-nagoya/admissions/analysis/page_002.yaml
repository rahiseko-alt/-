# page_002 — 元資料 p.2–3 の見開き（左 p.2 / 右 p.3）
# 寸法は比率（%W = 片ページ幅比、%H = ページ高さ比）。判型の実寸は不明
grid:
  p2: "ラベル列（約 6〜27%W）+ 本文列（約 31〜97%W）の 2 列。上部 約 20%H を大きなロゴタイプが占める。下端 約 15%H は横罫で区切った出願資格ブロック（ラベル箱 + 2 列の箇条）"
  p3: "上部 約 25%H = 相談案内（本文 約 3〜68%W + 住所 約 50〜68%W + 略地図の枠 約 72〜95%W）。下部 約 27〜95%H = 角丸パネル全幅。パネル内は ステップ列（約 5〜27%W）+ 内容列（約 30〜92%W）"
margins: { top: "約 3%H", bottom: "約 3〜4%H（ノンブルは下端から 約 2%H、小口の角）", outside: "約 5.5%W", inside: "約 3%W（ノド湾曲で推定）" }
gutter: "列間 約 3〜4%W"
photo_ratios:
  - "写真なし"
  - "p.3 右上に略地図（枠 約 23%W × 19%H、灰色の道路・黒の建物の単純図形）"
  - "p.3 パネル内に QR コード（約 5%W 角）"
heading_hierarchy:
  - { level: display, 内容: "（学校名の欧文ロゴタイプ・読み仮名入り）", size: "キャップハイト 約 13%H", weight: "極太" }
  - { level: label, 内容: "（英字の小見出し）", size: "約 1.2%H", weight: "中サンセリフ", 備考: "下に曲線の細罫" }
  - { level: h2, 内容: "（考え方の見出し 2 行）", size: "約 2.2%H", weight: "太ゴシック" }
  - { level: lead, 内容: "（キャッチコピー 1 行）", size: "約 2.5%H", weight: "太ゴシック" }
  - { level: body-strong, 内容: "（強調語句を本文中で拡大）", size: "約 2〜2.4%H", weight: "太ゴシック", 備考: "同じ行の中で小さな地の文と大きな強調語を混植" }
  - { level: body, size: "約 1.2%H", weight: "中ゴシック", 行送り: "約 3.3%H（約 200%）" }
  - { level: side-label, 内容: "（出願資格のラベル）", size: "約 1.4%H", weight: "太、字間 約 1em", 形: "灰色ベタ + 墨の細枠" }
  - { level: panel-title, 内容: "（WEB 出願の見出し 2 行）", size: "約 2.6%H", weight: "太ゴシック白抜き", 形: "パネル上部の墨ベタ帯" }
  - { level: catch, 内容: "（ステップ数を大きく見せる見出し）", size: "数字 約 3.5%H / 他 約 2.3%H", weight: "極太" }
  - { level: step, 内容: "STEP 番号", size: "約 1.6%H", weight: "太", 形: "淡灰の角丸ピル（墨の細枠）、最後だけ墨ベタ白抜き" }
  - { level: h3, 内容: "各ステップの見出し", size: "約 1.5%H", weight: "太ゴシック" }
  - { level: note, size: "約 0.9%H", weight: "中ゴシック" }
colors:
  墨: "文字・ロゴタイプ・パネル見出し帯（p.3 の 約 8%）"
  淡灰: "STEP ピル・出願資格ラベル・地図の道路（約 3%）"
  白: "地（約 85%）"
  面積: "p.2 は墨の文字だけで構成（ロゴタイプが最大の黒面）。p.3 は黒帯がアクセント"
rules:
  - "p.2: 英字小見出しの下に左から右へ緩く上がる曲線の細罫（全幅）、出願資格の上に全幅の細い直線罫"
  - "p.3: ステップ内容の間に細い横罫（内容列幅）。パネルは墨の細枠 + 角丸"
  - "STEP ピルの間は灰色の太い縦矢印"
  - "注記の留学生案内は細枠の小さな箱"
cards:
  - "角丸パネル（p.3 下部 約 68%H、角丸 約 1.5%W、墨の細枠、上部 約 12% が墨ベタ帯）"
  - "略地図の細枠ボックス"
density: "p.2 = 低〜中（余白多め、行送りが広い）、p.3 = 中〜高（パネル内に 3 段階の手順と注意事項）"
page_type: { left: message, right: other, 補足: "考え方（アドミッションポリシー）と出願資格 / 相談案内・WEB 出願の手順" }
eye_flow: "p.2 左上の巨大ロゴタイプ → 考え方の見出し（左列）→ キャッチ（右列上）→ 強調語の拾い読み → 下端の出願資格 → p.3 上の相談案内 → 黒帯の見出し → STEP 1 → 2 → 3 → 受付完了（縦に下る）→ 注意事項"
background: "白地のみ。Layer 1 不要"
image_crop: "裁ち落としなし。すべて版面内"
rhythm: "表紙（灰）の直後の白い見開き。左 = 余白の多いメッセージ、右 = パネルで締めた手順という静と動の対比。p.18–19（留学生の扉）が p.2 と同じ ラベル列 + 本文列 の型を再利用"
notes:
  - "撮影画像はページ上端が画像の左側。時計回り 90° で正立。見開き（W:H ≈ 2:1）。歪みは小さく比較向き"
  - "Phase 5 の第 1 候補（写真なし・文字組みと単純図形だけで構成）"
  - "Layer 1: 不要"
  - "Layer 2: 曲線の細罫（SVG）、直線罫、灰色ラベル箱、角丸パネル + 墨帯、STEP ピル・縦矢印（SVG）、注記の細枠、略地図（単純図形の SVG。ただし自社の所在地図は company-data の情報で作る）"
  - "Layer 3: ロゴタイプ（自社ロゴの正式データ）、見出し・本文・強調語・ステップ説明・相談時間・住所・電話・URL（facts 参照）、QR（qr ヘルパー）、ノンブル"
  - "本文中で強調語だけを 2 倍近く大きくする混植は、span にクラスを付けて Layer 3 で再現する（ベースラインを揃える）"
