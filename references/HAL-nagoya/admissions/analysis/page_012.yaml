# page_012 — 元資料 p.22–23 の見開き（左 p.22 留学生 区分 前期 / 右 p.23 留学生 区分 後期）。入学区分テンプレート（page_004 と同型）
# 寸法は比率（%W = 片ページ幅比、%H = ページ高さ比）。判型の実寸は不明
grid:
  型: "片ページ 2 段。左段 約 4〜47%W / 右段 約 51〜97%W。段間 約 4%W"
  p22: "見出し + 太罫（約 2〜6%H）→ 全幅の導入文 2 行 → 2 段。左段: ラベル帯 4 本（メリット・書類 2 種・日程）+ 小さな日程表 2 点。右段: シェブロン + 段階 8 つの長いフロー（下端まで）"
  p23: "見出し + 太罫（約 3〜6%H）→ すぐ 2 段。左段: ラベル帯 2 本（書類・受付）。右段: シェブロン + 段階 7 つのフロー（下端まで）"
margins: { top: "見出しまで 約 2〜3%H", bottom: "約 3%H（フローが下端近くまで）", outside: "約 3〜4%W", inside: "約 3%W" }
gutter: "段間 約 4%W"
photo_ratios: [ "写真なし" ]
heading_hierarchy:
  - { level: h1, 内容: "（留学生の入学区分名 + 時期 + 区分）", size: "約 2.5%H", weight: "太ゴシック、中央揃え", 形: "下に全幅の太罫" }
  - { level: lead, 内容: "（区分の説明 2 行）", size: "約 1.2%H", weight: "太" }
  - { level: h2, 内容: "（メリット / 書類 / 日程 / 受付のラベル）", size: "約 1.3%H", weight: "太白抜き", 形: "墨ベタ帯（左段幅）。番号付き（①②）のラベルもある" }
  - { level: flow-title, 内容: "（エントリー / 出願方法）の流れ", size: "約 1.6%H", weight: "太", 形: "中灰の下向きシェブロン" }
  - { level: h3, 内容: "段階名", size: "約 1.2〜1.3%H", weight: "太", 形: "淡灰帯 + オフセット影" }
  - { level: body, size: "約 1.0%H", weight: "中", 行送り: "約 1.4%H" }
  - { level: note, size: "約 0.8%H", weight: "中" }
colors:
  墨: "太罫・ラベル帯・文字（約 8%）"
  中灰: "シェブロン・縦矢印（約 4%）"
  淡灰: "段階帯（右段に 7〜8 本）・表見出し（約 10%）"
  白: "地（約 78%）"
rules:
  - "page_004 と同じ（見出し太罫、ラベル帯、縦矢印、表の外枠中太 + 内罫細線）"
  - "段階が多いので縦矢印は短く（約 3〜5%H）、段階帯の間隔が詰まる"
cards:
  - "補足の細枠ボックス（持参の受付時間・提出期間）"
density: "高（両ページとも下端までフローが続く。p.22 は資料中もっとも要素数が多い）"
page_type: { left: data, right: data, 補足: "留学生の入学区分ごとの要項" }
eye_flow: "見出し → 左段のラベル帯を上から → 右段のシェブロン → 段階を下へ。左右の段がほぼ同じ高さまで埋まる"
background: "白地のみ。Layer 1 不要"
image_crop: "裁ち落としなし"
rhythm: "国内向け区分ページ（p.6–9）と同じテンプレートを留学生向けに再利用。段階数が多い場合でもレイアウトを変えず、段階帯の間隔を詰めて吸収する"
notes:
  - "撮影画像はページ上端が画像の左側。時計回り 90° で正立。左ページ上端の小口側に爪（小さな墨の縦帯）"
  - "段階 8 つでも同じ部品で組めることの検証になる（フロー部品の伸縮テスト用）"
  - "Layer 1: 不要"
  - "Layer 2: 太罫・ラベル帯・シェブロン・段階帯・縦矢印・表の罫・補足ボックス"
  - "Layer 3: 区分名・書類名・金額・日程・注記（facts から。参考資料の値は書き写さない）"
