# page_016 — 元資料 p.30–31 の見開き（左 p.30 白ページ / 右 p.31 願書記入例）
# 寸法は比率（%W = 片ページ幅比、%H = ページ高さ比）。判型の実寸は不明
grid:
  p30: "印刷なし（宛名ラベルの裏）。裏写りのみ"
  p31: "見出し（約 3〜5%H）→ 小見出し 2 つ（約 17%H、左右）→ 3 列: 左の帳票縮小図（約 3〜41%W × 20〜80%H）/ 中央の注記列（約 41〜58%W）/ 右の帳票縮小図（約 58〜96%W × 20〜80%H）。背後に全幅の淡灰の横縞（帳票の各ブロックの高さに合わせた帯）。右下に次ページへの誘導 1 行"
margins: { top: "約 3%H", bottom: "約 4%H", outside: "約 3%W", inside: "約 3%W" }
gutter: "縮小図と注記列の間 約 1%W"
photo_ratios:
  - "写真なし"
  - "帳票の縮小図 2 点（縦長 約 1:1.6、墨のヘッダー帯付き）"
heading_hierarchy:
  - { level: h2, 内容: "●（記入例の見出し）", size: "約 1.8%H", weight: "太ゴシック" }
  - { level: h3, 内容: "［（区分）の場合］", size: "約 1.4%H", weight: "中、角括弧" }
  - { level: annotation, 内容: "（記入上の注意。◀ ▶ で左右の帳票を指す）", size: "約 0.9%H", weight: "中", 備考: "中央揃え、左右に小さな黒三角" }
  - { level: link, 内容: "（次ページへの誘導 + ▶ の連続）", size: "約 1.7%H", weight: "太", 位置: "右下" }
colors:
  墨: "縮小図のヘッダー帯・文字（約 6%）"
  淡灰: "背後の横縞（約 25%）"
  白: "地・縮小図の紙面（約 65%）"
rules:
  - "縮小図の中は実物の帳票と同じ罫（細線・点線）を縮小。記入例の〇囲みは太めの円"
  - "注記列は罫なし。横縞の色面で、注記と帳票ブロックの対応を示す"
cards:
  - "帳票縮小図（白い紙面 + ヘッダー帯、影なし、わずかに傾いて見えるのは撮影の歪み）"
density: "p.30 = なし（白）、p.31 = 中"
page_type: { left: other, right: other, 補足: "白ページ（ラベルの裏）/ 願書の記入例（2 区分）" }
eye_flow: "見出し → 左の縮小図 → 中央の注記（横縞に沿って左右を行き来）→ 右の縮小図 → 右下の誘導で次ページへ"
background: "白地 + 淡灰の横縞（単色の帯なので Layer 2）"
image_crop: "裁ち落としなし。縮小図は横縞の上に重ねる"
rhythm: "帳票ブロックの後の記入例。次の p.32（page_017）に留学生版の記入例が続く"
notes:
  - "撮影画像はページ上端が画像の左側。時計回り 90° で正立。p.30 は白ページで裏写りだけが見える"
  - "縮小図は画像を貼らず、帳票の HTML 部品を縮小（transform: scale）して再利用する。記入例の値はダミー（〇〇・XXXX）で置き、参考資料の記入例の文字は書き写さない"
  - "Layer 1: 不要"
  - "Layer 2: 横縞の色面、縮小した帳票部品（枠・ヘッダー帯・罫）、注記の小三角"
  - "Layer 3: 見出し・区分名・注記・記入例のダミー値・誘導文・ロゴマーク（正式データ）"
