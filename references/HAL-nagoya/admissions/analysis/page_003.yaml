# page_003 — 元資料 p.4–5 の見開き（左 p.4 / 右 p.5）。上端が撮影範囲から切れている
# 寸法は比率（%W = 片ページ幅比、%H = ページ高さ比）。判型の実寸は不明
grid:
  p4: "左に小さなラベル列（約 3〜11%W）+ 年制の注記列（約 11〜15%W）+ 全幅表（約 15〜96%W）。表は 4 列（学部 約 14% / 学科 約 16% / 専攻 約 33% / 入学区分 約 11%）。3 つの表（年制別）を縦に積み、最下部に授業時間の 1 行表"
  p5: "上 約 3〜55%H と 約 59〜88%H に同じ型の時間軸図を 2 つ。縦軸 = 月（左端 約 8〜12%W の墨ベタの月ラベル列）、横 = 入学区分 3 列（約 13〜40%W / 40〜66%W / 66〜96%W）。最下部 約 90〜97%H に灰色の説明ボックス"
margins: { top: "見出し黒帯が上端裁ち落とし（帯の高さ 約 4〜5%H と推定。撮影で切れている）", bottom: "約 3%H", outside: "約 2〜3%W（表がほぼ小口いっぱい）", inside: "約 3%W" }
gutter: "表の列間はセル内余白 約 0.5%W のみ。時間軸の区分列の間は 約 1%W"
photo_ratios: [ "写真・図版なし（表と図表のみ）" ]
heading_hierarchy:
  - { level: h1, 内容: "（ページ見出し）", size: "約 2.5〜3%H", weight: "太ゴシック白抜き", 形: "上端の墨ベタ帯に中央揃え（見開きの左右でそれぞれ）" }
  - { level: side-label, 内容: "（募集学科 / 授業時間のラベル）", size: "約 1.2%H", weight: "太ゴシック白抜き", 形: "墨ベタの小さな箱（約 7%W × 2.5〜4%H）" }
  - { level: table-group, 内容: "【年制】", size: "約 1.1%H", weight: "太", 形: "角括弧で表の左上に" }
  - { level: table-head, size: "約 1.0%H", weight: "太、字間広め", 形: "淡灰ベタの見出し行" }
  - { level: table-body, size: "約 1.0%H（コース名は太字 + 角括弧）", weight: "中" }
  - { level: chart-head, 内容: "（入学区分名）", size: "約 1.3%H", weight: "太", 形: "淡灰の箱 + 墨の細枠 + 右下オフセット影" }
  - { level: chart-label, 内容: "（月）", size: "約 1.2%H", weight: "太白抜き", 形: "墨ベタの箱を縦に連ねる" }
  - { level: note, size: "約 0.8%H", weight: "中" }
colors:
  墨: "見出し帯・月ラベル列・入学のバー（時間軸最下段の全幅帯）・表の外枠（約 10%）"
  淡灰: "表の見出し行、時間軸の 1 か月おきの横縞、区分の見出し箱、説明ボックスの地（約 10〜15%）"
  白: "地（約 75%）"
rules:
  - "表: 外枠 太め（約 1pt）、内罫 細線。年制ごとに別の表として間を空ける。結合セルを多用（学部・学科・入学区分は縦に結合）"
  - "時間軸: 期間 = 墨の縦線（太さ 約 0.4%W）、始点・終点 = 黒丸、未確定・随時の期間 = 破線。区分列の境 = 淡灰の縦の細線"
  - "注記の小さな細枠ラベル（募集回の表示）"
cards:
  - "説明ボックス: 淡灰ベタ・枠なし、左上に墨ベタの小ラベル（白抜き）"
  - "区分見出し: 淡灰の箱 + 細枠 + 右下オフセット影"
density: "高（p.4 は表のセル数が多く 1 ページ 60 行相当、p.5 は図表 2 つ）"
page_type: { left: data, right: data, 補足: "募集学科・入学区分の一覧表と授業時間 / 入学区分別の日程の時間軸図" }
eye_flow: "p.4: 左上のラベル → 4 年制の表（上から下）→ 2 年制 → 1 年制 → 授業時間。p.5: 上の時間軸（月を上から下、区分を左から右）→ 下の時間軸 → 説明ボックス"
background: "白地のみ。Layer 1 不要"
image_crop: "裁ち落としは上端の見出し黒帯だけ（小口側も裁ち落とし）"
rhythm: "考え方の見開き（p.2–3）の後に、資料全体の索引となるデータ見開き。続く p.6–9 の区分ページの前提になる"
notes:
  - "撮影画像はページ上端が画像の左側。時計回り 90° で正立。上端が切れており見出し帯の文字の上半分が欠ける。見出し帯の高さは p.10・p.21 から推定する"
  - "Phase 5 の予備候補（表の結合セルと時間軸図の CSS/SVG 化の検証）。比較時は上端の欠けを考慮"
  - "Layer 1: 不要"
  - "Layer 2: 上端の墨帯、ラベル箱、表の罫と見出し行の色面、時間軸の月ラベル列・横縞・縦線・丸・破線・入学バー（SVG または CSS grid）、説明ボックス"
  - "Layer 3: 学部・学科・専攻・入学区分の名称、日付、月、注記（すべて company-data の facts から。参考資料の学科名・コース名は書き写さない）"
  - "時間軸図は「月 × 区分」の格子に期間を配置するので、データ駆動（facts の日程から位置を計算）で作ると更新に強い"
