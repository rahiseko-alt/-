# page_015 — 元資料 p.28–29 の見開き（左 p.28 留学生入学願書裏面 / 右 p.29 出願書類チェックリスト + 宛名ラベル）
# 寸法は比率（%W = 片ページ幅比、%H = ページ高さ比）。判型の実寸は不明
grid:
  p28: "page_014 の p.26 と同型（小口側 約 2〜58%W に帳票の裏面 5 ブロック、ノド側 約 60〜100%W に大きな灰色の左向き三角 + 確認の呼びかけ 4 行）"
  p29: "ノド側 約 3〜45%W = チェックリスト（見出し + 3 列の表 約 3〜45%W × 16〜52%H）、小口側 約 47〜100%W = 宛名ラベル（キリトリ線で囲む、約 23〜97%H）。ラベル内は 郵便番号の枠（右上）→ 小さな切手欄（左上）→ 送付方法の小ラベル → 宛先 2 行 → 墨のリボン帯 → 入学区分の〇選択表 → 志願者の住所氏名表"
margins: { top: "p.29 見出しまで 約 10%H", bottom: "約 6%H", outside: "約 2%W", inside: "約 3%W" }
gutter: "チェックリストとラベルの間 約 2%W（キリトリ線）"
photo_ratios: [ "写真なし" ]
heading_hierarchy:
  - { level: h2, 内容: "●（チェックリスト / ラベルの見出し）", size: "約 1.7%H", weight: "太ゴシック", 形: "黒丸 + 見出し、下に 1〜3 行の説明" }
  - { level: table-head, 内容: "該当者 / チェック / 書類", size: "約 1.0%H", weight: "太", 形: "淡灰の見出し行" }
  - { level: address, 内容: "（宛先 = 学校名 + 部署）", size: "約 2%H", weight: "極太", 備考: "自社版では facts の住所・名称を使う" }
  - { level: ribbon, 内容: "（在中表示 + 締切の注記）", size: "約 1.7%H（注記 約 0.9%H）", weight: "太白抜き、字間広め", 形: "両端に切り込みのある墨のリボン帯（約 50%W × 3.5%H）" }
  - { level: small-label, 内容: "（送付方法）", size: "約 1.2%H", weight: "太白抜き", 形: "濃灰の小さな箱" }
  - { level: body, size: "約 1.0〜1.1%H", weight: "中" }
  - { level: note, size: "約 0.8%H", weight: "中" }
colors:
  墨: "リボン帯・郵便番号枠・表の外枠（約 6%）"
  濃灰: "送付方法の小ラベル（約 1%）"
  中灰: "p.28 の大きな三角（約 4%）"
  淡灰: "表の見出し行・ブロック帯（約 4%）"
  白: "地（約 85%）"
rules:
  - "チェックリスト: 3 列（該当者 約 25% / チェック欄 約 12% / 書類名 約 63%）× 10 行。外枠中太・内罫細線、該当者の列は結合セル、チェック欄は中央に小さな四角"
  - "宛名ラベル: 四辺をキリトリ線（破線）で囲む。郵便番号は 1 桁ずつの太枠 7 つ。切手欄は破線の小さな四角"
  - "入学区分の選択表: 区分 × 専願 / 併願 の 2 段見出し + 〇の破線円"
cards:
  - "リボン帯（墨ベタ、左右の端を矢羽根形に切り欠く）"
  - "郵便番号の枠"
density: "p.28 = 高（帳票）、p.29 = 中（表 1 点 + ラベル 1 点、余白あり）"
page_type: { left: other, right: other, 補足: "切り取り帳票（留学生入学願書裏面）/ 出願書類チェックリストと封筒用の宛名ラベル" }
eye_flow: "p.29: 左上のチェックリスト見出し → 表を上から → 右のラベル見出し → 郵便番号 → 宛先 → リボン帯 → 入学区分の〇 → 志願者欄"
background: "白地のみ。Layer 1 不要"
image_crop: "裁ち落としなし"
rhythm: "帳票ブロックの最後。出願前の最終確認（チェックリスト）と封入（ラベル）で流れを締める"
notes:
  - "撮影画像はページ上端が画像の左側。時計回り 90° で正立。p.29 上部に裏写りの文字が薄く見える"
  - "宛名ラベルの郵便番号・住所・宛先は参考資料の固有情報。自社版では company-data の facts だけを使う"
  - "Layer 1: 不要"
  - "Layer 2: チェックリストの罫と見出し行・チェック欄の四角、ラベルのキリトリ線・郵便番号枠・切手欄、リボン帯（SVG の多角形）、〇の破線円、大きな三角"
  - "Layer 3: 見出し・書類名・該当者・宛先・郵便番号（facts）・区分名・注記"
