# page_005 — 元資料 p.8–9 の見開き（左 p.8 / 右 p.9）。入学区分ページのテンプレート（page_004 と同型）
# 寸法は比率（%W = 片ページ幅比、%H = ページ高さ比）。判型の実寸は不明
grid:
  型: "片ページ 2 段。左段 約 5〜47%W / 右段 約 51〜96%W。段間 約 4%W"
  p8: "見出し + 太罫（約 2〜6%H）→ すぐ 2 段。左段に ラベル帯 3 本 + 日程表 3 点（1 次・2 次・別時期）、右段にフロー 3 段階 + 誘導箱（右段の下 約 35%H は余白）"
  p9: "見出し + 太罫（約 3〜7%H）→ 全幅の導入文 2 行 → 2 段。左段に ラベル帯 4 本 + 小さな日程表 2 点、右段にフロー 3 段階 + 誘導箱。下 約 20%H は余白"
margins: { top: "見出しまで 約 2〜3%H", bottom: "p.8 約 12%H / p.9 約 20%H（内容量に応じて余白が残る）", outside: "約 5%W", inside: "約 3.5%W（推定）" }
gutter: "段間 約 4%W"
photo_ratios: [ "写真・図版なし" ]
heading_hierarchy:
  - { level: h1, 内容: "（入学区分名 + 括弧の区分）", size: "約 2.5%H", weight: "太ゴシック、字間広め、中央揃え", 形: "下に全幅の太罫" }
  - { level: h2, 内容: "（資格 / 書類 / 日程などのラベル）", size: "約 1.3%H", weight: "太白抜き", 形: "墨ベタ帯（左段幅）" }
  - { level: flow-title, 内容: "（出願方法）の流れ", size: "約 1.6%H", weight: "太", 形: "中灰の下向きシェブロン（右段幅）" }
  - { level: h3, 内容: "段階名", size: "約 1.3%H", weight: "太", 形: "淡灰帯 + オフセット影" }
  - { level: table-group, 内容: "【入学時期】・1 次 / 2 次の小見出し", size: "約 1.1〜1.2%H", weight: "太" }
  - { level: body, size: "約 1.0〜1.1%H", weight: "中" }
  - { level: note, size: "約 0.8%H", weight: "中" }
colors:
  墨: "見出し太罫・ラベル帯・本文（約 7%）"
  中灰: "シェブロン・縦矢印（約 3%）"
  淡灰: "段階帯・表見出し・縞（約 6%）"
  白: "地（約 80%）"
rules:
  - "page_004 と同じ（見出し下の太罫、表の外枠中太 + 内罫細線 + 縞、フローの縦矢印）"
  - "p.8 の選考内容は 2 列の細枠表（左に区分名の結合セル、右に選考内容 2 行ずつ）"
cards:
  - "細枠の補足ボックス（WEB 出願・持参の受付時間）"
  - "誘導箱（入学手続きへの参照、淡灰 + 細枠 + オフセット影）"
density: "p.8 = 高（日程表 3 点）、p.9 = 中（表が小さく下に余白）"
page_type: { left: data, right: data, 補足: "入学区分 C・D の要項" }
eye_flow: "見出し → 左段のラベル帯を上から → 日程表 → 右段シェブロン → 段階を下へ → 誘導箱"
background: "白地のみ。Layer 1 不要"
image_crop: "裁ち落としなし"
rhythm: "p.6–7 と同型の見開きを続け、区分ページの連続感を出す。内容量の差は下部の余白で吸収（ページを詰め直さない）"
notes:
  - "撮影画像はページ上端が画像の左側。時計回り 90° で正立。左ページ上端の小口側に爪（小さな墨の縦帯）"
  - "page_004 と同じ部品で組めることの確認用（テンプレート再利用の検証ページ）"
  - "Layer 1: 不要"
  - "Layer 2: 太罫・ラベル帯・シェブロン・段階帯・縦矢印・表の罫と縞・補足ボックス"
  - "Layer 3: 区分名・資格・書類名・選考内容・日程・金額・注記（facts から。参考資料の値は書き写さない）"
