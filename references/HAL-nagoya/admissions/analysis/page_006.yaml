# page_006 — 元資料 p.10–11 の見開き（左 p.10 入学手続き / 右 p.11 振込用紙 + エントリーシート表面）
# 寸法は比率（%W = 片ページ幅比、%H = ページ高さ比）。判型の実寸は不明
grid:
  p10: "ラベル列（約 3〜15%W、墨ベタの箱ラベル）+ 本文列（約 17〜96%W）。上から 見出し黒帯 → 導入 1 行 → 入学金 → 学費（全幅の表 約 17〜96%W × 27〜54%H）→ 保険 → 提出物 → 下部に囲み記事（約 17〜80%W × 75〜95%H）"
  p11: "帳票の 2 分割。ノド側 約 0〜40%W = 振込用紙（縦組みの帳票を 90° 回転、受取書と依頼書の 2 片）、小口側 約 40〜100%W = エントリーシート（上 約 6〜14%H に墨ベタのヘッダー帯）。境界は縦のキリトリ線"
margins: { top: "見出し黒帯が上端裁ち落とし（帯 約 4〜5%H）", bottom: "約 5%H", outside: "p.10 約 3%W（ラベル箱）/ p.11 約 2%W", inside: "約 2〜3%W" }
gutter: "ラベル列と本文列の間 約 2〜3%W。表のセル内余白 約 0.5%W"
photo_ratios:
  - "写真なし"
  - "帳票の写真貼付欄（約 12%W × 16%H の縦長枠、中に人物シルエット + 注意 3 行）"
heading_hierarchy:
  - { level: h1, 内容: "（ページ見出し）", size: "約 3%H", weight: "太白抜き、字間広め", 形: "上端の墨ベタ帯" }
  - { level: lead, 内容: "（導入文 1 行）", size: "約 1.5%H", weight: "太" }
  - { level: side-label, 内容: "（入学金 / 学費 / 保険 / 提出物のラベル）", size: "約 1.2%H", weight: "太白抜き", 形: "墨〜濃灰ベタの箱（約 12%W × 2.5%H、3 行のものは高さ 約 6%H）" }
  - { level: table-title, 内容: "（年度）年間学費明細", size: "約 1.3%H", weight: "太" }
  - { level: amount, 内容: "■（費目）（金額）", size: "約 1.4%H", weight: "太" }
  - { level: box-title, 内容: "（別冊名）について", size: "約 1.5%H", weight: "太", 形: "淡灰の箱 + 細枠 + オフセット影、囲みの上辺に重ねる" }
  - { level: form-title, 内容: "（帳票名）", size: "約 3%H", weight: "極太ゴシック" }
  - { level: form-block, 内容: "入学期 / 希望学科 / 本人 / 保証人", size: "約 1.1%H", weight: "太", 形: "淡灰の帯" }
  - { level: body, size: "約 1.0〜1.1%H", weight: "中" }
  - { level: note, size: "約 0.7〜0.8%H", weight: "中" }
colors:
  墨: "見出し帯・ラベル箱・帳票ヘッダー帯・表外枠（約 10%）"
  淡灰: "表見出し行・縞・帳票の見出し帯・囲みの見出し（約 8%）"
  白: "地（約 80%）"
rules:
  - "学費表: 12 行 × 9 列。見出し行 中灰、1 行おきに淡灰の縞、年制の列は縦に結合、数字は右揃え。外枠は左と上下が太め"
  - "囲み記事: 墨の細枠（約 0.8pt）"
  - "振込用紙: 太枠 + 細罫 + 縦組みの項目名、金額欄は 1 桁ずつの枠、収納印の破線の円 2 つ、キリトリ線（破線）"
  - "エントリーシート: 灰色見出し帯 + 細枠、行内は点線、選択肢は角丸の小さな囲み、最下部に事務局記入欄（太枠・縦の点線）"
cards:
  - "囲み記事（細枠、上辺中央に見出し箱を重ねる）"
  - "写真貼付欄（細枠の縦長箱）"
density: "高（p.10 は表 + 5 ブロック、p.11 は帳票 2 種）"
page_type: { left: data, right: other, 補足: "入学手続き・学費表 / 切り取り帳票（振込用紙 + エントリーシート表面）" }
eye_flow: "p.10: 見出し帯 → 導入文 → ラベル箱を上から下へ（左列で拾い、右の本文を読む）→ 学費表 → 囲み記事。p.11: 帳票名（右上）→ ヘッダー帯 → 帳票を上から記入順に。振込用紙は 90° 回して使う"
background: "白地のみ。Layer 1 不要"
image_crop: "裁ち落としは見出し黒帯（p.10 上端）と帳票ヘッダー帯（p.11 小口側）"
rhythm: "区分ページの後の締めのデータページ（p.10）から、綴じ込み帳票（p.11〜18）へ切り替わる境目"
notes:
  - "撮影画像はページ上端が画像の左側。時計回り 90° で正立。p.10 は見出し帯の上部が切れて文字の上半分が欠ける"
  - "Phase 5 の第 3 候補は p.10 側（学費表 + ラベル箱 + 囲み記事）。p.11 の振込用紙は金融機関の固有情報を含むので再現対象から外す"
  - "Layer 1: 不要"
  - "Layer 2: 見出し帯、ラベル箱、表の罫・見出し行・縞、囲み記事の枠と見出し箱、帳票のヘッダー帯・見出し帯・枠・点線・キリトリ線・写真欄のシルエット（SVG）"
  - "Layer 3: 学費・入学金の金額、学科名、注記、帳票の項目名、ロゴ（正式データ）。金額は必ず company-data の facts から（参考資料の金額は書き写さない）"
  - "帳票の振込用紙は金融機関の指定様式であることが多い。自社版では様式の指定を人間に確認する"
