# page_007 — 元資料 p.12–13 の見開き（左 p.12 エントリーシート裏面 / 右 p.13 振込用紙 + 入学願書表面）
# 寸法は比率（%W = 片ページ幅比、%H = ページ高さ比）。判型の実寸は不明
grid:
  p12: "小口側 約 4〜60%W = 帳票の裏面（学歴・職歴・自己アピール の 3 ブロックを縦に）、ノド側 約 61〜100%W = 白（振込用紙の裏）。上 約 3〜9%H に確認の呼びかけ（灰色の下向き三角の上に 2 行）と横のキリトリ線"
  p13: "ノド側 約 0〜40%W = 振込用紙（90° 回転の縦組み帳票）、小口側 約 41〜100%W = 入学願書（上 約 8〜16%H に墨ベタのヘッダー帯）。境界は縦のキリトリ線"
margins: { top: "帳票名 約 2%H / ヘッダー帯 約 8%H", bottom: "約 3%H", outside: "約 2〜4%W", inside: "約 2%W" }
gutter: "帳票ブロック間 約 2%H。帳票の左右余白 約 2%W"
photo_ratios:
  - "写真なし"
  - "写真貼付欄（約 12%W × 16%H、人物シルエット）"
heading_hierarchy:
  - { level: form-name-top, 内容: "（課程・区分 + 志願者用）", size: "約 2%H", weight: "太", 位置: "ヘッダー帯の上、右寄せ" }
  - { level: form-title, 内容: "（帳票名 + 課程名）", size: "約 3%H（課程名は 約 1.5%H）", weight: "極太" }
  - { level: form-block, 内容: "学歴 / 職歴 / 自己アピール / 入学区分 / 希望学科 / 本人 / 保証人", size: "約 1.1%H", weight: "太", 形: "淡灰の帯（ブロック幅）" }
  - { level: slip-title, 内容: "（振込用紙の名称）", size: "約 1.5%H", weight: "太、縦組み", 位置: "ノド側の帳票の縦の見出し" }
  - { level: field, size: "約 0.9〜1.0%H", weight: "中" }
  - { level: note, size: "約 0.7%H", weight: "中" }
colors:
  墨: "ヘッダー帯（ロゴマーク白抜き）・枠線（約 8%）"
  淡灰: "ブロック見出し帯・上部の三角・帯（約 6%）"
  白: "地（約 85%）"
rules:
  - "帳票ブロック: 外枠細線（約 0.5pt）、見出し帯の下に記入行。行内の区切りは点線"
  - "自己アピール欄: チェックボックス 8 行 + 下に記入用の点線罫 7〜8 行"
  - "キリトリ線: 縦（約 61%W / p.13 では約 40%W）と横（上部）に破線 + 小さな注記"
  - "綴じ穴の目印: p.12 上部の灰色帯の中に小さな円 2 つ"
  - "事務局記入欄: 最下部に太枠の小さな表（縦の点線区切り）"
cards:
  - "写真貼付欄（細枠の縦長箱）"
  - "〇で囲む選択肢（角丸の小さな囲み、点線）"
density: "高（記入欄の格子が密）。ただし p.12 のノド側 約 40%W は白"
page_type: { left: other, right: other, 補足: "切り取り帳票（エントリーシート裏面 / 振込用紙 + 入学願書表面）" }
eye_flow: "p.13: 右上の帳票名 → ヘッダー帯 → 帳票名・ロゴ → 写真欄 → 入学区分・入学期 → 希望学科 → 本人 → 保証人 → 事務局欄。p.12: 上の確認の呼びかけ → 学歴 → 職歴 → 自己アピール"
background: "白地のみ。p.12 のノド側の白い部分に裏写り（反対面の振込用紙）が見える"
image_crop: "裁ち落としは p.13 小口側のヘッダー帯のみ"
rhythm: "p.11（エントリーシート）と同型の帳票を区分別に繰り返す（p.13 入学願書、p.15 推薦書、p.17 作文）。表 = 右ページ、裏 = 左ページ"
notes:
  - "撮影画像はページ上端が画像の左側。時計回り 90° で正立"
  - "Phase 5 の第 4 候補は p.13 の入学願書部分（ヘッダー帯・写真欄・見出し帯 + 細枠の記入表・事務局欄）。振込用紙（金融機関・口座の固有情報）は再現しない"
  - "Layer 1: 不要"
  - "Layer 2: ヘッダー帯、見出し帯、枠と点線、チェックボックス、〇囲み、写真欄のシルエット（SVG）、キリトリ線、綴じ穴の目印、灰色の三角"
  - "Layer 3: 帳票名・項目名・注記・ロゴマーク（正式データ）。学科名などの選択肢は facts から"
  - "帳票は印刷後に手書きされるため、記入欄の高さ（約 2.5〜3%H）を本文量で詰めない。固定寸法の Layer 2 として作る"
