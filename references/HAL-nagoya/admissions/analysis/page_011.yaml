  - "p.21 の灰色ボックス内の企業名・職種の一覧は参考資料の実績そのもの。構造（淡灰ボックス + 【見出し】 + 斜線区切りの流し組み）だけを参考にし、内容は一切持ち込まない"
  - "Layer 1: 不要"
  - "Layer 2: 見出し帯、ラベル箱、小さな表の罫、淡灰ボックス"
  - "Layer 3: 見出し・本文・制度の説明・一覧（自社の実績は company-data/facts/results.yaml から、as_of と source 付き）"
