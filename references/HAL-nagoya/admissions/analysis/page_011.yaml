# page_011 — 元資料 p.20–21 の見開き（左 p.20 留学生の出願方法 / 右 p.21 留学生の支援体制・実績一覧）
# 寸法は比率（%W = 片ページ幅比、%H = ページ高さ比）。判型の実寸は不明
grid:
  p20: "ラベル列（約 5〜19%W、灰色ラベル箱 1 つ）+ 本文列（約 23〜97%W）。本文列の上に小さな表（5 列 × 3 行、約 23〜70%W × 6〜12%H）。下 約 62%H 以降は余白"
  p21: "全幅の見出し黒帯（上端裁ち落とし、約 0〜5%H）→ 番号付きの見出し + 本文 6 項目（全幅、約 5〜50%H）→ 淡灰の地のボックス 2 つ（約 52〜70%H / 72〜94%H、全幅）"
margins: { top: "p.20 約 1%H（ほぼ上端から）/ p.21 黒帯が裁ち落とし", bottom: "約 4%H", outside: "約 3%W", inside: "約 2%W" }
gutter: "ラベル列と本文列の間 約 4%W"
photo_ratios: [ "写真なし" ]
heading_hierarchy:
  - { level: h1, 内容: "（学校名 + 支援体制の章題）", size: "約 2.5%H", weight: "太白抜き", 形: "上端の墨ベタ帯（小口まで裁ち落とし）" }
  - { level: side-label, 内容: "（出願方法のラベル）", size: "約 1.3%H", weight: "太、字間広め", 形: "淡灰 + 細枠 + オフセット影" }
  - { level: h3, 内容: "●（在住地別の見出し）", size: "約 1.2%H", weight: "太" }
  - { level: h3-numbered, 内容: "1.〜6. の支援項目", size: "約 1.3%H", weight: "太ゴシック" }
  - { level: box-label, 内容: "【（制度名）】【実績】", size: "約 1.1%H", weight: "太、墨角括弧" }
  - { level: body, size: "約 0.9〜1.0%H", weight: "中", 行送り: "約 1.4%H" }
  - { level: list, 内容: "（企業名・職種の羅列。斜線区切りの流し組み）", size: "約 1.0%H", weight: "中" }
colors:
  墨: "見出し帯・文字（約 10%）"
  淡灰: "地のボックス 2 つ（p.21 の 約 40%）、ラベル箱、小さな表の見出し行"
  白: "地"
rules:
  - "p.20 の小さな表: 外枠中太・内罫細線・見出し行淡灰"
  - "p.21 は罫線なし（ボックスの色面で区切る）"
cards:
  - "淡灰の地のボックス（枠なし、内余白 約 1%W）。中は流し組みの一覧"
density: "p.20 = 中（上半分に集中、下半分は余白）、p.21 = 高（全面に本文と一覧）"
page_type: { left: data, right: data, 補足: "留学生の出願方法 / 支援体制と実績一覧" }
eye_flow: "p.20: ラベル → ●見出し → 表 → ●見出し → 番号付きの制度説明。p.21: 黒帯 → 1. から 6. の見出しを拾い読み → 灰色ボックスの一覧"
background: "白地のみ。Layer 1 不要"
image_crop: "裁ち落としは p.21 上端の黒帯のみ"
rhythm: "扉（p.19）の後の説明見開き。左が軽く右が重い非対称"
notes:
