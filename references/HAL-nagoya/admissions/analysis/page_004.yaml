# page_004 — 元資料 p.6–7 の見開き（左 p.6 / 右 p.7）。入学区分ページの標準テンプレート
# 寸法は比率（%W = 片ページ幅比、%H = ページ高さ比）。判型の実寸は不明
grid:
  型: "片ページ 2 段。左段 約 5.5〜47%W（概要・メリット・書類・方法・日程表）/ 右段 約 51〜96%W（フロー）。段間 約 4%W"
  p6: "見出し + 太罫（約 2〜7%H）→ 全幅の導入文 2 行（約 7〜11%H）→ 2 段"
  p7: "見出し + 太罫（約 3〜7%H）→ すぐ 2 段（導入文なし）。下 約 20%H は余白"
margins: { top: "見出しまで 約 2〜3%H", bottom: "約 4%H（p.6 は日程表が 約 95%H まで）", outside: "約 5.5%W", inside: "約 3.5%W（推定）" }
gutter: "段間 約 4%W"
photo_ratios: [ "写真・図版なし" ]
heading_hierarchy:
  - { level: h1, 内容: "（入学区分名 + 括弧の区分）", size: "約 2.5%H", weight: "太ゴシック、字間 約 0.5em、中央揃え", 形: "下に全幅の墨の太罫（約 0.3%H）" }
  - { level: lead, 内容: "（区分の説明 2 行）", size: "約 1.2%H", weight: "太ゴシック" }
  - { level: h2, 内容: "（メリット / 書類 / 方法 / 日程などのラベル）", size: "約 1.3%H", weight: "太ゴシック白抜き", 形: "左段幅いっぱいの墨ベタ帯（高さ 約 2.2%H）" }
  - { level: flow-title, 内容: "（区分）の流れ", size: "約 1.6%H", weight: "太ゴシック", 形: "右段幅いっぱいの中灰の下向きシェブロン（逆三角の旗形、高さ 約 4%H）" }
  - { level: h3, 内容: "フローの段階名", size: "約 1.3%H", weight: "太ゴシック", 形: "淡灰の帯 + 右下の濃いオフセット影（高さ 約 2.2%H）" }
  - { level: h4, 内容: "①②・1. 2. の項目", size: "約 1.1%H", weight: "太" }
  - { level: body, size: "約 1.0〜1.1%H", weight: "中", 行送り: "約 1.4%H（約 140%）" }
  - { level: table-group, 内容: "【入学時期】", size: "約 1.2%H", weight: "太" }
  - { level: note, size: "約 0.8%H", weight: "中〜太" }
colors:
  墨: "見出し下の太罫、ラベル帯（左段に 4〜5 本）、本文（約 8%）"
  中灰: "フロー見出しのシェブロン、縦矢印（約 3%）"
  淡灰: "段階帯、表見出し行、縞（約 6%）"
  白: "地（約 80%）"
rules:
  - "見出し下の全幅太罫（小口側は裁ち落とし気味まで延びる）"
  - "日程表: 外枠中太、内罫細線、見出し行淡灰、1 行おきに淡灰の縞、右端列（結果通知）は縦に結合"
  - "フロー: 段階帯の下から次の段階帯まで灰色の太い縦矢印（段の左端 約 1%W の位置）。説明文は矢印の右に字下げ"
  - "補足の細枠ボックス（持参の受付時間・WEB 出願の案内、面談内容の 2 列ボックス）"
cards:
  - "細枠の補足ボックス（0.5pt 相当、角なし、内余白 約 0.5%W）"
  - "提出期間ボックス（細枠、2 行）"
  - "最下部の誘導箱（入学手続きページへの参照）: 淡灰 + 細枠 + オフセット影"
density: "高（p.6 は左段にラベル 5 本 + 表 2 点、右段に 5 段階のフロー + 誘導箱）。p.7 は中（下部に余白）"
page_type: { left: data, right: data, 補足: "入学区分ごとの要項（資格・書類・方法・日程・流れ）。1 区分 = 片ページ" }
eye_flow: "上の見出し → 導入文 → 左段（ラベル帯ごとに上から下）→ 右段のシェブロン → 段階 1 → 縦矢印で下へ → 最後の誘導箱"
background: "白地のみ。Layer 1 不要"
image_crop: "裁ち落としなし（太罫の小口側だけ端近くまで）"
rhythm: "同じテンプレートを p.6・p.7・p.8・p.9（国内）、p.22・p.23（留学生）で反復。区分によって左段のブロック数と右段の段階数が変わるだけ"
notes:
  - "撮影画像はページ上端が画像の左側。時計回り 90° で正立。p.6 上部の見出しと導入文がわずかに右上がり（撮影の傾き）"
  - "左ページ上端の小口側に小さな墨の縦帯（爪・インデックスと推定、約 1%W × 6%H）。右ページは小口側の 約 20〜25%H に同様の濃い印"
  - "Phase 5 の第 2 候補（部品化の検証に最適: 見出し + 太罫、ラベル帯、シェブロン、段階帯 + 縦矢印、縞の日程表、補足ボックス）"
  - "Layer 1: 不要"
  - "Layer 2: 太罫、ラベル帯、シェブロン（SVG の多角形）、段階帯とオフセット影、縦矢印（SVG）、表の罫・見出し行・縞、補足ボックス、誘導箱"
  - "Layer 3: 区分名・説明文・書類名・金額・日付・受付時間・注記・ページ参照（金額・日付はすべて company-data の facts から。参考資料の値は書き写さない）"
  - "フローの段階数と本文量が区分ごとに違うので、矢印の長さは段階ブロックの高さに追従させる（flex で縦に伸ばす）"
