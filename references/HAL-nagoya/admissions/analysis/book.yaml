# 参考資料の解析結果（資料全体）— Phase 4（system/rules/references.md §4）
# 対象: references/HAL-nagoya/admissions/（入学要項・17 画像）
# 構造だけを書く。参考資料の文章・数字（学費・日付）・固有名詞は書き写さない（「（学校名）」のように伏せる）
# 寸法はすべて比率: %W = 片ページの幅に対する比、%H = ページの高さに対する比（判型の実寸は不明。notes 参照）

# グリッド（資料全体の傾向）
grid:
  基本: "片ページ 2 段（左 約 41%W・右 約 45%W、段間 約 4%W）。左段 = 資格・書類・日程などの箇条と表、右段 = 手続きの流れ（縦のフロー）"
  変形1: "ラベル段 + 本文段（左 約 22〜25%W のラベル列 / 右 約 65〜70%W の本文列）。考え方・手続き・留学生要項の扉で使う"
  変形2: "1 段の全幅表（学科一覧・学費表）。左に小さな黒ラベル、右に全幅の表"
  帳票: "綴じ込みの切り取り帳票は片ページを ノド側 約 40%W（振込用紙・縦組みの帳票を 90° 回転） / 小口側 約 60%W（願書・エントリーシート）に分割。キリトリ線（破線）で区切る"
  基準線: "ページ見出し（上端 約 4〜7%H）→ 本文開始（約 9〜12%H）→ 本文終わり（約 95%H）。行送りは本文 約 1.4%H（データページ）／約 3.3〜3.8%H（メッセージページ）"
# 余白（ページ比率。撮影のためノド側は湾曲で縮んで見える）
margins:
  top: "約 3〜4%H（黒帯の見出しは上端まで裁ち落とし）"
  bottom: "約 4〜5%H（ノンブルは下端から 約 2%H、小口側の角）"
  outside: "約 5〜6%W"
  inside: "約 3〜5%W（推定。ノドの湾曲で正確に測れない）"
# ガター・段間
gutter: "段間 約 3〜4%W。ラベル列と本文列の間は 約 3〜4%W。表内のセル内余白は 約 0.5%W"
# 写真の比率と使われ方
photo_ratios:
  - "写真はゼロ。1 色（墨）の文字・表・帳票中心の資料"
  - "図版は p.3 の略地図（約 17%W × 13%H の枠囲み）と QR コード（約 5%W 角）、帳票の写真貼付欄（縦長 約 3:4 の枠 + 人物シルエット）のみ"
  - "記入例ページ（p.31–32）は帳票の縮小図（約 1:1.4 の縦長）を 2 点並べる"
# 見出し階層（字面の高さ ≒ 文字サイズの目安。%H）
heading_hierarchy:
  - { level: display, 内容: "（学校名ロゴタイプ）", size: "キャップハイト 約 13%H", weight: "極太・幾何学的な欧文", 使用: "p.2 左上のみ" }
  - { level: h1, 内容: "ページ見出し（入学区分名など）", size: "約 2.5〜3%H", weight: "太ゴシック、短い語は字間を大きく空ける", 形: "A) 上端裁ち落としの黒帯に白抜き中央揃え / B) 白地に黒文字中央揃え + 下に全幅の太罫（約 0.3%H）" }
  - { level: lead, 内容: "（キャッチコピー 1 行）", size: "約 2.3〜2.6%H", weight: "太ゴシック", 使用: "p.2・p.3・p.19 の考え方ページ" }
  - { level: h2, 内容: "（項目名）ラベル帯", size: "約 1.3〜1.5%H", weight: "太ゴシック白抜き", 形: "段幅いっぱいの濃い墨ベタ帯（高さ 約 2.2%H）" }
  - { level: h2-side, 内容: "（項目名）サイドラベル", size: "約 1.3%H", weight: "太ゴシック、字間広め", 形: "灰色ベタ + 墨の細枠の箱、または墨ベタ白抜きの箱（幅 約 13〜20%W）" }
  - { level: h3, 内容: "フローの各段階名", size: "約 1.3%H", weight: "太ゴシック黒", 形: "薄灰色の帯 + 右下に濃い影（オフセット）、段幅いっぱい" }
  - { level: h4, 内容: "①②・1. 2. の小見出し", size: "約 1.1〜1.2%H", weight: "太ゴシック" }
  - { level: body, size: "約 1.0〜1.2%H", weight: "中ゴシック", 行送り: "データページ 約 135〜150% / メッセージページ 約 200%" }
  - { level: note, 内容: "※注記", size: "約 0.8〜0.9%H", weight: "中〜太ゴシック" }
  - { level: folio, size: "約 1%H", weight: "細〜中ゴシック", 位置: "下端の小口側の角" }
# 色の役割（実際の色は自社ブランドカラーに置き換える）
colors:
  印刷: "1 色（墨のみ）。彩度はほぼゼロ"
  役割:
    墨100: "本文・罫・見出し黒帯・ラベル帯・帳票ヘッダー帯（面積 約 5〜10%）"
    濃灰_K70-90: "ラベル帯・表見出しの一部（約 2〜3%）"
    中灰_K30-50: "フローの見出し（逆三角・シェブロン）、大きな三角の矢印、時間軸の濃い行（約 2〜5%）"
    淡灰_K10-25: "表の見出し行・縞（ゼブラ）・フローの段階帯・注意事項の囲み（約 5〜10%）"
    白: "紙の地（約 75〜85%）"
  表紙: "全面グレー（中濃度。撮影の露出で正確な濃度は不明）+ 白の横帯 1 本"
  自社版への置き換え案: "墨100 → 本文は墨のまま、帯・ラベルはブランドの濃色。灰の各濃度 → ブランド色の 10〜40% の平網"
# 罫線
rules:
  - "表の外枠: 墨 約 0.8〜1pt 相当の太め / 内罫: 0.25pt 相当の細線 / 見出し行の下だけ中太"
  - "ページ見出し下の全幅太罫（約 0.3%H、ページ幅いっぱい・ノド側から小口まで）"
  - "帳票: 実線の枠 + 記入行は点線（破線）の区切り、キリトリ線は破線 + 「（キリトリ線）」の小さな注記"
  - "フロー: 段階帯の間を太い灰色の縦矢印（線 約 0.5%W + 三角の矢じり）でつなぐ"
  - "p.2・p.3 では見出し下に緩い曲線の細罫（波打つ横罫）"
# カード
cards:
  - "角丸パネル（p.3）: 墨の細枠、角丸 約 1.5%W、上部に墨ベタの見出し帯（パネル高さの 約 12%）"
  - "細枠の注記ボックス: 墨 0.5pt 相当、角丸なし、内余白 約 0.5%W（WEB 出願の案内・持参の場合などの補足）"
  - "囲み記事: 墨の細枠 + 上辺中央に灰色見出し箱を重ねる（p.10 の別冊案内）"
  - "灰色の地のボックス（p.5 制度説明、p.21 実績一覧）: 淡灰ベタ、枠なし、左上に墨ベタの小ラベル"
  - "影: 段階帯・タイトル帯に右下のオフセット影（墨、約 0.3%H）。ぼかしなし"
# 情報密度
density: "高（データ・帳票ページ）／中（考え方・扉ページ）。1 ページに表 1〜3 点・フロー 1 本・ラベル帯 3〜5 本が標準。余白は少なめで段組みを詰める"
# ページタイプ（資料全体）
page_type: "other（入学要項。cover 兼 toc 1 / message 2 / data 多数 / 帳票 多数 / 記入例 2）"
# 視線誘導
eye_flow: "各ページ: 上端の見出し（黒帯 or 太罫）→ 左段の資格・書類（上から下）→ 右段のフロー（縦矢印で下へ）→ 右下の「入学手続き」への誘導箱。帳票ページは大きな灰色三角の矢印でキリトリ部分へ誘導"
# 背景表現
background: "すべて白地（紙）。写真・グラデーション・質感なし。表紙のみ全面グレー + 白帯。Layer 1 はほぼ不要（必要なら紙の質感程度）"
# 画像のクロップ
image_crop: "写真なし。略地図・帳票縮小図は枠内に収める（裁ち落としなし）。裁ち落とし要素は 上端の黒帯見出し・表紙のグレー地と白帯・帳票ヘッダー帯（小口側）のみ"
# ページ間のリズム
rhythm:
  - "表紙（目次兼用）→ 考え方・WEB 出願の見開き → 募集学科と日程の見開き → 入学区分ごとの見開き（1 区分 = 片ページ、同じテンプレートを 4 回反復）→ 手続き・学費 → 綴じ込み帳票（表裏で 8 ページ）→ 留学生の扉（考え方の再提示）→ 留学生の区分ページ（同テンプレート）→ 留学生帳票 → チェックリスト・宛名ラベル → 記入例"
  - "国内向けと留学生向けで同じ構成を二度繰り返す（考え方 → 区分 → 手続き → 帳票）"
  - "帳票は右ページ（表）に置き、裏（左ページ）に続きを印刷。白ページ（帳票の裏）が p.16・p.30 に出る"
# その他の所見
notes:
  - "寸法の単位: 判型の実寸が不明なため、すべて比率（%W・%H）で記述。片ページはほぼ正方形（W:H ≈ 1:1）、見開きは約 2:1。中綴じ 32 ページ相当（表紙 = p.1、最終 = p.32）"
  - "画像はすべて 72dpi の写真（スキャンではなく撮影）。どの画像もページ上端が画像の左側（反時計回りに 90° 回転した状態）なので、時計回りに 90° 回して見る"
  - "page_001 と page_017 は片ページ、page_002〜016 は見開き（左 = 偶数ページ、右 = 奇数ページ）。page_NNN と元資料ノンブルの対応は page_map"
  - "撮影由来の誤差: 遠近の歪み・ノド側の湾曲・照明ムラ・裏写り（反対面の文字が薄く透ける）がある。page_003 は上端が切れている。npm run compare の差分はノイズが大きいので、比較前に片ページの切り出しと正立・台形補正が必要"
  - "Layer の切り分け（全体）: Layer 1 = ほぼ不要（白地。表紙のグレー地も単色なので Layer 2 の色面で足りる）／ Layer 2 = 黒帯・ラベル帯・表・フロー矢印・シェブロン・帳票の枠と罫・角丸パネル・三角矢印・略地図の単純図形・写真貼付欄のシルエット（SVG）／ Layer 3 = すべての文字・数字・ノンブル・QR・ロゴ（ロゴは company-data/brand/logo の正式データ）"
  - "書体: 和文はすべてゴシック（複数ウェイト）、明朝なし。欧文は幾何学的なサンセリフ。数字は等幅気味"
  - "流用禁止: 学校名・ロゴ・学科名・コース名・制度名・学費・日付・住所・電話・銀行名・口座番号・実績の企業名一覧は書き写さない。構造（段組み・表の型・フロー・帳票の項目構成の考え方）だけを使う"

# ---- 以下は資料全体の補足（テンプレート外のキー）----
# page_NNN.jpg と元資料ノンブルの対応・ページタイプ
page_map:
  page_001: { pages: "p.1（表紙）", type: "cover（目次兼用）", 単体: true }
  page_002: { pages: "p.2–3", type: "message（入学選考の考え方・出願資格）+ other（相談案内・WEB 出願の流れ）" }
  page_003: { pages: "p.4–5", type: "data（募集学科・入学区分の表・授業時間）+ data（入学区分別スケジュールの時間軸図）", 備考: "上端が切れている" }
  page_004: { pages: "p.6–7", type: "data（入学区分 A の要項）+ data（入学区分 B の要項）" }
  page_005: { pages: "p.8–9", type: "data（入学区分 C）+ data（入学区分 D）" }
  page_006: { pages: "p.10–11", type: "data（入学手続き・学費表）+ form（振込用紙 + エントリーシート表面）" }
  page_007: { pages: "p.12–13", type: "form（エントリーシート裏面）+ form（振込用紙 + 入学願書表面）" }
  page_008: { pages: "p.14–15", type: "form（入学願書裏面）+ form（推薦書）" }
  page_009: { pages: "p.16–17", type: "白ページ（推薦書の裏）+ form（課題作文 1 枚目）" }
  page_010: { pages: "p.18–19", type: "form（課題作文 2 枚目）+ message（留学生要項の扉・考え方・資格）" }
  page_011: { pages: "p.20–21", type: "data（留学生の出願方法）+ data（留学生の支援体制・実績一覧）" }
  page_012: { pages: "p.22–23", type: "data（留学生 区分 前期）+ data（留学生 区分 後期）" }
  page_013: { pages: "p.24–25", type: "data（留学生の入学手続き）+ form（振込用紙 + 留学生エントリーシート表面）" }
  page_014: { pages: "p.26–27", type: "form（同 裏面）+ form（振込用紙 + 留学生入学願書表面）" }
  page_015: { pages: "p.28–29", type: "form（同 裏面）+ other（出願書類チェックリスト + 宛名ラベル）" }
  page_016: { pages: "p.30–31", type: "白ページ（ラベルの裏）+ other（願書記入例 2 点）" }
  page_017: { pages: "p.32（最終ページ。表4 の可能性）", type: "other（留学生の記入例 表・裏）", 単体: true }
# 表のデザイン
table_design:
  - "見出し行: 淡〜中灰ベタ、太字、短い語は字間を空けて中央揃え"
  - "外枠は太め、内罫は細線。区分の切れ目（年制・学部）は中太の横罫"
  - "縦方向の結合セルが多い（学部 → 学科 → 専攻の 3 階層、結果通知日などの共通値）"
  - "日程表・学費表は 1 行おきに淡灰の縞（ゼブラ）。数字は右揃え（学費）・中央揃え（日付）"
  - "表の上に【見出し】形式の小見出し（太字・墨角括弧）、下に ※注記 2〜4 行"
  - "表の左に小さな墨ベタの箱ラベル（白抜き）を置き、表本体は右に全幅"
# 帳票のデザイン
form_design:
  - "ヘッダー: 小口側の帳票上部に墨ベタの帯（高さ 約 7%H、裁ち落とし）+ 中央にロゴマーク（白抜き）。帯の上辺にキリトリ線"
  - "帳票名は太ゴシック大（約 3%H）、左に記入日、右上に写真貼付欄（細枠・人物シルエット・注意 3 行）"
  - "記入欄はブロックごとに灰色の見出し帯 + 細枠の表。行内は点線で区切る。〇で囲む選択肢は角丸の小さな囲み"
  - "最下部に「事務局記入欄」（太枠・縦罫の小さなセル）"
  - "ノド側の振込用紙は 90° 回転した縦長の帳票。受取書・依頼書の 2 片を破線で区切り、収納印の破線の円を置く"
  - "帳票の裏（左ページ）は学歴・職歴・自己アピール（チェックボックス + 記入罫）など。上部に灰色の帯 + 綴じ穴の目印（小さな円 2 つ）"
  - "帳票のない残りの部分には大きな灰色三角の矢印 + 太字 3〜4 行の確認の呼びかけ"
# Phase 5（完コピ検証）の候補（優先順）
phase5_candidates:
  - page: page_002
    理由: "p.2 はラベル列 + 本文列の 2 段・大きな見出し文字・強弱のあるメッセージ組版、p.3 は角丸パネル + 黒見出し帯 + ステップの縦フロー + 細罫区切り。写真がなく Layer 2/3 だけで再現でき、文字組みの精度を測りやすい。撮影の歪みも比較的少ない"
  - page: page_004
    理由: "入学区分ページの標準テンプレート（見出し + 太罫、ラベル帯、シェブロンのフロー見出し、段階帯 + 縦矢印、縞の日程表）。同じ型が p.8–9・p.22–23 で反復するので、部品化（shared/components）の検証に最適"
  - page: page_006
    理由: "p.10 の学費表（12 行 × 9 列、縞・結合セル・右揃え数字）と左のラベル箱 + 本文の型、囲み記事。表の精度検証向き。p.11 側は振込用紙を含むので比較対象を p.10 に絞るのがよい"
  - page: page_007
    理由: "p.13 の入学願書（ヘッダー帯・写真貼付欄・灰色見出し帯 + 細枠の記入表・事務局欄）は自社の願書にも必要な型。罫と寸法の精度を確認しやすい。振込用紙部分（金融機関の固有情報）は再現対象から外す"
  - page: page_003
    理由: "（予備）3 階層の結合セル表と、月の縦軸 + 区分の列 + 期間の縦線で表す時間軸図。CSS/SVG での図表化の検証になる。ただし上端が切れているので見出し帯の高さは他ページから推定する"
# 読み取りにくかったページ
unreadable:
  - "page_003: 上端が撮影範囲から切れ、見出し帯の文字の上半分が欠けている（構造は読める）"
  - "page_001: 表紙が暗く写り、裏写りで大きな欧文の反転像が透けている（デザイン要素ではなく裏写りと判断）"
  - "page_009・page_016 の左ページは白ページで、裏写りだけが見える"
  - "細かい注記（約 0.8%H）は 72dpi では字形まで判別しにくいが、構造の判断には支障なし"
