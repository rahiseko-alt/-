# page_008 — 元資料 p.14–15 の見開き（左 p.14 入学願書裏面 / 右 p.15 推薦書）
# 寸法は比率（%W = 片ページ幅比、%H = ページ高さ比）。判型の実寸は不明
grid:
  p14: "小口側 約 2〜58%W = 帳票の裏面（学歴・職歴・自己アピール）、ノド側 約 60〜100%W = 白（振込用紙の裏、裏写りあり）。上部に確認の呼びかけと横のキリトリ線"
  p15: "ノド側 約 0〜42%W = 空き（中央に大きな灰色の右向き三角 + 太字 3 行の確認の呼びかけ）、小口側 約 42〜100%W = 推薦書（上 約 6〜15%H に墨ベタのヘッダー帯）"
margins: { top: "ヘッダー帯 約 6%H", bottom: "約 6%H（最下部に個人情報の注記 1 行）", outside: "約 2%W", inside: "約 2%W" }
gutter: "推薦書内の左右余白 約 3%W"
photo_ratios: [ "写真なし" ]
heading_hierarchy:
  - { level: form-title, 内容: "（推薦書の名称）", size: "約 3.5%H", weight: "極太、字間広め、中央揃え" }
  - { level: h3, 内容: "記 / 入学希望者 / 推薦者", size: "約 1.5%H", weight: "太、字間広め" }
  - { level: body, 内容: "（推薦文 2 行）", size: "約 1.3%H", weight: "中" }
  - { level: callout, 内容: "（記入漏れの確認の呼びかけ 3 行）", size: "約 1.3%H", weight: "太" }
  - { level: field, 内容: "氏名 / 学校名 など", size: "約 1.5%H", weight: "太、字間 約 2em", 形: "下に記入用の横罫" }
  - { level: note, size: "約 0.8%H", weight: "中" }
colors:
  墨: "ヘッダー帯（約 5%）"
  中灰: "大きな三角の矢印（約 4%）"
  白: "地（約 88%）"
rules:
  - "推薦書: 枠なし。記入欄は下罫のみ（細線、帳票幅いっぱい）。押印位置の小さな円"
  - "キリトリ線（縦、約 42%W）"
  - "p.14 は page_007 の裏面と同型（灰色見出し帯 + 細枠 + 点線）"
cards: null
density: "p.14 = 高、p.15 = 低（推薦書は余白が多い）"
page_type: { left: other, right: other, 補足: "切り取り帳票（入学願書裏面 / 推薦書）" }
eye_flow: "p.15: 灰色の三角（ノド側から小口へ向く）→ 推薦書のヘッダー帯 → 表題 → 推薦文 → 入学希望者 → 推薦者の記入欄"
background: "白地のみ。裏写りあり"
image_crop: "裁ち落としは推薦書のヘッダー帯のみ"
rhythm: "帳票ページの連続。空き部分に大きな三角を置いて、切り取る部分へ視線を送るパターンが p.17・p.26・p.28 でも繰り返される"
notes:
  - "撮影画像はページ上端が画像の左側。時計回り 90° で正立"
  - "Layer 1: 不要"
  - "Layer 2: ヘッダー帯、記入用の下罫、押印の円、キリトリ線、大きな三角（SVG）、裏面の帳票枠"
  - "Layer 3: 帳票名・推薦文・項目名・注記・ロゴマーク（正式データ）"
  - "大きな三角の矢印は単純図形なので SVG で描き、色はブランドの淡色に置き換えられる"
