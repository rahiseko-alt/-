# 比較用の補正指定（Phase 5 / npm run ref:prep。system/rules/references.md §4）
# 見開き（印刷ノンブル 47〜48）の写真。90° 反時計回りに倒れて保存されているので時計回りに 90° 回し、
# 右ページ（ノンブル 48。講師 5 段・ピックアップ・4 段のステップ表がある白地の情報面）だけを切り出す
# 回転後の画像は 2862×1484px。四隅は画素の実測（回転後の座標）:
#   左上 (1443, 8)    … ノド。左ページの写真コラージュの右端（y=100〜1400 の 5 点で x=1442〜1443 の暗い線）と天の端（白地の始まり）の交点
#   右上 (2847, 13)   … 小口の端の影の線（y=20〜1460 の 25 点で x = 2847 + 0.0076 y）と天の端（灰色の影の帯の下端 y≈13〜16）の交点
#   右下 (2858, 1483) … 小口の端の線と撮影範囲の下端の交点。
#     地の端（x=1460〜2480 の 18 点で y = 1467 + 0.0147 (x − 1460)）は小口側で撮影範囲の外（x=2858 で y≈1487）。下端で止めたので、右下は約 4px（ページ高の約 0.3%）欠ける
#   左下 (1443, 1466) … ノドの線と地の端の交点
# ノドの数 mm は紙の湾曲で奥へ落ち込み、横に縮んで写る（4 点の射影補正では取り除けない）
# 写真上の片ページの縦横比は 約 0.96（幅 1404〜1415px / 高さ 1458〜1474px）。ノド側の落ち込みで幅が縮んでいるため、
# 同じ学校案内の前半（references/HAL-nagoya/brochure-1/）の表紙で実測した 0.98 を使う（books/replica/a-brochure と同じ判型系）
image: references/HAL-nagoya/brochure-2/page_001.jpg
rotate: 90
# 左上・右上・右下・左下（回転後の画像に対する比率。x / 2861, y / 1483）
corners:
  - [0.5044, 0.0054]
  - [0.9951, 0.0088]
  - [0.9990, 1.0]
  - [0.5044, 0.9885]
aspect: 0.98
height_px: 2000
notes: "右ページ（講師 5 段 ＋ ピックアップ ＋ 4 段のステップ表）。補正後に講師写真の上端・ステップ表のパネルの上下端が水平、外側の柱の帯が垂直であることを目視で確認"
