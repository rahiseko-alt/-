  - "時間帯ボックス: 面取りした線枠、内側は濃色帯のまま"
  - "資格バッジ: 金グラデーションの正方形（2 行の大きな文字＋小さな説明 2 行）"
  - "ピックアップタブ: 吹き出し状の小さな線枠ラベル"
density: "高（左: 見出し 7・本文 2 ブロック・リスト 3 組 × 6〜9 項目、右: 講師 5・本文 1・ステップ表 4 段 × 10〜15 項目）"
page_type: course
eye_flow: "左上の特大コース名 → 金バッジ → 右側の写真コラージュ → lead → 左下リスト群と時間帯ボックス → 右上の講師 5 人 → ピックアップ → ステップ表を左から右へ（矢羽根が誘導）"
background: "左: 青紫の単色面。下部 ≈0.42H を濃色帯に水平に切り替え。外側（左端）に白い斜線ハッチ（45°、幅 ≈0.07W × 高さ ≈0.3H）。色面とコラージュの境界は右上を面取りした多角形。右: 白地、ステップ表まわりに淡いグレーの面"
image_crop: "コラージュは天・ノド・地で裁ち落とし、画像同士は白の細い隙間。人物は上半身を大きく、作業の手元をアップで。講師写真は肩から上、キャプションが下端に重なる"
rhythm: "4 年制コース見開きの標準形（同型: page_002・006・009・012・013・014）。左＝暗い色面＋写真、右＝白地の情報面という明暗対比"
notes: |
  撮影: 見開き写真が 90° 反時計回りに倒れている（時計回りに 90° 回して解析）。左端に後続ページの小口が写り込むが、デザインではない。
  寸法: 片面 W・H に対する比率。物理寸法は不明。
  Layer 1: 写真コラージュ欄の各画像（自社写真 company-data/photos、または生成ビジュアル。参考資料の作品・写真は使わない）。左の地色はほぼ単色なので CSS でもよい。
  Layer 2: 色面の多角形（clip-path）、斜線ハッチ（repeating-linear-gradient）、白帯見出し、矢羽根（SVG か clip-path）、講師間の縦罫、ステップ表パネル、資格バッジ、時間帯ボックス枠、学部タブ。
  Layer 3: 学部タブ文字、kicker、コース名、lead、専攻名と説明、職種・ソフト・資格リスト、時間帯、講師のキャプション・社名・肩書・氏名、ピックアップ本文、ステップ表の全項目、注記、柱、ノンブル。
  自社版では講師ロゴ・社名は company-data にある情報だけを使う。Phase 5 候補の第 1 位（book.yaml）。
