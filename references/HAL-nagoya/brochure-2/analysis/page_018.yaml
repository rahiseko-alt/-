notes: |
  撮影: 90° 反時計回りに倒れた見開き写真。寸法は片面 W・H 比。
  講座名・資格名・期間・時間・校名・人名・数値はすべて参考資料固有の情報なので、表の構造（列構成、区分の付け方、チップの使い方）だけを使う。
  Layer 1: ほぼなし（右の人物写真のみ。自社写真か使わない）。
  Layer 2: すべての色面・帯・カード・表の罫・斜線ストライプ・六角形（clip-path か SVG）・名前プレート・矢印バナー。
  Layer 3: すべての見出し・表のセル・数値・本文・校名・注記・ノンブル。表は HTML の table で組み、セルの数値は company-data から参照する。
