notes: |
  撮影: 90° 反時計回りに倒れた見開き写真。左端に後続ページの小口。寸法は片面 W・H 比。
  Layer 1: 左の夜景写真（自社校舎の写真か生成。生成する場合は看板・文字なし）、学生ポートレート（自社）、カード内の写真（自社）。
  Layer 2: 紺の色面、斜線ハッチ・ストライプ、白い平行四辺形帯、ポイントカードと紺の円、コースカードの線枠・タブ・年次見出し帯、線枠チップ、赤い線枠バッジ。
  Layer 3: キャッチ、タイトル、インデックス項目と P.nn、ポイント、学生の声（氏名・内定先は company-data のみ）、コース名・職種・キャッチ・本文・年次項目、受講曜日・時間、注記、柱、ノンブル。
  Phase 5 候補（第 2 位）: 右ページのコースカードは Layer 2/3 だけで高精度に再現でき、繰り返し部品の検証に最適。
