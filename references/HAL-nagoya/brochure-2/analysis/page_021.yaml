notes: |
  撮影: 90° 反時計回りに倒れた見開き写真。寸法は片面 W・H 比。
  室名・機器名・メーカー名・数値は参考資料固有なので、キャプション帯と吹き出しの構造だけを使う。
  Layer 1: 実習室・人物の写真（自社写真のみ。施設の写真を生成すると事実と誤認されるので使わない）。
  Layer 2: 白い中帯、括弧枠（SVG か border）、キャプション帯、吹き出し（CSS の三角）、斜線ハッチ、写真モザイクのグリッド。
  Layer 3: 見出し、説明、チェックリスト、室名・説明、吹き出しの文字、注記、ノンブル。
