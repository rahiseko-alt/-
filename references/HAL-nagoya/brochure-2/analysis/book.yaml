eye_flow: "コース見開きは『左上の特大コース名 → 写真コラージュ → 左下リスト → 右上講師 → ステップ表を左→右』。学部扉は『巨大英字 → 番号付き特長 01〜03 → インデックス → 下帯のインタビュー』。矢羽根・▶・番号で左→右の方向を一貫して作る"
background: "左ページ＝テーマ色の単色面（下部を濃色帯に切り替え）＋外側の白い斜線ハッチ。学部扉＝写真をテーマ色でデュオトーン化した全面地。施設・キャンパス＝写真モザイク＋白い中帯。立地＝青灰色のデュオトーン航空写真で建物だけ自然色。光・グラデーションは控えめで、質感は写真が担う"
image_crop: "写真は天・地・ノド・小口で積極的に裁ち落とし。コラージュは平行四辺形カットと白い細隙間。切り抜き人物・切り抜き作品を色面へはみ出させて奥行きを作る。講師写真は肩から上、キャプションを下端に重ねる"
rhythm: "学部ごとに『扉（巨大英字＋インタビュー）→ 卒業生 → 4 年制コース見開き × n → 2 年制コンパクト版＋トピックス』を繰り返し、学部ごとにテーマ色だけ変える（この分冊は CG 系学部の途中から始まる）。後半は『夜間部 → グループ校 → キャンパスライフ → 立地 → 施設 × 2 → 問い合わせ → 表 4』と、情報ページから写真主体のページへ移って余白の多い締めで終わる。左＝暗い色面、右＝白い情報面の明暗対比が全体を通して続く"
notes:
  寸法の表記: "片面の幅 W・高さ H に対する比率で記載（A4 換算ではない）。撮影写真から測ると片面の縦横比は約 1:1.05〜1.1（幅:高さ）で、A4 縦（1:1.414）よりかなり正方形に近い変形判と推定。物理寸法は不明"
  撮影状態: "page_001〜023 は見開き 1 枚の写真で、すべて 90° 反時計回りに倒れて写っている（時計回りに 90° 回すと正立）。page_024 は単ページ（表 4）で同じく 90° 倒れている。72dpi の撮影・スキャンで文字層はない。左端に後続ページの小口（色帯）が写り込むが、デザインではない。ノド付近は紙の湾曲で寸法が縮む"
  phase5_candidates:
    - page: page_001
      理由: "4 年制コース見開きの標準形。同型が 7 見開き（001・002・006・009・012・013・014）あり、部品化したときの再利用価値が最大。色面・白帯見出し・矢羽根付きステップ表・講師 5 段とも HTML/CSS で正確に組め、Layer 1 は写真コラージュ欄だけに限定できる"
    - page: page_017
      理由: "右ページの 6 枚のコースカード（タブ見出し＋2 段の年次表）は Layer 2/3 だけで高精度に再現でき、カード部品の検証に最適。左ページは全面写真＋インデックス＋ポイントカードで、写真欄と文字欄の重ね方も同時に検証できる"
    - page: page_023
      理由: "締めの問い合わせ見開き。巨大キャッチ・番号付きバナー・地図（SVG）・QR・URL・電話など Layer 3 の正確性が要の要素が集中し、写真は右端の 1 枚だけ。自社版への転用がそのまま効く"
    - page: page_004
      理由: "学部扉。デュオトーン写真の全面地（Layer 1 生成）に巨大英字・番号付き特長・インデックスカード・インタビュー帯（Layer 2/3）を重ねる構成で、3 層の重ね方と生成背景のワークフローを検証できる"
    - page: page_003
      理由: "（任意）2 年制コンパクト版と 2 段の記事型ページ（トピックス）。半ページ版のコース部品と記事レイアウトの部品を同時に作れる"
  layer_split_general: "Layer 1＝写真モザイク・デュオトーン写真地・コラージュ素材（自社写真か生成。参考資料の写真・作品は使わない）。Layer 2＝テーマ色の色面と多角形（clip-path）、斜線ハッチ（repeating-linear-gradient）、白帯・平行四辺形帯、矢羽根、パネル、バッジ、罫、地図・リング図形（SVG）。Layer 3＝すべての見出し・本文・リスト・人名・社名・ページ参照・柱・ノンブル・QR"
  読み取りの限界: "本文の小さな文字は 72dpi では判読しにくいが、構造解析には支障なし。page_024 はほぼ白紙。ノド付近は湾曲のため比率の誤差が大きい（特に page_003・015・016）"
