notes: |
  撮影: 単ページの写真が 90° 反時計回りに倒れている（時計回りに 90° 回すと正立）。片面のみなので縦横比の基準として使える（W:H ≈ 1:1.04 前後。撮影の余白を含むため参考値）。
  ロゴ・タグライン・法人名・住所・電話・URL・建物名はすべて参考資料固有。自社版は company-data/brand/logo の正式ロゴと facts の連絡先だけを使う。
  Layer 1: 建物の切り抜き写真（自社校舎の写真のみ）。地は白なので背景画像は不要。
  Layer 2: タグライン下の細罫だけ。
  Layer 3: タグライン、正式ロゴ（データ配置）、法人名・認可表記・住所・電話・URL、写真キャプション（縦組み）。
