notes: |
  撮影: 90° 反時計回りに倒れた見開き写真。左端に後続ページの小口。寸法は片面 W・H 比。
  Layer 1: 扉の上段の全面地（写真のデュオトーン。生成する場合は機材・空間のみで文字・ロゴを入れない）、右上の写真グリッド（自社写真）、下帯右端の暗い質感。
  Layer 2: 下帯の色面、特長の黒い半透明帯、インデックスカードのチップと下線、白い縦棒、斜線ハッチ。巨大英字の天裁ちは Layer 3 のテキストを .trim の外へはみ出させてクリップする（文字は画像にしない）。
  Layer 3: 巨大英字（自社の学部名に置き換える）、学部名、特長 3 点、インデックス、ページ参照、インタビューの見出し・本文・肩書・氏名・略歴、ノンブル。
  Phase 5 候補（第 4 位）: Layer 1 生成背景と Layer 2/3 の重ね方を検証できる。
