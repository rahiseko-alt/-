  Layer 1: コラージュ素材（自社作品写真・生成ビジュアル。参考資料の作品は使わない）。
  Layer 2: 色面多角形、白帯、矢羽根、パネル、縦罫、バッジ、時間帯ボックス枠。
  Layer 3: すべての文字・リスト・人名・社名・柱・ノンブル。ロゴ枠は自社の正式データがある場合だけ。
