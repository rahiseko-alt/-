# page_005 — 見開き（p.55–56 相当）。音楽系学部の卒業生紹介（雑誌型の卒業生紹介）
grid:
  見開き: "不規則な雑誌グリッド。上段 0〜0.45H と下段 0.55〜1.0H に分け、中央 ≈0.47H にノドをまたぐ大見出しの帯。片面を 3 列相当（各 ≈0.3W）で割り、プロフィールを 1〜2 列幅で配置"
  左ページ: "上段＝大きなイラスト作品 0.6W ＋ 縦長の記事列 0.3W。下段＝プロフィール 2 本（各 0.45W）"
  右ページ: "上段＝記事列 2 本 ＋ 写真列（集合写真）。下段＝プロフィール 2 本 ＋ 右下に就職実績ボックス"
margins:
  top: "≈0.03H（天に細いマゼンタの帯、学部タブは天に接する）"
  bottom: "≈0.04H（地に細いマゼンタの帯）"
  inside: "≈0.02W（大見出しの帯と写真がノドをまたぐ）"
  outside: "≈0.05W（右は柱帯を含む）"
gutter: "プロフィール間 ≈0.02W。罫ではなく余白と淡黄色の三角形で区切る"
photo_ratios:
  - "左上: イラスト作品 ≈3:2（0.6W × 0.35H、最大の画像）"
  - "人物: 4:5〜1:1 のポートレート（≈0.12W）× 8 前後"
  - "作業写真: ≈4:3（≈0.2W）× 4、集合写真 ≈3:2 × 1、製品パッケージ ≈3:4 × 2"
  - "企業ロゴ 5 点前後（ロゴは自社版では扱わない）"
  - "写真面積 ≈40%"
heading_hierarchy:
  - level: "大見出し（卒業生紹介）"
    size: "≈0.06H、ノドをまたぐ平行四辺形帯（≈0.11H 高）に白抜き"
    weight: "900"
  - level: "プロフィール見出し"
    size: "≈0.015H × 2〜3 行"
    weight: "700、濃い紫系の文字"
  - level: "人名"
    size: "≈0.017H（卒業年を小さく併記）"
    weight: "明朝体、欧文名は欧文書体"
  - level: "肩書・社名"
    size: "≈0.008H"
    weight: "400〜700"
  - level: "本文"
    size: "≈0.008H"
    weight: "400"
  - level: "相互参照バナー"
    size: "≈0.015H"
    weight: "800 斜体、白、黒帯"
colors:
  テーマ: "#a8246e マゼンタ（大見出しの帯・天地の細帯 ≈8%）"
  地: "#ffffff（≈50%）"
  淡黄: "#f5eeb0 前後の網点・斜線テクスチャの三角形（見出しの背後、≈8%）"
  グレー: "#e8e8e8（就職実績ボックス）"
  黒: "#111111（バナー）"
rules:
  - "プロフィール見出しの下に細いグレー罫（本文欄幅）"
  - "就職実績ボックスは面取りしたグレーの面（罫なし）"
cards:
  - "プロフィール＝見出し（淡黄の三角形を背後に）→ 本文 → 写真 → 肩書・人名・卒業年 → ロゴ。カード枠はない"
  - "就職実績ボックス: グレーの面に見出し・社名列挙・QR（右上の角を面取り）"
  - "黒帯バナー: 小口まで伸び、左端を斜めカット"
  - "大見出しの帯: 両端を斜めにカットした多角形"
density: "高（プロフィール 8 前後、画像 15 枚以上、本文量も多い）"
page_type: interview
eye_flow: "左上の大きな作品画像 → ノド中央の大見出し → 左上段の記事 → 右上段の記事と集合写真 → 下段のプロフィールを左から右へ → 右下の実績ボックス → 黒帯バナー"
background: "白地に、天地のマゼンタの細帯と、見出しの背後に置く淡黄色の網点三角形（斜めの対角線で切った形）。外側に斜線ハッチ。写真以外の地はフラット"
image_crop: "作品画像は天と小口で裁ち落とし。ポートレートは角版で肩から上。作業写真は人物と機材を一緒に"
rhythm: "学部扉（page_004）の次、コース（page_006）の前に置く実績の見開き。page_011 と同型（色だけ変える）"
notes: |
  撮影: 90° 反時計回りに倒れた見開き写真。左端に後続ページの小口。寸法は片面 W・H 比。
  卒業生の氏名・社名・作品名・受賞歴・ロゴはすべて参考資料固有の情報なので、構造だけを使う。
  Layer 1: 淡黄の網点三角形のテクスチャ（生成か SVG パターン）、自社の卒業生写真（company-data/photos。権利確認済みのみ）。
  Layer 2: 天地の細帯、ノドをまたぐ大見出しの多角形帯（clip-path）、プロフィールの罫、グレーの実績ボックス、黒帯バナー、斜線ハッチ。
  Layer 3: 大見出し、プロフィールの見出し・本文・氏名・卒業年・肩書・社名、実績の社名列挙、QR（qr ヘルパー）、バナーの文字、柱、ノンブル。卒業生情報は company-data に追加して参照する。
