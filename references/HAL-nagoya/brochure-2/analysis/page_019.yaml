  Layer 1: 写真モザイク（自社写真のみ。足りない場合は文字・看板なしの生成イメージを検討するが、イベント写真の生成は事実と誤認されるので避ける）。
  Layer 2: 中帯の白い面、斜線ストライプ、紺のボックス、月ボックス、半透明の一覧ボックス、写真モザイクのグリッド（CSS grid）。
  Layer 3: 英字見出し、キャッチ、月・行事リスト、イベント説明、受賞一覧、ノンブル。
