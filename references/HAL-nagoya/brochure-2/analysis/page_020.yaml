notes: |
  撮影: 90° 反時計回りに倒れた見開き写真。寸法は片面 W・H 比。
  地名・駅名・路線名・建物名・所要時間は参考資料固有なので、構造（デュオトーン地＋強調建物、リング図形、模式路線図、周辺カード）だけを使う。
  Layer 1: 航空写真のデュオトーン地（自社校舎の周辺を撮影した写真か、文字・看板なしで生成。強調する建物は自社校舎）。
  Layer 2: リング図形と引き出し線（SVG）、建物ラベルのタグ、黒の細帯、白パネルと斜めカット、路線図（SVG。路線・駅の位置は company-data のアクセス情報から）、周辺カード、斜線ストライプ、縦帯。
  Layer 3: 巨大キャッチ、lead、ラベル、リング内の文字と数字（所要時間は company-data）、箇条書き、路線図の駅名、周辺紹介の文字、ノンブル。
