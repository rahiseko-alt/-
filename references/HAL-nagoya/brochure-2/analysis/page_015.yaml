notes: |
  撮影: 90° 反時計回りに倒れた見開き写真。ノド付近の湾曲が大きく、比率の誤差が大きい。寸法は片面 W・H 比。
  コンパクト版（page_003・007 の左ページと同じ部品）を 2 つ並べた形。半ページ版のコース部品の検証に使える。
  Layer 1: 下部の学生写真（自社写真）、モック画像（生成するなら画面内に文字を入れない）。
  Layer 2: 色面、白パネル、白帯、矢羽根、パネル、縦罫、3 種のバッジ。
  Layer 3: すべての文字・リスト・人名・社名・柱・ノンブル。
