notes: |
  撮影: 90° 反時計回りに倒れた見開き写真。左端に後続ページの小口。寸法は片面 W・H 比。
  電話番号・URL・メールアドレス・住所・営業時間・地名・駅名はすべて参考資料固有なので使わない（自社の値は company-data/facts の contacts・school から参照）。
  Layer 1: 右端の建物写真（自社校舎の写真のみ）。
  Layer 2: 番号バナー（clip-path ＋ repeating-linear-gradient）、線枠チップ、URL ボックス、円形バッジ、罫、地図・路線図（SVG）、写真の切り欠きマスク、斜線ストライプ。
  Layer 3: キャッチ、導入文、バナーの見出しと番号、見学・相談・電話・メール・時刻・注記、WEB 情報、QR（qr ヘルパー）、地図の文字、写真キャプション、ノンブル。
  Phase 5 候補（第 3 位）: Layer 3 の正確性が要の要素が集中し、写真が 1 枚だけで、自社版へそのまま転用できる。
