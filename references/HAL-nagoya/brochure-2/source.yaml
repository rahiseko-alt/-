notes: |
  Google Drive「専門学校パンフレット参考資料」の「HAL名古屋パンフレット②.pdf」（https://drive.google.com/file/d/1Sag6IU0bRRvM7eRQpjTB89JhQYIDD8Ma/view）を 2026-10-08 に取り込み。Drive への格納日は 2026-10-07。実際の入手日は【要確認】
  元 PDF は印刷物の写真・スキャン（文字情報なし、埋め込み画像は 72ppi）。ページ画像は同じ解像度の 72dpi・JPEG（品質 85）
  ページ: brochure-1と同一冊子の後半。平置きスキャン。全画像が90°反時計回り（読むには時計回り90°）。page_001〜023=見開き（page_NNN=冊子p.(2N+45)〜(2N+46)。例: page_001=p.47-48、page_023=p.91-92）。page_024=裏表紙（単ページ、校名ロゴ・住所・電話・URL）。p.45-46はbrochure-1 page_024。p.79-82は夜間部・グループ校、p.83-90はキャンパスライフ・校舎・施設、p.91-92は問い合わせ・アクセス。
  禁止語に未登録の企業名（就職先・提携先。自社でも使う可能性があるため人間が判断）【要確認】: アドビ（Adobe）、大日本印刷（DNP）、Omnicom Production Japan、たきコーポレーション、KADOKAWA、プロダクション・アイジー、東映アニメーション、ポリゴン・ピクチュアズ、サンジゲン、ufotable、デジタル・フロンティア、スピード、活劇座、Netflix、テレビ朝日クリエイト、バンダイナムコフィルムワークス、KMS、SMILE PLEASE、ドッグイヤー・レコーズ、サウンド・シティ、ソニー・ミュージックレーベルズ、アニプレックス、Colorful Palette、エクシング（JOYSOUND）、ヤマハミュージックジャパン、よしもとブロードテック、インテリジェントシステムズ、カプコン、日産自動車、本田技術研究所、木村デザイン研究所、znug design、Calty Design Research、トヨタ自動車、トヨタ自動車東日本、米国トヨタ自動車販売、日本マイクロソフト、チームラボ、ソフトバンク、アクセンチュア、LINEヤフー、楽天グループ、日本総合研究所、サイバーエージェント、富士通、日本HP、Sky、GMOインターネット、博報堂アイ・スタジオ、Pinterest Japan、Hakuhodo DY ONE、Meta、NTTドコモ、FIDOアライアンス、NTT DXパートナー、Google、SCARZ、スクウェア・エニックス、バンダイナムコスタジオ、クオラス、モリサワ、ワコム、三菱自動車工業、アビッドテクノロジー、エイベックス・ミュージック・クリエイティヴ、朝日新聞、中京テレビ放送、CBCテレビ、テレビ愛知、東海テレビ、名古屋テレビ、VICON
  禁止語に未登録の候補（一般名詞と重なるため人間が判断）【要確認】: 環境が人を育てる。（p.85の見出し。短く格言的で、自社の校舎紹介でも使いうる）、名古屋駅前、徒歩3分（HALの所在説明だが、自社も名古屋駅周辺なら同様の表現を使う可能性）、地上36階（HAL校舎の特徴（数字＋一般語）。単独では弱い）、450-0002（HALの郵便番号だが名駅エリア共通。自社が同エリアなら衝突）、高度システムエンジニア専攻 / IoTネットワーク専攻 / サイバーセキュリティ専攻（高度ITコースの専攻名。一般的で自社の将来の専攻名と衝突しうる）、WEBデザイナー専攻 / WEB開発エンジニア専攻 / スマートフォンアプリ開発専攻 / WEBプログラム専攻 / WEBデザイン専攻（一般的なWEB系専攻名）、情報処理プログラム専攻 / ネットワークセキュリティ専攻（一般的なIT系専攻名）、併修制度（グループ大学との制度名だが一般語）、在校生向け専科（HALの講座区分だが一般的）
