# 入手経路・利用上の注意・見開きの扱い（例: page_002 は 2〜3 ページの見開き）
notes: |
  Google Drive「専門学校パンフレット参考資料」の「HAL名古屋 パンフレット①.pdf」（https://drive.google.com/file/d/1A4gNQnTXOwVusLLpR0g5oN0IkZYR695X/view）を 2026-10-08 に取り込み。Drive への格納日は 2026-10-07。実際の入手日は【要確認】
  元 PDF は印刷物の写真・スキャン（文字情報なし、埋め込み画像は 72ppi）。ページ画像は同じ解像度の 72dpi・JPEG（品質 85）
  ページ: 平置きスキャン（ノドに影）。全画像が90°反時計回りに回転しており、読むには時計回り90°回転が必要。page_001=表紙（単ページ、3DCGキャラクター＋「>PRO」）。page_002〜024=見開き（page_NNN=冊子p.(2N-3)〜(2N-2)。例: page_002=p.1-2、page_010=p.17-18、page_024=p.45-46）。冊子全体はp.92＋裏表紙で、本PDFは前半。後半はbrochure-2（p.47〜）。page_010は2026年3月卒業生の就職実績一覧（極小文字）。各ページ左上に「ZERO→PRO」ロゴタブ。
  禁止語に未登録の企業名（就職先・提携先。自社でも使う可能性があるため人間が判断）【要確認】: 任天堂、カプコン、セガ、スクウェア・エニックス、バンダイナムコスタジオ、バンダイナムコフォージデジタルズ、バンダイナムコフィルムワークス、コナミデジタルエンタテインメント、コナミ、サイバーエージェント、ゲームフリーク、インテリジェントシステムズ、フロム・ソフトウェア、Cygames、レベルファイブ、サイバーコネクトツー、ソニー・インタラクティブエンタテインメント、スパイク・チュンソフト、コロプラ、マーベラス、NHN PlayArt、SNK、UBISOFT、トヨタ自動車、マツダ、日産自動車、本田技術研究所、三菱自動車工業、スズキ、ダイハツ、白組、ufotable、カバー、Yostar Pictures、サンジゲン、ビクターエンタテインメント、宝塚舞台、富士ソフト、Sky、デジタル・フロンティア、京都アニメーション、東映、東映アニメーション、プロダクション・アイジー（Production I.G）、GMOインターネットグループ、チームラボ、グラフィニカ、ボンズ、ポリフォニー・デジタル、Netflix、Lola Visual Effects、Barehand Modeling Studio、日本マイクロソフト（Microsoft / Copilot）、NTTデータグループ、NTTドコモ、キヤノンITソリューションズ、ヤマハミュージックジャパン、三井住友銀行、東海テレビ放送、清水建設、アドビ（Adobe）、アニプレックス（Aniplex）、KADOKAWA、Colorful Palette、大日本印刷（DNP）、ソフトバンク、富士通、日本HP、博報堂アイ・スタジオ、Hakuhodo DY ONE、LINEヤフー、Pinterest Japan、ポリゴン・ピクチュアズ、Omnicom Production Japan、たきコーポレーション、テレビ朝日クリエイト、エクシング、サウンド・シティ、ソニー・ミュージックレーベルズ、木村デザイン研究所、Calty Design Research、znug design、インフォテック・サーブ、スピード、活劇座、KAMITSUBAKI STUDIO、SCARZ、ワコム、NEC、イマジカ、ソニックパワード、ハーモニック・ピクチャーズ、RAY-NET、ソフトクリエイト、セントラル・ミュージックエンタテインメント、アップフロントグループ、やおきん、ZONe ENERGY、AbemaTV、清華大学
