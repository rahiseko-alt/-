# 比較用の補正指定（Phase 5 / npm run ref:prep。system/rules/references.md §4）
# 見開き（ノンブル 27〜28）の写真。90° 反時計回りに倒れて保存されているので時計回りに 90° 回し、
# 左ページ（ノンブル 27。7 列のインデックス表がページ全体を占める側）だけを切り出す
# 回転後の画像は 2485×1290px。四隅は画素の実測（回転後の座標）:
#   左上 (97, 8)    … 天の紺帯の上端（x=120〜300 で y≈8）と左端（白地の始まり）の直線の交点
#   右上 (1277, 0)  … ノド。紺帯がノドまで裁ち落とされて右ページの帯と接する位置（y=30〜100 で x≈1277）。天は撮影範囲の端
#   右下 (1250, 1277) … ノドの影の中央（表の右端 1239 と右ページの表の左端 1266 の中間）と地の端（x=1230 で y≈1278）
#   左下 (10, 1289) … 左端の直線（y=300〜1250 の 6 点で x = 43.7 − 0.0683 (y − 792)）と撮影範囲の下端の交点
#     地の端は撮影範囲の外（ノンブル位置からの推定で y≈1298）。下端で止めたので、左下は約 9px（ページ高の約 0.7%）欠ける
# ノド側は紙の反りで内側へ湾曲する（y=700 で 約 +5px）。4 点の射影補正では取り除けない
# aspect は表紙（page_001。回転後 1414×1431px、ページの実測 約 1389×1418px）から求めた片ページの縦横比 0.98（この見開きは遠近とノドの反りで横が縮んで写っている）
