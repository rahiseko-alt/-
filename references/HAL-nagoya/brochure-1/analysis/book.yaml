  alternation: "章の地色が 青（01）→ 白（02 扉）→ 青（02 続き）→ 暗い祝祭（03）→ 白（04・05）と切り替わり、学部セクションでは 学部色の扉 → 白の卒業生 → 左学部色・右白のコース紹介 が繰り返される"
  reuse: "同じ型の繰り返しが多い: コース紹介（page_018・019・020・024）、学部扉（page_016・022）、卒業生（page_017・023）、白地データ見開き（page_008・013）"
phase5_candidates:
  - { page: page_015, reason: "学部・学科インデックスの表組み。ほぼ Layer 2/3（CSS grid と色面）だけで再現でき、写真・生成画像に左右されずに位置・寸法・色分けの精度を比較できる。学部色の CSS 変数の基盤にもなる" }
  - { page: page_018, reason: "コース紹介の標準型。資料内で 4 見開き（019・020・024 と半幅版の 021）に繰り返され、テンプレート化したときの再利用価値が最も高い。Layer 1（学部色のグラデーション＋写真）・Layer 2（講師カード・矢印形ヘッダーの表）・Layer 3（大量の箇条）をすべて含む" }
