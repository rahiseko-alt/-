  - { page: page_008, reason: "白地のデータ見開き（章扉兼用）。巨大な数字・見出しバー・六角形図・数値パネルなど数字を見せる部品がそろい、page_013 と型を共有。Layer 1 がほぼ不要なので比較が安定する" }
  - { page: page_002, reason: "導入見開き。青のファセット背景（多くのページで共通の Layer 1）の生成品質と、その上の斜体英字・番号付き見出し・白帯パネルの重なりを検証できる。文字量が少なく 2 ラウンドの比較が回しやすい" }
notes: >-
  入力はすべて印刷物を撮影（スキャン）した 72dpi の JPEG でテキストレイヤーはない。どのファイルも 90° 回転して保存されており（反時計回りに倒れている）、
  時計回りに 90° 回すと正位置になる。page_001 だけが単ページ（表紙）、page_002〜024 は 1 枚に見開き 2 ページ（左右のノンブル: 2N−3 と 2N−2）。
  多くの画像で紙の反り・遠近のゆがみがあり、左端に下に重なったページの小口が写り込む。特に page_012 は斜めから撮影されて台形にゆがみ、下端の一部が欠けているため完コピには使わない。
  page_010 の表は 72dpi では文字が判読できず、構造（列数・行数・ゼブラ）のみ解析した。
  Phase 5 では比較前に参考画像を回転・台形補正し、見開きを左右に分割してから使う必要がある（npm run compare の参照画像は補正済みのものを一時ディレクトリに作る）。
  共通部品化の候補（shared/components）: 斜線ハッチ、外側の斜線ストライプ、柱タブ、小口のインデックスタブ、斜めカットの見出しバー、オフセット影の白見出しバー、六角形（QR 台）、破線リング付き番号円、矢印形ヘッダーの学年ステップ表、人物カード、コースのタブカード、黄色帯ラベル。
  共通の Layer 1 素材の候補（shared/generated-assets）: 青ファセット背景、暗い祝祭背景、学部色グラデーション地（色違い）。
  人物・企業名・ロゴ・学部学科名・数字・作品・固有コピーはすべて流用禁止。完コピ時はダミー文字・プレースホルダ枠で構造だけを合わせる。
