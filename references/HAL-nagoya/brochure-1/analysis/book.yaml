    contest: "黒に近い濃紺 60〜65% / 金 5% / 赤または分野色 8%"
    department: "学部色 45〜50% / 白 45% / 写真"
  note: "色は役割と面積比だけを学ぶ。実際の色は company-data/brand/colors/colors.yaml の自社ブランドカラーを使い、学部色は CSS 変数で切り替える"
rules: "罫線は少なく、白い細線（項目の区切り）・灰色の細線（ブロック区切り）・点線（本文の下）程度。代わりに装飾として「斜線ハッチ（平行な短い斜線 5〜6 本）」「ページ外側の太い斜線ストライプ」「ページ上下端の帯と段差のある折れ線」が全ページに繰り返し出る（共通部品化の第一候補）"
cards: "角は直角が基本（角丸はほぼなし）、影はごく弱いかオフセット影。タイトルタブの右端を斜めにカット、六角形（QR 台・キャプション）、角を斜めに落とした多角形カード、矢印形の学年ヘッダー、2 色セル（名簿）など、斜めの切り欠きで統一された『デジタル・HUD 風』の造形"
density: "全体に高い。文字の少ないページは表紙・導入（page_002）・学部扉の左ページ程度で、他は 1 見開きに 10〜20 ブロック。最も高いのは就職先一覧（page_010、約 900 行）"
