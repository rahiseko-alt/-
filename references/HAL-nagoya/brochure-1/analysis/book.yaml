  - "白地＋上下端の帯と斜線ハッチ: データ見開き・学部の右ページ（Layer 2 だけで作れる）"
  - "表紙・学部扉のキービジュアル（CG キャラクター・作品アート）: 自社用に生成。他社作品は流用不可"
image_crop: "写真は角版でノドまで寄せて裁ち落とすのが基本。肖像は胸上で統一。キービジュアルは顔・主役を大きく画面端で裁ち切る。背景用の写真はデュオトーンにしてグラデーションでぼかす"
rhythm:
