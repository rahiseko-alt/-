# 参考資料の解析結果（Phase 4・資料全体）: references/HAL-nagoya/brochure-1/
# 24 枚のページ画像（page_001 = 表紙、page_002〜024 = 見開き 23 組＝ノンブル 1〜46）をすべて画像として目視して記入。
# 寸法はすべて判型に対する比率（W = 片ページ幅、H = ページ高さ）。実寸は不明（印刷物を撮影した 72dpi JPEG で、紙の反り・遠近のゆがみがあるため）
# 固有名詞・文章は書き写さず「（学校名）」のように伏せている

grid:
  format: "ほぼ正方形の冊子（片ページ W:H ≈ 1:1.0〜1.03、見開き ≈ 2:1）。表紙の撮影画像は 1414x1431px（回転後）"
  base: "3 列ベースが最も多い（人物カード・事例カード・メッセージカード・卒業生ブロック）。表組みは 5 列（就職先一覧）・7 列（学部インデックス）・4 列（学年ステップ）。ロゴ一覧は 6 列"
  chapter_opener: "左上に巨大な章番号（斜体英数字）＋見出し 2 行、その下に本文と要素群。見開きをまたぐ大見出しも多い（page_005・011・017・023）"
  course_template: "左ページ = 学部色の地に 60% W の文字列＋40% W の写真列、右ページ = 白地に講師カード 5 列／授業紹介／学年ステップ 4 列（page_018・019・020・024、半幅版が page_021）"
margins:
  top: "約 4〜6% H（左ページ左上に柱タブ）"
  bottom: "約 3〜5% H（ノンブルは下端の外側の角に小さく）"
  inside: "約 2〜5% W（写真・大見出しはノドをまたぐことが多い）"
  outside: "左ページ 7〜9% W（外側の斜線ストライプ装飾を含む）、右ページ 4% W（学部セクションでは小口のインデックスタブを含めて 6% W）"
gutter: "カード・ブロック間 約 1〜3% W、段間 約 2.5〜3% H。表のセル間は白い隙間 約 0.3% W（罫線なし）"
photo_ratios:
  - "人物の肖像 1:1〜3:4（胸上、カード内で統一サイズ）が最多"
  - "作品画面・事例写真 16:9〜4:3 横の角版"
  - "キービジュアル（表紙・学部扉）は全面または大きなパネル（横帯型・縦パネル型）"
  - "写真を青や学部色のデュオトーンにして背景へ溶かす使い方（page_002・003・015・022）"
heading_hierarchy:
  - { level: display, desc: "英字スローガン・英字の学部名。斜体／コンデンスの極太サンセリフ、白。学部名は横にずらしたグリッチ状の切れ目", size: "12〜22% H" }
  - { level: section_no, desc: "章番号 01〜05（斜体英数字・極太）。白地では紺、暗い地では白", size: "約 12% H" }
  - { level: h1, desc: "和文ゴシック極太の 1〜3 行。助詞・ひらがなを小さくして漢字を大きく見せる。「」や『』の部分を拡大", size: "6〜10% H" }
  - { level: stat, desc: "大きな数字（斜体・極太）＋小さな単位。紺・青・赤", size: "5〜17% H" }
  - { level: h2_bar, desc: "見出しバー 3 種: 紺地（右端を斜めカット）／白地に細い紺枠＋オフセット影／赤地", size: "約 2〜3% H" }
  - { level: h3, desc: "左に縦棒（▍）付きの見出し、『』付きの制度名、▶ 付きの箇条見出し", size: "約 2% H" }
  - { level: running_head, desc: "柱タブ（英字スローガン＋章番号＋章名／学部セクションでは英字学部名＋和文学部名）", size: "約 2〜3% H" }
  - { level: body, desc: "本文はゴシック中心。インタビューの氏名・引用見出しは明朝寄り", size: "約 1.0〜1.4% H（表組みは 0.7% H まで小さくなる）" }
