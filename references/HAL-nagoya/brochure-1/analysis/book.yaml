eye_flow: "見開き単位で『左上の巨大な番号・英字 → 見出し → 巨大な数字 → カード群を Z 字』が基本。見開きをまたぐ帯見出し・大見出しで左右を一体に見せる。表は縦に流し読み、学年ステップは左から右へ時系列"
background:
  - "青のファセット背景（濃淡 2〜3 段の三角形の面＋斜めの光）: 章 01〜02 の多くの見開き（page_002・003・005・006・007 左・009・010）。共通の Layer 1 素材として 1〜2 種を生成すれば使い回せる"
