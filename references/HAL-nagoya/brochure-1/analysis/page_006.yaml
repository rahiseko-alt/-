notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 9・10）。寸法は判型比。
  Layer 1: 青ファセット背景（生成）。事例写真・作品画像は自社のもの（参考資料の写真・作品・キャラクターは流用禁止）。
  Layer 2: カードの不揃いグリッド（CSS grid の span で表現）、紺タブの斜めカット、六角形（QR 台・キャプション）、工程の円形バッジ（目盛り付きリング）と矢印、黄色ラベル（わずかに傾ける）。
  Layer 3: 見出し・制度名・説明・事例名・キャプション・工程名・QR・ノンブル。
  事例数が変わってもグリッドが崩れないよう、カードは grid-auto-flow: dense で組むとよい。
