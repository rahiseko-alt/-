notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 19・20）。寸法は判型比。
  Layer 1: 暗い祝祭背景（ボケ光・金リボン・紙吹雪）を生成。文字・賞のロゴ・メダル内の文字は入れない。月桂樹のような金の装飾は Layer 1 の部分素材として生成してもよい。
  Layer 2: 赤いリボン帯（SVG・燕尾カット）、円形メダル・シールの枠（SVG グラデーション）、結果の表組み、区切り線、分野ラベルの線。
  Layer 3: 章番号、見出し（グロー は text-shadow）、賞名、回数・年数、本文、作品名・受賞者名、ノンブル。
  賞名・作品名・人物・賞のロゴは流用禁止。実績は facts/results.yaml にあるものだけ。Phase 5 の候補（暗い背景＋祝祭の Layer 1 と Layer 3 の重ねの検証に向く）。
