  Layer 1: 全面のキービジュアル（自社用に生成。人物・キャラクター・発光ライン・星空・光条まで）。文字・ロゴは入れない。
  Layer 2: なし（必要なら下部に文字の可読性を上げる暗いグラデーションを CSS で重ねる）。
  Layer 3: 英字スローガン、分野列挙、学校名＋年度（すべて中央揃え・白・コンデンス体）。学校名は facts 参照。
  完コピ時の注意: 英字の極太コンデンス書体（自社のフォント設定から近いものを選ぶ）と、表題の幅（約 50% W）・位置（下から約 23〜43% H）を合わせる。
