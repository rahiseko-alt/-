notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 29・30）。寸法は判型比。
  Layer 1: 左上のキービジュアル（自社用に生成。参考ページを構図リファレンスとして入力してよいが、他社の作品・キャラクター・ロゴは再現しない）、左下の暗い赤のグリッチ質感、右ページの深紅地と HUD 風の線画。
  Layer 2: 3 項目の半透明帯、細線・縦棒、コースのタブカード（4 枚、コース数で増減）、小口のインデックスタブ、肖像の白縁。
  Layer 3: 英字の学部名（グリッチは clip-path で 2〜3 片に分けてずらす）、和文の学部名、リード、3 項目、英字見出し、インタビュー（自社の許諾済みのもののみ。なければ TODO）、コース名、参照ページ、ノンブル。
  学部の扉の型として page_022 と同じ構成。学部色を CSS 変数にすれば学部ごとに使い回せる。Phase 5 の候補。
