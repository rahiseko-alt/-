notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 31・32）。左端に下のページの小口が重なって写る。寸法は判型比。
  Layer 1: 不要（白地）。作品画像・肖像は自社学生・卒業生の許諾済みのもののみ（他社のゲーム画面・パッケージ・ロゴは流用禁止）。
  Layer 2: 淡い黄色の斜めの面、赤い平行四辺形の帯、柱タブ、小口タブ、灰色の囲みと黒帯、上端の赤線。
  Layer 3: 帯見出し、キャッチ、氏名・職種・卒業年、本文、就職先の列挙、QR、ノンブル。
  人物・企業名・作品名・本文は流用禁止。ブロックの自由配置は本文量で崩れやすいので、各ブロックを固定高さの枠にして overflow を検出する。
