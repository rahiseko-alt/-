background: "白地に淡い黄色の平行四辺形を各ブロックの後ろに散らす（Layer 2 の clip-path で可）。小口に縦書きのインデックスタブ"
image_crop: "作品画像は余白なしの角版でノドまで寄せる。肖像は胸上・背景は明るい屋内"
