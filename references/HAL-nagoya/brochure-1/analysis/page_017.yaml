  left: { layout: "左上 = 卒業生 A（肖像＋ロゴ＋本文）、中上 = 卒業生 B（本文＋肖像）、右上 = 作品画像（縦長、ノドまで）、左下 = 作品画像 2 枚＋卒業生 C（3 名の集合写真）、中下 = 卒業生 D" }
