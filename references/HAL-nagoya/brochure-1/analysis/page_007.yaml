notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 11・12）。寸法は判型比。紙の反りで右ページ左下がやや膨らむ。
  Layer 1: 左ページの青ファセット背景（生成）。肖像写真は自社のもののみ。
  Layer 2: 名簿セル（CSS grid、人数で行数が変わる）、チェック記号の四角（SVG）、細線、白い小タブ、カード上端のハッチ線、キャッチ帯。
  Layer 3: 見出し、説明、理念、チェック項目、名簿（facts/teachers.yaml 参照）、企業メッセージ（自社で許諾済みのもののみ、なければ TODO）、ノンブル。
  人物名・企業名・メッセージ本文は流用禁止。完コピ時は同じ文字数のダミーで置く。
