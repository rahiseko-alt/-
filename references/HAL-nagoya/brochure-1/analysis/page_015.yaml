notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 27・28）。紙の反りで右ページの表がやや傾く。寸法は判型比。
  Layer 1: 右ページ上部の作品コラージュ帯のみ（自社作品か生成で。学生作品・キャラクターの流用は不可）。
  Layer 2: 表全体（CSS grid。学部ごとの色は CSS 変数で、行高は専攻数に追従）、紺帯、斜線ハッチのアイコン、バッジ枠、＝・＋の記号、灰色の注記ボックス。
  Layer 3: 見出し、学部・学科・専攻名（facts/courses.yaml 参照）、参照ページ番号（BOOK のページ順から生成）、注記、ノンブル。
  ほぼ Layer 2/3 だけで再現できるため Phase 5 の最有力候補（表組みと色分けの精度を検証できる）。学部・学科名は流用禁止。
