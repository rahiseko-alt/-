notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 3・4）。寸法は判型比。
  Layer 1: 左ページの写真＋青グラデーション（人物写真は自社写真を使うか、生成するなら人物を写真枠ではなく背景として）、右ページの青ファセット背景。
  Layer 2: 白ダイヤ（clip-path）、赤ラベル（平行四辺形＋段差影）、番号円と破線リング（SVG）、結線、斜線ハッチ、下部の白帯、見出しバー、円形バッジの枠（中身の文字は Layer 3）。
  Layer 3: 見出し・説明・制度名・本文・バッジ内の文字・ノンブル。称号名や制度内容は company-data にあるものだけを使う（ない場合は TODO）。
  円形バッジは参考資料のロゴ・認定マークなので流用不可。自社に該当がなければ枠だけ再現する。
