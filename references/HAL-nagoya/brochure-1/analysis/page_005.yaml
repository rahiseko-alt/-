notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 7・8）。寸法は判型比。
  Layer 1: 青のファセット背景（生成）。中央の写真は自社写真のみ（参考資料の写真は使わない）。
  Layer 2: カード（CSS グリッド 3 列。カード数で行数が変わるので背景に焼き込まない）、分野色の縦帯とタブ、黄色帯、角切りキャプションカード（clip-path）、QR を載せる六角形、斜線ハッチ。
  Layer 3: 見出し・数字（facts 参照）、キャプション、カード内の氏名・企業名・肩書き、分野タグ、QR（qr ヘルパー）、ノンブル。
  人物・企業名・ロゴは流用禁止。完コピ時は同じ枚数のダミーカード（顔写真枠＋ダミー文字）で構造だけ合わせる。
