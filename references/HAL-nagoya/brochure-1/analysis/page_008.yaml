notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 13・14）。寸法は判型比。
  Layer 1: ほぼ不要（白地）。六角形モザイクの写真は自社写真のみ。
  Layer 2: 紺パネル（clip-path で角カット）、白見出しバーとオフセット影、番号バッジ（黄色丸）、紺タブ、六角形図（SVG）、赤の強調ボックス、上下の帯とハッチ。
  Layer 3: すべての数字・見出し・本文・脚注（数値は facts/results.yaml 参照・as_of/source 必須。参考資料の数値は使わない）。
  数字の桁数が変わっても崩れないよう、数値ボックスは幅を固定せず内容に合わせる。Phase 5 の候補（データページの代表）。
