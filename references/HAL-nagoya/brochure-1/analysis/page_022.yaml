notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 41・42）。左端に下のページの小口が重なって写る。寸法は判型比。
  Layer 1: 左右の濃紺〜藍のデュオトーン地（生成）。キービジュアルは自社用に生成するか自社作品（他社作品・キャラクター・ロゴは流用禁止）。
  Layer 2: 番号の斜線、細線・縦棒、コースのタブカード（2×2 の CSS grid）、斜線ストライプ、小口タブ、肖像の白縁。
  Layer 3: 英字の学部名（グリッチは clip-path）、和文の学部名、番号付き箇条、学科名、コース名、参照ページ、英字見出し、インタビュー、ノンブル。
  page_016 と合わせて「学部の扉」テンプレートの 2 バリエーション（横帯型・縦パネル型）として扱う。学部色を CSS 変数で切り替える。
