notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 5・6）。寸法は判型比。
  Layer 1: 写真（講演・講堂・肖像は自社写真のみ。参考資料の写真は切り出さない）。背景は白地と青の面なので生成不要。
  Layer 2: 上部の青帯と斜めの切り、白六角形（clip-path）、白パネル、縦書きキャプション帯、ロゴグリッドの枠、斜線ストライプ・ハッチ。
  Layer 3: 見出し、引用、本文（明朝）、縦書きキャプション、章番号、章見出し、ロゴタイプに相当する校名表記（正式ロゴのみ）、ノンブル。
  連携企業ロゴの羅列は自社に正式なロゴ使用許諾がない限り再現しない。完コピ時は同サイズのプレースホルダ枠で置く。
