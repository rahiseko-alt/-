  - { level: banner, desc: "（見出し 1 行）藍色の平行四辺形の帯に白ゴシック極太、ノドをまたぐ", size: "約 6% H" }
  - { level: catch, desc: "（キャッチ 2〜4 行）紺ゴシック太", size: "約 2.2% H" }
  - { level: name, desc: "（職種・小）＋（氏名）明朝寄りの太字＋（卒業年・小）", size: "約 2% H" }
