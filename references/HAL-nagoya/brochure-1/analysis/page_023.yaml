# page_023.jpg の解析（Phase 4）。見開き（ノンブル 43〜44）。学部（CG 分野）の活躍する卒業生。page_017 と同じ型の青系
# 寸法は判型に対する比率（W = 片ページ幅、H = ページ高さ）。実寸は不明
grid:
  spread: "3 列ベース（各ページ 約 30% W × 3）の自由配置。中央に見開きをまたぐ藍色の帯見出し（48〜58% H）"
  left: { layout: "左上 = 卒業生 A（キャッチ＋本文＋六角形の小図版）、中上 = 作品ポスター（縦長）、右上 = 卒業生 B（キャッチ＋本文＋作業風景）、左中 = キャラクター群の切り抜き（枠なし、約 50% W）、下段 = 卒業生 C・D（キャッチ＋本文＋肖像・作業写真）" }
  right: { layout: "上段 = 卒業生 E・F（キャッチ＋本文＋作品画像 2〜3 枚）、下段 = 卒業生 G・H（キャッチ＋本文＋肖像＋作品画像）、右下 = 灰色の囲み（主な就職先＋QR）と黒帯" }
margins: { top: "約 4% H（柱タブ）", bottom: "約 4% H", inside: "画像はノドまで", outside: "左 7% W / 右 6% W（小口タブ含む）" }
gutter: "ブロック間 約 2% W"
photo_ratios: ["作品ポスター・キービジュアル 2:3〜3:4 縦（大）× 3", "キャラクター群の切り抜き（角版なし）約 1:1、面積 約 18%", "作業風景・肖像 4:3 と 3:4 × 7", "作品画面 16:9 × 2"]
