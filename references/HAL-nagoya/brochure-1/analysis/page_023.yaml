colors: { base: "白 約 55%", tint: "淡い黄色の斜めの面 約 10%", accent: "学部色の藍（帯・柱タブ・上端の線・キャッチ）約 6%", images: "作品画像の多色 約 25%", box: "灰色の囲み＋黒帯" }
rules: "上端に学部色の藍の太線。各ブロックのキャッチの下に細い灰色線。囲みに細い灰色線"
cards: "page_017 と同じ（灰色の囲み＋黒帯、角版の肖像・作品）。六角形の枠に入れた小図版"
density: "高（卒業生 8 名・本文 約 3,000 字、画像 約 14）"
page_type: interview
eye_flow: "中央の藍色の帯見出し → 左のキャラクター群の切り抜き → 左上から Z 字に各ブロック → 右下の囲み"
background: "白地に淡い黄色の平行四辺形を各ブロックの後ろに散らす。左ページ外側に紺の斜線ストライプ"
image_crop: "キャラクター群は切り抜きで白地に直接置き、ブロックの境界をはみ出させる。作品ポスターは角版"
rhythm: "学部扉（page_022）の直後。page_017 と同じ型を学部色だけ替えて繰り返す"
notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 43・44）。左端に下のページの小口が重なって写る。寸法は判型比。
  Layer 1: 不要（白地）。作品画像・切り抜きは自社学生・卒業生の作品で許諾済みのもののみ（他社作品・キャラクター・ロゴは流用禁止）。切り抜きは透過 PNG を Layer 1 の部分素材として置く。
  Layer 2: 淡い黄色の斜めの面、藍色の帯（学部色の CSS 変数）、柱タブ、小口タブ、灰色の囲みと黒帯、六角形の枠。
  Layer 3: 帯見出し、キャッチ、氏名・職種・卒業年、本文、就職先の列挙、QR、ノンブル。
  page_017 のテンプレートを学部色の変数だけで切り替えられるかの確認に使える。
