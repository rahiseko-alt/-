rules: "本文の下に灰色の点線の区切り。見出し前の紺の縦棒。表のセルは白い隙間で区切る（罫線なし）。資格一覧の分類ごとに上辺に色の太線"
cards: "受賞紹介カード（淡い緑のグラデーション地・角丸わずか）。推薦者カード（淡い黄色の地＋肖像＋ロゴ）。数値表（淡い灰色の地・3×3）。オレンジ枠の注記ボックス＋矢印形ラベル"
density: "高（数値 約 12、資格名 約 45、本文 6 ブロック）"
page_type: data
eye_flow: "左上の章番号 → 見出し → 赤い制度名 → 本文 → 写真 → 巨大な人数 → 数値表 → 右上の見出しバー → 推薦者カード → 資格一覧表 → 下部の補足"
background: "白地。上下端に紺の帯と斜線ハッチ、左ページ外側に紺の斜線ストライプ（Layer 2）"
image_crop: "受験風景は手元と横顔に寄り、背景の他の学生をぼかす。受賞者は上半身＋賞状"
rhythm: "章 04 の扉。章 02（page_008）と同じ白地のデータ見開きの型を繰り返し、章ごとのリズムを作る"
notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 23・24）。左端に下のページの小口が重なって写る。寸法は判型比。
  Layer 1: ほぼ不要（白地）。写真は自社のもののみ。
  Layer 2: 見出しバー（赤・紺）、縦棒、点線、資格一覧の表（CSS grid、分類ごとの色は CSS 変数）、カードの淡いグラデーション、オレンジの囲みと矢印ラベル、上下の帯とハッチ。
  Layer 3: 章番号、見出し、制度名、本文、人数（facts/results.yaml・as_of/source）、資格名、推薦者情報（許諾のあるもののみ）、ノンブル。
  資格名は一般名称なら使えるが、人数・人物・企業名・制度の固有名は流用禁止。
