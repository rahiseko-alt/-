  Layer 1: 不要（地図は単色シルエットなので SVG）。写真は自社のもののみ。
  Layer 2: 世界地図（SVG）、ピンと引き出し線、紺パネル、見出しバー（斜めカット）、細枠の囲み、上下の帯とハッチ。
  Layer 3: 章番号、見出し、地図上の英字タイトル（袋文字は -webkit-text-stroke）、都市名、本文、ノンブル。
  海外拠点・提携校・人物・機関名は流用禁止。自社に海外拠点がなければ構成自体を使わない（TODO として人間に確認）。
