  判型はほぼ正方形の中綴じ/無線綴じで、見開き W:H ≈ 2:1。寸法は判型比。紙の反りで右ページ上端がやや傾く。
  Layer 1: 左右それぞれの青い背景（左はキービジュアルの青モノトーン、右は多角形ファセット）。文字・数字は入れない。
  Layer 2: 白帯パネルと三角の切り欠き（CSS clip-path）、項目間の細線、斜線ハッチ・斜線ストライプ（SVG 部品化して全ページで再利用）、目次の色チップ、認定バッジの赤い枠。
  Layer 3: 英字スローガン、キャッチ、本文、目次（ページ番号と項目）、01〜05 見出し、満足度ラベルと数字（facts 参照・as_of/source 必須）、ノンブル。
  数字・実績は参考資料のものを使わない。目次は BOOK の構成から生成する。
