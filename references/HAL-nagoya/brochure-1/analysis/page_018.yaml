notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 33・34）。左端に下のページの小口が重なって写る。寸法は判型比。
  Layer 1: 左ページの赤グラデーション地と写真列への溶け込み（生成するか CSS グラデーション＋写真で）。写真は自社のもののみ。
  Layer 2: 白い見出しバー、縦棒、斜線ストライプ、金バッジの枠、講師カードの区切り線と赤タグ、白タブ、学年ステップ表（CSS grid 4 列＋矢印形ヘッダーは clip-path）、小口タブ、上下の赤帯。
  Layer 3: コース名、学科名、称号、年制、リード、専攻名と説明、職種・ソフト・資格の箇条、講師情報、授業名と説明、学年ステップの全文、ノンブル。facts/courses.yaml を参照。
  コース紹介の標準型として最も再利用価値が高い（3 見開き連続で同じ型）。Phase 5 の最有力候補。
