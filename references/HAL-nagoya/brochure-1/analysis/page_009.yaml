notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 15・16）。左端に下のページの小口が重なって写る。寸法は判型比。
  Layer 1: 濃紺のファセット背景（生成）。肖像写真は自社卒業生の許諾済み写真のみ。
  Layer 2: カード（黄色帯の斜めカット＋濃紺パネル、CSS grid 3 列）、円形バッジ、六角形（QR）、脚注線。
  Layer 3: 見出し・人数（facts 参照）・企業名・職種・学科名・氏名・コメント・脚注・下部の企業名帯・QR・ノンブル。
  人物・企業名・コメントは流用禁止。完コピ時は同じ文字数のダミーで、カードの高さが揃うことを確認する。Phase 5 の候補（カード型インタビューの代表）。
