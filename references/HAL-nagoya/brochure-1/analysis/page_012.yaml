  Layer 1: page_011 と共通の暗い祝祭背景（同じ生成画像を流用してよい）。
  Layer 2: 分野色の結果帯（CSS 変数で分野色を切り替え）、金シール（SVG）、区切り線。
  Layer 3: 分野ラベル、コンテスト名、結果、本文、ノンブル。分野色は自社の学科色（brand/colors）に置き換える。
  コンテスト名・作品・人物・商品は流用禁止。
