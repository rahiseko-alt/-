notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 35・36）。左端に下のページの小口が重なって写る。寸法は判型比。
  Layer 1 / 2 / 3 の切り分けは page_018 と同じ。追加要素（白枠の制度バッジ、授業時間帯の囲み）は Layer 2 の部品＋Layer 3 の文字。
  型の再利用性の確認用: page_018 のテンプレートに差し替えデータを流し込んだときに、ローマ数字付きのコース名や 2 個目のバッジで崩れないかを検証するのに向く。
  作品画面・人物・講師名・企業名は流用禁止。
