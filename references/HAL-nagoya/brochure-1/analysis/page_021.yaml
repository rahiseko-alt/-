notes: >-
  元画像は印刷物の撮影で 90° 回転（時計回り 90° で正位置）。1 枚に見開き 2 ページ（ノンブル 39・40）。左端に下のページの小口が重なって写る。寸法は判型比。
  Layer 1: 左ページの赤地と写真コラージュの溶け込み（写真は自社のもののみ）。右ページは不要（白・灰色）。
  Layer 2: page_018 の部品の半幅版（学年ステップ表は 2 列）、白いパネル、赤の見出しバー、六角形の行頭記号（SVG）、灰色線、斜線ハッチ、小口タブ。
  Layer 3: 学科名、バッジの文字、専攻、講師情報、授業、ステップ、トピックの見出し・本文、ノンブル。
  コース型のテンプレートが列数（4 年 → 2 年）と幅（全幅 → 半幅）を変えても成立するかの確認に使える。チーム名・企業名・イベント名・人物は流用禁止。
