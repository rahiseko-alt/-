notes: |
  Google Drive「専門学校パンフレット参考資料」の「名古屋医療秘書福祉&IT専門学校 オープンキャンパスチラシ.pdf」（https://drive.google.com/file/d/1a0S8oAbrjsArSpjfsoE4SdoOw-PrdRFa/view）を 2026-10-08 に取り込み。Drive への格納日は 2026-10-07。実際の入手日は【要確認】
  元 PDF は印刷物の写真・スキャン（文字情報なし、埋め込み画像は 72ppi）。ページ画像は同じ解像度の 72dpi・JPEG（品質 85）
  ページ: スキャン/撮影画像4枚。全画像が反時計回りに90°倒れている（時計回り90°で正立）。page_001=Halloween eventチラシ（回転後A4縦）、page_002=在校生ティーパーティーチラシ（回転後A4縦）、page_003=Open Campusチラシ表（回転後A4横）、page_004=同チラシ裏（回転後A4横。左半分=職業体験・ティーパーティー・校名、右半分=資格PR・SNS）。
  禁止語に未登録の候補（一般名詞と重なるため人間が判断）【要確認】: リアルな学校生活が知れる（チラシ見出し。一般的な表現）、自分に合う学校選びをしよう（チラシ見出し。一般的な表現）、選べる職業体験（OC企画名だが一般的）、圧倒的なサポート体制で安心（訴求コピーだが一般的な表現）、最大資格取得数17個（数値入りの訴求。数字は流用禁止）、放課後に無料の手厚い個別補講を実施（訴求コピー。やや一般的）、在校生数No.1（『東海地区医療分野(事務関連)在校生数No.1』の一部。No.1表記自体は自社も使いうる）
