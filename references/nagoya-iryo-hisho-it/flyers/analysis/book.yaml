# 参考資料の解析結果（Phase 4。system/rules/references.md §4）— 資料全体
# 対象: references/nagoya-iryo-hisho-it/flyers/（ページ画像 4 枚。来校イベント・オープンキャンパスの告知チラシ）
# - ページ画像はすべて画像として目視した（正立させた確認用コピーも目視）
# - 寸法は「仕上がり 1 ページ（チラシ 1 面）に対する比率（%）」で書く。物理寸法は不明（notes 参照）
# - 参考資料の文章・数値（日付・時刻・金額・実績）・固有名詞（校名・学科名・商品名・キャラクター名）は書き写さず「（…）」で伏せる

# グリッド（段数・段間・基準線）
grid:
  基本: "厳密な段組はなく、中央軸を基準にした帯状の構成。縦のチラシは「上 40〜45% ヒーロー（タイトル＋写真/イラスト）→ 中段 日付と要点 → 下段 2 パネル（内容・特典）→ フッター帯（学校情報＋QR）」"
  横のチラシ: "表は横 3 層（ヒーロー ≈ 35% / イベント ≈ 45% / 特典の帯 ≈ 20%）。裏は左 2/3（白いカード 2 枚）＋右 1/3（色紙風の縦パネル）"
  左右の配分: "下段の 2 パネルは ≈ 60:35（縦のチラシ）。写真の格子は 3 列 × 2 行か 4 列 × 2 行"
  基準線: "なし。日付・タイトルを中央揃えし、写真やイラストは左右の端に寄せて裁ち落とす"
  版面: "端まで装飾・写真が届く（裁ち落とし多用）。文字の安全余白はページ幅の ≈ 3〜5%"

# 余白
margins:
  top: "≈ 0〜3%（ヒーローの写真・装飾は天に裁ち落とし）"
  bottom: "≈ 2〜3%（フッター帯は地に裁ち落とし）"
  left: "≈ 3%（文字・パネル）"
  right: "≈ 3%"
  注記: "チラシは 1 枚もの（見開きなし）。ノド・小口の区別はない"

# ガター・段間
gutter: "パネル間 ≈ ページ幅の 2〜3%。写真の格子の間隔 ≈ 1〜1.5%。帯と帯の間は装飾の境界（波形・直線）で区切り、間隔を取らない"

# 写真の比率と使われ方
photo_ratios:
  - "体験の写真: 円形（直径 ≈ ページ幅の 17%）×6、または横位置 ≈ 4:3〜3:2 の格子 ×6〜8。キャプションを下か下端の色帯に"
  - "人物の大きな写真: 横長チラシの左右端に、胸から上を大きく（裁ち落とし）。縦長チラシは写真のコラージュ 5〜6 点をヒーロー部に敷き詰める"
  - "切り抜きの人物（背景なし）: 帯やパネルの境界にまたがって置く"
  - "建物の外観（フッターの小写真）"
  - "景品・食べ物のイラスト（写真ではなくイラスト調）"
  - "面積比: 写真 ≈ 25〜35% / イラスト・装飾 ≈ 15〜25%"

# 見出し階層（字高はページ高に対する比率）
heading_hierarchy:
  - level: "イベント名（ヒーロー）"
    字高: "≈ 8〜11%"
    ウェイト: "極太の丸ゴシック（白抜き＋色のフチ取り）または英字のディスプレイ書体（丸い極太／手書き風のスクリプト）"
  - level: "日付"
    字高: "≈ 5〜8%（月は ≈ 3〜4%、曜日は丸囲みの小さな字）"
    ウェイト: "極太の丸い数字か、太いセリフ体の数字。斜線で月と日を分ける"
  - level: "サブ見出し・リボン"
    字高: "≈ 2.5〜4%"
    ウェイト: "太丸ゴシック・白抜き（リボン・帯の上）"
  - level: "ラベル（雲形・ピル・吹き出し）"
    字高: "≈ 2〜2.5%"
    ウェイト: "太丸ゴシック（雲形の中は色文字、ピルの中は白抜き）"
  - level: "リード"
    字高: "≈ 2.0〜2.3%"
    ウェイト: "太丸ゴシック・濃い茶〜黒・中央揃え 2 行"
  - level: "キャプション・注記"
    字高: "≈ 1.0〜1.3% / ≈ 0.7%"
    ウェイト: "太ゴシック / 細ゴシック"

# 色の役割と面積比（16 進は撮影画像からの推定。実際の色は自社のブランドカラーを使う）
colors:
  傾向: "チラシごとに季節・企画に合わせた配色を作り、学校の基本色（ローズピンク）は帯・日付の囲み・フッターで共通させる"
  page_001: "ラベンダー #e7e2e0〜#d9cfe0・クリーム・テラコッタ #c9786a 前後・橙・モーブ #a5748f（日付）・淡黄 #fffda6（特典パネル）"
  page_002: "ダスティローズ #be767a 前後（中央の縦帯・日付の囲み・フッター帯）＋白"
  page_003: "ラベンダーの縦縞 #d7dbef・ピンクの花柄の帯 #c78ea5・橙（カボチャ・タイトル）・クリーム・黄＋学科ごとの色の丸ラベル"
  page_004: "ピンクの紙地 #f7e8eb＋白いカード、右 1/3 は淡黄の紙地 #fcf6b8。写真のキャプション帯を学科ごとに色分け（ピンク・青・紫・緑・橙・水色）"
  面積: "地の色（パステル）≈ 40〜60% / 写真 ≈ 25〜35% / 強い色（ローズ・橙）≈ 10〜15% / 文字 ≈ 5%"

# 罫線
rules:
  - "罫はほとんど使わない。区切りは色面の境界・波形の上辺・手描き風の線（スウッシュ・波線）で行う"
  - "日付の囲みの中に白の細罫（ラベルと日付の間）"
  - "雲形ラベルの下に斜線の帯（ハッチング）や手描き風の下線"
  - "点線の囲み（予約の案内）"

# カード（角丸・余白・影・枠）
cards:
  パネル: "淡い色地の矩形（角なし）か白い角丸カード（半径 ≈ ページ幅の 2%）。影なし"
  ラベル: "雲形（思考の吹き出し、外側に小さな丸 3 つ）、ピル、リボン（両端が折れた帯）、ペナント、六角形・ロゼット型のバッジ、スカラップ（波縁）の円"
  日付の囲み: "円（カボチャのイラスト・クリーム色の円・淡いピンクの円）や斜線模様の矩形"
  写真の枠: "円形マスク、白い細フチ、下端の色帯キャプション"
  内側余白: "パネル内 ≈ ページ幅の 2〜3%"

# 情報密度
density: "高（チラシ 1 面に日付・時刻・体験 6〜8 種・特典 2〜3 種・QR・学校情報）。装飾とイラストで隙間を埋め、余白はほぼない"

# ページタイプ（ページ画像ごとの対応表）
page_type:
  page_001: "other（季節イベントの告知チラシ・縦。シート A の表と推定）"
  page_002: "other（在校生との交流イベントの告知チラシ・縦。シート A の裏と推定）"
  page_003: "other（オープンキャンパスの告知チラシ・横。シート B の表と推定）"
  page_004: "other（オープンキャンパスの職業体験と資格の案内・横。シート B の裏と推定）"

# 視線誘導（資料全体の傾向）
eye_flow: "ヒーローの大きなイベント名 → 大きな日付 → リード → 体験の写真の格子 → 特典 → 右下（または下端）の QR と予約の案内。最後に必ず QR で行動を促す"

# 背景表現
background: "季節のモチーフ（おばけ・カボチャ・星・花・水玉・縦縞）や紙の質感（ドットの地紋・花柄）をパステルの地に敷く。写真は切り抜きや円形でイラストとなじませる。これらの質感・装飾・イラストは Layer 1（生成）に向く。パネル・帯・日付の囲みは Layer 2"

# 画像のクロップ
image_crop: "大きな人物写真は左右端・天に裁ち落とし、胸から上。体験の写真は円形か角丸なしの矩形で、作業の手元や表情に寄る。切り抜きの人物はパネルの境界をまたがせて奥行きを出す"

# ページ間のリズム
rhythm:
  構成: "2 枚のシート（表裏）と推定。シート A（縦）: 表＝季節イベント、裏＝交流イベント。シート B（横）: 表＝日程の一覧と季節企画と特典、裏＝体験の詳細とイベントの選び方と資格"
  関係: "表は集客の訴求（大きな日付・特典）、裏は内容の詳細（体験の一覧・選び方）。同じ日付を表裏で繰り返し、どちらの面からでも予約へ誘導する"

# その他の所見
notes:
  画像の状態: "4 枚とも 1 枚もののチラシを撮影・スキャンした 72dpi の JPEG（テキスト層なし）。全ページが 90° 反時計回りに倒れた状態で保存されている（ページの天が画像の左）。正立には 90° 時計回りに回転する。page_001・page_002 は正立すると縦（縦横比 ≈ 1:1.43〜1.45）、page_003・page_004 は正立すると横（≈ 1.38〜1.42:1）。見開きはない"
  表裏の推定: "page_001 の特典パネルに page_002 の文字が左右反転の位置で透けており、page_001 と page_002 は 1 枚の表裏と推定。page_003 と page_004 は同じ日程を扱い、page_004 の右下に管理番号があることから、page_003 が表、page_004 が裏と推定"
  寸法の表し方: "物理寸法が不明なため、寸法はすべて仕上がり 1 面に対する比率（%）で書いた。縦横比から A4（縦・横）と推定"
  Layer の切り分け: "Layer 1 は背景の質感・季節の装飾・イラスト（おばけ・カボチャ・花柄・縦縞・紙のドット）と写真（自社写真）。Layer 2 はパネル・帯・リボン・雲形・ピル・日付の囲み・写真の円形マスク・キャプション帯・矢印。Layer 3 はイベント名（英字ロゴ風の文字も含め、文字は生成画像に入れない）・日付・時刻・本文・学校情報・QR"
  共通部品の候補: "日付の囲み（円・斜線の矩形）、雲形ラベル、リボン見出し、写真の格子＋色帯キャプション、フッター帯（学校情報＋QR）、特典カード（タブ付きの白い角丸）"
  phase5_candidates:
    - page: page_002
      理由: "構造が明快（写真のコラージュ＋中央の色帯＋大きなタイトル → 日付の囲み 2 つ → フッター帯）。Layer 1（写真）と Layer 2/3 の切り分けが分かりやすく、チラシの基本形として再利用しやすい"
    - page: page_003
      理由: "横チラシで情報密度が最も高い。縦縞・花柄の地（Layer 1 の生成）、日付の円 6 つ（Layer 3 の正確な配置）、写真の格子＋円ラベル、特典カードの帯など、Layer の重ね合わせを総合的に検証できる"
    - page: page_001
      理由: "イラスト中心の季節チラシ。背景の装飾を参考画像の入力で Layer 1 に生成し、その上に日付・パネルを Layer 2/3 で重ねる手順の検証に向く（予備候補）"
  比較時の注意: "npm run compare の前に、参考画像を正立させた比較用画像（一時ファイル）を --reference で渡す。撮影の歪みがあるため画素一致率は低く出る。目視比較を主にする"
