notes: |
  - 画像の状態: 1 面。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。正立後の縦横比 ≈ 1:1.43（A4 縦と推定）。表面の透けあり
  - 寸法の表し方: 仕上がり 1 面に対する比率
  - Layer 1: 写真のコラージュ（自社写真）、切り抜きの人物（自社写真を切り抜く）、飲み物・建物・景品のイラスト（生成可。文字・ロゴを入れない）
  - Layer 2: 中央の縦帯、写真の格子の配置、日付の囲み（斜線の地紋は repeating-linear-gradient）、フッター帯、手描きの線（SVG）、QR の地
  - Layer 3: キッカー・イベント名（フチ取りは -webkit-text-stroke か paint-order で）・サブ見出し・リード・時刻・日付・特典の文・箇条・QR（日付・アクセスは company-data から。参考の駅名・景品名は使わない）
  - 再現の注意: タイトル 2 行目が帯より広く写真に重なるため、タイトルは帯とは独立した絶対配置にする。人物の切り抜きはフッター帯より手前（z-index を上）に置く
  - Phase 5 候補（チラシの基本形。Layer の切り分けが明快）
