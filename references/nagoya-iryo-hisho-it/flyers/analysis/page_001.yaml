eye_flow: "英字のイベント名 → リボン → 大きな日付（左→右）→ リード → 左パネルの円形写真 → 右パネルの特典 → 右下の QR"
background: "淡いラベンダー・クリームの不定形の面、右上の大きなおばけのイラスト（裁ち落とし）、左上の水玉の面、星やカボチャの小さなイラスト。季節の装飾は Layer 1 で生成する。裏面（page_002）の文字が淡く透けている（撮影・紙の性質。原稿の要素ではない）"
image_crop: "体験の写真は円形マスクで、作業の手元や人物の顔に寄る。建物の外観は角なしの矩形"
rhythm: "シート A の表と推定。裏（page_002）と同じ学校の基本情報・QR を持つが、配色は季節（ラベンダー・橙）に寄せる"
notes: |
  - 画像の状態: 1 面。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。正立後の縦横比 ≈ 1:1.45（A4 縦と推定）。裏面の透けあり
  - 寸法の表し方: 仕上がり 1 面に対する比率
  - Layer 1: 背景の装飾（不定形の面・おばけ・水玉・星・カボチャ）を参考画像の入力で生成（文字なし）。写真は自社写真。食べ物・景品のイラストは生成可（商品のロゴ・文字を入れない）
  - Layer 2: パネル（ラベンダー・淡黄）、雲形ラベル（SVG）、リボン（SVG）、円形写真のマスク、斜線のハッチング、手描き風の下線（SVG）、QR の地
  - Layer 3: 英字のイベント名（Web フォントで組む。生成画像に入れない）・リボンの文字・日付・時刻・リード・キャプション・特典の文・学校情報・QR（日付・学校情報は company-data から。参考の日付・校名・景品名は使わない）
  - 再現の注意: 日付は斜線と数字の位置関係を固定した部品にする（月・日・曜日の 3 要素）。英字のディスプレイ書体は丸い極太の書体を fonts に登録して使う
  - Phase 5 予備候補（Layer 1 の装飾生成の検証）
