# 参考資料の解析結果（Phase 4）— flyers / page_001（季節イベントの告知チラシ・縦 1 面）
# 寸法は仕上がり 1 面に対する比率（%）。左上が原点。文章・数値（日付・時刻・住所・電話番号）・固有名詞（校名・商品名）は伏せる

grid:
