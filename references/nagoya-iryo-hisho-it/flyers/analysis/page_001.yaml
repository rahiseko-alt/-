  ヒーロー: "英字 2 行は中央揃え（幅 ≈ 55%）。左に雲形の吹き出し（x 6〜29% / y 12〜22%）、右にカボチャの風船のイラスト"
  日付: "月 / 日 を斜線で区切る大きな数字 3 組（x 8〜72%）＋右に時刻 2 行（x 76〜96%）"
  左パネル: "x 3〜60% / y 44〜85%。雲形ラベル → 円形写真 3 列 × 2 行（直径 ≈ 17%）＋各写真の下にキャプション"
