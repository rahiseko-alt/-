notes: |
  - 画像の状態: 1 面。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。正立後の縦横比 ≈ 1.42:1（A4 横と推定）
  - 寸法の表し方: 仕上がり 1 面に対する比率
  - 実績を示すバッジ（順位など）は流用禁止の「実績・数字」に当たる。形（ロゼット）だけを参考にし、内容は自社の facts（as_of・source 付き）があるときだけ使う
  - Layer 1: 地の装飾（縦縞・花柄・花や季節のイラスト）を参考画像の入力で生成（文字なし）、人物写真と体験の写真（自社写真）、景品・チケットのイラスト（文字・ロゴなし）
  - Layer 2: 日付の円（カボチャはイラスト素材＋円形の配置）、円形ラベル、ピル、スカラップの円（SVG）、特典のパネル、雲形、特典カードとタブ、ペナント、バッジの形、波形の境界（SVG）
  - Layer 3: 校名（facts）・英字のイベント名（Web フォント）・日付・時刻・見出し・学科名と体験名（courses から）・特典の文と金額（facts）・QR
  - 再現の注意: 日付の円は 6 つを等間隔の flex にし、円の中の月・日・曜日の位置を部品で固定する。写真に重なる円形ラベルは写真の角の座標に対して配置する
  - Phase 5 候補（Layer の重ね合わせの総合検証）
