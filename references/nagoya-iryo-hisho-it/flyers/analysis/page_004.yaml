# 参考資料の解析結果（Phase 4）— flyers / page_004（オープンキャンパスの体験と資格の案内・横 1 面）
# 寸法は仕上がり 1 面に対する比率（%）。左上が原点。文章・数値（日付・時刻・資格数）・固有名詞（校名・学科名・資格名・キャラクター名）は伏せる

grid:
  構成: "左右 2 分割。左 ≈ 66%（ピンクの紙地）: 白い角丸カード 2 枚を縦に（体験の一覧 / イベントの選び方）＋フッターの白い帯。右 ≈ 34%（淡黄の紙地）: 資格の訴求の縦パネル"
  左のカード 1: "x 4〜64% / y 6〜52%。上辺にグラデーションのピル見出し（はみ出し）→ 日付の円 4 つ＋時刻の一覧 → 写真 4 列 × 2 行（各写真の下 ≈ 30% が色帯のキャプション）"
  左のカード 2: "x 4〜64% / y 54〜81%。中央に黄色の雲形（問いかけ＋日付の円 3 つ）、左 ≈ 35%: 選択肢 A（リボンのタグ＋見出し＋副題＋チェックリスト）、右 ≈ 35%: 選択肢 B（リボンのタグ＋見出し＋副題＋色のタイル 2 列 × 3 行）。左右へ向かう太い矢印"
  フッター: "x 0〜66% / y 82〜100%。キャッチ 1 行 → 法人名と校名のロゴタイプ（大）＋認定表記 → 住所・電話。右寄りに SNS の QR 2 つ＋アイコン、キャラクターのイラストと権利表記"
  右パネル: "x 66〜100%。見出し 2 行（中央）→ リボン → 王冠付きの円形バッジ＋写真 2 点（重ねて配置）＋ラベル → 資格の一覧（白い囲み）→ 予約の点線の囲み（QR 2 つ）→ 切り抜きの人物"
margins:
  top: "≈ 2〜3%（カードの見出しのピルは ≈ 2% まで）"
  bottom: "≈ 0%（フッターは地まで）。文字は ≈ 3% 上で止める"
  left: "≈ 4%（カード）"
  right: "≈ 3%（右パネルの内容）"
gutter: "左右の領域の境界は色の切り替えだけ（間隔なし）。カード 2 枚の間 ≈ 2%。写真の格子の間隔 ≈ 0.5%"
