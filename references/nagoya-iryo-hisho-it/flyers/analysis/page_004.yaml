eye_flow: "左上のグラデーションの見出し → 日付の円 → 写真の格子（左→右、上→下）→ 中央の黄色の雲形 → 左右の選択肢 → 右パネルの見出しとバッジの数字 → 予約の QR → フッターの校名"
background: "左はピンクの紙地（ドットの地紋）、右は淡黄の紙地（ざらつきの質感）。紙の質感と地紋は Layer 1 で生成し、カード・帯は Layer 2"
image_crop: "体験の写真は角なしの矩形で、作業の手元と表情に寄る。右パネルの写真は角丸で一部を重ねる。切り抜きの人物はカードの端からのぞかせる"
rhythm: "シート B の裏と推定（右下に管理番号）。表（page_003）の日程の告知を受けて、体験の内容・イベントの選び方・資格の訴求で詳細を補う。右 1/3 の縦パネルは別の色の紙地で独立した話題（資格）にしている"
notes: |
  - 画像の状態: 1 面。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。正立後の縦横比 ≈ 1.38:1（A4 横と推定）。右 1/3 の縦パネルが折り加工による面か、単なる色分けかは画像から判断できない
  - 寸法の表し方: 仕上がり 1 面に対する比率
  - ライセンスキャラクターのイラストと権利表記は流用不可（自社に正式なライセンスがない限り使わない）。資格名・資格数は自社の facts にある値だけ
  - Layer 1: 紙地の質感（ピンクのドット地紋・淡黄のざらつき）を生成（文字なし）、写真（自社写真）、切り抜きの人物
  - Layer 2: 白い角丸カード、グラデーションのピル、日付の円、キャプションの色帯と白いピル、リボンのタグ、雲形（SVG）、矢印（SVG）、色のタイル、チェックのアイコン、王冠付きのバッジ、点線の囲み
  - Layer 3: 見出し・日付・時刻・学科名と体験名（courses から）・選択肢の文・資格の一覧（facts）・キャッチ・校名（ロゴは brand/logo）・住所・電話・QR
  - 再現の注意: 写真の格子は 4 × 2 の grid にして、キャプションの色を学科の facts（色のトークン）から引く。左右の領域の境界は直線で、背景だけを 2 色に分ける
  - 共通部品の候補: 写真＋色帯キャプションのセル、選択肢 A/B の比較ブロック
