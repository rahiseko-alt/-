notes: |
  Google Drive「専門学校パンフレット参考資料」の「名古屋医療秘書福祉&IT専門学校 パンフレット①.pdf」（https://drive.google.com/file/d/1XsA0YYODi3l1-rlW2Z_y9gtp6-SM22sH/view）を 2026-10-08 に取り込み。Drive への格納日は 2026-10-07。実際の入手日は【要確認】
  元 PDF は印刷物の写真・スキャン（文字情報なし、埋め込み画像は 72ppi）。ページ画像は同じ解像度の 72dpi・JPEG（品質 85）
  ページ: 冊子を開いて撮影した写真。全24枚とも画像が反時計回りに90°倒れている（時計回り90°で正立）。page_001=表紙（単ページ）、page_002=表紙裏+INDEX(p1)の見開き、page_003〜024=各2ページ見開き（p2-3〜p52-53。魅力・業界紹介・各学科・時間割・先生紹介・資格サポート・合格実績）。page_007左はピンぼけ。全体にマイメロディのキャラクターが入る。後半はbrochure-2に続く。
  禁止語に未登録の企業名（就職先・提携先。自社でも使う可能性があるため人間が判断）【要確認】: 聖心美容クリニック、ウエルシア、マツモトキヨシ、スギ薬局、V・drug、サンドラッグ、TechTrain、株式会社TechBowl、名古屋大学医学部附属病院
  禁止語に未登録の候補（一般名詞と重なるため人間が判断）【要確認】: 三幸（グループ名の2文字接頭辞（三幸フェスティバル・三幸共済会・三幸大学など多数）。短いため登録するかは人間判断）、快護（同校の造語だが2文字。「介護」から「快護」の時代へ は登録済み）、小児クラークコース（医療秘書科のコース名。固有寄りだが一般名にも近い）、看護クラークコース（医療秘書科のコース名。固有寄りだが一般名にも近い）、医師事務コース（コース名（一般的））、美容医療コース（コース名（一般的））、小児看護コース（医療保育科のコース名（一般的））、医療事務保育コース（医療保育科のコース名。やや固有）、スポーツレクリエーションコース（介護福祉科のコース名（総合福祉・心理福祉コースと並ぶ））、診療情報管理士科（資格名+科の一般的な学科名）、WEBデザイン・ITプログラミング科（IT系学科名。自社の将来の学科名と衝突しうる）、推しイベント（同校の見出しラベルだが一般的な言い回し）、スタートアッププログラム（入学前後プログラム名だが一般語）、合格保証制度（『生涯、全国どこでも安心の合格保証制度』。他校にもある一般的制度名）、医事業務実践ベーシック（授業名。固有寄り）、シミュレーションコンテスト（学内イベント名だが一般語）、景気に左右されにくく求人も豊富な業界（見出しコピーだが一般的な表現）、一生の財産（『資格は努力の証！一生の財産！』の一部。一般的表現）、Palette（卒業展/進級展の写真内の看板文字。展示名かどうか不明）
