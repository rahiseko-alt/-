# 比較用の補正指定（Phase 5 / npm run ref:prep。system/rules/references.md §4）
# 見開き（選択コース紹介 2 種）の写真。90° 反時計回りに倒れて保存されているので時計回りに 90° 回し、
# 左ページ（大写真＋学び・職種ボックス＋授業カード 3 枚）だけを切り出す。左右のページは同じ構造で鮮明さも同程度のため左を選んだ
# 回転後の画像は 2195×1611px。四隅は画素の実測（回転後の座標）:
#   左辺 x ≈ 31 … 小口の紙の端（前のページの小口の影と、外周の淡い緑灰の帯の始まりの境目。y = 300〜1550 でほぼ一直線）
#   右辺 x ≈ 1110 … ノドの谷線（y = 40〜1600 で x = 1110 ± 1 の一直線）
#   下辺 … 左下 y ≈ 1605（帯の下端と机の境目）。ノド側は紙の反りで下へふくらみ、推定 y ≈ 1618（撮影範囲の外）なので 1610（下端）で止めた
#   上辺 … 天は撮影範囲の外。白パネルの上端（x = 100 で y ≈ 13）から帯の幅（地の帯の実測 約 21px）を引いた推定は y ≈ -8〜-12。
#     corners は 0〜1 の比率しか書けないため y = 0 で止めた。比較画像の上端は実際の天より 約 0.6%（約 1.5〜2mm）下を写し、上ほどわずかに上へずれる
# aspect: 紙の端から測ると 1079 / 1613 ≈ 0.669 だが、正円のはずのアイコンの円が 横 100px × 縦 105px（横 0.95 倍）に写っており、
#   撮影時の横方向の縮み（ページの反り）と判断した。補正後の縦横比 約 0.703 は A4 縦（0.7071）との差が 1% 以内のため A4 縦とした
image: references/nagoya-iryo-hisho-it/brochure-1/page_016.jpg
rotate: 90
# 左上・右上・右下・左下（回転後の画像に対する比率。x / 2194, y / 1610）
corners:
  - [0.0141, 0.0]
  - [0.5059, 0.0]
  - [0.5059, 1.0]
  - [0.0141, 0.9969]
aspect: 0.7071
height_px: 2000
notes: >-
  左ページ（選択コース紹介。大写真・情報ボックス・授業カード 3 枚）。補正後に情報ボックスの下端・授業カード行の上端が水平、
  小口側の帯とノドの谷線がまっすぐであることを目視で確認。紙の反りによる局所的なゆがみ（カード行の下端と白パネルの下端がノド側で 約 0.7% 下がる、
  天の白パネルの上端が中央で浮く）は 4 点の射影補正では取り除けない。books/replica/b-course が使用
