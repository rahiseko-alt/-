# 比較用の補正指定（Phase 5 / npm run ref:prep。system/rules/references.md §4）
# 表紙（単ページ）の撮影画像。90° 反時計回りに倒れて保存されているので時計回りに 90° 回す
# 回転後の画像は 1160×1689px（右端 1 列・上端 1 行は白い枠のアーティファクト）。四隅は画素の明暗の実測（回転後の座標）:
#   左上 (0, 0)       … 天は撮影範囲の外（濃色タブが画像の上端まで届く）。左端の直線（y=600 で x≈1.5、y=1640 で x≈5.5）を上へ延ばすと x≈0
#   右上 (1150.5, 0)  … 右端（y=50〜450 で x≈1150）。天は撮影範囲の外なので上端で止めた
#   右下 (1158, 1658) … 右端（y=1050〜1250 で x≈1154〜1156 を下へ延長）と地の端（x=1080〜1150 で y≈1658）の交点
#   左下 (5.5, 1679.5) … 左端と地の端（x=8〜40 で y≈1679.5）の交点
# 天が画像の外にあるため、上端で止めた分（円から求めた縦の倍率で 約 5〜15px = 約 1〜2.5mm）だけ上部がわずかに縦に伸びる
# aspect: 紙の端から測ると縦横比は 約 0.69 だが、正円であるはずの 2 つのエンブレム（大: 横 178.5 × 縦 185px、小: 横 62 × 縦 63.5px。輪の中心で計測）が
#   縦に 2.4〜3.6% 長い楕円に写っている（撮影で横方向が縮んでいる）。円を正円に戻すと 約 0.71 になり、A4 縦（0.7071）との差が 1% 以内のため A4 縦とした
# 紙の曲がり: 右半分（目次の見出しバー・告知ボックス）の水平線は 約 −0.5°（右上がり）でそろうが、左の色面パネルの上辺・ドットの行は 約 +1°（右下がり）、
#   パネルの下辺と地の端は 約 −1.1°。表紙の左寄り（綴じ側）が反って写っており、4 点の射影補正では取り除けない（パネルの上辺に 約 1〜2mm の傾きが残る）
image: references/nagoya-iryo-hisho-it/admissions/page_001.jpg
rotate: 90
# 左上・右上・右下・左下（回転後の画像に対する比率。x / 1159, y / 1688）
corners:
  - [0.0, 0.0]
  - [0.9927, 0.0]
  - [0.9991, 0.9822]
  - [0.0047, 0.9950]
aspect: 0.7071
height_px: 2000
notes: "表紙（色面パネル＋正方形ドット＋目次）。補正後に目次の見出しバー・告知帯・告知ボックスが水平、パネルの左右辺がまっすぐであることを目視で確認。books/replica/b-adm-cover が使用"
