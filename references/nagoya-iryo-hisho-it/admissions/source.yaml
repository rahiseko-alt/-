notes: |
  Google Drive「専門学校パンフレット参考資料」の「名古屋医療秘書福祉&IT専門学校 入試方法学費ガイド.pdf」（https://drive.google.com/file/d/1OGs690gyYfxJvG4sl7ju8qYsd-jj97x3/view）を 2026-10-08 に取り込み。Drive への格納日は 2026-10-07。実際の入手日は【要確認】
  元 PDF は印刷物の写真・スキャン（文字情報なし、埋め込み画像は 72ppi）。ページ画像は同じ解像度の 72dpi・JPEG（品質 85）
  ページ: 冊子を開いて撮影した写真。全10枚とも反時計回りに90°倒れている（時計回り90°で正立）。page_001=表紙（単ページ）、page_002〜009=見開き（p1-2, p3-4, p5-6, p7-8, p9-10, p13-14, p15-16, p17-18）。p11-12の画像はなく欠落の可能性。page_007〜009は出願様式（テーマ作文記入シート・AOエントリーシート・課題シート・入学願書・利用申込・併願申請・選考料振込・記入例）。page_010=p19（お問い合わせ・地図、単ページ）。
  禁止語に未登録の企業名（就職先・提携先。自社でも使う可能性があるため人間が判断）【要確認】: 株式会社オリエントコーポレーション、株式会社ジャックス、三井住友カード株式会社、全保連株式会社（Z-College support）、日本政策金融公庫、三井住友銀行 名古屋駅前支店、株式会社共立メンテナンス（ドーミー）
  禁止語に未登録の候補（一般名詞と重なるため人間が判断）【要確認】: AO特別出願許可書（同校（三幸学園系）のAO制度の書類名。固有寄りだが一般語の組合せ）、選べる4つの年間学費納入プラン（学費プランの見出し。固有寄り）、ITビジネス科（留学生向け学科名。自社（AIビジネス）の学科名と衝突しうるため登録しない方がよい）、国際ビジネス科（留学生向け学科名。一般的で自社と衝突しうる）、ドーミーちくさ3（提携寮名（共立メンテナンス）。自社も同社寮を使う可能性）、ドーミー池下（提携寮名（共立メンテナンス））、三幸花子（記入例の架空氏名（三幸太郎・三幸大学も同様）。『三幸』を登録すれば不要）、09231697（提携ローン用の学校コード等（03354571, M138）。数字のみ）
