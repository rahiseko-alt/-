page_type: cover
eye_flow: "左上の濃色タブ（対象年度）→ 色面中央のタイトル 2 行 → 右上のエンブレム → 目次を上から 4 群 → 下部の校名ロゴタイプ"
background: "白地。全面背景画像なし。色面・ドットは単色で、Layer 2（CSS の色面＋SVG パターン）で作れる。照明ムラは撮影由来で原稿の表現ではない"
image_crop: "写真なし。濃色タブだけ天に裁ち落とし（塗り足しまで伸ばす）。色面パネルは天・地・左とも仕上がり線の内側で止まる"
rhythm: "表紙単ページ。主色の赤が次の見開き（pp.1–2）以降の見出し帯の縦バーとセクション帯に引き継がれる。目次の 4 群がそのまま冊子の章立て（学費・出願 → 入試制度 → 学費支援 → 書類・問い合わせ）"
notes: |
  - 画像の状態: 72dpi の撮影画像。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。単ページ。縦横比 ≈ 1:1.46（A4 縦と推定）
  - 寸法の表し方: すべて仕上がり 1 ページに対する比率。字高の目安はページ高に対する比率
  - Layer 1: 不要（白地）。必要なら紙の質感のみ
  - Layer 2: 主色の色面パネル、濃色タブ（天に塗り足し）、正方形ドット（SVG pattern）、白の点線、目次の見出しバー・下罫と V 字の切り欠き（SVG）、点線リーダー（CSS の border-bottom: dotted か leader 用の擬似要素）、グレーの告知帯、細枠ボックス
  - Layer 3: 対象年度・資料種別・タイトル・副題・目次の項目とページ番号・告知文・認定表記・法人名・校名（いずれも facts / copy 参照）。エンブレムと校名ロゴタイプは company-data/brand/logo の正式データを置く（生成しない）
  - 再現の注意: タイトルは極太ゴシックで字間を詰めない。ドットは等間隔のパターンで、パネル幅に対して列数（10）を固定するとずれにくい。目次のページ番号は右端をそろえる
  - Phase 5 候補（写真なしで差分が見やすい）
