notes: |
  - 画像の状態: 見開き 1 枚（左 p.17 / 右 p.18）。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する
  - 寸法の表し方: 仕上がり 1 ページ（片ページ）に対する比率
  - 記入例に書かれた架空の人名・住所・日付・口座などは書き写さない（伏せる対象）
  - Layer 1: 不要
  - Layer 2: 見出し帯（チャコール・主色の角丸）、記入表、指示の枠、下線の記入欄、囲み、引き出し線（SVG）、括弧形
  - Layer 3: 見出し・指示・注釈・口座などの案内（company-data に値がある場合だけ。参考の口座情報は使わない）
  - 再現の注意: 右ページの縮小図は画像ではなく、自社版の願書ページ（p.16 相当）をコードで縮小して埋め込む（同じ HTML を transform: scale で縮小するか、render 結果を自社素材として使う）。引き出し線の端点は縮小図の欄の座標に合わせて SVG で引く。参考資料の縮小図を貼ってはいけない
  - 共通部品の候補: 記入例（縮小図＋注釈＋引き出し線）の組み方
