# 参考資料の解析結果（Phase 4）— admissions / page_003（元資料 pp.3–4 の見開き）
# 寸法は仕上がり 1 ページに対する比率（%）。文章・数値（日付）・固有名詞は伏せる

grid:
  構成: "見開きをまたぐ 1 枚の大表（列 7 × 行グループ 3）。左ページに 4 列、右ページに 3 列"
  左ページの列幅: "区分名 ≈ 12% / 出願資格 ≈ 21% / 出願書類 ≈ 35% / 選考方法 ≈ 32%（左ページ版面幅に対する比率）"
  右ページの列幅: "受付期間 ≈ 43% / 試験日 ≈ 30% / 合否通知 ≈ 27%"
  行グループ: "入試区分ごとに 3 グループ（高さ ≈ ページ高の 38% / 27% / 27%）。各グループは「通常（上段）」と「学費減免制度の選考（下段）」の 2 段に分かれ、下段は選考方法の列の中に縦書きラベルセルを入れ子にして示す。右ページ側も同じ高さで 2 段に分かれる"
  見出し帯: "左ページの天にだけ見出し帯（h1 ＋同じ帯の中に極小の注記 1 行）。右ページは見出し帯なしで表のヘッダから始まる"
margins:
  top: "≈ 2%（左の見出し帯）/ 右ページの表ヘッダ上端 ≈ 9%"
  bottom: "≈ 3%（表の下端がノンブル直上まで来る）"
  inside: "≈ 1.5〜2%（表がノドぎりぎりまで伸び、ノドで左右がつながる）"
  outside: "≈ 2〜3%（右ページは小口にツメ）"
gutter: "行グループ間に ≈ 1% の白い間隔（グループごとに独立した枠）。列間はなし（罫で区切る）"
photo_ratios: "写真なし"
heading_hierarchy:
  - level: h1
    字高: "≈ 2.8%"
    ウェイト: "太ゴシック・黒"
    装飾: "淡ピンク帯＋左端の主色縦バー。帯の右側に極小の注記を同居させる"
  - level: "表ヘッダ"
    字高: "≈ 1.3%"
    ウェイト: "中ゴシック・黒（中グレーの地）。一部の列は下に極小の注記を 1 行"
  - level: "区分名（行見出し）"
    字高: "≈ 2.0%（2 行）"
    ウェイト: "太ゴシック・黒（淡ピンク地のセル）。下に極小の補足と、主色の細枠の小ボックス"
  - level: "セル内の小見出し"
    字高: "≈ 1.0%"
    ウェイト: "太ゴシック＋●（書類名）、【 】で囲む項目名"
  - level: "日付（右ページ）"
    字高: "≈ 1.1%"
    ウェイト: "中ゴシック・黒。区分（第 1〜3 次など）ごとに行をそろえる"
