colors:
  表ヘッダ: "#909295 前後の中グレー（黒文字）"
  行見出し: "淡ピンク #f4cbce 前後"
  縦書きラベル: "中間ピンク #d997a7 前後"
  強調: "主色（参照ページの小バッジの文字、注意ボックスの枠と文字、対象区分の小バッジ）"
  面積: "白 ≈ 80% / グレー ≈ 4% / ピンク系 ≈ 8% / 黒文字・罫 ≈ 8%"
rules:
  - "外枠 ≈ 1pt 黒（行グループごとに閉じた枠）、内罫 ≈ 0.3pt 黒"
  - "下段（制度の選考）と上段の間は細罫。選考方法の列では縦書きラベルセルの右に本文"
  - "セル内の区切りに細い点線（グレー）を使う箇所がある"
  - "注意ボックス: 主色の細枠（≈ 0.5pt）・白地・主色の文字"
cards: "表の中の小部品だけ。参照ページのインラインバッジ（淡ピンク地＋主色文字、角丸小）、対象区分のバッジ（主色地・白抜き／グレー地、角丸小）、注意ボックス（主色の細枠）"
density: "最高。見開き全面を極小〜小の文字の表で埋める（1 セル最大 ≈ 20 行）"
page_type: "data（見開き 1 表）"
eye_flow: "左上の見出し → ヘッダを左から右へ（ノドをまたいで見開きを横断）→ 行グループごとに、左端の区分名から右端の合否通知へ読む Z 型をグループ数だけ繰り返す"
background: "白地。全面背景なし。右ページに裏面の印刷が透けて見える（裏写り）が、原稿の要素ではない。右ページの右下に淡い水色の円模様がのぞくのは隣の紙"
image_crop: "写真なし"
rhythm: "p.2 の概要フロー → この見開きの詳細一覧（全区分の資格・書類・選考・日程）→ pp.5–6 の制度説明。冊子中で最も文字が密な見開き"
notes: |
  - 画像の状態: 見開き 1 枚（左 p.3 / 右 p.4）。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。ノドの湾曲と照明の傾きで右ページがやや小さく写る。裏写りあり
  - 寸法の表し方: 仕上がり 1 ページ（片ページ）に対する比率
  - Layer 1: 不要
  - Layer 2: 表（行グループの枠、ヘッダのグレー地、行見出しのピンク地、縦書きラベルセル、点線の区切り）、インラインバッジ、注意ボックス、ツメ
  - Layer 3: すべての文字と日付（日程は company-data の値を参照。参考の日付は使わない）
  - 再現の注意: 1 枚の表を 2 ページに分割して組むため、左右で行グループの高さを共有する必要がある（行高を mm で固定するか、同じ grid-template-rows を両ページに与える）。縦書きラベルは writing-mode: vertical-rl。文字量が増えるとセルがあふれやすいので、行高に余裕を持たせる
  - 共通部品の候補: 見開きをまたぐ表の組み方（ページ分割された grid）
