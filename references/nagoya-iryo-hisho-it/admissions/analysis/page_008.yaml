notes: |
  - 画像の状態: 見開き 1 枚（左 p.15 / 右 p.16）。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。裏写りあり
  - 寸法の表し方: 仕上がり 1 ページ（片ページ）に対する比率。写真貼付欄の実寸は注記に書かれているが、ここでは書き写さない
  - Layer 1: 不要
  - Layer 2: フォームの枠・罫・点線・ラベルセルの地色・郵便番号マス・チェック欄・写真貼付欄（シルエットは単純な SVG）・原稿用紙のマス（SVG の pattern か CSS の repeating-linear-gradient）・切取線
  - Layer 3: ラベル・選択肢（学科名・コース名・入試区分・制度名は company-data から）・指示文・注記・校名（facts 参照）
  - 再現の注意: 写真貼付欄は実寸（mm）で組む。原稿用紙のマスは正方形を保ち、列数・行数を固定する。記入欄の高さは mm で固定し、文字量で伸縮させない
  - Phase 5 候補（右ページの入学願書。細罫の精度とフォーム部品の検証）
