notes: |
  - 画像の状態: 見開き 1 枚（左 p.9 / 右 p.10）。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。左ページは撮影の傾きで行が右上がりに写る
  - 寸法の表し方: 仕上がり 1 ページ（片ページ）に対する比率
  - Layer 1: 不要
  - Layer 2: 見出し帯、山形＋帯の h2（SVG または clip-path）、定義表、囲み、グレーパネル、角丸ボックスと円形バッジ、矢印形、検索窓の形
  - Layer 3: 見出し・本文・制度名・企業名・電話番号・URL・コード・QR。外部機関・企業の情報は自社の company-data に存在する場合だけ使う（参考の連絡先・企業名は使わない）
  - 再現の注意: 山形＋帯の h2 は文字数で帯の長さが変わらない（版面幅いっぱい）。3 段に並べると 2 行になり帯が高くなるので、帯の高さを可変にする
  - 共通部品の候補: 山形＋帯の h2、定義表（ラベル列の均等割り）
