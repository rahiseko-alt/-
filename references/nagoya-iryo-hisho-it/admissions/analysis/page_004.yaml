notes: |
  - 画像の状態: 見開き 1 枚（左 p.5 / 右 p.6）。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。照明ムラあり
  - 寸法の表し方: 仕上がり 1 ページ（片ページ）に対する比率
  - Layer 1: 不要
  - Layer 2: 見出し帯、段階表（対角線セルは SVG の線か linear-gradient）、小表、分岐図の矢印（SVG）、タブ付き枠ボックス、方針ボックス、フローのステップ・▼・円形バッジ・点線リーダー、最下部の帯、ツメ
  - Layer 3: すべての見出し・金額・日付・説明・QR（金額・日程は company-data の値を参照。参考の数値は使わない）
  - 再現の注意: フローは 2 列の grid で、各ステップと説明ボックスを同じ行に置き、点線リーダーを行の中央の高さで引く。円形バッジはステップの左外へはみ出すので、版面の左端との間隔に注意
  - 共通部品の候補: タブ付き枠ボックス、2 列フロー（ステップ＋説明）
