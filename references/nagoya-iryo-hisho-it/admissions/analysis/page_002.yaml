notes: |
  - 画像の状態: 見開き 1 枚（左 p.1 / 右 p.2）。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。ノドの湾曲で横方向が詰まり、わずかに傾いている
  - 寸法の表し方: 仕上がり 1 ページ（片ページ）に対する比率
  - Layer 1: 不要（白地）
  - Layer 2: 見出し帯と縦バー、表（罫・ヘッダの地色・多段ヘッダの結合セル）、納入プランの角丸帯と三角、⊕ 記号（SVG）、フロー図のボックス・縦帯・矢印（SVG。点線の矢印も）、所要期間のピル、ツメ
  - Layer 3: 見出し、表の全数値（学費・定員は company-data/facts の値を参照。参考の金額は使わない）、日付、注記、ノンブル
  - 再現の注意: 多段ヘッダは HTML の table（colspan / rowspan）で組み、罫の太さを外枠と内罫で分ける。学科名の均等割りは text-align-last: justify。フロー図は CSS grid の 3 列で組み、中段から 1 列にまたがせる。矢印は SVG で描き、ボックス間の間隔を固定する
  - 共通部品の候補: 見出し帯（h1）、多段ヘッダの表、フローのステップボックス＋矢印、所要期間のピル
  - Phase 5 候補（募集要項の中核部品を 1 見開きで検証できる）
