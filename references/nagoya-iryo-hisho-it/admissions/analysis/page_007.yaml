notes: |
  - 画像の状態: 見開き 1 枚（左 p.13 / 右 p.14）。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。裏写りあり。元資料の pp.11–12 はページ画像がない
  - 寸法の表し方: 仕上がり 1 ページ（片ページ）に対する比率
  - Layer 1: 不要
  - Layer 2: 外枠・内罫・点線・ラベルセルの地色・郵便番号マス・チェック欄・作文欄の横罫・タイトル枠・切取線（すべて CSS/SVG）
  - Layer 3: ラベル・選択肢（学科名は company-data/facts/courses から）・指示文・校名・住所・電話（facts 参照）・注記
  - 再現の注意: 用紙は印刷して手書きされるため、記入欄の高さを mm で固定する（文字量で伸縮させない）。明朝体はブランド書体ではなく用紙用の書体として typography に別途定義する。切取線の位置は製本（中綴じ）のノドとの関係で決める
  - 共通部品の候補: フォームの行（ラベルセル＋記入欄）、郵便番号マス、切取線
