notes: |
  - 画像の状態: 見開き 1 枚（左 p.7 / 右 p.8）。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。照明で左ページ上部が明るい
  - 寸法の表し方: 仕上がり 1 ページ（片ページ）に対する比率
  - Layer 1: 不要
  - Layer 2: 見出し帯とキッカーのピル、タブ付き枠ボックス、帯見出し、フローのブロックと矢印、月タグ（SVG の繰り返し）、年次の括り線、付箋形（SVG）、グレーパネル、支援額表、アイコン（SVG の線画。自作するか、既存アイコンを使う）
  - Layer 3: すべての見出し・本文・金額・割合・月の表記・QR。法人グループのマークは参考資料のロゴなので使わず、自社の正式ロゴに置き換える。金額・割合は company-data の値か TODO（参考の値は使わない）
  - 再現の注意: タイムラインは月の数が変わると幅が変わるので、CSS grid の repeat() で列数を可変にする。金額の縦組みは writing-mode: vertical-rl＋text-combine-upright（2 桁）
  - 共通部品の候補: タブ付き枠ボックス、帯見出し（右端が丸い）、月タグのタイムライン
