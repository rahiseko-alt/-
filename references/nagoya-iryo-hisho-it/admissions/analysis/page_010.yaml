notes: |
  - 画像の状態: 単ページ。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。縦横比 ≈ 1:1.50（下部がわずかに台形に歪む）
  - 寸法の表し方: 仕上がり 1 ページに対する比率
  - Layer 1: 不要（白地）
  - Layer 2: 見出しの角丸帯、問い合わせパネル、円形バッジ（アイコンは SVG の線画）、吹き出しラベル、点線、検索窓、QR のカード、略地図（SVG で自社の周辺を描く）
  - Layer 3: すべての見出し・電話番号・URL・メール・ID・住所・駅名・所要時間・QR（facts/school・contacts を参照。参考の連絡先・地名は使わない）。校名ロゴタイプは company-data/brand/logo
  - 再現の注意: 見出しの文字を帯より大きくして上へはみ出させる（帯は文字の下半分にかかる）。略地図は自社の所在地で作り直す（参考の地図を模写しない）
  - 共通部品の候補: 問い合わせパネル（円形バッジ付き）、吹き出しラベル、検索窓
