# 参考資料の解析結果（Phase 4。system/rules/references.md §4）— 資料全体
# 対象: references/nagoya-iryo-hisho-it/admissions/（ページ画像 10 枚。募集要項・入試方法・学費の案内＋出願書類）
# - ページ画像はすべて画像として目視した（正立させた確認用コピーも目視）
# - 寸法は「仕上がり 1 ページに対する比率（%）」で書く。物理寸法は不明（notes 参照）
# - 参考資料の文章・数値（学費・日付・定員）・固有名詞は書き写さず「（…）」で伏せる

# グリッド（段数・段間・基準線）
grid:
  基本: "1 段組が主。版面幅いっぱいの表・枠ボックスを上から積む。説明ページの一部だけ 2〜3 段（p.10 の 3 段カラム、p.17 の 2 段フォーム、p.18 の 3 列の記入例）"
  版面: "版面幅 ≈ ページ幅の 90〜92%、版面高 ≈ ページ高の 92〜94%。余白を削って情報量を優先する版面"
  段間: "2〜3 段にするときの段間 ≈ ページ幅の 2〜3%"
  基準線: "厳密なベースライングリッドは見られない。表の行高・ボックスの高さは内容量で決まる（Layer 2 の可変ボックスで組む）"
  見開き: "左右ページで見出し帯の位置と版面をそろえる。p.3–4 は 1 枚の大表がノドをまたいで続き、行の高さが左右でそろう"
  ツメ: "右ページの小口に淡ピンクの縦長タブ（縦書きのセクション名）。ページ高の上から ≈ 10〜30% の位置。説明ページ（pp.2–10）に付く"

# 余白（物理寸法が不明なため比率で書く）
margins:
  top: "≈ 2〜3%（ページ高比。ページ見出し帯が天に近い）"
  bottom: "≈ 4〜5%（ページ高比。ノンブルは下端から ≈ 2.5% の中央）"
  inside: "≈ 4〜5%（ページ幅比）"
  outside: "≈ 4%（ページ幅比。右ページは小口側にツメが重なる）"
  記入用紙: "pp.13–18 の用紙は外側 ≈ 6〜8%、ノド側 ≈ 3〜4% の位置に縦の切取線（破線）が入る"

# ガター・段間
gutter: "段間 ≈ ページ幅の 2〜3%。枠ボックス同士の縦の間隔 ≈ ページ高の 1〜1.5%。フロー図の矢印用の間隔 ≈ ページ高の 2%"

# 写真の比率と使われ方
photo_ratios:
  - "写真は資料全体で 0 点。表紙もグラフィック（色面・正方形ドット・エンブレム）だけで構成"
  - "画像的な要素は QR コード、線画アイコン（電話・PC・建物・財布など）、略地図（p.19）、願書の縮小図（p.18 の記入例）のみ"

# 見出し階層（字高はページ高に対する比率。A4 縦と仮定した場合の pt は参考値）
heading_hierarchy:
  - level: "表紙タイトル"
    字高: "≈ 4%（A4 仮定で 34pt 前後）"
    ウェイト: "極太ゴシック・白抜き・2 行"
    装飾: "色面の中央。上に小ラベルと点線、下に角括弧の副題"
  - level: h1
    役割: "ページ見出し（各ページ 1 本）"
    字高: "≈ 2.5〜3%（A4 仮定で 22〜26pt）"
    ウェイト: "太ゴシック・黒"
    装飾: "淡ピンクの横帯（帯高 ≈ ページ高の 4〜5%）＋左端に主色の縦バー。変化形として、見出しの左に 2 行の小さなキッカー、法人グループのマーク＋主色ピルのキッカーを置く版がある"
  - level: h2
    役割: "セクション見出し"
    字高: "≈ 1.4〜1.8%"
    ウェイト: "太ゴシック・白抜き"
    装飾: "ページごとに 5 種を使い分け: (a) 黒の山形ブロック＋主色の帯 (b) 枠ボックスの左上に重なる主色の角丸タブ (c) 主色の角丸帯（両端半円）＋下向き三角 (d) 淡ピンク帯＋黒の縦バー（黒文字）(e) チャコールの角丸帯"
  - level: h3
    役割: "小見出し・項目見出し"
    字高: "≈ 1.1〜1.3%"
    ウェイト: "太ゴシック"
    装飾: "■＋黒、主色の ◆＋主色文字＋黒の括弧書き、主色の【 】ラベル、〈 〉で挟む中央見出し"
  - level: "本文・表内"
    字高: "≈ 0.8〜0.9%（A4 仮定で 7〜8pt）"
    ウェイト: "ゴシック中〜太"
  - level: "注記（※）"
    字高: "≈ 0.55〜0.65%（A4 仮定で 5.5〜6pt）"
    ウェイト: "ゴシック細〜中"
  - level: "記入用紙"
    字高: "用紙タイトル ≈ 3〜4%、ラベル ≈ 1.1%"
    ウェイト: "明朝体（タイトルは太めの明朝、ラベルは字間を大きく空けた均等割り）"

# 色の役割と面積比（16 進は撮影画像からの推定。実際の色は自社のブランドカラーを使う）
colors:
  主色: "#c14455 前後（クリムゾン寄りのローズ赤）。見出し帯の縦バー、セクション帯、表紙の大色面、強調文字（注意書き・ページ参照）、問い合わせページの円形バッジ"
  主色の濃: "#982433 前後。表紙の対象年度タブ"
  淡色: "#e8b2b7〜#f4cbce（淡ピンク）。ページ見出し帯の地、表ヘッダ、ラベルセル、フロー図の強調ボックス、ツメ"
  中間ピンク: "#d997a7〜#e39ca5。フロー図の区分見出しボックス、ステップボックス"
  チャコール: "#3a3a3a〜#575f5e。帯見出し、山形ブロック、下向き三角、日付バッジ"
  グレー: "#909295 前後（出願方法一覧の表ヘッダ）、薄グレー（フロー図の背景帯、問い合わせパネル）"
  地: "白（紙白）"
  面積: "地 白 ≈ 80% / 淡ピンク ≈ 8〜12% / 主色 ≈ 3〜5%（表紙だけ ≈ 30%）/ 黒の文字・罫が残り。記入用紙は黒＋淡ピンクのラベルセルだけ"

# 罫線（表・フォームの設計を含む）
rules:
  表の罫: "外枠 ≈ 0.75〜1pt の黒、内罫 ≈ 0.25〜0.3pt の黒。ヘッダ行は淡ピンク地（学費表）またはグレー地（出願方法一覧）。罫の色は黒で統一し、色は地色で付ける"
  表の構成:
    - "多段ヘッダ（2〜3 段）: 列グループ見出し → 小見出しの順に罫で分割（学費の一括／分割の表）"
    - "ラベル列: 字間を空けた均等割り（学科名・項目名）。学科名の下に小さな補足"
    - "数値: 右寄せまたは中央、主要な合計だけ太字で一回り大きく、その下に括弧書きの小さな補足"
    - "単位の注記は表の右上に小さく（「（単位）」）"
    - "行グループの区切りは太罫か小さな間隔（p.3–4 は区分ごとに独立した枠を縦に並べる）"
    - "対角線で区切った角セル（行見出しと列見出しを 1 セルで示す。p.5 の段階表）"
    - "セル内に縦書きのラベルセルを入れ子にする（p.3–4 の制度別サブ行）"
    - "セル内の強調は淡ピンクのインラインバッジ（参照ページ・対象区分）と主色の細枠ボックス"
  フォームの罫:
    - "外枠 ≈ 1pt 黒、内罫 ≈ 0.3pt。ふりがな欄と氏名欄の間は点線"
    - "ラベルセルは淡ピンク地、字間を大きく空けた明朝"
    - "郵便番号は 3＋4 の黒枠マス、選択肢は（　）括弧と □ のチェック欄"
    - "写真貼付欄（細枠の縦長矩形＋寸法の注記＋グレーのシルエット）"
    - "作文欄は等間隔の横罫（≈ 13 行）、課題欄は 20×15 の原稿用紙マス（200・300 の位置に小さな字数表示）"
    - "ノド寄りに縦の切取線（破線＋縦書きの小さなラベル）"
  その他: "目次のリーダーは点線、見出し下の主色細罫に吹き出し状の V 字の切り欠き、問い合わせページの区切りは主色の点線"

# カード（角丸・余白・影・枠）
cards:
  枠ボックス: "白地＋主色または黒の細枠（≈ 0.75pt）。角丸あり（半径 ≈ ページ幅の 1%）となし（角）が混在。影なし"
  強調ボックス: "淡ピンク地＋主色の枠（フロー図の受付期間など）。内側に白地・黒枠の日付ボックスを入れ子にする"
  タブ付きボックス: "枠ボックスの左上に主色の角丸タブ（白抜き）を重ね、枠の上辺をまたぐ"
  ピル: "グレー地・黒枠の小さなピル（所要期間）、主色の白抜きピル（キッカー）"
  問い合わせパネル: "薄いピンクグレーの角丸パネル（半径 ≈ 2%）＋左端に主色の円形バッジ（線画アイコン＋白抜きの短いラベル）が半分はみ出す"
  付箋: "ピンクの付箋形（右上の角が折れた形）に大きな数字（p.7）"
  内側余白: "ボックス内の余白 ≈ ページ幅の 1.5〜2%"

# 情報密度
density: "高。説明ページは小さな文字の表・注記で版面を埋める（1 見開きに表 3〜5 個、注記 10〜20 行）。記入用紙は罫が主で文字は少ないが、余白はほとんどない。資料全体で写真ゼロ"

# ページタイプ（ページ画像ごとの対応表）
page_type:
  page_001: "cover（表紙。単ページ）"
  page_002: "data / other（pp.1–2 見開き。左: 学科・定員・学費の表、右: 出願〜入学のフロー図）"
  page_003: "data（pp.3–4 見開き。入試区分ごとの出願方法一覧。1 枚の表がノドをまたぐ）"
  page_004: "data / other（pp.5–6 見開き。左: 学費減免の段階表と関連制度、右: 総合型選抜の制度説明とフロー）"
  page_005: "data（pp.7–8 見開き。学費支援制度 2 種の説明: 制度ボックス・タイムライン・支援額表）"
  page_006: "data / other（pp.9–10 見開き。左: 奨学生制度の定義表、右: 奨学金・ローンの案内と問い合わせ先）"
  欠番: "元資料の pp.11–12 に当たる画像はない（ページ画像は pp.10 の次が pp.13–14）。表中の参照から記入用紙のページと推定"
  page_007: "other（pp.13–14 見開き。記入用紙: 作文シート／エントリーシート）"
  page_008: "other（pp.15–16 見開き。記入用紙: 課題作文シート／入学願書）"
  page_009: "other（pp.17–18 見開き。左: 制度利用の申込欄・併願申請・選考料の振込案内、右: 願書の記入例）"
  page_010: "access（p.19。問い合わせ方法とアクセス。最終ページ＝裏表紙と推定）"

# 視線誘導（資料全体の傾向）
eye_flow: "各ページとも左上の見出し帯 → 版面幅の表・ボックスを上から下へ。フロー図は上から下へ矢印で誘導し、最も重要な期間・金額を淡ピンクの面か主色の太字で止める。見開きをまたぐ表は行ごとに左→右（ノド越し）の Z 型"

# 背景表現
background: "全ページ白地。全面の背景画像・写真・グラデーションはない。色は単色の面（見出し帯・表ヘッダ・ボックス）だけで、すべて Layer 2（CSS/SVG）で作れる。Layer 1 が必要な要素はほぼない（使うなら紙の質感程度）"

# 画像のクロップ
image_crop: "写真なし。略地図・アイコン・QR は角のある矩形または円形バッジ内に収め、裁ち落としはしない。表紙の濃色タブだけ天に裁ち落とす"

# ページ間のリズム
rhythm:
  構成: "前半（表紙＋pp.1–10）はカラーの説明ページ、後半（pp.13–18）はモノクロの記入用紙、最後（p.19）に再びカラーの問い合わせページ"
  前半: "毎ページが同型の見出し帯で始まる均質なリズム。概要（p.2 のフロー）→ 詳細（pp.3–4 の一覧表）→ 制度（pp.5–10）の順に、全体→部分へ進む"
  後半: "切取線付きの用紙が続き、色をほぼ使わない。最後の見開き（pp.17–18）で用紙と記入例を左右に並べる"
  見開き: "説明ページは左右とも同じ見出し帯の型。左右の内容が対になる（表 ⇔ フロー、制度 ⇔ 申込方法）"

# その他の所見
notes:
  画像の状態: "10 枚とも冊子を撮影・スキャンした 72dpi の JPEG（テキスト層なし）。全ページが 90° 反時計回りに倒れた状態で保存されている（ページの天が画像の左）。正立させるには 90° 時計回りに回転する。page_002〜page_009 は見開き 1 枚、page_001 と page_010 は単ページ。照明ムラ・ノドの湾曲・わずかな傾き・裏写りがある"
  寸法の表し方: "物理寸法が不明なため、寸法はすべて仕上がり 1 ページに対する比率（%）で書いた。字高の pt は A4 縦（210×297mm）と仮定した参考値。表紙の縦横比 ≈ 1:1.46 から A4 縦・中綴じ（表紙＋19 ページ＝20 ページ）と推定。見開き画像はノドの湾曲で横方向が詰まって見えるため、見開きからは判型を判断しない"
  Layer の切り分け: "Layer 1 はほぼ不要（白地）。Layer 2 は見出し帯・縦バー・表の罫と地色・枠ボックス・タブ・ピル・フロー図の矢印（SVG）・正方形ドット（SVG パターン）・略地図（SVG）・ツメ。Layer 3 はすべての文字・数値・日付・QR・ノンブル。学費・定員・日付・連絡先は company-data/facts の値を参照し、参考の値は使わない（現在 company-data は TODO）"
  共通部品の候補: "見出し帯（h1）、山形＋帯の h2、タブ付き枠ボックス、多段ヘッダの表、定義表（ラベル列＋内容列）、フロー図のステップボックス＋矢印、記入フォームの行（ラベルセル＋入力欄）、切取線。shared/components と shared/layouts に部品化すると、募集要項の他ページにも再利用できる"
  phase5_candidates:
    - page: page_001
      理由: "写真なしの幾何学的な表紙（色面＋正方形ドット＋目次のリーダー）。Layer 2/3 だけでほぼ完全に再現でき、比較で差が見えやすい。自社の募集要項の表紙テンプレートの土台になる"
    - page: page_002
      理由: "多段ヘッダの学費表（左）と 3 列のフロー図（右）。募集要項の中核部品（表・フロー・注記・見出し帯）をまとめて検証できる。数値はダミーまたは company-data の TODO で置く"
    - page: page_008
      理由: "入学願書（右ページ）の記入フォーム。罫の太さ・ラベルセル・郵便番号マス・写真貼付欄・切取線など、印刷して手書きされる用紙の精度を検証できる"
  比較時の注意: "npm run compare の前に、参考画像を正立させ、1 ページ分に切り出した比較用画像（一時ファイル）を --reference で渡す。撮影の歪みがあるため画素一致率は低く出る。目視比較を主にする"
