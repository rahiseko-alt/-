notes: |
  Google Drive「専門学校パンフレット参考資料」の「名古屋医療秘書福祉&IT専門学校 WEBデザイン、ITプログラミング科 パンフレット.pdf」（https://drive.google.com/file/d/18FzLF7JCNcL2gxurFHdq7qvls11dtvhT/view）を 2026-10-08 に取り込み。Drive への格納日は 2026-10-07。実際の入手日は【要確認】
  元 PDF は印刷物の写真・スキャン（文字情報なし、埋め込み画像は 72ppi）。ページ画像は同じ解像度の 72dpi・JPEG（品質 85）
  ページ: 冊子を開いて撮影した写真。全8枚とも反時計回りに90°倒れている（時計回り90°で正立）。page_001=表紙（単ページ）、page_002〜007=各2ページ見開き（p1-2〜p11-12。魅力・仕事チャート・学科紹介・時間割・先生紹介・資格・就職サポート）、page_008=裏表紙（アクセス・SNS・所在地）。
