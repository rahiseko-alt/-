# 比較用の補正指定（npm run ref:prep。system/rules/references.md §4）
# 見開きの撮影画像（90° 反時計回りに保存）を正立させ、左ページ（本文 3 ページ: 職種の座標チャート）だけを切り出す
image: references/nagoya-iryo-hisho-it/brochure-web-it/page_003.jpg
rotate: 90
# 左上・右上・右下・左下（回転後の画像 2305×1715px に対する比率）
corners:
  - [0.0095, 0.0018]
  - [0.4935, 0.0035]
  - [0.4935, 0.9982]
  - [0.0, 0.9953]
aspect: 0.7071
height_px: 2000
notes: >-
  四隅は回転後の画像の画素の明暗（机の白とページの淡い水色の境目）とノドの谷線（x = 1137px 付近）から取った。
  ページの左辺は下に向かって画像の外へ少しはみ出しているため、左下は x = 0 に置いた（左下の数 mm は画像に写っていない）。
  紙の端から測ると縦横比は 約 0.67 だが、正円であるはずの大きな黄色の円・ノンブルの円が横 0.95 倍前後の楕円に写っていたため、
  aspect を A4 縦（0.7071）とした。この値で黄色の円は縦 1238px・横 1230px（差 0.7%）になる。
  紙の反りによる局所的なゆがみ（上端の右寄りの浮き、ノド付近の縮み）は残る。books/replica/b-web-it が使用
