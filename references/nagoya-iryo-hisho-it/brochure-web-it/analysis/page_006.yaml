# 参考資料の解析結果（Phase 4）— references/nagoya-iryo-hisho-it/brochure-web-it/page_006.jpg
# 見開き（本文 9〜10 ページ: 左 = 教員紹介 / 右 = 資格取得の支援 5 項目）。寸法は片ページ比

# グリッド
grid:
  left: "上 約 22% H: 吊り下げのピル＋大見出し＋山括弧で挟んだ紹介文 3 行（中央揃え）。中 約 45% H: 縦長の教員カード 3 列（均等、約 29% W）。下 約 25% H: 小さめの教員カード 4 列（均等、約 22% W）"
  right: "上 約 12% H: 吊り下げのピル＋大見出し。下 約 85% H: 大パネル 1 枚（右上に円形写真が重なる）。パネル内: 支援 1（約 40% H: 見出し → 4 段のステップ → 2 つの時間割の比較）、支援 2〜5（2 列×2 段、細い線で区切る）"
  step_flow: "縦書きの起点ラベル（ブルー）＋3 つの箱（黄・淡青・淡青）＋終点ラベル（オレンジ）を三角の矢印で横につなぐ"
# 余白
margins:
  top: "約 2% H（吊り下げ線はページ上端から）"
  bottom: "約 4% H"
  inside: "約 3% W"
  outside: "約 4% W"
# ガター・段間
gutter: "教員カードの列間 約 2% W、段間 約 2% H。支援 2〜5 の列間 約 3% W"
# 写真の比率
photo_ratios:
  - "大きな教員カード 3 枚: 写真（約 3:4 の縦位置、カードの下 60%）に教員と学生の 2 人組（腰上）"
  - "小さな教員カード 4 枚: 写真（約 3:4 の縦位置、カードの上 75%）に教員 1 人（胸上）"
  - "右: 円形写真 1 点（直径 約 13% W、パネルの右上に重ねる）、支援 3〜5 の写真 3 点（約 4:3）、切り抜き人物 1 体"
  - "写真の面積比 約 40%（左は 約 60%）"
# 見出し階層
heading_hierarchy:
  - { level: lead, desc: "ブルーの吊り下げピル（約 1.3% H、白抜き、両端に白い点）" }
  - { level: h1, desc: "大見出し（約 5% H、ブルー。強調語は袋文字で黄色のマーカーを敷く）" }
  - { level: handwriting, desc: "教員カード上部の手書き風メッセージ 3 行（約 2.5% H、黒＋一部を緑・黄のマーカーで強調）" }
  - { level: card-name, desc: "教員の担当科目（約 0.7% H）＋名前（約 1.2% H）、カード下端の色帯に学生の名前（約 1% H、白抜き）" }
  - { level: support-head, desc: "円形の番号バッジ（ブルー、英字を弧状に＋数字、直径 約 8% W）＋前置き 1〜2 行（約 1.5% H、ブルー）＋見出し（約 3% H、茶〜オレンジ）" }
  - { level: step, desc: "ステップの箱の見出し 2 行（約 1.2% H）＋説明 2〜3 行（約 0.8% H）" }
  - { level: count, desc: "時間割の上の比較ラベル（約 1.8% H）＋数字を囲む四角（約 2.5% H）" }
  - { level: body, desc: "本文 約 0.95% H" }
# 色
colors:
  roles:
    primary: "ブルー（見出し・ピル・番号バッジ・パネル枠・時間割のヘッダ）"
    emphasis: "茶〜オレンジ（支援の見出し、比較の矢印、終点のラベル）"
    card_footer: "教員カードの下端の色帯をブルー・ローズ・グリーンで順に変える（小さなカードはグリーン・ブルー・ローズ・グリーン）"
    highlight: "黄（マーカー、最初のステップの箱、比較の背景の淡いオレンジ地）"
    ground: "白地に薄い方眼紙（右ページ）、左は白〜淡い水色"
  estimates_hex: { blue: "#3a7cc4", brown: "#b8702a", footer_blue: "#5a92d0", footer_rose: "#c4607e", footer_green: "#7ea64a", step_yellow: "#fdf0b0", compare_bg: "#fbe7c8" }
  area: "写真 約 40% / 白 約 40% / 色帯・箱の面 約 12% / 強調色 約 8%"
# 罫線
rules:
  - "教員カード: 灰色の細枠の角丸。白い上部と写真の境は波形（スカラップ）"
  - "右の大パネル: ブルーの細い二重線の角丸"
  - "支援 2〜5 の区切り: 灰色の細い縦線と横線"
  - "ステップをつなぐ三角の矢印、2 つの時間割をつなぐ太い曲線の矢印（オレンジ）"
# カード
cards:
  - "大きな教員カード: 白い上部に手書き風メッセージと担当・名前 → 波形の境 → 写真（2 人組）→ 写真の下部に白い吹き出しボックス（学生のコメント 3 行）→ 色帯（学生の名前）"
  - "小さな教員カード: 写真の上に白い吹き出しボックス（教員のコメント 3 行）→ 色帯（担当科目＋名前）"
  - "ステップの箱（角丸、淡色地）、ミニ時間割 2 つ（ヘッダはブルー、変化するセルを青で塗る）"
# 情報密度
density: "高。左: カード 7 枚（写真主体）。右: 図解＋表 2 つ＋支援 4 項目"
# ページタイプ
page_type: other
# 視線誘導
eye_flow: "左上の見出し → 紹介文 → 大きな教員カード（手書き風メッセージ → 写真の顔 → コメント）を左から右 → 小さなカード 4 枚 → 右の見出し → 支援 1 の見出し → ステップを左から右 → 2 つの時間割の比較（左→右の曲線矢印）→ 支援 2→3→4→5"
# 背景表現
background:
  - "左: 白〜ごく淡い水色（フラット）"
  - "右: 白地に薄い方眼紙。パネルは白"
  - "教員カードの写真の背景は木目・窓・植物（撮影場所の環境）"
# 画像のクロップ
image_crop:
  - "大きなカードの写真は教員と学生を並べた腰上。手を振る・ガッツポーズなど動きのあるポーズ"
  - "小さなカードは教員 1 人の胸上で、顔を写真の上 3 分の 1 に置き、下部に吹き出しボックスを載せる余白を残す"
# リズム
rhythm: "支える人の見開き。左（人物・感情）と右（制度・図解）の対は前の見開きと同じ型。次の見開き（資格取得者と就職）へ「資格」でつながる"
# その他の所見
notes:
  - "画像は見開きを 90° 反時計回りに回した状態。読むには 90° 時計回りに回す"
  - "寸法は片ページの W・H に対する比率（物理サイズ不明）"
  - "Layer 1: 教員・学生の写真（自社写真）、右ページの方眼紙（薄いテクスチャ、CSS でも可）"
  - "Layer 2: 教員カード（波形の境は SVG マスク、色帯、吹き出しボックス）、二重線パネル、番号バッジ、ステップの箱と矢印、ミニ時間割（時間割データから生成）、比較の曲線矢印（SVG）、区切り線"
  - "Layer 3: 見出し、教員のメッセージ（手書き風フォントで組む。画像にしない）、名前・担当科目、コメント、ステップの説明、時間割の文字、本文"
  - "手書き風メッセージは文字なので Layer 3。手書き風の書体を使い、マーカーは CSS の背景で敷く"
  - "教員名・学生名・担当科目・コメント・写真・資格名・コマ数の数値は流用禁止"
