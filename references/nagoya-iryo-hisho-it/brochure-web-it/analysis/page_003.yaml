# 参考資料の解析結果（Phase 4）— references/nagoya-iryo-hisho-it/brochure-web-it/page_003.jpg
# 見開き（本文 3〜4 ページ: 左 = 職種の座標チャートと卒業生 / 右 = 数字で見る業界の魅力 3 カード＋働き方の図）。寸法は片ページ比

# グリッド
grid:
  left: "ページ全体を 1 つの図として使う。左上: 白い大きな円（ページ角で切れる）に見出し 3 行。中央: 大きな黄色の円（直径 約 85% W）＋縦横の矢印で 4 象限。職種のメモカード 8 枚を象限に配置。左下: 切り抜き人物＋本文 8 行。下 約 18% H: タブラベル＋卒業生ボックス 2 つ横並び"
  right: "上 約 10% H: 吊り下げの見出しパネル（横長）。中 約 50% H: データカード 3 列（均等、約 28% W）。下 約 35% H: 働き方の図（左: 青いピル見出し 2 つ＋本文＋写真 / 中: 選択肢の箱 5 つを縦に / 右: 青いピル見出し＋本文＋教員メッセージ）"
  axes: "縦軸: 上端に青のラベル、下端に緑のラベル（矢印は青→緑のグラデーション）。横軸: 左端にオレンジの縦長ラベル、右端にローズの縦長ラベル（矢印はオレンジ→ローズのグラデーション）。交点は円の中心よりやや左上"
# 余白
margins:
