  - { level: h1-right, desc: "吊り下げパネルの見出し: 山括弧で囲んだアイコン＋短い語（約 3% H、茶）＋説明語（約 2.5% H、ブルー）＋大きな数字＋語（約 4% H、茶、キラキラ）" }
