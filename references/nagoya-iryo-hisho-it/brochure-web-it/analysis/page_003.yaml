eye_flow: "左上の見出し → 黄色の大円の中心（軸の交点）→ 上下左右の軸ラベル → 象限ごとのメモカード → 左下の本文 → 卒業生 → 右上の見出しパネル → データカード 1→2→3（バッジの番号順）→ 働き方の図（左→中→右）"
# 背景表現
background:
  - "淡い水色の地（フラット）"
  - "左の大きな黄色の円と、左上の白い円（見出し用、ページ角で切れる）が背景の役割。どちらも単色なので Layer 2"
  - "写真の重ね合わせや質感の表現はない"
# 画像のクロップ
image_crop:
  - "メモカードの写真は人物とモニターを斜めから。顔はカードの中央より上"
  - "切り抜き人物は全身で、チャートの外側（左下・右上）に立たせる"
# リズム
rhythm: "前の見開き（学科の特徴）から「この分野の仕事と将来性」へ広げる見開き。次の見開き（学科とコースの紹介）の前提を数字で示す"
# その他の所見
notes:
  - "画像は見開きを 90° 反時計回りに回した状態。読むには 90° 時計回りに回す"
  - "寸法は片ページの W・H に対する比率（物理サイズ不明）"
  - "Layer 1: 写真素材（自社写真・切り抜き）。背景の大円・白い円・軸はすべて単色で Layer 2 にできるため、全面背景の生成は不要"
  - "Layer 2: 大きな黄色の円、白い円、グラデーションの軸矢印（SVG）、軸ラベル、メモカード（画鋲と折れ角は SVG / CSS）、データカード、ロゼット型バッジ、棒・円・折れ線グラフ（SVG。値は Layer 3 のデータから生成）、吹き出し型ピル、働き方の図の箱と点線"
  - "Layer 3: 見出し、軸ラベル、職種名と説明、数字、グラフのラベルと値、出典、本文、名前と所属"
  - "IT の可視化の中心となる見開き。職種の座標チャート（分野の広がり）＋業界データの 3 カード（将来性）の構成は、自社の AI・ビジネス分野の説明（例: 縦軸と横軸に自社の分野の 2 軸を置き、自社の職種カードを配置）に最も転用しやすい。軸の意味・職種・数値はすべて自社の facts と出典付きの統計から作り直す"
  - "数値（不足人数・割合・年収）、出典名、職種の説明文、人物名・勤務先・出身校、写真は流用禁止"
