# 参考資料の解析結果（Phase 4。system/rules/references.md §4）— 資料全体
# 対象: references/nagoya-iryo-hisho-it/brochure-web-it/（page_001〜page_008、全 8 画像を目視）
# Web デザイン系・IT プログラミング系の 2 コースを持つ学科の単独パンフレット（表紙＋本文 12 ページ＋裏表紙）
# 構造だけを記述。参考資料の文章・固有名詞・数値は書き写さない（「（学科名）」「（コース名 A）」のように伏せる）
# 寸法は判型に対する比率（W = 片ページの幅、H = ページの高さ、%）。物理サイズは不明

# グリッド（段数・段間・基準線）
grid:
  basis: "片ページ単位（W×H）。72dpi の撮影画像からの目視の比率推定"
  tendency:
    - "パネル（角丸の二重線フレーム）単位で面を割る。1 ページ = 大パネル 1〜3 枚。パネル内部を 2〜3 列に割る"
    - "3 列の縦長カード（データカード・授業カード・教員カード）が繰り返し出る。列幅は均等、列間 約 2% W"
    - "図解ページでは列グリッドを外し、ページ全体を 1 つの図（座標軸チャート・ピラミッド・時間割）として使う"
    - "全面写真は 1 か所だけ（在校生の声。片ページの上半分）。他はパネル内の写真"
  page_frame: "淡い水色の地（ページ全面）→ 白い角丸パネル。後半は白地に薄い方眼紙。brochure-2 の外周帯＋地紙の 3 重構造より簡素"
  folio: "ページ番号は下端の小口側の角。青い小さな円に白抜きの数字"
  no_index_tab: "インデックスタブなし（単独学科の薄い冊子のため）"

# 余白（判型比）
margins:
  unit: "片ページの W / H に対する比率"
  top: "約 2〜4% H"
  bottom: "約 3〜5% H"
  inside: "約 3〜4% W（brochure-2 よりノド側に余裕がある）"
  outside: "約 4〜6% W"

# ガター・段間
gutter: "パネル間 約 1.5〜2% H。パネル内の列間 約 2〜3% W。カード列間 約 2% W"

# 写真の比率と使われ方
photo_ratios:
  - "PC・モニター・ノート PC に向かう人物の写真が大半（画面が写り込む作業風景）。IT を「人＋画面」で表す"
  - "矩形写真は 4:3 前後の横位置が基本（カード上部・パネル内）。角丸 小"
  - "円形写真: 表紙で太い色リング付き（直径 約 28〜38% W）、本文では小さな補助（直径 約 10〜12% W）"
  - "切り抜き人物（在校生・教員）を各見開きに 1〜4 体。吹き出しとセット"
  - "コースページだけ写真を大きく（片ページ幅の 約 60%、高さ 約 30% H）"
  - "写真の面積比は見開き平均 約 20〜30%"

# 見出し階層（相対サイズ。H = ページ高さ）
heading_hierarchy:
  - level: lead
    desc: "ピル型の吊り下げラベル（青地に白、約 1.2% H、両端に白い点）または白地＋細枠のピル（約 1.3% H）"
  - level: h1
    desc: "章見出し（約 4〜6% H）。青の和文＋強調語を茶〜オレンジ、または強調語の下に黄色のマーカー。英数字（数字・英単語）は幾何学的な丸ゴシックで和文より大きく"
  - level: display-en
    desc: "英字のディスプレイ見出し（約 5% H、青＋白フチ、キラキラ記号）。在校生の声のページだけ"
  - level: h2
    desc: "パネル見出し（約 2.5〜3% H）。左にバッジ（ペナント型・ロゼット型・円形の番号）、2 段組の見出し（小さな前置き 1 行＋大きな本文 1 行）"
  - level: tag
    desc: "左端に小さな × 型のクリップ記号を付けた青・オレンジのタブラベル（約 1.3% H）。小見出しの共通部品"
  - level: h3
    desc: "カード見出し（約 1.5〜2% H、中央揃え、色文字）"
  - level: body
    desc: "本文 約 0.9〜1% H（行長 20〜35 字）、注記 約 0.6% H"
  - level: typeface
    desc: "見出し・本文ともゴシック〜丸ゴシック。数字と英字は丸みのある幾何学的なサンセリフ。手書き風の文字は教員カードのメッセージだけ"

# 色の役割と面積比（実際の色は自社のブランドカラーを使う）
colors:
  roles:
    primary: "ブルー — 見出し・吊り下げラベル・表のヘッダ・番号バッジ・ページ番号"
    emphasis: "茶〜オレンジ — 強調語・大きな数字・チャートの主系列"
    highlight: "黄（淡黄〜レモン）— データカードの上半分、マーカー、注目セル、図解の面"
    course_coding: "コース A（デザイン系）= くすんだローズ、コース B（プログラミング系）= オリーブグリーン。バッジ・タグ・パネルの淡色地で全ページ統一"
    point_coding: "6 つのポイントにティール・オレンジ・ネイビー紫・ローズ・バイオレット・オリーブを割り当て、バッジとパネルの枠を同色に"
    ground: "淡い水色の地、白いパネル、薄い方眼紙"
  estimates_hex:
    blue: "#3b7cc0"
    brown_orange: "#c27a2c"
    yellow: "#fbe98a"
    pale_yellow: "#fdf6d0"
    rose: "#c47a92"
    olive: "#8aa64e"
    ground_blue: "#e8f1f8"
  area: "白〜淡い水色の地 約 55% / 写真 約 25% / 黄の面 約 8% / 強調色（青・茶・コース色）約 12%"
  vs_brochure_2: "同じ学校の総合パンフレット（brochure-2）のローズ主体に対し、こちらは青主体。部品の形は共通で、キーカラーだけ差し替えている"

# 罫線
rules:
  - "パネル枠: 角丸の二重線（外側の細線＋内側の細線、2 色のことも）。brochure-2 の角欠き（チケット型）ではない"
  - "吊り下げ線: ページ上端からラベル・見出しパネルへ細い縦線 2 本＋丸点（brochure-2 と共通）"
  - "図解の接続線: 細い灰色の線（直角に折れる）でラベルや時間割のセルとカードを結ぶ"
  - "区切り: パネル内の細い横線、点線の接続線（働き方の図）"

# カード
cards:
  - "データカード: 縦長、上半分が黄色地、上辺中央にロゼット（スカラップの円）の番号バッジ、下半分が白地にチャート"
  - "メモ風カード: 白い紙＋上に画鋲の丸＋右下の角が折れた形（職種チャート）"
  - "授業・教員カード: 写真＋淡色の帯＋本文、下端にコース色や役割色の帯"
  - "バッジ: ペナント型（下辺が V 字に欠けた旗形、線画アイコン＋英字ラベル＋番号）、ロゼット型、円形の番号（英字を弧状に）、盾形（コース）"
  - "吹き出し: 角丸四角＋しっぽ、雲形、楕円（白地＋細枠）"

# 情報密度
density: "中〜高。見開きの要素数 25〜45。brochure-2 よりパネル内の余白が広く、本文の文字も少し大きい"

# ページタイプ（画像ごとの対応）
page_type:
  page_001: "cover（単ページの表紙）"
  page_002: "course（見開き: 学科の特徴 6 項目）"
  page_003: "data（見開き: 職種の座標チャート＋業界の数値データ＋働き方の図）"
  page_004: "course（見開き: 学科紹介＋2 コースの紹介）"
  page_005: "course＋interview（見開き: 時間割と授業＋在校生の声）"
  page_006: "other（見開き: 教員紹介＋資格取得支援）"
  page_007: "data＋interview（見開き: 資格取得者と資格一覧＋就職支援）"
  page_008: "back-cover（単ページの裏表紙）"

# 視線誘導（資料全体の傾向）
eye_flow: "各見開きとも左上の大見出し → 図解・大きな数字 → パネルを上から下へ → 右ページ。図解のページは図の中心（軸の交点・ピラミッドの頂点）から外側へ"

# 背景表現（Layer 1 で作るべきもの）
background:
  - "淡い水色の地（グラデーションなし）。後半ページは白地に薄い方眼紙"
  - "表紙・裏表紙は白〜淡い水色の地に大小のパステル円と網点の円を散らし、上下を波形の白い帯で区切る"
  - "在校生の声のページは全面写真の上に白い角丸パネルを重ね、その下の余白に淡い水色の斜めストライプ"
  - "職種チャートは大きな黄色の円（片ページ幅の 約 85%）を背景にする。単色なので Layer 2 で作れる"

# 画像のクロップ
image_crop:
  - "PC 作業の写真は、人物の顔とモニター（またはノート PC）が同時に入る斜めの構図。画面の中身は判読できない程度"
  - "コース写真はパネル右側で裁ち落とし気味に大きく、人物 2 人の笑顔を中央に"
  - "切り抜き人物は腰上〜全身。指さし・手を広げるポーズで隣の情報を示す"

# ページ間のリズム
rhythm:
  sequence: "表紙 → 特徴 6 項目（概要）→ 職種と業界データ（なぜこの分野か）→ 学科とコース（何を学ぶか）→ 時間割と在校生の声（どう学ぶか）→ 教員と資格支援（誰が支えるか）→ 資格と就職（どうなれるか）→ 裏表紙"
  pattern: "図解・データ中心の左ページと、写真・人物中心の右ページを組み合わせる見開きが多い（5〜6、7〜8 ページ）"
  missing: "本文はノンブル 1〜12。表紙裏・裏表紙裏は画像に含まれない"

