# 参考資料の解析結果（Phase 4）— references/nagoya-iryo-hisho-it/brochure-web-it/page_005.jpg
# 見開き（本文 7〜8 ページ: 左 = 1 年次の時間割と授業 3 つ / 右 = 在校生の声）。寸法は片ページ比

# グリッド
grid:
  left: "上 約 8% H: タブラベル＋大見出し、右に円形の注記バッジと円形写真 2 点。中 約 42% H: 時間割の表（5 曜日列＋時限列、8 行）。下 約 45% H: 授業カード 3 列（均等、約 29% W）、各カードの下に切り抜き人物の顔"
  timetable: "左端の時限列 約 5% W（番号）＋時間列 約 7% W、曜日列 各 約 15% W。ヘッダ行 約 3% H、各行 約 5% H。1 つの授業が 2 行分のセルにまたがる"
  right: "上 約 48% H: 全面写真（ノド側・上端・小口側まで）。写真の左側に白い角丸パネル（約 45% W）を重ねる。下 約 50% H: 写真カード 3 列（均等）、その下に 2 つのボックス（約 35:60）"
# 余白
margins:
  top: "左 約 3% H ／ 右 0（写真は裁ち落とし）"
  bottom: "約 3% H"
  inside: "約 3% W（右の写真はノドまで）"
  outside: "左 約 4% W ／ 右 写真部 0、下部 約 4% W"
# ガター・段間
gutter: "授業カードの列間 約 2% W、写真カードの列間 約 3% W"
# 写真の比率
photo_ratios:
  - "右上: 全面写真（約 4:3 の横位置、片ページ面積の 約 48%）。人物は右寄り、腰上の正面"
  - "授業カードの写真 3 点（約 5:4、カード幅いっぱい）。すべて PC・モニターに向かう人物"
  - "写真カード 3 点（約 4:3、白フチ）、ボックス内の写真 2 点"
  - "切り抜き人物: 授業カードの下に 3 体（胸上）、右下に 1 体（全身）"
  - "円形写真 2 点（直径 約 11% W、左上）"
  - "写真の面積比 約 40%"
# 見出し階層
heading_hierarchy:
  - { level: tag, desc: "× 型クリップ付きのタブラベル（ブルー、約 1.2% H、学科名を伏せる部分）" }
  - { level: h1-left, desc: "大見出し（約 4.5% H、ブルー、記号の & だけ小さく）" }
  - { level: badge, desc: "オレンジのスカラップ円バッジ（直径 約 12% W）に白抜きの注記 5 行" }
  - { level: table-head, desc: "時間割のヘッダ: ブルー地に白の英字小文字の曜日（約 1.3% H）。オンラインの日だけオレンジの小ピル" }
  - { level: cell, desc: "授業名（約 1% H）＋説明 2 行（約 0.6% H）。注目の授業は淡黄のセルに大きめの授業名" }
  - { level: card-title, desc: "授業カードの授業名（約 1.6% H、カードごとにローズ・灰・灰の色文字）＋小見出し 2 行（約 1.3% H、色文字）" }
  - { level: display-en, desc: "右: 英字のディスプレイ見出し 2 行（1 行目 約 3.5% H、2 行目 約 5% H、ブルー＋白フチ、キラキラと流れ星）。上に傾けたピル（学科名を伏せる部分）" }
  - { level: lead-right, desc: "白パネル内のリード 2 行（約 1.5% H、ブルー、中央揃え）" }
  - { level: photo-tag, desc: "写真カードの左上に少し傾けたブルーのタグ（約 1.4% H）＋右上に小さな吹き出し" }
  - { level: body, desc: "本文 約 0.95% H（右の白パネル内は約 10 行）" }
# 色
colors:
  roles:
    primary: "ブルー（時間割のヘッダと時限列・見出し・タグ・英字見出し）"
    highlight: "淡黄（注目の授業セル・授業カードの名前の帯）"
    accent: "オレンジ（注記バッジ・オンラインのピル）、授業名のローズ"
    neutral: "休みの列は灰色地、昼休みのセルは薄い灰色の文字"
    ground: "白地（左）、右下は淡い水色地に白い斜めストライプ"
  estimates_hex: { blue: "#3a7cc4", header_blue: "#4a86c8", cell_yellow: "#fdf6cf", orange_badge: "#d97a1e", rose_text: "#c0607a", stripe_blue: "#d8e8f6" }
  area: "写真 約 40% / 白 約 35% / 淡黄・淡青の面 約 15% / 強調色 約 10%"
# 罫線
rules:
  - "時間割: 細い灰色の格子。注目セルは細い灰色の枠を太めにして浮かせる"
  - "注目セルから下の授業カードへ細い灰色の接続線（縦に下ろす）"
  - "授業カード: 細い灰色の枠の角丸。下辺の中央に吹き出しのしっぽ（下の人物の発言として読ませる）"
  - "右下のボックス: 細いブルーの枠の角丸"
# カード
cards:
  - "授業カード: 写真＋淡黄の帯に授業名＋小見出し＋本文 3 行。カードの下端がしっぽになり、切り抜き人物と線画アイコン（本・PC・機器）を添える"
  - "白い角丸パネル（右上、写真の上）: 英字見出し＋リード＋本文＋名前"
  - "写真カード 3 枚: 白フチの写真＋傾いたタグ＋吹き出し＋本文 3 行"
  - "外部プログラムの紹介ボックス（流用禁止のロゴ部分あり）、行事のボックス（タグ＋写真＋切り抜き人物）"
# 情報密度
density: "高（左: 時間割のセル 約 40＋カード 3）。右は写真が大きく、文字量は中"
# ページタイプ
page_type: interview
# 視線誘導
eye_flow: "左上の見出し → 時間割（曜日の列を左から右、時限を上から下）→ 黄色のセル → 接続線に沿って下の授業カード → 切り抜き人物 → 右上の全面写真の顔 → 英字見出し → 本文 → 下の写真カード 3 枚 → ボックス"
# 背景表現
background:
  - "左: 白地（フラット）"
  - "右上: 全面写真が背景。白いパネルを写真の左側（人物と重ならない位置）に重ね、パネルの後ろに淡い水色の斜めストライプ（パネルの縁から少しはみ出す）"
  - "右下: 淡い水色の地に白の太い斜めストライプとキラキラ記号"
# 画像のクロップ
image_crop:
  - "全面写真は人物を右寄りに置き、左側の空き（ぼけた室内）にパネルを載せる"
  - "授業カードの写真は人物の横顔とモニター／ノート PC を斜めから"
  - "切り抜き人物は胸上で、カードの下端からのぞくように配置"
# リズム
rhythm: "学び方の見開き。左が表（時間割＝構造）、右が人（在校生の声＝感情）。前の学科紹介を具体化し、次の教員・資格支援へ"
# その他の所見
notes:
  - "画像は見開きを 90° 反時計回りに回した状態。読むには 90° 時計回りに回す"
  - "寸法は片ページの W・H に対する比率（物理サイズ不明）"
  - "Layer 1: 右上の全面写真（自社写真。パネルを載せる空きのある構図を撮る or 選ぶ）、授業・写真カードの写真、切り抜き人物（自社写真）、右下のストライプ（単純なので CSS の repeating-linear-gradient でも可）"
  - "Layer 2: 時間割の格子（データから生成する表組み）、注目セルの塗り、接続線、授業カード（しっぽ付き）、白いパネル、傾いたタグ、吹き出し、注記バッジ"
  - "Layer 3: 見出し、英字見出し、曜日・時限・時間、授業名と説明、本文、名前、注記"
  - "IT の可視化: 時間割の表そのものを図として見せ、注目の授業（プログラミング・グラフィック・Web 制作）を色で抜き出してカードで解説する。授業名の羅列より「週の中の位置」が伝わる。AI・ビジネスの時間割にも同じ型が使える"
  - "授業名・時間・人物名・出身校・外部サービス名・写真は流用禁止"
