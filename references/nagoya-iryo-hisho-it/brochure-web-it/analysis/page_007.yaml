# 参考資料の解析結果（Phase 4）— references/nagoya-iryo-hisho-it/brochure-web-it/page_007.jpg
# 見開き（本文 11〜12 ページ: 左 = 資格取得者の声と取得できる資格の一覧 / 右 = 就職支援）。寸法は片ページ比

# グリッド
grid:
  left: "上 約 45% H: 淡黄のパネルにタブラベル＋体験談 2 列（均等）。中 約 37% H: 淡い水色のパネルに見出し＋資格カード（全幅 1 枚＋2 列×2 段）。下 約 12% H: 淡黄のボックス（切り抜き人物＋見出し＋本文 2 行）"
  right: "上 約 12% H: 吊り下げのピル＋大見出し。中 約 45% H: ブルー枠の大パネル（左 35%: 大きな数字＋注記＋ドーナツグラフ / 右 65%: タブラベル＋帯見出し＋3 列の支援内容＋小さな図・ロゴ風ボックス＋地元就職の帯）。下 約 38% H: 淡黄のパネル（左上に円形バッジ、見出し帯、右上にイラストバッジ、本文 3 行、3 人の切り抜き人物と吹き出し・役割ラベル）"
# 余白
margins:
  top: "約 3% H"
  bottom: "約 4% H"
  inside: "約 3% W"
  outside: "約 4% W"
# ガター・段間
gutter: "体験談の列間 約 3% W、資格カードの列間 約 2% W / 段間 約 1.5% H、パネル間 約 2% H"
# 写真の比率
photo_ratios:
