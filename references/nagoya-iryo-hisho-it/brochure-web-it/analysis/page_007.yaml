  - "左下: 切り抜き人物 1 体（腰上、資格の証書を持つ）"
  - "右下: 切り抜き人物 3 体（全身〜腰上、中央の学生が最大）"
  - "右中: 写真なし（数字・グラフ・簡略地図・図解）"
  - "写真の面積比 約 25%"
