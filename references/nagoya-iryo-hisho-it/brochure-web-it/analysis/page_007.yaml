heading_hierarchy:
  - { level: tag, desc: "× 型クリップ付きのタブラベル（ブルー、約 1.4% H）" }
  - { level: testimonial, desc: "体験談: 名前（約 1.2% H）＋見出し 2 行（約 1.8% H、ブルー、中央揃え）＋本文 7 行＋下部の白いボックスに円形ラベル（ブルー）と資格名 2 行" }
  - { level: h2-left, desc: "資格一覧の見出し（約 2.5% H、ブルー＋強調語は袋文字）＋左に証書の線画アイコン" }
  - { level: cert-card, desc: "資格名（約 1.8% H、ブルー）＋括弧の区分（オレンジ）＋認定団体（約 0.8% H）＋細い線＋説明 3 行" }
  - { level: h1-right, desc: "大見出し（約 4.5% H、ブルー。強調語を黄色のマーカーの上に袋文字）" }
  - { level: big-number, desc: "大きな数字（約 7% H、ブルー、小数と % は約 50%）＋上に淡い水色のラベル 2 行" }
  - { level: badge, desc: "左下パネルの円形バッジ（ブルー、直径 約 17% W）に数字と短い語" }
  - { level: role, desc: "役割ラベル（ローズ・ブルー・グリーンの角丸の色面に白抜きのピル＋名前）" }
  - { level: body, desc: "本文 約 0.95% H、注記 約 0.6% H" }
