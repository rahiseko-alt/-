# 情報密度
density: "高。見開きで要素 約 40、右ページは brochure-2 の 2 見開き分の内容を 1 ページに圧縮しているため特に密"
# ページタイプ
page_type: data
# 視線誘導
eye_flow: "左上のタブ → 体験談の写真 2 枚 → 見出し → 本文 → 資格一覧の見出し → 資格カード（全幅 → 2×2）→ 下の切り抜き人物 → 右上の大見出し → 大きな数字 → ドーナツ → 3 列の支援内容 → 下段の円形バッジ → 中央の学生 → 左右の担当と吹き出し"
# 背景表現
background:
  - "白地に薄い方眼紙（両ページ）"
  - "淡黄と淡い水色のパネルの面が背景の色のリズムを作る。質感・写真の背景はない"
# 画像のクロップ
image_crop:
  - "体験談の写真は 2 人組の腰上。背景の壁の大きな文字は判読できないボケ"
  - "右下の切り抜き 3 人は中央の学生を一番高い位置に、担当 2 人を左右の下に置き、手で中央を示すポーズ"
# リズム
rhythm: "本文の最後の見開き（資格と就職＝出口）。右ページは総合パンフレット（brochure-2 の page_001・page_002）の就職支援の部品を青に差し替えて再構成している。次は裏表紙"
# その他の所見
notes:
  - "画像は見開きを 90° 反時計回りに回した状態。読むには 90° 時計回りに回す"
  - "寸法は片ページの W・H に対する比率（物理サイズ不明）"
  - "Layer 1: 体験談の写真、切り抜き人物（自社写真）、方眼紙（薄いテクスチャ、CSS でも可）"
  - "Layer 2: 淡色パネル、二重線パネル、点線の区切り、ドーナツグラフ（SVG）、資格カード、円形バッジ、役割ラベル、吹き出し、簡略地図・図解（SVG）"
  - "Layer 3: 見出し、名前、体験談の本文、資格名・区分・認定団体・説明、大きな数字と注記、支援内容の箇条書き、役割名"
  - "同じ部品（大きな数字＋3 列の支援＋循環する人物配置）を学科別と総合の 2 冊で使い回している。自社でも shared/components に部品化し、色をブランド変数で切り替える構成が向く"
  - "資格名・団体名・人物名・勤務先・数値・外部サービスのロゴ・写真は流用禁止"
