# 比較用の補正指定（Phase 5 / npm run ref:prep。system/rules/references.md §4）
# 見開き（就職実績のデータページ）の写真。90° 反時計回りに倒れて保存されているので時計回りに 90° 回し、
# 左ページ（大数字・地図・ランキング・求人データの 3 段パネル）だけを切り出す
image: references/nagoya-iryo-hisho-it/brochure-2/page_001.jpg
rotate: 90
# 左上・右上・右下・左下（回転後の画像 2309×1716px に対する比率。x / 2308, y / 1715）
corners:
  - [0.0178, 0.0]
  - [0.5117, 0.0]
  - [0.5013, 1.0]
  - [0.0191, 1.0]
aspect: 0.7071
height_px: 2000
notes: >-
  四隅は回転後の画像の画素の実測。左辺（小口）は外周の水色帯の外端（x = 41〜44px でほぼ垂直）、右辺はノドの谷線
  （最も暗い列。y = 0 で x = 1180、y = 1700 で x = 1157 と斜め）。天と地は撮影範囲の外にはみ出しているため、上下の辺は画像の上端・下端で止めた。
  外周帯の幅が四辺で同じ（小口側で実測 57px ≒ 10mm）とすると、天は 約 30〜50px、地は 約 45px（合計でページ高の 約 4〜5%）が写っていない。
  このため補正画像は縦に 約 4〜5% 引き伸ばされ、上下の帯が細く見える。
  ほかに 4 点の射影補正では取り除けないゆがみが 2 つ残る:
  (1) 紙の反りによる縦のせん断。水平であるはずのパネルの横線が上半分で右上がり 約 2.5°（傾き −0.045）、下に行くほど小さくなり地ではほぼ水平
  (2) ノド側の圧縮。円形の写真の縦横比が、ページ中央（x ≒ 900px）で 0.95、ノド寄り（x ≒ 1055px）で 0.88。ノド側の 約 15% が強く縮んで写るため、
  補正画像では中央の要素が 5〜10mm ノド側へずれて見える。
  判型は A4 縦とした（同じ資料の裏表紙 page_009 は紙の端が全部写っており、紙の端の縦横比 0.685 を円の縦横比 0.96 で補正すると 0.71）。
  books/replica/b-data が使用
