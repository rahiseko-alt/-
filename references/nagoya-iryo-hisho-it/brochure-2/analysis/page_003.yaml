# 参考資料の解析結果（Phase 4）— references/nagoya-iryo-hisho-it/brochure-2/page_003.jpg
# 見開き（左: 在校生の成長ストーリー / 右: 業界別の卒業生カード 6 件）。寸法は片ページ比

# グリッド
grid:
  left: "上 約 45% H: 大判写真（片ページ幅いっぱい）。下 約 55% H: 左下→右上に上昇する帯状の矢印を軸に、4 枚のカードを上下交互に配置（自由配置）"
  right: "上 約 20% H: 章見出し＋リード 2 行（中央揃え）。下 約 77% H: 3 列×2 段のカードグリッド（列幅 均等 約 28% W、段間 約 2% H）"
# 余白
margins:
  top: "左: 0（写真は上端・小口側で裁ち落とし）／ 右: 約 3% H"
  bottom: "約 4% H"
  inside: "約 2% W"
  outside: "左ページ 写真部は 0（裁ち落とし）、下部 約 5% W ／ 右ページ 約 9% W（インデックスタブ列を含む）"
# ガター・段間
gutter: "カードの列間 約 2% W、段間 約 2% H"
# 写真の比率
photo_ratios:
  - "左: 大判の人物写真 1 点（横位置 約 3:2、片ページ面積の 約 45%）。屋外・緑の背景、腰上の正面"
  - "左: 円形写真 4 点（直径 約 13% W）をカードの間に、切り抜き人物 1 体（左下）"
  - "右: カード上部の写真 6 点（約 1:0.85 のほぼ正方形の横位置）。仕事中の人物（PC・窓口・保育・介護の場面）"
  - "右: 見出し横の小さな切り抜き人物 1 体＋吹き出し"
# 見出し階層
heading_hierarchy:
  - { level: h1-left, desc: "写真上の白い楕円プレートに英字の筆記体サブ（約 1% H）＋和文の見出し（約 3.5% H、暖色グラデの袋文字）＋所属と名前（約 0.8% H）" }
  - { level: catch-left, desc: "写真の下部に白抜きのキャッチ 4 行（約 2.2% H、行間広め、薄い影）" }
  - { level: h1-right, desc: "ブラケット囲みの章見出し（約 4.5% H）。並列の語を 1 語ずつ別の色（5 色）にし、中黒でつなぐ。末尾の語だけ最大" }
  - { level: card-tag, desc: "カード左上の色付き四角タグ（約 1% H、白文字 2 文字）＋円形バッジ（学科・年度、約 0.6% H）" }
  - { level: card-title, desc: "カード下部の見出し 2 行（約 1.4% H、中央揃え、カード色の濃い文字）" }
  - { level: timeline-card, desc: "タイムラインのカード: リボン型の色帯見出し（約 1.4% H）＋2 行の小見出し（約 1.3% H、色文字）＋本文" }
  - { level: body, desc: "本文 約 0.85% H、5〜6 行" }
# 色
colors:
  roles:
    primary: "ローズ（写真の枠線・タイムラインの終点・見出しの暖色）"
    category: "カードごとに業種色を割り当て（ローズ・ブルー・グリーン・黄緑・オレンジ・ブルー）。タグ・カード下部の地・見出し文字が同じ色系"
    timeline: "矢印の帯を 4 色に分割（グリーン→山吹→ブルー→ローズ）。各段階のカード見出しも同じ色"
    ground: "外周の淡い水色帯＋白い方眼紙"
  estimates_hex: { rose: "#c4466f", blue: "#4a78b8", green: "#6aa04c", orange: "#e08a2c", mustard: "#e3a640", card_tint: "#eef4ea" }
  area: "写真 約 35%（左上の大判が大きい）/ 白地 約 40% / カードの淡色地 約 15% / 強調色 約 10%"
# 罫線
rules:
  - "左: 大判写真に細いローズの枠線（下辺・ノド側）"
  - "左: 矢印の帯とカードを結ぶ細い接続線（灰色、直角に折れる）"
  - "右: カードは枠線なし、淡色地のみ。カード内の区切り線なし"
# カード
cards:
  - "右: 縦長カード（角丸 小、影なし）。上段: 白地にタグ＋バッジ＋所属・名前、中段: 写真（カード幅いっぱい）、下段: 淡色地に見出し 2 行＋本文 5 行"
  - "左: 白地の角丸カード（細い色枠）。上にリボン型の色帯見出し、左右に小さなキラキラ"
  - "吹き出し: 雲形（白地）1 個、楕円 1 個"
# 情報密度
density: "高。右: カード 6 件×（タグ・所属・名前・見出し・本文 5 行）。左: カード 4 枚＋写真 5 点＋装飾"
# ページタイプ
page_type: interview
# 視線誘導
eye_flow: "左上の大判写真の人物の顔 → 写真上の見出し → キャッチ 4 行 → 矢印の起点（左下）から終点（右上）へ段階順にカード → 右ページの章見出し → カード 3 列×2 段（左上→右上→左下→右下）"
# 背景表現
background:
  - "左上の写真が実質的な背景（屋外・緑のぼけ）。写真の上に白い楕円プレートと白抜き文字"
  - "下部・右ページは外周の水色帯＋白い方眼紙"
  - "装飾: クリップボード・ペン・流れ星・祝いの札などの線画イラスト、キラキラ記号"
# 画像のクロップ
image_crop:
  - "大判写真は上端と小口側で裁ち落とし、人物を中央やや右に置き、左側の空き（ぼけた背景）に文字を載せる"
  - "カード写真は仕事中の横顔・斜め向き。顔をカードの中心線よりやや上に"
  - "円形写真は 2〜3 人のスナップ（イベント・授業）"
# リズム
rhythm: "章 3 見開き目（人物の見開き）。前の見開きの図解・一覧から一転して写真の比率を上げる。左の 1 人の物語（縦の時間軸）と右の 6 人の並列（横の比較）の対"
# その他の所見
notes:
  - "画像は見開きを 90° 反時計回りに回した状態。読むには 90° 時計回りに回す"
  - "寸法は片ページの W・H に対する比率（物理サイズ不明）"
  - "Layer 1: 左上の大判写真（自社写真。文字を載せる空きを確保した構図）、地紙、カードの写真（自社写真）"
  - "Layer 2: 写真上の楕円プレート、4 色に分割した上昇矢印（SVG。帯の太さは 約 4% H）、接続線、カード（タグ・バッジ・淡色地）、吹き出し"
  - "Layer 3: 見出し、キャッチ、カードの所属・名前・年度・見出し・本文、段階ラベル"
  - "右のカードは CSS グリッドの繰り返し部品にできる（データ: カテゴリ色・タグ・所属・名前・写真・見出し・本文）。本文量の差を下段の淡色地が吸収する構造にする"
  - "人物名・勤務先・出身校・業種の固有表現・写真は流用禁止"
