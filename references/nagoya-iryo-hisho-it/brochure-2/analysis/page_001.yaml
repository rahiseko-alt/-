# 参考資料の解析結果（Phase 4）— references/nagoya-iryo-hisho-it/brochure-2/page_001.jpg
# 見開き（左: 実績の数値 / 右: 就職先一覧）。寸法は片ページの W・H に対する比率

# グリッド
grid:
  left: "パネル 3 段（上 約 30% H: 実績数値＋地図の 2 列 55:45 / 中 約 23% H: ランキング一覧＋丸写真 3 点の 2 列 65:35 / 下 約 30% H: 求人データと輩出数の 2 パネル横並び 50:50）。最上部 約 13% H が章見出し"
  right: "1 枚の大パネル（ネイビー枠）。上段 約 62%: 地域別 4 列の一覧、下段 約 38%: 学科別 4 列の一覧。各列の頭にグループ見出し"
# 余白
margins:
  top: "約 3% H（左はパネル開始まで 約 15% H、見出し領域を含む）"
  bottom: "約 4% H"
  inside: "約 2〜3% W"
  outside: "左ページ 約 6% W ／ 右ページ 約 9% W（インデックスタブ列を含む）"
# ガター・段間
gutter: "パネル間 約 1.5% H。一覧の列間 約 1.5〜2% W。パネル内余白 約 3% W"
# 写真の比率
photo_ratios:
  - "円形（1:1）6 点。直径 約 14〜17% W。中段パネルの右に 3 点を斜めに連ね、下段に 3 点を散らす"
  - "全身の切り抜き人物 1 点（縦長 約 1:2.5）。下段パネルの左外へはみ出す"
  - "右ページは写真なし"
# 見出し階層
heading_hierarchy:
  - { level: lead, desc: "小リード 1 行＋キラキラ記号（約 1.2% H）" }
  - { level: h1, desc: "3 色ブラケット囲みの章見出し（約 4% H）。濃紺＋強調語 2 つが暖色（白フチ＋影）" }
  - { level: label, desc: "淡ピンクの色面ラベル 2 行（約 2% H）。2 行目の方が大きく強調色" }
  - { level: hero-number, desc: "大数字（約 9% H）、ローズ。小数・％ は 約 50%。下に括弧書きの補足 1 行（約 1.2% H）" }
  - { level: h2, desc: "淡グリーン地のラベル見出し（約 2.5% H）、淡黄地のラベル見出し 2 行（約 2.5% H）" }
  - { level: list, desc: "ランキング・データ行（約 1.3% H）＋右端の数値（約 1.5% H）" }
  - { level: h2-right, desc: "右ページはネイビーのピル型バーに白文字（約 2% H）、その下に細いバー（約 1.4% H）" }
  - { level: body, desc: "一覧の文字 約 0.6% H（極小）。注記 約 0.6% H" }
# 色
colors:
  roles:
    primary: "ローズ（大数字・上段パネル枠・ラベル地）"
    secondary: "ネイビー（右ページの枠・バー・行頭記号・見出し文字）"
    accents: "グリーン（中段パネル枠と見出し帯）、山吹と淡黄（下段左）、ピンク（下段右）。吹き出しはパステル各色"
    ground: "外周の淡い水色帯＋白い方眼紙"
  estimates_hex: { rose: "#c4466f", navy: "#3f5a9c", green: "#8db35c", pale_yellow: "#fdf0b0", map_green: "#9cb36a", band: "#d6e6f3" }
  area: "白地 約 65% / パステル面 約 15% / 強調色 約 10% / 写真 約 10%（左ページのみ）"
# 罫線
rules:
  - "パネル枠: 色線（ローズ・グリーン・ネイビー）、角欠きの角丸"
  - "吊り下げ線: 各パネル見出しから上辺へ細い縦線 2 本＋丸点"
  - "ドットリーダー: ランキングとデータ行の項目名と数値の間"
  - "下段 2 パネルの間に細い縦の区切り線"
# カード
cards:
  - "角欠き角丸パネル 3 段（左）、大パネル 1 枚（右）"
  - "雲形吹き出し 5 個（地図の周りに放射状）。淡色地＋色フチ、2〜3 行の短文"
  - "切り抜き人物の頭上に楕円の吹き出し 1 個"
# 情報密度
density: "高。左: 要素 約 20、文字量 中。右: 極小文字の一覧が約 400 行（文字量が非常に多い）"
# ページタイプ
page_type: data
# 視線誘導
eye_flow: "左上の章見出し → 大数字 → 地図と吹き出し → ランキング（上から下）→ 下段の 2 つのデータ → 右ページ上のネイビーバー → 一覧（左列→右列、上段→下段）"
# 背景表現
background:
  - "外周の淡い水色帯＋白い方眼紙（細く薄い格子）"
  - "右ページ一覧の背後に薄いグレーの線画（人物と建物）を透かしで敷く"
  - "地図は単色の簡略シルエット＋赤い点（拠点）。写真的な表現はない"
# 画像のクロップ
image_crop:
  - "円形写真は人物の顔〜胸元（PC 作業・接客の場面）。円の中心より上に顔"
  - "全身切り抜きは足元まで入れ、パネル枠の外に立たせる"
# リズム
rhythm: "章の最初の見開き。左が数字で引きつけ、右が一覧で裏付ける「インパクト→根拠」の対。次の見開き（支援体制）へ続く"
# その他の所見
notes:
  - "画像は見開きを 90° 反時計回りに回した状態。読むには 90° 時計回りに回す。72dpi の撮影画像で、右ページ小口側がやや湾曲"
  - "寸法は片ページの W・H に対する比率（物理サイズ不明。A4 縦相当と推定、未確認）"
  - "Layer 1: 外周帯＋方眼紙の背景、右ページの線画の透かし（文字なしで生成）、円形・全身の写真（自社写真）"
  - "Layer 2: 角欠きパネル、吊り下げ線、雲形吹き出し、ピル型バー、日本地図シルエット（SVG）、ドットリーダー、インデックスタブ"
  - "Layer 3: 見出し、大数字と補足、ランキング、データ表、一覧の全文字、注記、ページ番号、タブ文字。一覧は facts から生成し、列が文字量に追従する構造にする"
  - "一覧・注記の文字が非常に小さい（約 0.6% H）。自社版では最小サイズ規定を守り、件数を絞るか段数を増やす"
  - "数値・校名・病院名・企業名・人物名は流用禁止（「（大数字 %）」「（就職先 N 件）」のように伏せて再現する）"
