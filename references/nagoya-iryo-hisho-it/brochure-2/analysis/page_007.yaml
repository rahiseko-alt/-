# 参考資料の解析結果（Phase 4）— references/nagoya-iryo-hisho-it/brochure-2/page_007.jpg
# 見開き（オープンキャンパスの案内: 1 日の流れ・よくある質問・体験メニュー・個別参加・オンライン参加）。寸法は片ページ比

# グリッド
grid:
  spread: "見開きを 3 段に分ける。上 約 32% H: 左はヒーロー（大見出し＋集合の切り抜き）、右は 2 パネル横並び。中 約 38% H: 4 ステップの流れを見開き全幅に横一列（左ページ 2 ステップ＋右ページ 2 ステップ、矢印で連結）＋左下に誘導文、右下に Q&A 帯。下 約 25% H: 左ページ 1 パネル（全幅）、右ページ 2 パネル（45:55）"
  step_box: "各ステップ: 円形の時刻バッジ（直径 約 6% W）＋見出し＋本文＋写真 2〜3 点。箱の幅 約 42% W"
# 余白
margins:
  top: "約 2% H（ヒーローの見出しは上端近くまで）"
  bottom: "約 3% H"
  inside: "約 2% W（流れの矢印はノドをまたぐ）"
  outside: "約 4〜5% W"
# ガター・段間
gutter: "ステップ間 約 3% W（矢印を置く）。段間 約 2% H"
# 写真の比率
photo_ratios:
  - "上段左: 5 人の集合の切り抜き（腰上、横幅 約 70% W）"
  - "ステップ内: 矩形写真（約 4:3、角丸、白フチ）と円形写真（直径 約 10% W）"
  - "体験メニュー: 6 点の格子（3 列×2 段、約 4:3、下にラベル帯）"
  - "各パネルに全身・半身の切り抜き人物（スタッフ役の在校生）を 1 体ずつ"
  - "写真の面積比 約 35%"
# 見出し階層
heading_hierarchy:
  - { level: h1, desc: "ヒーロー見出し 2 行（1 行目 約 6% H、2 行目 約 4.5% H）。暖色グラデーション＋白フチ＋影、白い雲形プレートの上" }
  - { level: ribbon, desc: "斜めに傾けた黄色のリボンに英字（約 1% H）" }
  - { level: tab, desc: "段の見出しタブ（ローズの角丸、約 2% H）" }
  - { level: step-head, desc: "時刻バッジ内の数字（約 2% H、白）＋ステップ名（約 1.8% H、色文字）＋補足（約 1% H）" }
  - { level: h2, desc: "パネル見出し（約 2.5〜3% H）。色付き袋文字、強調語だけ大きく" }
  - { level: qa, desc: "Q / A の小さな色バッジ＋問い（約 1.1% H）＋答え（約 1.1% H）" }
  - { level: body, desc: "本文 約 0.9% H、吹き出し 約 0.9% H" }
# 色
colors:
  roles:
    steps: "ステップごとに色を変える（山吹 → グリーン → ティール → ラベンダー）。時刻バッジ・箱の枠・見出し文字を同色"
    panels: "上段右: 黄緑（メッセージアプリ登録）とティール（先輩の声）。下段: ラベンダー（個別参加）、山吹（体験メニュー）、水色（オンライン）"
    accent: "ローズ（タブ・Q&A の帯）、矢印はティール"
    ground: "パステルの斜めパッチワーク（ピンク・水色・黄・ラベンダーの大きな色面を斜めに重ねる）"
  estimates_hex: { mustard: "#d99a2c", green: "#7aa83c", teal: "#5a9c96", lavender: "#8b84c4", rose: "#c4466f", sky: "#7fb0de", patch_pink: "#f6dde4", patch_blue: "#dce9f6", patch_yellow: "#fbf1c8" }
  area: "パステルの地とパネル 約 45% / 写真 約 35% / 白い箱 約 10% / 強調色 約 10%"
# 罫線
rules:
  - "ステップの箱: 色枠の角丸＋上辺に時刻バッジが半分はみ出す"
  - "ステップ間の太い矢印（右向き、色面）"
  - "パネル枠: 色線の角丸（角欠きではない）"
# カード
cards:
  - "ステップ箱、Q&A のカード（白地＋細枠、Q と A を縦に並べる）"
  - "体験メニューのタイル: 写真＋下端の色帯ラベル（白文字）"
  - "QR ボックス（白い角丸）、チェックリスト（チェック記号付きの行）"
  - "吹き出し: 雲形・楕円・角丸（白地＋色フチ）を多数"
# 情報密度
density: "非常に高。見開きで要素 約 60、写真 約 20 点"
# ページタイプ
page_type: other
# 視線誘導
eye_flow: "左上のヒーロー見出し → 集合写真の顔 → 段のタブ → 4 ステップを左から右へ（矢印に沿って見開きを横断）→ 右上のパネル → 下段の 3 パネル"
# 背景表現
background:
  - "パステルの斜めパッチワーク（大きな色面が斜めに重なる。境目はくっきり、テクスチャなし）"
  - "パネルは白〜淡色で地から浮かせる。影なし"
  - "装飾: 流れ星・音符・キラキラ記号（線画）"
# 画像のクロップ
image_crop:
  - "集合写真は横一列の切り抜き。左端と右端の人物はポーズで外向きに開く"
  - "ステップ内の写真は場面の説明（受付・説明会・体験・見送り）"
  - "切り抜き人物をパネルの右端・左端から少しはみ出させる"
# リズム
rhythm: "オープンキャンパス 2 見開きの 1 つ目（概要と流れ）。次の見開き（日程カレンダー）へ「体験の中身 → いつ行けるか」の順で続く"
# その他の所見
notes:
  - "画像は見開きを 90° 反時計回りに回した状態。読むには 90° 時計回りに回す"
  - "寸法は片ページの W・H に対する比率（物理サイズ不明）"
  - "Layer 1: パステルの斜めパッチワーク背景（文字なしで生成。単色の多角形の重なりなので SVG でも可）、写真素材（自社写真・切り抜き）"
  - "Layer 2: ステップの箱、時刻バッジ、矢印、パネル、タイル、Q&A カード、吹き出し、リボン"
  - "Layer 3: 見出し、時刻、ステップ名と本文、Q&A、メニュー名、QR、案内文"
  - "見開きを横断する 4 ステップは、ノドに矢印が来ないよう 2+2 で左右に振り分けている（ノドで文字を切らない配慮）"
  - "時刻・日程・人物名・出身校・メッセージアプリやサービスの名称は流用禁止"
