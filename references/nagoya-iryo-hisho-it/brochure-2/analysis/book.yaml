# 参考資料の解析結果（Phase 4。system/rules/references.md §4）— 資料全体
# 対象: references/nagoya-iryo-hisho-it/brochure-2/（page_001〜page_009、全 9 画像を目視）
# 構造だけを記述。参考資料の文章・固有名詞・数値は書き写さない（「（学校名）」のように伏せる）
# 寸法は判型に対する比率（W = 片ページの幅、H = ページの高さ、%）。物理サイズは不明

# グリッド（段数・段間・基準線）
grid:
  basis: "片ページ単位（W×H）。見開き写真の実測ではなく目視の比率推定"
  tendency:
    - "パネル（角欠き角丸フレーム）単位で面を割る入れ子構成。ページを 2〜4 段のパネルに分け、パネル内部を 2〜4 列に割る"
    - "一覧系は 4〜5 列（就職先・実習先）、カード系は 3 列×2 段、カレンダーは 4 列×4 段、Q&A は 2 列×2 段＋3 列×1 段"
    - "見開き全体を 1 つの面として使うのは章扉的な見開き（支援制度・オープンキャンパス）だけ。それ以外は左右ページで独立した組み"
    - "写真ページでも矩形の段組より、丸写真・切り抜き人物・吹き出しを自由配置する傾向が強い（グリッドから外れる要素が多い）"
  page_frame: "ページ外周にパステル色の帯（約 3% W）→ 内側に角丸の地紙（白い方眼紙またはドット地）→ その上にパネル、という 3 重構造が全ページ共通"
  index_tab: "右ページの小口側に縦長ピル型のインデックスタブ（幅 約 4% W、高さ 約 20% H、章名を縦書き）。左ページにはない"
  folio: "ページ番号は下端の小口側の角。小さな円またはハート形の色面に数字"

# 余白（判型比）
margins:
  unit: "片ページの W / H に対する比率"
  top: "約 2〜4% H（地紙の端からパネルまで）"
  bottom: "約 3〜4% H"
  inside: "約 2〜3% W（ノド側ぎりぎりまでパネルを寄せる。製本の食い込みを考えると攻めた設定）"
  outside: "左ページ 約 5〜8% W ／ 右ページ 約 8〜10% W（インデックスタブの列を含む）"
  note: "外周のパステル帯（約 3% W）は塗り足しまで伸びる色面。文字はその内側の地紙の上だけに置かれる"

# ガター・段間
gutter: "パネル間 約 1.5〜2% H（縦方向）／ 約 1.5% W（横方向）。パネル内の列間 約 2% W。一覧の列間は 約 1.5% W と狭い"

# 写真の比率と使われ方
photo_ratios:
  - "円形（1:1）の切り抜きが最多。直径 約 12〜20% W。パネルの角や見出しの横に重ねる"
  - "全身・半身の切り抜き人物（背景を抜いた在校生・教員）が各見開きに 2〜6 体。パネルの外へはみ出させて奥行きを作る"
  - "矩形写真は 4:3 前後の横位置（カード・施設写真・体験メニュー）と、縦長カードの上部写真（約 5:4）"
  - "大判写真は 1 か所だけ（成長ストーリーの人物写真。片ページの上半分 約 45% H）"
  - "写真の面積比は見開き平均 約 15〜25%。文字・図版の比率が高い資料"

# 見出し階層（相対サイズ。H = ページ高さ）
heading_hierarchy:
  - level: lead
    desc: "見出し上の小リード 1 行（約 1.2% H）。前後にキラキラ記号。またはピル型の英字ラベル（約 1% H）を吊り下げ"
  - level: h1
    desc: "章見出し（約 4〜5% H）。3 色の角括弧（ブラケット）で囲むか、白い雲形プレートに載せる。2 色の和文で、強調語だけ暖色＋白フチ＋薄いドロップシャドウ"
  - level: hero-number
    desc: "実績の大数字（約 8〜10% H）。極太の丸ゴシック、強調色 1 色。小数部・単位は 約 50%"
  - level: h2
    desc: "パネル見出し（約 2〜3% H）。色面ラベル（角丸）・ピル型バー・円形の色面に白抜きのキーワード＋袋文字のカタカナ語などパネルごとに意匠を変える"
  - level: h3
    desc: "カード見出し・グループ見出し（約 1.3〜1.8% H）。2 行に分けて中央揃え、色文字"
  - level: body
    desc: "本文 約 0.8〜0.9% H（行長 15〜25 字）。一覧・注記は 約 0.5〜0.7% H まで小さくなる"
  - level: typeface
    desc: "見出しは太い丸ゴシック系、数字は幾何学的な丸ゴシック。本文はゴシック。明朝は使っていない。手書き風・ポップ体の装飾文字を一部に併用"

# 色の役割と面積比（実際の色は自社のブランドカラーを使う）
colors:
  roles:
    primary: "ローズ（くすんだマゼンタ）— 大数字・強調ラベル・パネル枠・ページ番号"
    secondary: "ネイビーブルー — 一覧系パネルの枠・ピル型バー・行頭記号"
    accents: "グリーン、山吹（オレンジ寄りの黄）、ラベンダー、水色 — パネル・カテゴリの色分け"
    highlight: "淡黄色 — マーカー下線、1 位の帯、注目パネルの地"
    ground: "セクションごとに外周帯の色を変える（就職: 淡い水色／学校生活・支援: 淡いピンク＋細かい水玉／オープンキャンパス: パステルの斜めパッチワーク）"
  estimates_hex:
    rose: "#c4466f"
    navy: "#3f5a9c"
    green: "#8db35c"
    mustard: "#e3a640"
    lavender: "#8b84c4"
    pale_yellow: "#fdf3b5"
    band_blue: "#d6e6f3"
    band_pink: "#f4d7df"
  area: "地紙（白〜ごく淡い色）約 55〜65% / パステルの面（パネル地・吹き出し・帯）約 15〜20% / 強調色（文字・枠・ラベル）約 8〜12% / 写真 約 15〜20%"
  rule_of_thumb: "1 見開き＝強調色 1 色＋サブ 2〜3 色。カテゴリ（学科・業種・制度）ごとに色を割り当て、同じカテゴリは全ページで同じ色"

# 罫線
rules:
  - "パネル枠: 中太（約 0.3〜0.5% W 相当の太さ）の色線。角は内側にえぐれた角欠き（チケット型）が基本"
  - "吊り下げ表現: パネル上辺やページ上端から見出しラベルへ細い縦線 2 本＋端の丸点（吊り看板）。資料全体の識別子"
  - "ドットリーダー（項目名と数値をつなぐ点線）、列の区切りの点線"
  - "カードの接続線（細線）: タイムラインやフロー図とカードを結ぶ"

# カード
cards:
  - "角欠き角丸パネル（塗りはごく淡いパステル、影なし、枠線あり）"
  - "縦長カード: 上に色タグ＋丸バッジ、中央に写真、下に淡色地の見出し＋本文（3 列×2 段で並べる）"
  - "吹き出し: 雲形（スカラップ）、楕円、角丸四角＋しっぽ。淡色塗り＋色フチ、または白地＋色フチ"
  - "番号バッジ: 盾形（英字の弧状ラベル＋数字）、円形の時刻バッジ、ロゼット"
  - "角丸の色面ラベル、ピル型のタグ（カテゴリ・役割）"

# 情報密度
density: "高。1 見開きの要素数 25〜60、文字量も多い（一覧・カレンダー・料金表）。余白は少なく、隙間をイラスト・キラキラ記号・吹き出しで埋める"

# ページタイプ（画像ごとの対応）
page_type:
  page_001: "data（見開き: 実績の数値＋就職先一覧）"
  page_002: "other / 就職支援の仕組み（見開き: 循環図＋3 列の支援内容＋一覧）"
  page_003: "interview（見開き: 成長ストーリー＋卒業生カード 6 件）"
  page_004: "other / 支援制度（page_005 と同じ見開きの斜め撮り・上端欠け。解析は page_005 を正とする）"
  page_005: "other / 支援制度（見開き: 3 つの支援を番号付きパネルで）"
  page_006: "data＋access（見開き: アンケート円グラフ Q&A＋施設写真＋周辺イラストマップ）"
  page_007: "other / イベント（見開き: オープンキャンパスの流れ・体験メニュー）"
  page_008: "data（見開き: 年間イベントカレンダー＋日程・補助制度の表）"
  page_009: "back-cover / access（単ページ: 路線図＋問い合わせ＋校名）"

# 視線誘導（資料全体の傾向）
eye_flow: "各見開きとも左上の章見出し → 大きな数字・人物（切り抜き）→ パネルを上から下へ → 右ページの一覧・表。数字と人物の顔で目を止め、吹き出しで横へ流す"

# 背景表現（Layer 1 で作るべきもの）
background:
  - "外周のパステル帯＋角丸の地紙（白い方眼紙、細かい水玉）"
  - "オープンキャンパスの見開きはパステルの斜めパッチワーク（大きな色面の重なり）"
  - "裏表紙は淡色地に大小のパステル円と網点の円を散らす"
  - "背景そのものは静かで、装飾は前景（Layer 2 の枠・吹き出し）に寄せている"

# 画像のクロップ
image_crop:
  - "人物は切り抜き（全身・半身）か円形トリミングが中心。顔を円の中心よりやや上に置く"
  - "矩形写真は裁ち落としせず、角丸＋白フチでパネル内に収める（例外: 成長ストーリーの大判写真）"
  - "切り抜き人物はパネルの枠をまたいで重ね、紙面に立体感を出す"

# ページ間のリズム
rhythm:
  sequence: "（資料の後半部分）就職の章 4 ページ（実績→支援→卒業生）→ 学校生活の章（支援制度→Q&A・周辺マップ）→ オープンキャンパス 4 ページ（流れ→日程）→ 裏表紙"
  pattern: "数字・一覧の見開きと人物の見開きを交互に置く。各章は「インパクトのある数字・人物」→「根拠となる一覧・表」の順"
  missing: "ノンブル上は 54〜69 ページ＋裏表紙。62〜63 ページの見開きは画像に含まれない"
  section_coding: "章ごとに外周帯の色とインデックスタブの色を切り替える（青系→ピンク系→パステル混色）"

# その他の所見
notes:
  scan_condition:
    - "全画像が 72dpi の写真（スキャンではなく撮影）。文字レイヤーなし"
    - "page_001〜page_008 は見開き（左右 2 ページ）を 90° 反時計回りに回した状態で保存されている。読むには 90° 時計回りに回す"
    - "page_009 は単ページ（裏表紙）で、横長画像に 90° 反時計回りで入っている"
    - "page_004 は page_005 と同じ見開きの斜め撮り（上端の見出しが切れ、指が写り込み、左下がぼける）。比較用には使わない"
  units: "寸法はすべて判型に対する比率（W・H の %）。見開きの縦横比から A4 縦相当と推定するが未確認"
  reuse_across_editions: "学科別パンフレット（brochure-web-it）と裏表紙・就職支援の部品を共有し、キーカラーだけ差し替えている（ピンク版／青版）。部品化して色を変数にする設計の参考になる"
  do_not_use:
    - "ライセンスキャラクターのイラスト（支援制度・周辺マップの見開きに登場）。構造の参考にもしない"
    - "写真・ロゴ・校名・学科名・人物名・企業名・病院名・数値・制度名・URL・電話番号・SNS アカウント名"
  layer_split_summary:
    layer1: "外周帯＋地紙のテクスチャ、パッチワーク背景、円と網点の散らし（裏表紙）、写真素材（自社写真）"
    layer2: "角欠きパネル、吊り下げ線、吹き出し、ピル型バー、番号バッジ、インデックスタブ、地図・路線図の簡略図形、円グラフ、カレンダーの格子、タイムラインの矢印"
    layer3: "見出し・数字・一覧・表・注記・ページ番号・QR・連絡先（すべて company-data 参照）"
  phase5_candidates:
    - page: page_001
      reason: "左ページは大数字・地図・ドットリーダー付きランキング・データ表と、数字中心の紙面の典型。Layer 1 は地紙だけで、Layer 2/3 の再現精度（数字のサイズ・行揃え・パネル枠）を測りやすい。右ページは多段の一覧を facts から流し込む検証になる"
    - page: page_003
      reason: "右ページの卒業生カード 3 列×2 段は、インタビュー・卒業生紹介に繰り返し使える部品の検証に最適。左ページは大判写真＋矢印タイムライン＋接続線付きカードで、写真（Layer 1）と図形（Layer 2）の重ね合わせを試せる"
    - page: page_007
      reason: "時刻バッジ＋矢印で 4 段階をつなぐ流れ図、Q&A、体験メニューの写真グリッドなど、自社のオープンキャンパス紙面にそのまま使える構造。パッチワーク背景は Layer 1 生成の練習にもなる"
    - page: page_005
      reason: "（予備）見開きをまたぐ番号付きパネル＋色分けされた 3 制度。料金表・段階表のタイポグラフィ検証向き。キャラクターと外部連絡先の部分は除外して再現する"
