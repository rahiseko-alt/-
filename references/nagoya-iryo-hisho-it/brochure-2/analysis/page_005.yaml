# 参考資料の解析結果（Phase 4）— references/nagoya-iryo-hisho-it/brochure-2/page_005.jpg
# 見開き（3 つの支援制度: 学費・学習・生活。番号付きパネルで色分け）。寸法は片ページ比

# グリッド
grid:
  spread: "見開きを 1 つの面として使う。上 約 55% H: 支援 1 のパネルが見開きをまたぐ（左右で中身は分かれる）。下 約 45% H: 左ページ全幅に支援 2、右ページに支援 3（約 62% W）＋縦長ボックス（約 30% W）"
  left_top: "最上部 約 10% H: 英字ピルのラベル（吊り下げ）＋円形アイコン 3 個＋リード 1 行"
  right_top: "最上部 約 12% H: 白い雲形プレートに章見出し＋右上にキャラクターのイラスト（流用禁止）"
  inner: "支援 1 の左: 制度表（左 55%）＋金額の段階表（右 45%）、その下に体験談 2 件（横並び）。支援 1 の右: 2 つの見出し帯＋本文の 2 列、体験談 1 件、制度ボックス 2 つ。支援 2: 2 列×2 段。支援 3: 1 列（本文＋写真＋連絡先＋QR）"
# 余白
margins:
  top: "約 3% H"
  bottom: "約 4% H"
  inside: "約 1〜2% W（支援 1 のパネルはノドをまたいで連続）"
  outside: "左ページ 約 5% W ／ 右ページ 約 8% W（インデックスタブ列を含む）"
# ガター・段間
gutter: "上下のパネル間 約 2% H、下段のパネル間 約 1.5% W、パネル内の列間 約 3% W"
# 写真の比率
photo_ratios:
  - "体験談の切り抜き人物 3 体（半身〜全身、約 15% H）"
  - "円形写真 2 点（直径 約 12% W、支援 2 の列の右）"
  - "建物の矩形写真 1 点（約 4:3）、冊子表紙のサムネイル 1 点（縦位置）"
  - "写真の面積比は 約 10%。図表と文字が主体"
# 見出し階層
heading_hierarchy:
  - { level: label, desc: "英字のピル型ラベル（約 1% H、ローズ地に白のイタリック）を吊り下げ" }
  - { level: h1, desc: "章見出し（約 5% H）。数字＋和文、暖色グラデーション文字、白い雲形プレートの上" }
  - { level: support-head, desc: "支援見出し（約 3.5% H）: 盾形の番号バッジ（英字を弧状に＋数字）→ 線画アイコン → 円形の色面に白抜きのキーワード 2 文字 → 袋文字のカタカナ語" }
  - { level: burst, desc: "赤い雲形バーストに黄色の大きな数字（約 4% H）" }
  - { level: h2, desc: "制度名（約 2.5% H、ローズ）、色帯見出し（ローズ・ブルー・グリーンのピル／角丸帯、白文字 約 1.6% H）" }
  - { level: tier, desc: "段階表の行: 区分名（約 1.5% H）＋金額（約 2.2% H、行ごとに色を変える）＋補足（約 1% H）" }
  - { level: body, desc: "本文 約 0.85% H、注記 約 0.6% H" }
# 色
colors:
  roles:
    primary: "ローズ（支援 1・章見出しの周辺・タブ）"
    section_coding: "支援 1 = ローズ、支援 2 = ブルー、支援 3 = グリーン、補足ボックス = ネイビー寄りの紫。枠線・見出し帯・番号バッジを同じ色で統一"
    accent: "赤（バースト）＋黄（数字）、淡黄（段階表の地）、段階表の金額は 5 色の多色"
    ground: "淡いピンクの外周帯＋細かい水玉の地（白い方眼紙ではない）"
  estimates_hex: { rose: "#c03e6a", burst_red: "#c8203a", blue: "#4a86c8", green: "#7aa83c", purple: "#5a5a9c", pink_ground: "#f6dde4", yellow: "#fff6a8" }
  area: "ピンク地＋白パネル 約 70% / 強調色（帯・枠・バッジ）約 15% / 写真 約 10% / 淡黄 約 5%"
# 罫線
rules:
  - "パネル枠: 支援ごとの色で中太の線、角丸（角欠きではない）。支援 1 は二重線に近い太さ"
  - "制度表の行区切りは細い点線"
  - "吊り下げ線（ラベル）"
# カード
cards:
  - "制度ボックス: 淡ピンク地＋ローズ枠の角丸。段階表ボックス: 淡黄地＋淡黄枠"
  - "体験談: 色付き四角タグ（盾の下辺が尖った形）＋楕円の白い吹き出し（色フチ）＋本文 5 行＋切り抜き人物"
  - "黄色の円バッジ（割合の数字）を 2 つの見出し帯の間に重ねる"
  - "連絡先ボックス: 淡グリーン地にフリーダイヤル表記と電話番号、右に QR"
# 情報密度
density: "非常に高。見開きで要素 約 50、金額・制度名・注記が多い"
# ページタイプ
page_type: other
# 視線誘導
eye_flow: "右上の章見出し → 左上の支援 1 の見出しと赤いバースト → 段階表（上から下）→ 体験談 → 右の制度帯 → 下段の支援 2 → 支援 3 → 右端の補足ボックス"
# 背景表現
background:
  - "淡いピンクの地に細かい水玉（ドット）のテクスチャ。外周帯との境目なく全面"
  - "白いパネルが地から浮く。影なし"
  - "右上のキャラクターイラストは構造上「章見出しの横のマスコット枠」。自社版では使わない（必要なら自社のイラスト素材）"
# 画像のクロップ
image_crop:
  - "切り抜き人物は腰上〜全身、吹き出しの横に立たせる"
  - "円形写真は人物の胸上（授業・ビジネスマナーの場面）"
# リズム
rhythm: "学校生活の章の最初の見開き。外周帯がピンクに変わり、章の切り替えを色で示す。前の就職の章（青系）から暖色へ"
# その他の所見
notes:
  - "画像は見開きを 90° 反時計回りに回した状態。読むには 90° 時計回りに回す。page_004 は同じ見開きの斜め撮り（使わない）"
  - "寸法は片ページの W・H に対する比率（物理サイズ不明）"
  - "Layer 1: ピンクの水玉地（文字なしで生成。または CSS の radial-gradient でも可）、写真素材（自社写真）"
  - "Layer 2: 見開きをまたぐパネル（左右ページで枠線がノドで連続するよう座標を合わせる）、番号バッジ、円形のキーワード色面、赤い雲形バースト（SVG）、色帯見出し、段階表の格子、吹き出し、QR の枠"
  - "Layer 3: 見出し、金額・割合、制度名、本文、注記、電話番号・QR（自社の値）、ページ番号、タブ文字"
  - "金額・割合・制度名・団体名・電話番号・住所・URL・キャラクターは流用禁止"
  - "支援 1〜3 の色分け（枠・帯・バッジを同色）は、自社の制度紹介に転用しやすい色の割り当て方"
