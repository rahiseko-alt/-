# 参考資料の解析結果（Phase 4）— references/nagoya-iryo-hisho-it/brochure-2/page_008.jpg
# 見開き（左: 年間のイベントカレンダー / 右: 特別イベントの日程・説明会・交通費補助・予約手順）。寸法は片ページ比

# グリッド
grid:
  left: "上 約 18% H: 見出しエリア（手描き風バースト＋大見出し＋サブ見出しの帯＋切り抜き人物）＋開催時間の行＋凡例 2 行。下 約 78% H: 月別カレンダー 4 列×4 段（最終段は 2 か月分＋別枠のボックス）"
  right: "上 約 30% H: 特別イベントパネル（日程の羅列＋写真タイル 3+4 の 2 段）。中 約 20% H: イベント説明ボックス 3 列。次 約 32% H: 補助制度パネル（2 列の説明＋地域別の料金表）。下 約 13% H: 予約手順（3 ステップの円＋矢印）＋QR 2 点＋電話"
  calendar_cell: "1 か月 = 7 列×6 行の格子。月名の黄色タブ（約 3% H）＋曜日の色付きヘッダ行＋日付セル（約 2.8% W × 2.3% H）"
# 余白
margins:
  top: "約 3% H"
  bottom: "約 3% H"
  inside: "約 2% W"
  outside: "約 4〜5% W"
# ガター・段間
gutter: "カレンダーの間 約 1% W / 1.5% H（狭い）。右ページのボックス間 約 1.5% W"
# 写真の比率
photo_ratios:
  - "右上: 写真タイル 7 点（横長 約 2:1）。左に色面の帯（約 40%）を重ね、その上にイベント名"
  - "左上: 腰上の切り抜き人物 1 体（見出しの右）"
  - "写真の面積比 約 8%（表と日程が主体）"
# 見出し階層
heading_hierarchy:
  - { level: burst, desc: "手描き風の放射線に囲まれた斜めの短いラベル（約 1.8% H、ローズ）" }
  - { level: h1, desc: "大見出し（約 5.5% H、暖色グラデーション＋白フチ）＋ローズの帯に白抜きのサブ見出し（約 2.5% H）＋括弧付きの補足 1 行" }
  - { level: legend, desc: "凡例: 色の四角＋ラベル（約 1.2% H）、線画アイコン＋ラベル" }
  - { level: month, desc: "カレンダーの月名（約 1.8% H、黒、数字だけ大きく）" }
  - { level: date, desc: "日付の数字（約 1% H）。イベント日はセルを色で塗り白抜き数字、斜めに 2 色を分割するセルもある" }
  - { level: h2-right, desc: "右ページのパネル見出し（約 2.5% H、色付き袋文字）＋右側にリード 2 行" }
  - { level: schedule, desc: "日付の羅列（約 1.4% H、日付と曜日の小さな丸記号）" }
  - { level: body, desc: "本文 約 0.9% H、料金表と注記 約 0.6% H" }
# 色
colors:
  roles:
    coding: "イベントの種類を 4 色（ローズ・グリーン・ブルー・ネイビー）で塗り分け、凡例と完全に一致させる"
    calendar: "月名タブは淡黄、曜日ヘッダは灰色地（日曜はローズ、土曜はブルーの文字）"
    panels: "右上: 淡グリーン、中: 白〜淡ラベンダー、補助制度: 淡オレンジ、予約: 白＋ローズの帯"
    photo_tiles: "写真タイルのイベント名の帯を学科・領域ごとの色（ローズ・紫・青・ティール・オレンジ・グリーン・茶）で塗る"
    ground: "パステルの斜めパッチワーク（前の見開きと連続）"
  estimates_hex: { rose: "#b8325e", green: "#6f9a3a", blue: "#5a8ad0", navy: "#3a4f96", tab_yellow: "#fbe98a", orange_panel: "#f8dfb8" }
  area: "白い格子 約 45% / パステルの地とパネル 約 30% / イベントの色塗り 約 10% / 写真 約 8% / 文字 残り"
# 罫線
rules:
  - "カレンダーは細い灰色の格子線。外枠は角丸の太め（白フチ＋影なし）"
  - "料金表は細い罫の表組（地域見出しは色帯）"
  - "予約手順は円をつなぐ太い矢印"
# カード
cards:
  - "カレンダーカード（角丸、白地、上辺に黄色の月名タブ）× 14"
  - "イベント説明ボックス（白〜淡色地の角丸、線画アイコン＋見出し＋本文＋日程）"
  - "写真タイル（角丸 小、色帯を重ねる）"
  - "丸バッジ（回数制限・事前申込）、雲形の吹き出し"
# 情報密度
density: "非常に高。カレンダー 14 か月分の日付セル 約 600、日程の羅列、料金表。文字が最も小さい見開き"
# ページタイプ
page_type: data
# 視線誘導
eye_flow: "左上のバーストと大見出し → 凡例 → カレンダーを月順（左→右、上→下）→ 右上の特別イベント → 説明ボックス 3 列 → 補助制度 → 下の予約手順（ステップ 1→3）→ QR・電話"
# 背景表現
background:
  - "パステルの斜めパッチワーク（前の見開きと同じ）"
  - "カレンダー・パネルが白で地から浮く。背景の装飾は流れ星の線画程度"
# 画像のクロップ
image_crop:
  - "写真タイルは横長に強くトリミングし、左側を色帯で覆って右側の人物・作業だけ見せる"
  - "切り抜き人物は指さしのポーズで見出しを示す"
# リズム
rhythm: "オープンキャンパス 2 見開きの 2 つ目（いつ・どう申し込むか）。資料本文の最後の見開きで、次は裏表紙"
# その他の所見
notes:
  - "画像は見開きを 90° 反時計回りに回した状態。読むには 90° 時計回りに回す"
  - "寸法は片ページの W・H に対する比率（物理サイズ不明）"
  - "Layer 1: パステルの斜めパッチワーク背景、写真タイルの写真（自社写真）"
  - "Layer 2: カレンダーの格子（年月からコードで生成。セルの色塗りはイベントデータから）、月名タブ、凡例の色四角、パネル、料金表の罫、予約手順の円と矢印、バースト（SVG）"
  - "Layer 3: 見出し、日付、凡例ラベル、日程、本文、料金、注記、QR、電話・メール（すべて自社データ）"
  - "カレンダーは手作業で組まず、日付とイベント種別の YAML から生成する部品にすべき（毎年の更新が日常編集になる）"
  - "日付・時間・金額・地名・会場名・電話番号・メールアドレスは流用禁止"
