# 参考資料の解析結果（Phase 4）— references/nagoya-iryo-hisho-it/brochure-2/page_002.jpg
# 見開き（左: 2 人の教員による就職支援の循環図 / 右: 生涯サポート 3 列＋地元就職支援＋実習先一覧）。寸法は片ページ比

# グリッド
grid:
  left: "上 約 18% H: 章見出し＋リード 3 行。下 約 80% H: 淡黄の大パネル 1 枚。パネル内は中央の円（人物）を軸にした放射状の自由配置（左右対称に近い 3 列: 吹き出し＋写真 / 人物 / 吹き出し＋写真）"
  right: "パネル 3 段（上 約 55% H: 3 列 均等＋各列に縦の点線区切り / 中 約 15% H: ラベル＋2 列 / 下 約 25% H: ラベル＋5 列の一覧）"
# 余白
margins:
  top: "約 3% H"
  bottom: "約 4% H"
  inside: "約 2〜3% W"
  outside: "左ページ 約 6% W ／ 右ページ 約 9% W（インデックスタブ列を含む）"
# ガター・段間
gutter: "右ページの 3 列の間 約 2% W（点線の区切り）。パネル間 約 1.5% H"
# 写真の比率
photo_ratios:
  - "左: 全身の切り抜き人物 3 体（中央の学生が最大 約 30% H、左右下の教員 約 25% H）"
  - "左: 矩形写真 2 点（約 4:3 横位置、約 25% W）を吹き出しの下に"
  - "右: 半身の切り抜き人物 3 体（上段パネルの左上と右上、見出しの両脇）"
  - "右: 写真は少なく、簡略地図・ロゴ風のボックス・図解イラストが中心"
# 見出し階層
heading_hierarchy:
  - { level: lead, desc: "小リード＋キラキラ記号（約 1.2% H）" }
  - { level: h1, desc: "ブラケット囲みの章見出し（約 4% H）。後半の強調語が暖色の袋文字" }
  - { level: badge, desc: "左上のローズの円形バッジ（直径 約 17% W）。中に大きな数字（約 4% H）＋上下に短い語" }
  - { level: banner, desc: "パネル上部のローズの帯見出し 2 行（約 2.5% H、白文字）。吊り下げ線付き" }
  - { level: h2-right, desc: "ネイビーのピル型バー（小）＋2 行の大見出し（約 3% H、2 行目は黄緑の袋文字で強調）" }
  - { level: h3, desc: "列見出し: ネイビーの台形タブ（約 1% H）＋2 行の見出し（約 2.5% H、主語だけ強調色）" }
  - { level: body, desc: "吹き出し内・説明 約 0.9% H、箇条書き 約 1.1% H、一覧 約 0.6% H" }
# 色
colors:
  roles:
    primary: "ローズ（左のバッジ・帯見出し・矢印・下段パネル枠）"
    secondary: "ネイビー（右上パネル枠・タブ・ピル）"
    accents: "グリーン（中段パネル）、淡黄（左パネル地）、水色・黄の吹き出し、役割ラベルの青と山吹"
    ground: "外周の淡い水色帯＋白い方眼紙"
  estimates_hex: { rose: "#c4466f", navy: "#3f5a9c", green: "#6f9f6a", panel_yellow: "#fdf6d8", bubble_blue: "#dbe9f6", bubble_yellow: "#fbe9c8" }
  area: "淡黄パネル地 約 35%（左）/ 白地 約 40% / 強調色 約 10% / 写真・切り抜き 約 15%"
# 罫線
rules:
  - "左: 中央の人物を囲む 3 本の弧状矢印（ローズ、太め）で循環を表す。弧に沿って文字を配置"
  - "右上パネルの列区切りは縦の点線"
  - "吊り下げ線（帯見出し・ラベル）、パネル枠は角欠き角丸"
# カード
cards:
  - "吹き出し: 角丸四角＋しっぽ（淡青・淡黄の塗り、文字 5 行）、楕円の白い吹き出し（色フチ）"
  - "役割カード: 白地＋細枠、上にピル型の役割ラベル（青・山吹）、名前、本文 5 行"
  - "右: 灰色の角丸ボックス（ロゴ＋説明）、淡黄のボックス（入学→卒業の図解）、星形バッジ（八角形の黄色）"
# 情報密度
density: "高。左: 要素 約 15、文字量 中。右: 要素 約 30、箇条書きと一覧で文字量 多"
# ページタイプ
page_type: other
# 視線誘導
eye_flow: "左上の円形バッジと章見出し → 帯見出し → 中央の学生（円の上）→ 左右の教員と吹き出し（循環矢印に沿って時計回り）→ 右上の大見出し → 3 列（左→右）→ 中段 → 下段の一覧"
# 背景表現
background:
  - "外周の淡い水色帯＋白い方眼紙"
  - "左パネルは淡黄のフラットな面、中央に淡ピンクの大きな円（人物の足元の台座）"
  - "装飾は小さなキラキラ記号・流れ星・本のイラスト（線画）"
# 画像のクロップ
image_crop:
  - "人物は全身切り抜き。中央の学生は円の上に立たせ、教員は円の左右下で学生を指し示すポーズ"
  - "矩形写真は角丸なし・白フチ、吹き出しのしっぽの先に置く"
# リズム
rhythm: "章 2 見開き目。前の見開き（数字）を受けて「仕組み」を図解する。人物の循環図（左）と支援の一覧（右）で、図解→詳細の対"
# その他の所見
notes:
  - "画像は見開きを 90° 反時計回りに回した状態。読むには 90° 時計回りに回す"
  - "寸法は片ページの W・H に対する比率（物理サイズ不明）"
  - "Layer 1: 背景（外周帯＋方眼紙）、人物の切り抜き写真・矩形写真（自社写真）"
  - "Layer 2: 淡黄パネル、台座の円、弧状矢印（SVG）、吹き出し、役割カード、ピル・タブ、点線の列区切り、簡略地図、入学→卒業の図解（矢印と人物アイコンは SVG かシンプルなイラスト素材）"
  - "Layer 3: 見出し、バッジ内の数字、吹き出しの本文、名前と役割、箇条書き、一覧、注記"
  - "右ページのロゴ・検索窓風ボックス・外部サービス名は流用禁止。構造（ロゴ＋説明の灰色ボックス）だけ参考にする"
  - "循環図は「1 人の学生を複数の担当が支える」構造の図解として汎用性が高い（自社の支援体制の説明に転用できる）"
