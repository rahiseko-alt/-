# 参考資料の解析結果（Phase 4）— references/nagoya-iryo-hisho-it/brochure-2/page_009.jpg
# 単ページ（裏表紙: 路線図によるアクセス・問い合わせ窓口・校名）。寸法はページの W・H に対する比率

# グリッド
grid:
  structure: "1 列・3 段。上 約 45% H: 路線図（中央に校舎イラスト）。中 約 37% H: ピル型の帯見出し＋窓口カード 3 列（左 2 列は縦長カード、右列は 3 段の横長カード）＋電話番号。下 約 15% H: 波形の白い帯に校名ブロック（中央揃え）"
  columns: "窓口カード 3 列の比率 約 28:28:44"
# 余白
margins:
  top: "約 3% H（路線図の上端）"
  bottom: "約 2% H（校名ブロックの下）"
  left: "約 10% W"
  right: "約 10% W"
  note: "表紙・裏表紙は単ページなのでノド・小口ではなく左右で記述"
# ガター・段間
gutter: "窓口カードの間 約 1.5% W。右列の横長カードの間 約 1% H"
# 写真の比率
photo_ratios: "写真なし。校舎は簡略イラスト、SNS とアプリはアイコン、各カードに QR"
# 見出し階層
heading_hierarchy:
  - { level: badge, desc: "左上のローズの大きな円（直径 約 20% W）に白抜き 4 行（参照ページの案内、約 1.5% H、最終行の数字だけ大きく）" }
  - { level: callout, desc: "右上の吹き出し型ボックス: ローズのピル見出し（約 1.2% H）＋箇条書き 2 項目（約 1.1% H）" }
  - { level: map-label, desc: "駅名ラベル（約 1.2% H、灰色の角丸ピル／白地ピル）、路線名（約 1.2% H、縦書きを含む）、所要時間の白い円（約 1% H、分の数字だけ大きく）" }
  - { level: bar, desc: "ローズのピル型の帯見出し（約 2% H、白抜き、字間を広く取る）" }
  - { level: card-head, desc: "窓口カードの見出し（約 1.6% H、色文字）＋補足 2 行（約 1% H）" }
  - { level: phone, desc: "電話番号（約 4% H、ローズ、幾何学的な数字）＋受付時間 1 行（約 1% H）" }
  - { level: school-name, desc: "校名（約 2.5% H、黒の太いゴシック）＋法人名・認定の小さな行（約 0.8% H）＋住所と電話・FAX の行（約 1% H）" }
# 色
colors:
  roles:
    primary: "ローズ（円バッジ・帯見出し・電話番号・現在地の駅ラベル・吹き出しの見出し）"
    neutral: "灰色（路線の線・駅ラベル）、白（カード・波形の帯）"
    decoration: "パステルの円（ピンク・水色・黄緑・黄・青）と網点の円を地に散らす"
    ground: "淡いピンクの地"
  estimates_hex: { rose: "#b8456e", ground: "#f7e6ea", line_gray: "#707070", dot_green: "#b8dc90", dot_blue: "#9cd0f0", dot_yellow: "#f6cc40" }
  area: "淡ピンクの地 約 55% / 白（カード・帯）約 30% / ローズ 約 7% / 路線の灰色 約 5% / パステル円 約 3%"
# 罫線
rules:
  - "路線は灰色の太線（直角と 45° の折れ線）。路線図は実際の地図ではなく模式図"
  - "カードは枠線なし（白地のみ、角丸 小）"
  - "下端の白い帯の上辺は波形（スカラップ）"
# カード
cards:
  - "窓口カード: 白地の角丸。左 2 枚は縦長（見出し・補足・ロゴまたはアプリアイコン・QR・検索窓風の枠）、右 3 枚は横長（アイコン・名称・アカウント名・QR）"
  - "吹き出し型ボックス（白地＋ローズの細枠、しっぽで校舎を指す）"
  - "所要時間の白い円（直径 約 9% W）× 6"
# 情報密度
density: "中。要素 約 30。文字量は少ないが QR・ラベルが多い"
# ページタイプ
page_type: back-cover
# 視線誘導
eye_flow: "左上のローズの円 → 中央の校舎イラスト → 路線と所要時間（放射状）→ 右上の吹き出し → 帯見出し → 窓口カード（左→右）→ 電話番号 → 下端の校名"
# 背景表現
background:
  - "淡いピンクの地に、大小のパステルの円（塗り）と網点の円を不規則に散らす。円の一部は端で切れる"
  - "下端の波形の白い帯（Layer 2 の SVG で作れる）"
# 画像のクロップ
image_crop: "該当なし（写真なし）。円の装飾は紙面の端で裁ち落とす"
# リズム
rhythm: "資料の最後（裏表紙）。学科別パンフレット（brochure-web-it/page_008）と同じ型でキーカラーだけ違う（こちらはピンク）"
# その他の所見
notes:
  - "画像は単ページを 90° 反時計回りに回した状態（横長の画像）。読むには 90° 時計回りに回す"
  - "寸法はページの W・H に対する比率（物理サイズ不明）"
  - "Layer 1: 淡ピンクの地＋パステル円と網点の散らし（文字なしで生成。または SVG）"
  - "Layer 2: 路線図（SVG。線・駅ピル・所要時間の円・校舎アイコン）、吹き出し型ボックス、円バッジ、帯見出し、窓口カード、波形の帯"
  - "Layer 3: 駅名・路線名・所要時間、アクセスの案内文、窓口の見出し、アカウント名、QR（qr ヘルパーで自社 URL から生成）、電話番号、校名・住所（facts 参照）"
  - "路線名・駅名・所要時間・電話番号・住所・URL・SNS アカウント名・ロゴ・校名は流用禁止。路線図は自社のアクセスで作り直す"
  - "Phase 5 の小さな練習課題として扱いやすい（写真なし、要素が明確、色を変数化すれば両パンフレットの裏表紙を 1 部品で作れる）"
