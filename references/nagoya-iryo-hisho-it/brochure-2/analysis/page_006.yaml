# 参考資料の解析結果（Phase 4）— references/nagoya-iryo-hisho-it/brochure-2/page_006.jpg
# 見開き（左: 学校生活のアンケート Q&A と施設 / 右: 学校周辺のイラストマップと施設写真）。寸法は片ページ比

# グリッド
grid:
  left: "上 約 15% H: 英字ピルのラベル＋リード＋雲形プレートの章見出し。中 約 25%+25% H: Q&A カード 2 列×2 段。次 約 15% H: ランキングカード 3 列×1 段。下 約 25% H: 施設見出しバッジ＋施設写真（大 1＋小 2）"
  right: "上 約 70% H: 1 枚のイラストマップ（全幅）。地図の上に番号付きスポットカード 5 枚を周囲に配置＋右上に QR ボックス。下 約 25% H: 施設写真 4 列×2 段"
# 余白
margins:
  top: "約 3% H"
  bottom: "約 3% H"
  inside: "約 2% W"
  outside: "左ページ 約 5% W ／ 右ページ 約 8% W（インデックスタブ列を含む）"
# ガター・段間
gutter: "Q&A カードの間 約 2% W / 2% H。施設写真の間 約 1% W（細い白い隙間）"
# 写真の比率
photo_ratios:
  - "左: Q&A カードごとに全身の切り抜き人物 1 体（約 20% H、カード右端からはみ出す）"
  - "左下: 外観の縦長写真 1 点（約 2:3）＋教室の横長 2 点（約 4:3）、施設紹介の切り抜き人物 1 体"
  - "右: スポットカードの写真 5 点（約 4:3）、施設写真 8 点（約 4:3、角丸 小、下端中央にピル型のキャプション）"
  - "写真の面積比 約 30%"
# 見出し階層
heading_hierarchy:
  - { level: label, desc: "英字ピルのラベル（約 1% H）＋リード 1 行（約 1.3% H）" }
  - { level: h1, desc: "章見出し（約 4.5% H）。白い雲形プレートの上、2 語を別の色（ピンク・山吹）で強調、記号でつなぐ" }
  - { level: q-head, desc: "Q&A カード見出し: 盾形の番号バッジ（英字を弧状に＋数字）＋2 行の問い（約 2% H、強調語だけ色）" }
  - { level: chart-label, desc: "円グラフの区分ラベルと割合（約 1% H）。区分名と % を 2 段" }
  - { level: rank, desc: "1 位の行は黄色の帯＋王冠型の順位バッジ（約 1.5% H）、2・3 位は小さく（約 1.2% H）" }
  - { level: map, desc: "地図上のラベル（駅名・路線名など、約 1% H）、スポットカードの番号付き見出し（約 1.3% H）" }
  - { level: body, desc: "吹き出し・説明 約 0.8% H" }
# 色
colors:
  roles:
    category: "Q&A カード 4 枚をローズ・グリーン・ブルー・ラベンダーで色分け（カード地・枠・番号バッジ）"
    charts: "円グラフはネイビー（最大区分）・赤・山吹・グリーンの 4 色。全カードで同じ色順"
    map: "灰色の道路、黒白の鉄道記号、緑の地下道ルート、山吹の徒歩ルート（矢印）、建物アイコンはパステル"
    ground: "淡いピンクの外周帯＋水玉の地"
  estimates_hex: { navy: "#3f5a9c", red: "#c8323c", mustard: "#e3a640", green: "#7aa83c", rose_card: "#f6dfe4", green_card: "#e6f0d8", blue_card: "#dce9f6", lavender_card: "#e6e2f3" }
  area: "パステルのカード地 約 30% / 写真 約 30% / 地図の灰色と白 約 25% / 強調色 約 10%"
# 罫線
rules:
  - "カード枠: カード色の中太線、角丸"
  - "地図: 道路は灰色の太線、鉄道は白黒の縞、ルートは色付きの点線と矢印"
  - "スポットカードから地図上の位置へ引き出し線（色付きの太い三角のしっぽ）"
# カード
cards:
  - "Q&A カード: 淡色地＋色枠、盾形バッジ、円グラフ、白い角丸の補足ボックス（イラスト付き）、切り抜き人物＋吹き出し"
  - "ランキングカード: 白地＋淡色の見出し帯、1 位を黄色の帯で強調"
  - "スポットカード: 色枠の角丸、番号付き見出し、写真"
  - "施設の見出しバッジ: 大きな雲形（スカラップ）の淡色地＋色フチ"
# 情報密度
density: "非常に高。見開きで要素 約 60（グラフ 4、写真 18、地図のラベル多数）"
# ページタイプ
page_type: access
# 視線誘導
eye_flow: "左上の章見出し → Q&A カード（Z 字: 左上→右上→左下→右下）→ ランキング 3 列 → 施設 → 右ページの地図（学校の位置 → 番号順にスポット）→ 施設写真の格子"
# 背景表現
background:
  - "淡いピンクの地＋水玉（左ページ）"
  - "右は地図そのものが背景（灰色の街路・建物アイコン・木のアイコン）。写真的な質感なし"
  - "右下にキャラクターのイラスト（流用禁止）"
# 画像のクロップ
image_crop:
  - "施設写真は室内全景の広角。キャプションのピルを下端に重ねる"
  - "スポット写真は店舗の入口＋人物（生徒）の小さな集合"
  - "切り抜き人物はカードの右端から上下にはみ出す"
# リズム
rhythm: "学校生活の章の 2 見開き目。左はデータ（円グラフ）で軽く、右は地図で「場所」を見せる。62〜63 ページは画像に含まれない"
# その他の所見
notes:
  - "画像は見開きを 90° 反時計回りに回した状態。読むには 90° 時計回りに回す"
  - "寸法は片ページの W・H に対する比率（物理サイズ不明）"
  - "Layer 1: 水玉の地、写真素材（自社写真）。周辺マップは文字が多いので Layer 1 にしない"
  - "Layer 2: Q&A カード、盾形バッジ、円グラフ（SVG。値は Layer 3 のデータから描く）、ランキング帯、地図（SVG の道路・鉄道・ルート・アイコン）、スポットカードと引き出し線、雲形バッジ、写真の格子とキャプションのピル"
  - "Layer 3: 見出し、問い、グラフの区分名と割合、順位と回答、地図の地名・駅名、店舗名、施設名、QR"
  - "アンケート結果の数値、店舗名・地名・駅名・ビル名、人物名、キャラクターは流用禁止。地図は自社周辺の実データで作り直す"
