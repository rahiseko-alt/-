# 参考資料の解析結果（Phase 4）— page_001.jpg
# 内容: 印刷物 6 点を机に並べた俯瞰写真（ページではない）。画像は 90° 回転して保存されている（時計回り 90° で正位置）
# 位置は正位置での写真全体に対する比率（左上原点、幅・高さ = 1.0）。寸法は写真上の推定
# 見えている表紙の構造を記録する。固有名詞・コピー・数字は伏せる

page_type: other（キット全体の俯瞰写真。各印刷物は cover）
grid:
  photo_layout: 上段 3 点（冊子 1・チラシ 2）、下段 3 点（学校案内 2・募集要項 1）の 2 段 × 3 列。上段は写真の上端・右端で一部切れる
  items:
    - { pos: "左上 x0.03–0.25 y0.00–0.42", item: ひとり暮らし案内冊子（グループ共通）, grid: "左上 40% × 30% に角丸の標題ブロック、右上 2/3 に大判写真、左の白余白に縦組みキャッチ、下 1/3 に角丸写真 2 枚＋QR 枠、最下部 8% にグループのロゴ一覧" }
    - { pos: "中上 x0.30–0.56 y0.00–0.42（上端で切れる）", item: 季節イベントの体験会チラシ（縦型）, grid: "上 40% 見出し・日付、下 60% を 左 60%（円形写真 2 段 × 3）/ 右 40%（黄色の特典パネル）、最下部に校舎写真＋連絡先＋QR の帯" }
    - { pos: "右上 x0.58–1.00 y0.02–0.39（右端で切れる）", item: オープンキャンパスのチラシ（横型）, grid: "3 段: 上 40% 欧文見出し＋日付バッジ列（左右に人物切り抜き）/ 中 35% 体験写真グリッド＋特典の吹き出し / 下 25% 特典カード 3 枚" }
    - { pos: "左下 x0.03–0.30 y0.44–0.98", item: 学校案内（全学科版）, grid: "白い見出し帯 15% → 波形 → 淡ピンク地に円形写真 7 点＋中央のキャラクター＋上部キャッチ → 波形 → 学科名 2 行＋英字の資料名" }
    - { pos: "中下 x0.32–0.63 y0.41–0.99", item: 募集要項, grid: "左 45% の縦長パネル（天から 80%）/ 右 55% にエンブレム＋表紙目次、下 10% は全幅フッター" }
    - { pos: "右下 x0.66–1.00 y0.38–0.98", item: 学校案内（IT 系学科版）, grid: "全学科版と同じ。円形写真 4 点（対角に大小）、キャッチは中央" }
margins:
  school_guides: 左右 約 5%、天地 約 4%（表紙幅・高さに対する比率）
  admissions_guide: 左右 約 7%、天 約 6%、地 約 5%
  flyers: 約 3〜4%（地色・模様は断ち切り）
gutter:
  admissions_guide: 左パネルと右の目次の間 約 5%
  open_campus_flyer: 写真グリッドの間隔 約 1%、特典カード同士 約 1.5%
photo_ratios:
  - 学校案内（全学科版）: 1:1 の円形 7 点。直径は表紙幅の 25〜30%、色リング付き
  - 学校案内（学科別版）: 1:1 の円形 4 点。直径は表紙幅の 30〜40%（左上と右下を大きく、対角に配置）
  - ひとり暮らし冊子: 角丸矩形の大判 1 点（約 3:4、紙面の 45%）＋横長 1 点＋小 1 点
  - 縦型チラシ: 円形 6 点（直径は幅の約 18%）
  - 横型チラシ: 矩形 7〜8 点のグリッド（4:3〜3:2）＋人物の切り抜き 2 点（腰から上）
  - 募集要項: 写真なし
heading_hierarchy:
  - { item: 学校案内, h1: "学校名ロゴタイプ（極太ゴシック、表紙幅の約 75%、天に配置）", h2: "キャッチ 2 行（ゴシック Medium・字間広め・地色の同系色）", h3: "学科名（学科ごとの色）", foot: "英字の資料名＋年度（極小キャップス）" }
  - { item: 募集要項, h1: "白抜きの太ゴシック標題 2 行（パネル幅の約 80%）", h2: "標題上の小見出し・括弧書きの補足", h3: "目次の赤い中見出し 4 つ" }
  - { item: ひとり暮らし冊子, h1: "角丸ブロック内の白抜き丸ゴシック 2 行＋年度", h2: "縦組みのキャッチ 2 行" }
  - { item: チラシ, h1: "手書き風の欧文スクリプト（オレンジのグラデーション）", h2: "リボン帯・吹き出し内の丸ゴシック", data: "太い丸ゴシックの日付数字＋曜日の丸" }
colors:
  学校案内（全学科版）: "淡ピンク地 約 70% / 白（見出し帯・下端）約 25% / パステルの水玉とリング 約 5%（オレンジ・ピンク・緑・水色・青・紫・ミント）"
  学校案内（学科別版）: "淡水色地 約 70% / 白 約 25% / パステルの水玉とリング 約 5%。学科名は青、コース名はピンク"
  募集要項: "白地 約 60% / コーラルピンク〜赤（#e6607a 前後）のパネル 約 35% / 赤の見出し帯・中見出し / グレーの注意枠"
  ひとり暮らし冊子: "白地＋写真が主、ピンクの標題ブロック 約 10%、濃グレーのタブ"
  チラシ: "ラベンダー・淡ピンクのストライプや水玉の地 / 淡黄の特典パネル / オレンジ（日付・かぼちゃ）/ くすんだ紫の文字"
rules:
  - 募集要項の目次: 赤い中見出しの下に細い赤罫、項目はリーダー罫＋右揃えノンブル、項目頭に小さな黒丸
  - 募集要項の標題の上に細い破線
  - 学校案内は罫線なし。白と色地の境界は波形（スカラップ）
cards:
  - 学校案内: なし（円形写真が要素の単位）
  - 募集要項: 赤い見出し帯 1 本、グレー地の注意枠 1 つ＋細線の補足枠 1 つ
  - ひとり暮らし冊子: 角丸の標題ブロック・角丸の写真パネル・QR 付きの白い角丸枠
  - チラシ: 白い角丸の特典カード 3 枚（左端に色付きの見出しタブ）、雲形・丸形の吹き出し、写真に重ねる色付きの丸ラベル
density:
  学校案内: 中（文字は少なく写真が多い）
  募集要項: 中〜高
  ひとり暮らし冊子: 中
  縦型チラシ: 高
  横型チラシ: 最高（写真 10 点以上・日付 8 個・特典 3 枚・QR 2 つ）
eye_flow:
  - 写真全体では、上段のチラシ 2 点（にぎやかな色・写真の多さ）に最初に目が行き、下段の学校案内 2 点は淡い地色で落ち着いて見える。募集要項の赤いパネルが下段の中心を締める
  - 学校案内: 学校名 → キャッチ → 円形写真を周回 → 学科名
  - 募集要項: 標題パネル → エンブレム → 目次の中見出し → 学校名
  - 横型チラシ: 欧文見出し → 日付バッジ列 → 季節イベントの見出し → 写真グリッド → 特典カード
background:
  学校案内: 淡色ベタ＋波形＋水玉・網点の丸。すべて Layer 2（SVG / CSS）で描ける
  募集要項: 白地＋ブランド色パネル＋正方形ドットの格子（Layer 2）
  ひとり暮らし冊子: 白地。写真が Layer 1
  チラシ: ストライプ・水玉の地は Layer 2、季節のイラスト（かぼちゃ・おばけ・星・ギフト・屋台の食べ物）は Layer 1 の生成または素材
image_crop:
  - 円形写真: 顔を円の中心よりやや上、肩〜胸まで。PC や実習器具を一緒に写す
  - 人物の切り抜き: 腰から上、紙面の左右端に立たせて中央の見出しを挟む
  - 大判写真（ひとり暮らし冊子）: 人物を右寄せ、手前に料理・飲み物
rhythm: 学校案内 2 点は同じテンプレートの色違いで並べるとシリーズになる。募集要項はブランド色のパネルで実務系と一目でわかる。チラシは季節の演出でキット内でも別扱い
notes:
  - 写真の重なり・切れ: 縦型チラシは上端、横型チラシは右端が写真外。右下の学校案内の下に別の物が少し写り込んでいる
  - 全学科版の中央にライセンスキャラクターがある。流用不可で、再現時も円形写真の配置だけを参考にし、中央は空ける / 自社の要素に置き換える
  - 再現時の切り分け: 学校名・キャッチ・学科名・目次・日付・連絡先はすべて Layer 3、波形・水玉・リング・パネル・カード・吹き出しは Layer 2、写真は自社の権利確認済み写真（company-data/photos）、季節のイラストのみ Layer 1
  - Phase 5 の候補: 学校案内の表紙テンプレート（Layer 2 だけで構造が完結し、写真枠を差し替えれば学科別版にも展開できる）と、募集要項の 2 段表紙（パネル＋表紙目次）
