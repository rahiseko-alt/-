# 参考資料の解析結果（Phase 4。system/rules/references.md §4）— 資料全体
# 対象: このディレクトリの 1 つ上にある page_001.jpg（1 枚）
# 内容: （学校名）の募集用印刷物一式（6 点）を机に並べて真上から撮った写真。元画像は 90° 回転して保存されている
#       （時計回りに 90° 回すと正位置。目視は正位置に回した確認用画像で行った）
# 寸法: 実物の採寸ではなく写真上の比率（幅:高さ）。遠近と重なりがあるため ±10% 程度の誤差を見込む
# 固有名詞・コピー・数字は伏せる（「（学校名）」「（法人名）」「（年度）」など）

# このキットの構成（正位置の写真で 左上 → 右下 の順）
kit:
  - id: living-support-book
    type: ひとり暮らし・学生寮の案内冊子（法人グループ共通の発行物）
    format: 縦型（A4 縦と推定）
    cover: 白地。左上に角丸のピンク色の矩形（白抜きの標題 2 行＋年度＋白い角丸タグ 2 つ）、右上 2/3 に大きな人物写真（カフェで食事する学生、右上角を大きく角丸にした矩形）、右上に濃グレーのタブ（保存版を示すラベル）、左の白い余白に縦組みのキャッチ 2 行。下 1/3 に角丸の写真パネル 2 枚（教室の学生 / 相談場面）と QR 付きの小さな案内枠。最下部にグループのロゴと系列校のロゴ一覧（複数色）
    tone: 明るい・生活感・安心感。学校単体ではなくグループのトーン
  - id: event-flyer
    type: 季節イベント（秋の行事）の体験会チラシ
    format: 縦型（A4 縦と推定。写真の上端で切れている）
    cover: 淡いラベンダー＋白の水玉地。上部に手書き風の欧文ディスプレイ書体（オレンジ）＋オレンジのリボン帯の和文見出し、かぼちゃのイラスト、吹き出し（対象学年・期間限定）。中段に 3 日分の日付を大きな丸ゴシック数字（くすんだ紫）＋曜日の丸、右に時間帯 2 行。下段左に体験メニューの円形写真 6 点（2 段 × 3、各キャプション付き）、右に黄色パネルの参加特典（ギフトのイラスト）。最下部に校舎写真・連絡先・おばけの吹き出し CTA・QR
    tone: かわいい・にぎやか・高校 1〜2 年生向け
  - id: open-campus-flyer
    type: オープンキャンパス日程＋特典のチラシ（横型）
    format: 横型（写真上の比率 1.4 以上、右端が写真外。A4 横と推定）
    cover: 淡いピンク〜ラベンダーのストライプ地。上段中央に手書き風の欧文見出し（オレンジのグラデーション）＋学校名、左右に学生スタッフの切り抜き写真、日付 6 個をかぼちゃ形・丸形のバッジで横一列、時間帯の注記。中段に季節イベントの見出しと体験写真 7〜8 点の矩形グリッド（各写真に色付きの丸ラベルで学科名・体験名）、右に特典の吹き出し・屋台のイラスト。下段に全幅のピンクの帯に「特典 1〜3」の白いカード 3 枚（金額・プレゼント・チケット）と QR
    tone: 最も情報密度が高い。にぎやか・お得感
  - id: school-guide-main
    type: 学校案内（全学科版）
    format: 縦型（A4 縦と推定、写真上の比率 約 0.69）
    cover: 上 15% が白い見出し帯（法人名・認定表記の小さな行＋大きな学校名ロゴタイプ＋ハートのシンボル）。下端が波形（スカラップ）で、淡いピンク地へ切り替わる。地には大小のパステルの水玉（ピンク・黄・水色・ミント）と網点の丸。上部中央に 2 行のキャッチ（ピンク、字間広め）。円形写真 7 点（白い余白＋色の太いリング。リング色はオレンジ・ピンク・緑・水色・青・紫・ミント）を中央のライセンスキャラクターの周りに散らす。下端は再び波形で白地へ戻り、学科名を学科ごとの色で 2 行に並べ、最下部に小さな英字の資料名＋年度
    tone: やさしい・明るい・女性比率の高い医療／福祉系
  - id: admissions-guide
    type: 募集要項（入試方法・学費ガイド。出願書類付き）
    format: 縦型（A4 縦と推定）
    cover: 白地。左 45% にコーラルピンク〜赤の縦長パネル（天から下 80% まで）。パネル上部に入学年度のタブ、ピンクの小さな正方形ドットの格子（上下 2 か所）、中央に小見出し＋破線＋白抜きの大きな標題 2 行＋括弧書きの補足。右上に円形の大きなエンブレム（ハートのシンボル＋円周の英字）。右下 55% に表紙目次（赤い見出し帯 1 本＋読者の目的を示す形の赤い中見出し 4 つ＋各項目のリーダー罫・ノンブル＋グレーの注意枠 2 つ）。最下部に認定表記の小さな行と学校名ロゴタイプ（中央）
    tone: 実務的だがブランド色で親しみを残す
  - id: school-guide-department
    type: 学校案内（学科別版。IT 系学科）
    format: 縦型（A4 縦と推定）
    cover: 全学科版と同じテンプレート（白い見出し帯＋波形＋水玉地＋色リングの円形写真＋中央のキャッチ＋下端の学科名＋英字の資料名）。違いは 地色が淡い水色、円形写真が 4 点で大きめ、キャッチが写真の間（中央）、ライセンスキャラクターなし、学科名を青・コース名をピンクで表示
    tone: 全学科版と同じ世界観で、色だけで学科を見分けさせる

# グリッド
grid:
  school_guides: 1 段・中央揃え。白い見出し帯（上 15%）→ 波形 → 写真とキャッチの自由配置エリア（65%）→ 波形 → 学科名・資料名（下 15%）
  admissions_guide: 2 段（左 45% パネル / 右 55% 目次）。下 10% は全幅のフッター
  flyers: 縦型は 上 40% 見出し・日付 / 下 60% を 左 60%（体験写真）・右 40%（特典パネル）に分割。横型は 3 段（日付 / 体験写真グリッド / 特典カード 3 枚）
# 余白（判型に対する比率）
margins:
  school_guides: 左右 約 5%（写真は余白の内側で自由配置）、天 約 4%、地 約 4%
  admissions_guide: 左右 約 7%、天 約 6%、地 約 5%
  flyers: 約 3〜4%（地色・模様は断ち切り）
gutter:
  admissions_guide: パネルと目次の間 約 5%
  flyers: 写真グリッドの間隔 約 1%
# 写真の比率と使われ方
photo_ratios:
  - 学校案内: すべて 1:1 の円形トリミング。直径は表紙幅の 25〜40% で大小をつける。白い細い余白の外に色の太いリング（直径の約 4%）
  - ひとり暮らし冊子: 角を大きく丸めた矩形（3:4 の大判 1 点＋横長 1 点＋小 1 点）
  - 縦型チラシ: 円形写真 6 点（直径は幅の約 18%）
  - 横型チラシ: 4:3〜3:2 の矩形写真をすき間なく並べたグリッド＋人物の切り抜き 2 点
  - 実写の学生写真が中心（笑顔・作業中の手元・実習風景）。学科の仕事場面がわかる写真を選んでいる
heading_hierarchy:
  - { role: 学校名ロゴタイプ, style: 極太ゴシック（墨〜濃グレー）, size: 表紙幅の約 75%, note: 学校案内 2 点・募集要項で同じ }
  - { role: 学校案内のキャッチ, style: ゴシック Medium・字間 0.2em 前後・2 行中央揃え, size: 表紙幅の約 55%, color: 地色に合わせた濃いめの同系色 }
  - { role: 学科名, style: ゴシック Medium, color: 学科ごとの色 }
  - { role: 英字の資料名＋年度, style: 細いサンセリフのキャップス・字間広め, size: 極小 }
  - { role: 募集要項の標題, style: 白抜きの太ゴシック 2 行・字間広め, size: パネル幅の約 80% }
  - { role: チラシの見出し, style: 手書き風の欧文スクリプト＋丸ゴシック。日付は太い丸ゴシック数字 }
# 色の役割と面積比（実際の色は company-data/brand/colors/colors.yaml を使う）
colors:
  brand_pink: { estimate: "#e6607a 前後（コーラルピンク）", role: "ブランドの主色。募集要項のパネル・ひとり暮らし冊子の標題ブロック・見出し帯", area: "募集要項で 約 35%" }
  pale_tints: { estimate: "淡ピンク #fbe6ec / 淡水色 #dcecf8 前後", role: "学校案内の地色。学科（版）ごとに地色を替える", area: "学校案内で 約 70%" }
  ring_palette: { estimate: "オレンジ・ピンク・緑・水色・青・紫・ミントのパステル〜中間色", role: "円形写真のリング・水玉・学科名の色分け", area: "各色 1〜3%" }
  dark_text: { role: "学校名ロゴタイプ・目次・本文", note: "真っ黒ではなく濃グレー寄り" }
  flyer_palette: { estimate: "ラベンダー・淡黄・オレンジ・くすんだ紫", role: "季節イベントの演出色。ブランド色とは別系統" }
  ratio_summary: "淡い地色が大面積、ブランドのピンクは中面積、多色のパステルは小面積の点（水玉・リング）で散らす"
rules:
  - 募集要項の目次: 中見出しの下に細い赤罫、項目はリーダー罫（細い実線）＋右揃えノンブル、項目頭に黒丸
  - 募集要項の標題上下に細い破線
  - 学校案内は罫線をほとんど使わず、波形の境界と円で区切る
cards:
  - 学校案内: カードなし（円形写真が要素の単位）
  - 募集要項: グレー地の注意枠（角なし）／細線枠の補足
  - ひとり暮らし冊子: 大きな角丸の写真パネル・角丸の標題ブロック・角丸の白タグ
  - チラシ: 角丸の白カード（特典 1〜3）、雲形・丸形の吹き出し、丸ラベル、黄色の特典パネル
density:
  school_guides: 中（写真 4〜7 点＋キャッチ＋学科名。文字は少ない）
  admissions_guide: 中〜高（表紙に目次 4 グループ）
  living_support_book: 中
  flyers: 高（縦型）〜最高（横型）
page_type: cover（6 点すべて表紙面のみが見えている）
eye_flow:
  school_guides: 学校名 → キャッチ → 円形写真（時計回り）→ 学科名
  admissions_guide: 左パネルの標題 → 右上のエンブレム → 目次の中見出し（目的別）→ 学校名
  flyers: 欧文見出し → 日付 → 体験写真 → 特典 → QR
background:
  school_guides: 淡い地色のベタ＋波形の境界＋水玉・網点の丸（すべて SVG / CSS で描ける。Layer 2）
  admissions_guide: 白地＋ブランド色のパネル＋正方形ドットの格子（Layer 2）
  flyers: 水玉・ストライプの地、季節のイラスト（かぼちゃ・おばけ・星・ギフト）は Layer 1（生成）または素材
  living_support_book: 白地＋写真（写真は Layer 1）
image_crop:
  - 円形写真は顔を円の中心よりやや上に置き、肩〜胸までを入れる。作業中の手元・PC を一緒に入れる
  - ひとり暮らし冊子の大判写真は人物を右寄せ、手前に料理を入れて生活感を出す
  - チラシの人物切り抜きは腰から上、紙面の左右端に立たせる
rhythm: 6 点で 3 系統（学校案内テンプレート系 2 / 実務系 1 / 販促チラシ系 2 ＋ グループ共通冊子 1）。学校案内は全学科版と学科別版を同じテンプレートの色違いで展開し、シリーズとして並べたときにそろう
notes:
  - 識別の統一要素は「学校名ロゴタイプ＋ハートのシンボル（円形エンブレム）」とブランドのピンク。学校発行の冊子 3 点は、学校名を表紙の天（学校案内）または地（募集要項）に同じ大きさで置く
  - 学校案内の表紙はテンプレート化されている（見出し帯・波形・水玉・色リングの円形写真・学科名）。地色・写真・キャッチ・学科名だけを差し替えて学科別版を作る
  - 学科ごとの色分け（学科名・リング色）がキット全体の色ルールになっている
  - 全学科版の中央にライセンスキャラクターを使っている。流用不可。自社には同等のものがないので構成からも外す
  - ひとり暮らし冊子は法人グループの共通発行物で、学校単体のテンプレートとはトーンが違う（角丸パネル＋大判写真）
  - チラシは季節イベントに合わせて毎回デザインを変える使い捨て型。ブランド色より季節の演出色を優先している

# 自社キット計画への示唆（AIビジネス専門学校。色・書体は company-data の正本を使う）
kit_planning:
  - 学校案内は「全体版＋学科別版」を 1 つの表紙テンプレートの差し替えで作る方式が使える。差し替える変数は 地色・写真・キャッチ・学科名だけにし、テンプレートは shared/components に置く
  - 学科ごとの色を持つ場合は company-data/brand/colors/colors.yaml に役割（例: 学科ごとのキー）を追加する必要がある。色の値は人間に確認し、推測で作らない
  - 円形写真＋色リング＋水玉は Layer 2（CSS / SVG）だけで描けるので、生成画像に頼らず量産できる。shared/components/photo-frame.hbs に円形・リング付きの型を追加する候補
  - 募集要項は「ブランド色のパネル＋表紙目次」の 2 段構成が実務系として参考になる。目次を読者の目的別（学科と学費 / 入試制度 / 学費サポート / 書類と問い合わせ）にグループ化する見せ方は、内容の名前を変えて使える
  - チラシは季節・イベントごとに作り直す前提で、日付バッジ列・体験写真グリッド・特典カード 3 枚・QR の CTA を部品化しておくと日常編集（Phase 9）で差し替えやすい
  - 写真は company-data/photos の権利確認済みのものだけ。学生の実習・作業風景の写真が多数必要になるので、撮影リストを早めに人間と相談する（TODO）
  - 柔らかいパステル調は医療・福祉系の読者向けのトーン。AI・ビジネス系の自社では、構造（テンプレート化・色分け）を借りてトーンは自社ブランドに合わせる
