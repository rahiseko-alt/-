eye_flow: "左上の見出し → 物件名（区分タグの色で区別）→ 居室の主写真 → ピンクの費用の数字 → 情報の小見出しを上から → 次のモジュールへ。左ページ → 右ページの順にモジュールを上から下へ"
background: "白地。全面背景なし"
image_crop: "居室は広角で部屋全体、外観は建物全体（見上げ）、共用部は引き。写真はすべて角なしの矩形でモジュール内に収め、裁ち落としなし"
rhythm: "冊子の中央の見開きで最も情報が密。前の見開き（費用の比較）を受けて具体的な物件を一覧し、次の見開き（路線図と手続き）へつなぐ"
notes: |
  - 画像の状態: 見開き 1 枚（左 p.5 / 右 p.6）。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する
  - 寸法の表し方: 仕上がり 1 ページ（片ページ）に対する比率
  - Layer 1: 居室・外観・共用部の写真（自社の提携先の写真。参考の写真は使わない）
  - Layer 2: 見出し帯、区分タグ、ピル、設備アイコン（SVG）、写真の枠とバッジ、情報の小見出しと罫、アクセスの図（flex の連結）、特徴の囲み、略地図と間取り図（SVG。自社のものを描く）
  - Layer 3: 物件名・説明・費用・住所・アクセス・食事の時間・細則・QR（自社の提携寮があれば company-data に facts を追加して参照。なければ TODO。参考の物件名・数値は使わない）
  - 再現の注意: モジュールはデータの繰り返しなので、1 物件分のパーシャル（写真の枚数と情報項目を可変）にして、物件の配列から生成する。費用のラベルと数字は行をそろえる
  - 共通部品の候補: 物件・コースなどのカタログ型モジュール（見出し行＋写真群＋情報 2 列）
