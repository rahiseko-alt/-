notes: |
  - 画像の状態: 見開き 1 枚（左 p.1 / 右 p.2）。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する
  - 寸法の表し方: 仕上がり 1 ページ（片ページ）に対する比率
  - Layer 1: 写真（自社写真。参考の写真は使わない）、イラスト（人物）は必要なら生成または自社素材
  - Layer 2: カード、吹き出しタグ（SVG または clip-path の尻尾）、英字タブ、付帯パネル、ピル、バッジ（雲形は SVG）、設備アイコン（SVG の線画）、統計のラベルと三角、波線の下線（text-decoration: wavy か SVG）、スマートフォンの枠
  - Layer 3: 見出し・本文・統計の数字（自社の調査値がある場合だけ。as_of と source が必要。なければ TODO）・タグ・ピルの語・QR。アプリ名・SNS 名・企業名は参考のものを使わない
  - 再現の注意: タグはカードの角をまたぐため、カードに position: relative をとり、タグを負のオフセットで置く。カードの高さは写真の高さで決まるので、写真の比率を固定する
  - Phase 5 候補（カード型レイアウトの代表）
