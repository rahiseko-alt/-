notes: |
  - 画像の状態: 見開き 1 枚（左 p.7 / 右 p.8）。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。右ページの下半分の申込書は切取線より下で、地と小口に裁ち落とし
  - 寸法の表し方: 仕上がり 1 ページ（片ページ）に対する比率
  - Layer 1: 写真（自社写真）、青いパネルの人物イラスト（必要なら生成）
  - Layer 2: 見出し帯、凡例タグ、路線図（SVG。自社の周辺の路線で描き直す）、小表、ステップカード（clip-path で角を折る）、青いパネルと矢印、QR の囲み、切取線、申込書の罫と見出し帯
  - Layer 3: 見出し・本文・駅名・所要時間・金額・連絡先・申込書のラベル・QR（自社の facts にある値だけ。参考の駅名・寮名・企業名は使わない）
  - 再現の注意: 路線図は参考の模写をせず、自社の所在地を中心に同じ表現（同心の点線＋色線＋白丸の駅）で作る。申込書は切り取って使うので、切取線より下を独立したブロックとして mm で固定する
  - 共通部品の候補: 手続きのステップカード、切取線＋申込書のブロック
