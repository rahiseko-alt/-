notes: |
  - 画像の状態: 見開き 1 枚（左 p.3 / 右 p.4）。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する
  - 寸法の表し方: 仕上がり 1 ページ（片ページ）に対する比率
  - Layer 1: 居室・人物の写真（自社写真）、切り抜きの人物（自社写真を切り抜く）、図のイラストアイコン
  - Layer 2: 見出しのアイコンタブ、カード、青いパネル、吹き出し、比較表の交互の地、矢印、マーカーの下線、時間の図（SVG）、無線 LAN のバッジ
  - Layer 3: 見出し・本文・表の数値・節約額・時間・Q&A・氏名と所属・QR（費用や人物は company-data にあるものだけ。参考の人名・数値は使わない。インタビューは流用禁止）
  - 再現の注意: 比較表の交互の地は tr:nth-child で。節約額のマーカーは linear-gradient の下半分塗り。時間の図は 24 時間の軸を SVG の座標で固定する
  - Phase 5 候補（表・数字の訴求・インタビューの部品が多様）
