notes: |
  - 画像の状態: 単ページ。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。縦横比 ≈ 1:1.49
  - 寸法の表し方: 仕上がり 1 ページに対する比率。左下のはがきはページ幅の ≈ 48% × ページ高の ≈ 50%（A4 縦と仮定するとほぼはがき大）
  - Layer 1: 写真 2 点（自社写真）
  - Layer 2: 細罫、縦罫、切取線（横・縦）とはさみのアイコン（SVG）、はがきの切手欄と郵便番号マス、矢印形の誘導、吹き出し、QR の囲み、グループ校の一覧の罫
  - Layer 3: 見出し・本文・電話番号・ID・委託先・はがきの宛先・郵便番号・グループ校の校名と連絡先・管理番号・QR（自社の facts だけ。参考の企業名・校名・連絡先は使わない。グループ校のロゴは自社グループの正式データがある場合だけ）
  - 再現の注意: はがきは郵便の規格（宛名面の郵便番号枠の位置・寸法）に合わせて mm で組む。切り取ったときにはがきの外形が規格の寸法になるよう、切取線の位置を判型から逆算する
  - 共通部品の候補: 切り取り式の返信はがき（宛名面）
