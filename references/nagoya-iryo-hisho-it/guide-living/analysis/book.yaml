# 参考資料の解析結果（Phase 4。system/rules/references.md §4）— 資料全体
# 対象: references/nagoya-iryo-hisho-it/guide-living/（ページ画像 6 枚。一人暮らし・提携学生寮の案内冊子）
# - ページ画像はすべて画像として目視した（正立させた確認用コピーも目視）
# - 寸法は「仕上がり 1 ページに対する比率（%）」で書く。物理寸法は不明（notes 参照）
# - 参考資料の文章・数値（家賃・割合・時間）・固有名詞（法人名・寮名・アプリ名・企業名・人名）は書き写さず「（…）」で伏せる

# グリッド（段数・段間・基準線）
grid:
  基本: "モジュール（角丸のカード）を縦に 2〜4 枚積む型。カード内は「写真（左 45〜55%）＋テキスト（右）」か「テキスト（上）＋写真（下）」の 2 分割が基本"
  段組: "1 段（カード幅＝版面幅）を基本に、ページ下部で 2 段（カード 2 枚を左右に）にする。pp.3 は上段 2 段（部屋タイプ 2 種）"
  カタログ: "pp.5–6 は 1 物件＝1 モジュール（見出し行＋写真群＋情報 2 列）を 1 ページに 3 つずつ。モジュールの高さはほぼ等分（最初の 1 つだけ大きい）"
  版面: "版面幅 ≈ ページ幅の 88〜90%、版面高 ≈ ページ高の 88〜92%"
  基準線: "厳密なベースライングリッドは見られない。カードの上辺・下辺を左右ページでそろえる"
  見開き: "左右でカードの上端をそろえる。セクション見出しは片ページずつ（見開きをまたがない）。pp.5–6 だけ見出し帯が左ページから右ページの天へ続く"

# 余白
margins:
  top: "≈ 5〜7%（ページ高比）"
  bottom: "≈ 5〜7%（ノンブルは地の外側寄りに極小）"
  inside: "≈ 5〜6%（ページ幅比）"
  outside: "≈ 5〜6%"
  表紙・裏表紙: "表紙は色面と写真が天・左に裁ち落とし。裏表紙は上下 2 分割で、下半分が切り取り式のはがき"

# ガター・段間
gutter: "カード間の縦の間隔 ≈ ページ高の 1〜1.5%、横の段間 ≈ ページ幅の 2〜3%。カード内の写真とテキストの間 ≈ 2〜3%"

# 写真の比率と使われ方
photo_ratios:
  - "横位置 ≈ 4:3〜3:2 が主（居室・食堂・人物の生活シーン）。カードの左半分に大きく置く"
  - "正方形〜縦長の小写真（料理・設備）を 2〜3 枚縦に積むか、2×3 の格子に並べる"
  - "人物の縦位置（表紙の主写真 ≈ 5:7、インタビューの顔写真 ≈ 3:4 の角丸）"
  - "円形の小さな顔写真（先生のコメント）、切り抜きの全身人物（費用の比較の横）"
  - "間取り図（線画）と略地図・路線図（図）"
  - "面積比: 中面で写真 ≈ 25〜35%、カタログ見開きで ≈ 40%"

# 見出し階層（字高はページ高に対する比率）
heading_hierarchy:
  - level: "表紙タイトル"
    字高: "≈ 4%（2 行）"
    ウェイト: "白抜きの中ウェイトのゴシック（細めで柔らかい印象）"
  - level: h1
    役割: "セクション見出し"
    字高: "≈ 1.8〜2.2%"
    ウェイト: "中ゴシック・黒"
    装飾: "左にネイビーのアイコンタブ（左端が角丸、白の線画アイコン）＋青の細い縦アクセント＋薄グレーの帯（右端が角丸）。右端に区分タグや注記ピルを置くことがある"
  - level: "h1（p.1 の変化形）"
    字高: "≈ 3.2%"
    ウェイト: "太ゴシック。キーワード 3 語をピンク＋波線の下線、残りは黒"
  - level: h2
    役割: "カード見出し"
    字高: "≈ 1.4〜1.6%（2 行）"
    ウェイト: "中ゴシック・黒"
    装飾: "カードの左上に黄色の吹き出しタグ（短い見出し語）を重ねる。英字のチャコールのタブ（上辺から出る）を使うカードもある"
  - level: h3
    字高: "≈ 1.0〜1.2%"
    ウェイト: "太ゴシック"
    装飾: "チャコールのピル（白抜き）、黒い四角＋太字＋下罫（物件情報の項目）、番号＋太字（手続きのステップ）"
  - level: "数値の強調"
    字高: "≈ 4〜6%（統計）、≈ 2.2%（価格）"
    ウェイト: "ピンクの細〜中ウェイトの数字。小数点以下と単位は小さく"
  - level: "本文"
    字高: "≈ 0.8〜0.9%"
    ウェイト: "細〜中ゴシック（グレー寄りの黒）"

# 色の役割と面積比（16 進は撮影画像からの推定。実際の色は自社のブランドカラーを使う）
colors:
  主色: "ローズピンク #d1667f 前後（表紙の色面、統計・価格・節約額の数字、見出しのキーワード、強調の吹き出し）"
  第 2 色: "ネイビー #20316f 前後（セクション見出しのアイコンタブ）＋ブルー #5f8ed4 前後（見出しの縦アクセント、情報のピル、インタビューの大きなパネル、表の見出し帯、アイコンの地）"
  アクセント: "イエロー #efd05a 前後（カードの吹き出しタグ、マーカーの下線）、チャコール #333〜#444（英字タブ・ラベルのピル・表紙のラベル）"
  区分色: "赤 #ae5667 / 青 / 緑 #6d8f80 前後（寮の区分タグと路線図の凡例で一貫して使う 3 色）"
  地: "白。カードと付帯パネルの地は薄グレー #f4f3f5 前後"
  面積: "白 ≈ 50% / 写真 ≈ 30% / 薄グレーのカード地 ≈ 10% / 色（ピンク・青・黄・ネイビー）≈ 8% / 黒文字 ≈ 2%"

# 罫線
rules:
  - "罫はほとんど使わない。区切りは薄グレーのカード地と余白で行う"
  - "見出しの下に細いグレーの罫（部屋タイプ、物件情報の小見出し）"
  - "比較表（p.4）: 罫なし。行ごとに白と薄グレーの交互の地、見出し行と合計行だけピンクの地"
  - "点線: インタビュー内の区切り、路線図の距離の同心円、切取線（はさみのアイコン付き）"
  - "裏表紙: 版面幅の細い黒罫で上部の段を区切る"

# カード（角丸・余白・影・枠）
cards:
  特徴カード: "白地または薄グレー地、角丸（半径 ≈ ページ幅の 1〜1.5%）、枠は極薄のグレーか無し、影なし。左上に黄色の吹き出しタグが角をまたいで重なる"
  付帯パネル: "カードの中に薄グレーの角丸パネル（チャコールのピル見出し＋青またはピンクのピル項目）"
  情報パネル: "青地の角丸パネルに白抜きの大きな文（インタビュー）、青い角丸矩形の吹き出し（手続きの案内）"
  写真の角: "写真は小さな角丸（半径 ≈ 0.5〜1%）。表紙だけ大きな角丸・切り欠き・スタジアム形"
  バッジ: "無線 LAN の黒い角丸アイコン、人気を示す赤い円形バッジ、ピンクの雲形バッジ、区分の色タグ（正方形に近い矩形）"
  内側余白: "カードの内側余白 ≈ ページ幅の 2〜3%"

# 情報密度
density: "中〜高。前半（pp.1–4）は写真とカードで中〜高、カタログ（pp.5–6）は最高、手続き（pp.7–8）は図解と用紙で高。表紙は低"

# ページタイプ（ページ画像ごとの対応表）
page_type:
  page_001: "cover（表紙。単ページ）"
  page_002: "other（pp.1–2 見開き。寮の特徴: 4 つのサポートのカードと満足度の統計）"
  page_003: "interview / data（pp.3–4 見開き。左: 部屋タイプとインタビュー、右: 費用の比較表・時間の比較・Q&A・Web と動画の案内）"
  page_004: "data（pp.5–6 見開き。提携寮の一覧カタログ 6 物件と費用の詳細）"
  page_005: "access / other（pp.7–8 見開き。左: 路線図と支援制度、右: 入寮手続きの流れと切り取り式の申込書）"
  page_006: "back-cover（裏表紙。見学・体験の案内、問い合わせ、切り取り式の返信はがき、グループ校の一覧）"

# 視線誘導（資料全体の傾向）
eye_flow: "各カードは黄色のタグ → 大きな写真 → 2 行の見出し → 本文 → 付帯パネルの順。見開き単位では大きなピンクの数字（統計・節約額）が最初に目に入り、そこから各カードへ散る"

# 背景表現
background: "全ページ白地。全面の背景画像やグラデーションはない。表現力は写真（Layer 1）に任せ、色面・カード・ピルは単色の Layer 2。表紙は白地に写真 3 点と色面を重ねる構成"

# 画像のクロップ
image_crop: "中面の写真はカードの内側で角丸の矩形に収め、裁ち落としはしない。表紙だけ写真を大きな角丸・切り欠き・スタジアム形のマスクで組み合わせる。人物は胸から上〜腰から上が多く、目線はカメラ。料理・設備は寄りのクロップ"

# ページ間のリズム
rhythm:
  構成: "表紙（写真主体）→ 特徴（写真大のカード）→ 部屋と声（写真＋人物）→ 数字の比較（表・図）→ カタログ（高密度）→ 地図と手続き（図解・用紙）→ 裏表紙（はがき）"
  傾向: "前半ほど写真が大きく情緒的、後半ほど情報密度と実務性（申込書・はがき）が上がる"
  見開き: "見開きごとにテーマが完結する。左右でカードの上端をそろえ、同じセクション見出しの型を繰り返す"

# その他の所見
notes:
  画像の状態: "6 枚とも冊子を撮影・スキャンした 72dpi の JPEG（テキスト層なし）。全ページが 90° 反時計回りに倒れた状態で保存されている（ページの天が画像の左）。正立には 90° 時計回りに回転する。page_002〜page_005 は見開き（ノンブル 1〜8）、page_001（表紙）と page_006（裏表紙）は単ページ"
  寸法の表し方: "物理寸法が不明なため、寸法はすべて仕上がり 1 ページに対する比率（%）で書いた。見開きの片ページの縦横比 ≈ 1:1.45〜1.50 から A4 縦相当と推定（撮影の歪みあり）。裏表紙の下半分の返信はがきは、ページの 1/4（左下）でおよそはがき大"
  Layer の切り分け: "Layer 1 は写真（自社の写真は company-data/photos。参考の写真は使わない。AI 生成の人物写真は学校の写真として使えない）と、必要なら料理・設備のイメージ。Layer 2 はカード・タグ・ピル・見出し帯・アイコンタブ・バッジ・写真のマスク・表・路線図と地図（SVG）・切取線。Layer 3 はすべての文字・数字・価格・QR"
  共通部品の候補: "アイコンタブ付きのセクション見出し、吹き出しタグ付きのカード、ピルのリスト、統計の大きな数字、比較表、手続きのステップカード、切り取り式の申込書・はがき"
  phase5_candidates:
    - page: page_002
      理由: "カード型レイアウトの代表。吹き出しタグ・写真＋テキストの 2 分割・ピルのパネル・大きな統計数字が 1 見開きにそろい、部品化の効果が大きい。写真は枠のプレースホルダで再現できる"
    - page: page_003
      理由: "比較表（交互の地色）、大きな数字の訴求、インタビュー（顔写真＋青いパネル）、Q&A カードなど、データとストーリーの部品が多様。写真の面積が小さく構造の比較がしやすい"
    - page: page_001
      理由: "色面＋写真 3 点のマスク（角丸・切り欠き・スタジアム形）＋縦組みのキャッチ。写真のマスク形状を Layer 2 で正確に組む検証になる"
  比較時の注意: "npm run compare の前に、参考画像を正立させ、1 ページ分に切り出した比較用画像（一時ファイル）を --reference で渡す。撮影の歪みがあるため画素一致率は低く出る。目視比較を主にする"
