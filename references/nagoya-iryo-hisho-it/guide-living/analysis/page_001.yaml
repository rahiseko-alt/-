image_crop: "主写真は人物を右寄せにし、頭の上に余白を少し残す。下の写真は手前の人物の肩から上を左寄せに。写真はすべて角丸・切り欠き・スタジアム形のマスクで切り、仕上がり線までは伸ばさない（色面だけ裁ち落とし）"
rhythm: "表紙単ページ。ピンクの主色と柔らかい細めのゴシックが中面の見出しのトーンを決める。裏表紙（page_006）は白地と情報中心で対照的"
notes: |
  - 画像の状態: 単ページ。90° 反時計回りに倒れている（ページの天が画像の左）。正立には 90° 時計回りに回転する。縦横比 ≈ 1:1.58 に写っている（周囲の余白と撮影の歪みを含む。中面からは A4 縦相当と推定）
  - 寸法の表し方: 仕上がり 1 ページに対する比率
  - Layer 1: 写真 3 点（自社の写真を company-data/photos から。参考の写真は使わない。人物写真は AI 生成で代用できない＝学校の写真は権利確認済みの実写のみ）。Phase 5 ではプレースホルダの枠で再現する
  - Layer 2: 色面パネル（下辺の角丸）、写真のマスク（border-radius と clip-path。主写真の左下の切り欠きは SVG の clipPath で正確に）、白い隙間、ラベル、タグのピル、QR カード、放射状の線の模様（SVG）、フッターの縦罫
  - Layer 3: グループ名・タイトル・年度・タグ・縦組みのキャッチ（writing-mode: vertical-rl）・ラベル・QR と案内文・法人ロゴとグループ校のロゴ（自社の正式ロゴに置き換え。参考のロゴは使わない）
  - 再現の注意: 写真同士の白い隙間の幅をすべてそろえる。主写真の切り欠きの角丸の半径は下の写真の角丸の半径＋隙間にする
  - Phase 5 候補（写真のマスク形状の検証）
