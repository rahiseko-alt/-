  ラベル: "主写真の右上に重なるチャコールのラベル（x 73〜94% / y 10〜14%）。左端が角丸で、写真の右端より外へはみ出す"
  QR カード: "下の写真の右下に重なる白い角丸カード（x 63〜93% / y 80〜85%）"
