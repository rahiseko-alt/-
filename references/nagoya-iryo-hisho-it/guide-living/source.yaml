notes: |
  Google Drive「専門学校パンフレット参考資料」の「名古屋医療秘書福祉&IT専門学校 ひとり暮らし応援BOOK.pdf」（https://drive.google.com/file/d/1VjU59SIFVkoMMd4Yi0ROkbUNrulkcMvt/view）を 2026-10-08 に取り込み。Drive への格納日は 2026-10-07。実際の入手日は【要確認】
  元 PDF は印刷物の写真・スキャン（文字情報なし、埋め込み画像は 72ppi）。ページ画像は同じ解像度の 72dpi・JPEG（品質 85）
  ページ: 冊子を撮影した写真。全6枚とも反時計回りに90°倒れている（時計回り90°で正立）。page_001=表紙（単ページ）、page_002〜005=各2ページ見開き（p1-2〜p7-8。指定学生寮の紹介・部屋タイプ・インタビュー・費用比較・寮一覧・路線MAP・入寮手続き。p8下部に入寮申込書の切取り様式）、page_006=裏表紙（見学・体験入寮・郵便はがき・系列7校一覧）。三幸学園グループ名古屋7校共通の冊子で、運営は共立メンテナンス（ドーミー）。
  禁止語に未登録の企業名（就職先・提携先。自社でも使う可能性があるため人間が判断）【要確認】: 株式会社共立メンテナンス、株式会社共立ファイナンシャルサービス、学生会館ドーミー、ファストドクター（FAST DOCTOR）、Domico（寮生専用アプリ）
  禁止語に未登録の候補（一般名詞と重なるため人間が判断）【要確認】: ドーミー名駅亀島（提携寮名（共立メンテナンス）。ドーミー名駅亀島アネックス・ドーミー大須観音・ドーミー徳川園・ドーミーちくさ3・ドーミー池下も同様。自社も同社寮と提携しうる）、就学支援プログラム（寮費分割払い制度の名称（共立）。一般語）、寮奨学生制度（制度名だが一般的（学生マンション奨学生制度も同様））、指定学生寮（一般語。登録しない方がよい）、吉越先生（系列校教員（高山先生・東海先生も）。姓のみのため登録不適）
