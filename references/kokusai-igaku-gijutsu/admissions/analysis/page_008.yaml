# kokusai-igaku-gijutsu / admissions / page_008（見開き: 左 p.8 = 志望理由書〔罫線の記入用紙〕／右 p.9 = 入学願書）
# 寸法は各片ページの幅（W）・高さ（H）に対する %。判型の実寸は不明
# 文章・固有名詞は書き写さない

grid:
  左（p.8）:
    段組: "1 段。版面 W 12〜92%"
    構成: "表題（左揃え）＋括弧書きの注記 → 記入枠 1（H 9.5〜54%、上端に設問 1 行のセル＋罫線 17 本前後）→ 記入枠 2（H 54〜80%、設問行＋罫線 10 本前後）→ 確認欄の注記 1 行 → 確認欄の枠（H 84〜91%）"
    罫線ピッチ: "H 約 2.2%（A4 と仮定すると約 6.5mm。手書きに適したピッチ）"
  右（p.9）:
    段組: "フォーム。版面 W 8〜92%"
    上部: "表題（中央、字間大）／右上に受付印用の円（直径 W 約 20%）／宛先 2 行（左）"
    選択欄: "左: 出願区分 5 行の選択リスト（○ ＋ 均等割りの区分名、W 8〜37%）／中: 志望学科 × 志望順位の小表（左上に斜線の見出しセル、W 39〜73%）／右: 写真貼付欄（W 76〜92%）／その下に受験日欄と受付番号欄"
    本体: "併願情報 2 行 × 2 列 → 個人情報の表（左に縦書きのグループ見出し「本人」「保証人」相当の 2 区分、W 約 5%。項目名列 W 約 10%）"
margins:
  左（p.8）: { 上: "約 7%（表題まで）", 下: "約 9%（確認欄の下端）／ノンブル 下端から約 6%", 小口: "約 12%", ノド: "約 8%" }
  右（p.9）: { 上: "約 4%（円の上端）／表題まで約 7%", 下: "約 8%（表の下端）／ノンブル 下端から約 6%", ノド: "約 8%", 小口: "約 8%" }
gutter: "右: 選択欄の 3 ブロックの間 W 約 2〜3%"
photo_ratios:
  - "写真貼付欄（縦長、幅:高さ ≒ 0.8:1）。中に写真の条件 3 項目の小さい注記"
  - "受付印用の円（正円、細線）"
heading_hierarchy:
  左（p.8）:
    - { level: "表題", 書体: "太明朝", 相対サイズ: "本文の約 2 倍", 表現: "左揃え＋右に本文の約 1.1 倍の括弧書き注記" }
    - { level: "設問", 書体: "明朝", 相対サイズ: "本文の約 0.85 倍", 表現: "記入枠の最上段セルに 1 行" }
  右（p.9）:
    - { level: "表題", 書体: "太明朝", 相対サイズ: "本文の約 2.3 倍", 表現: "4 文字を 3〜4 文字分ずつ空けて版面幅の約 40% に広げ、中央" }
    - { level: "宛先", 書体: "明朝", 相対サイズ: "本文の約 1.1〜1.3 倍", 表現: "2 行目（学校の長への宛名＋敬称）を大きく" }
    - { level: "項目名", 書体: "明朝", 相対サイズ: "基準", 表現: "均等割り" }
    - { level: "注記", 書体: "明朝", 相対サイズ: "本文の約 0.75 倍", 表現: "選択欄の上下に 1 行ずつ" }
colors:
  役割: "スミ 1 色（赤なし）"
  地: "白"
  面積: "白 85〜90% ／ 罫・文字 10〜15%"
rules:
  - "外枠 約 1pt、内罫 約 0.3〜0.5pt、記入用の横罫 約 0.3pt"
  - "点線リーダー（学校名・年月日の記入位置）"
  - "選択リストの各行頭に ○（直径 本文の約 1.2 倍）"
  - "志望順位の小表の左上セルに対角線"
cards: null
density: "中（記入欄が主体。文字は少ない）"
page_type: other
eye_flow: "左: 表題 → 記入枠 1 → 記入枠 2 → 確認欄 ／ 右: 表題 → 宛先 → 選択欄（左 → 中 → 右）→ 個人情報（本人 → 保証人）"
background: "白地のみ"
image_crop: null
rhythm: "説明（p.6）→ エントリーシート（p.7）に続く提出書類の見開き。左右とも記入面で、文字ページとの交互はない"
notes: |
  - 向き: 反時計回りに 90° 回転した状態（ページの上が画像の左）。時計回りに 90° 回転して見る。鮮明で手の写り込みなし
  - フォーム部品の見本帳になるページ: 写真貼付欄、受付印の円、選択リスト（○）、斜線見出しセル、縦書きグループ見出し、
    均等割りの項目名、ふりがな行、点線リーダー、押印位置、記入用の横罫
  - Layer 1: なし
  - Layer 2: すべての罫・枠・円・斜線・点線（CSS の border / SVG）。共通部品として shared/components/ に置ける粒度
  - Layer 3: 表題・項目名・注記・宛名（学校名は {{facts...}}）。入試区分名・学科名は company-data から
  - 再現の注意: 罫線ピッチを mm で固定（手書きできる高さを保つ）、均等割り、縦書きのグループ見出し、極端な字間の表題
  - Phase 5 の候補（p.9 入学願書を主、p.8 は罫線の記入用紙の型として同時に検証できる）
