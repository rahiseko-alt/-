# admissions / page_011（単ページ p.13: 特待生試験の申込書＋切り取り式の受験票）
# 寸法はページ幅（W）・高さ（H）に対する %（台形のゆがみがあるため ±3% 程度）。判型の実寸は不明
# 文章・固有名詞・日付は書き写さない

grid:
  段組: "フォーム。版面 W 8〜92%"
  上部（申込書）:
    表題: "中央（H 約 8%）＋その下に締切を示す副題 1 行。右上に受付印用の円（直径 W 約 19%、H 3〜19%）"
    宛先: "左に 2 行（H 13〜17%）"
    選択欄: "左: 学科の 2 択（○ 付き、1 行）・受験日時（2 行）・受付番号の 3 つの小枠（W 8〜43%）／中: 入試区分 4 行の選択リスト（W 48〜72%）／右: 写真貼付欄（W 77〜92%、H 17〜31%）"
    個人情報の表: "H 33〜57%。左に縦書きのグループ見出し列（W 約 5%）、項目名列（W 約 10%）、右端に性別の小列"
    規則の囲み: "H 58〜68%。左上に太字の見出し、番号付き 7 項目"
  切り取り線: "H 約 69.5%。破線＋中央に字間を空けたラベル（括弧書きの注意付き）"
  下部（受験票）: "表題（中央）→ 学科の 2 択・受験日の枠・写真貼付欄（右）→ 受付番号・氏名の 2 行の表 → 発行者名（中央）"
margins:
  上: "約 3%（円の上端）／表題まで約 6%"
  下: "約 8%（発行者名）／ノンブル 下端から約 4%"
  ノド: "約 8%"
  小口: "約 7%"
gutter: "上部の選択欄 3 ブロックの間 W 約 3〜5%"
photo_ratios:
  - "写真貼付欄 2 つ（申込書と受験票。縦長、幅:高さ ≒ 0.75:1）"
  - "受付印用の円（正円、細線）"
heading_hierarchy:
  - { level: "申込書の表題", 書体: "太ゴシック", 相対サイズ: "本文の約 2.2 倍", 配置: "中央（このページだけ明朝ではなくゴシックの表題）" }
  - { level: "副題（締切）", 書体: "太ゴシック", 相対サイズ: "本文の約 1.1 倍", 配置: "中央" }
  - { level: "受験票の表題", 書体: "太ゴシック", 相対サイズ: "本文の約 1.9 倍", 配置: "中央" }
  - { level: "規則の囲みの見出し", 書体: "太ゴシック", 相対サイズ: "基準" }
  - { level: "本文・項目名", 書体: "明朝", 相対サイズ: "基準", 表現: "項目名は均等割り" }
colors:
  役割: "スミ 1 色"
  地: "白"
rules:
  - "外枠 約 1pt、内罫 約 0.3〜0.5pt、点線リーダー（学校名の記入位置）"
  - "切り取り線: 細い破線がページ幅いっぱい"
cards: null
density: "中〜高（記入欄＋規則 7 項目）"
page_type: other
eye_flow: "表題 → 宛先 → 選択欄（左 → 中 → 右）→ 個人情報の表 → 規則 → 切り取り線 → 受験票"
background: "白地のみ"
image_crop: null
rhythm: "フォームの連続の後半。裏面（page_012 の左）は受験票の部分の裏にだけ受験上の注意を刷り、切り離した受験票の裏で確認できるようにしている"
notes: |
  - 向き: 反時計回りに 90° 回転した状態（ページの上が画像の左）。時計回りに 90° 回転して見る
  - 撮影のパースで台形にゆがんでいる（上辺が狭い）。比較に使うなら台形補正が必要
  - 1 ページに「申込書（上 70%）＋受験票（下 30%）」を切り取り線で同居させる構成
  - Layer 1: なし
  - Layer 2: 罫・枠・円・破線・写真貼付欄・○ の選択記号
  - Layer 3: すべての文字。日付・時間・区分名は company-data から
  - Phase 5 の候補外（ゆがみが大きい。同じ部品は page_008 で検証できる）
