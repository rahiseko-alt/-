notes: |
  - 向き: 画像は反時計回りに 90° 回転した状態（ページの上が画像の左）。時計回りに 90° 回転して見る。単ページ（見開きではない）
  - ページ縦横比は約 1:1.41（A4/B5 系と推定）。寸法はすべてページ比
  - Layer 1: イラスト 1 点のみ（生成。人物・器具の群像、グレー階調、文字なし）。元イラストに入っている英字ラベルは生成画像に入れず、必要なら Layer 3 で重ねる
  - Layer 2: 細罫 2 本、黒ベタ帯（CSS の色面）、切り欠き付きの細罫枠（枠線を 4 辺個別に描くか、文字の背景を地色で塗って罫を隠す）
  - Layer 3: 年度・資料名・ロゴタイプ相当（自社ロゴは company-data/brand/logo の正式データ）・キャッチコピー・学科名・学校名。すべて {{facts...}} / {{copy...}} 参照
  - 再現の注意: タイトルの均等な字間（letter-spacing を em 指定し、帯の幅と左右の余白を合わせる）、中心線のずれがないこと
  - Phase 5 の候補（最小構成で 3 層の切り分けを検証できる）
