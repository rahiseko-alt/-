# admissions / page_007（見開き: 左 p.6 = 入試制度の説明と手順 ／ 右 p.7 = エントリーシート）
# 寸法は各片ページの幅（W）・高さ（H）に対する %。判型の実寸は不明
# 文章・固有名詞・日付は書き写さない

grid:
  左（p.6）:
    段組: "1 段。版面 W 約 8〜97%（ノド側に寄せ気味）"
    構成: "大見出し帯 → 標語 1 行 → 小見出し帯＋説明 1 行 → 小見出し帯＋中央揃えの箇条書き 4 行 → 大見出し帯 → 条件 1 行 → 番号付き手順 7 項目 → 太字の締め 1 行"
    手順: "番号（W 約 3%）＋太字見出し 1 行＋本文 1〜3 行（字下げ W 約 4%）。各手順の上にグレーの太い区切り帯"
  右（p.7）:
    段組: "フォーム。版面 W 9〜92%"
    上部: "日付記入行（左）／受付番号欄（右上、2 マスの枠）／表題（左揃え）＋発行者名（右寄せ）／写真貼付欄（右、W 77〜92% × H 8〜21%）"
    本体: "希望学科の選択行（○ ＋ 学科名、2 マス）→ 併願情報の 2 行 × 2 列 → 個人情報の表（左に縦書きのグループ見出し列 W 約 5%、項目名列 W 約 12%）→ 活動報告（見出し＋左右 2 つの小表）→ 罫線の自由記入欄"
margins:
  左（p.6）: { 上: "約 6.5%（大見出し帯まで）", 下: "約 20%（内容は H 80% で終わる。ノンブル 下端から約 5%）", 小口: "約 8%", ノド: "約 2〜3%" }
  右（p.7）: { 上: "約 6%（日付行まで）", 下: "約 12%（フォーム下端）／ノンブル 下端から約 5%", ノド: "約 9%", 小口: "約 8%" }
gutter: "左: 1 段組。右: 活動報告の 2 つの小表の間 W 約 3%"
photo_ratios:
  - "写真貼付欄（縦長、幅:高さ ≒ 0.78:1）。中に写真の条件を 3 項目の小さい注記で入れる"
heading_hierarchy:
  左（p.6）:
    - { level: "大見出し", 書体: "太ゴシック", 相対サイズ: "本文の約 1.7〜1.9 倍", 表現: "グレーのグラデーション帯（左が淡く右が濃い、高さ H 約 3〜3.8%、版面幅いっぱい）に中央揃え" }
    - { level: "標語", 書体: "太ゴシック", 相対サイズ: "本文の約 1.3 倍", 表現: "◆ で左右をはさんで中央" }
    - { level: "小見出し", 書体: "太ゴシック", 相対サイズ: "本文の約 1.2 倍", 表現: "淡いグレー帯（版面幅の約 75%、高さ H 約 2.2%）に中央揃え" }
    - { level: "手順の見出し", 書体: "太ゴシック", 相対サイズ: "本文の約 1.1 倍", 表現: "番号＋見出し。日付部分も太字" }
    - { level: "本文", 書体: "ゴシック", 相対サイズ: "基準", 行送り: "約 1.4 倍" }
  右（p.7）:
    - { level: "フォーム表題", 書体: "明朝（中太）", 相対サイズ: "本文の約 2 倍", 表現: "字間をやや空けて左揃え" }
    - { level: "活動報告の見出し", 書体: "太明朝", 相対サイズ: "本文の約 1.7 倍", 表現: "左揃え＋右に括弧書きの注記" }
    - { level: "項目名", 書体: "明朝", 相対サイズ: "基準", 表現: "均等割り" }
    - { level: "注記", 書体: "明朝", 相対サイズ: "本文の約 0.75 倍" }
colors:
  左（p.6）: "スミ＋グレー（帯 K 20〜55%）。赤なし"
  右（p.7）: "スミのみ"
  面積: "左: 白 80% ／ グレー帯 8% ／ 文字 12%。右: 白 85% ／ 罫・文字 15%"
rules:
  - "p.6: 手順の区切りはグレーの太い帯（高さ H 約 0.8%、横方向のグラデーション）。罫線ではなく帯で区切る"
  - "p.7: 外枠 約 1pt、内罫 約 0.3〜0.5pt。記入位置の点線リーダー。ふりがな行と氏名行の間は細罫"
cards: null
density: "左: 中〜高（30〜35 行相当）／右: 中（記入欄主体）"
page_type: message
eye_flow: "左: 大見出し帯 → 標語 → 定義 → 箇条書き → 大見出し帯 → 手順 1〜7（上から下）／右: 表題 → 選択欄 → 個人情報の表 → 活動報告"
background: "白地のみ。帯のグラデーションは CSS で可"
image_crop: null
rhythm: "情報ページ（左）と、その説明に対応する提出用フォーム（右）を見開きで対にする。ここから後ろがフォームの連続"
notes: |
  - 向き: 反時計回りに 90° 回転した状態（ページの上が画像の左）。時計回りに 90° 回転して見る。page_006 は同じ見開きの手入りカット
  - 左ページの下 1/5 は空き（裏写りのみ）。左端に黄色の別紙の端が見える
  - 書体の使い分け: 説明ページはゴシック、フォームは明朝（公文書の表情）。冊子全体で一貫
  - Layer 1: なし
  - Layer 2: グレーのグラデーション帯（linear-gradient）、手順の区切り帯、フォームの罫・枠、写真貼付欄の枠、○ の選択記号（CSS の円）
  - Layer 3: すべての文字。日付・制度名は company-data から
  - Phase 5 の代替候補（左の p.6 は帯見出し＋番号付き手順の型。フォーム部品は page_008 で検証する方が網羅的）
