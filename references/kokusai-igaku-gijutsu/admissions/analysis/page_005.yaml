# admissions / page_005（見開き p.2〜3 入試一覧表。鮮明版）
# 寸法は各片ページの幅（W）・高さ（H）に対する %。判型の実寸は不明
# 文章・固有名詞・日付・金額・定員は書き写さない

grid:
  構成: "見開き 2 ページで 1 枚の表。行 = 入試区分 4 つ、左右のページで行の境界の高さをそろえる"
  左（p.2）: "列 3 本: 行見出し（縦書き、W 約 5.5%）／出願資格（W 約 42%）／出願手続（W 約 44%）。表の左端 W 約 8.5%、右端はノドぎりぎり（W 約 98.5%）"
  右（p.3）: "列 1 本（W 1.5〜92%）。各行のセルに小表・流れ図・【 】ラベルの段落を入れ子にする"
  行の高さ: "見出し行 H 約 2% ／ 第 1 行 H 約 20.5% ／ 第 2 行 H 約 20.5% ／ 第 3 行 H 約 16.3% ／ 第 4 行 H 約 21.3%（表全体 H 10.5〜91%）"
  入れ子の小表: "日程表 = 4〜5 行 × 4 列（区分／受付期間／試験日／発表日）。流れ図 = 2 行 × 3 列（登録・受付 → 面接・審査 → 許可・合格）、列間に黒い三角の矢印"
margins:
  左（p.2）: { 上: "約 8%（表の前の 1 行の注記まで）／表の上端 約 10.5%", 下: "約 9%（表の下端まで）／ノンブル 下端から約 5%", 小口: "約 8.5%", ノド: "約 1.5%" }
  右（p.3）: { 上: "約 8%（注記行）／表の上端 約 10.5%", 下: "約 9%", ノド: "約 1.5%", 小口: "約 8%" }
gutter: "ノドをはさんで表が連続（ノドの空き 左右合計 W 約 3%）。セル内の余白は W 約 1%"
photo_ratios: null
heading_hierarchy:
  - { level: "表のタイトル（右ページ上の見出し行）", 書体: "太ゴシック", 相対サイズ: "本文の約 1.3 倍", 表現: "見出し行のセル内に、注記と同じ行で並べる" }
  - { level: "列見出し", 書体: "太ゴシック", 相対サイズ: "本文の約 1.2 倍", 表現: "字間を空けて中央揃え" }
  - { level: "行見出し", 書体: "太ゴシック", 相対サイズ: "本文の約 1.3 倍", 表現: "縦書き＋丸数字。セルの上下中央" }
  - { level: "【 】ラベル", 書体: "太ゴシック", 相対サイズ: "基準", 表現: "段落頭のラベル。後続行はラベル幅だけ字下げ" }
  - { level: "本文", 書体: "ゴシック", 相対サイズ: "基準（A4 と仮定すると約 8pt 相当）", 行送り: "約 1.35 倍", 表現: "(1)(2) の番号付き、ぶら下げインデント" }
  - { level: "注記", 書体: "ゴシック", 相対サイズ: "基準", 色: "赤（注）・※・特待生関連の条件）" }
colors:
  役割: "スミ＋赤の 2 色。赤は注意・締切・条件（文字量の約 8〜10%）"
  地: "白"
  面積: "白 80% ／ 文字・罫 18% ／ 赤 2%"
rules:
  - "表の外枠 約 1pt。行の区切り 約 0.75pt、列の区切り 約 0.5pt"
  - "入れ子の小表は外枠 約 0.5pt、内罫 約 0.3pt、見出し行あり"
  - "流れ図の矢印: 細線＋黒い三角（約 0.5pt）"
cards: null
density: "非常に高（片ページ 45〜50 行相当＋入れ子の表）"
page_type: data
eye_flow: "行（入試区分）ごとに: 縦書きの行見出し → 出願資格 → 出願手続 → ノドを越えて右ページの日程・選考方法 → 赤の注記。行が終わったら次の行へ（上から下）"
background: "白地のみ"
image_crop: null
rhythm: "p.1（概要）の次に置かれる、冊子でいちばん情報量の多い見開き。表で全体を俯瞰させ、以降のページ（説明・フォーム）へ参照で送る"
notes: |
  - 向き: 反時計回りに 90° 回転した状態（ページの上が画像の左）。時計回りに 90° 回転して見る
  - 左端に黄色の別紙の端が見える（page_003 参照）。page_004 は同じ見開きの手入りカット
  - 構造の要点: 見開きをまたぐ表。左右のページで行の境界を同じ高さにそろえることで、ノドを越えても行を追える
    → 再現では行の高さを CSS 変数（mm）で共有し、左右ページのテンプレートで同じ値を使う
  - Layer 1: なし
  - Layer 2: 表の罫（外枠・行・列の太さの差）、入れ子の小表、流れ図の矢印（SVG か CSS の三角）
  - Layer 3: すべての文字。入試区分名・日付・金額・定員は company-data（facts）から差し込み、参考資料の値は使わない
  - 再現の注意: 縦書きの行見出し（writing-mode: vertical-rl）、ぶら下げインデント、【 】ラベル後の字下げ、
    文字量が 2 割増えてもセルからあふれないこと（行の高さを固定するなら文字サイズの下限を決めておく）
  - Phase 5 の候補（見開きで検証。片ページなら右の p.3）
