# 参考資料の解析結果（資料全体）— admissions（学生募集要項・冊子）
# Phase 4。system/rules/references.md §4。全 13 枚を画像として目視して記述（OCR・テキスト抽出は不使用）
# 寸法はすべて「ページ（片ページ）の幅・高さに対する比率（%）」。判型の実寸は不明（notes 参照）
# 文章・固有名詞・数字（学費・日付・定員など）は書き写さない。必要な箇所は（学校名）（学科A）のように伏せる

grid:
  基本: "1 段組。版面幅はページ幅の約 80〜84%。見出しは版面中央揃え、本文は左揃え"
  表ページ: "見開き 2 ページを 1 枚の表として使う（行の高さを左右ページでそろえる）。ノド側の余白は約 1.5〜3% と極端に狭い"
  フォーム: "左に縦書きのグループ見出し列（幅約 4〜5%）、その右に項目名列（幅約 12〜15%、均等割り）、残りが記入欄"
  例外: "裏表紙側の交通案内（page_013）だけ 2 段（地図 約 62% ＋ サイドバー 約 22%）"
margins:
  単位: "ページ幅・高さに対する %"
  上: "約 6〜11%（見出しまで）"
  下: "約 8〜10%（本文・表の下端まで）。ノンブルは下端から約 5〜7%"
  ノド: "情報ページ約 2〜10%（見開き表では約 1.5%）、フォームページ約 7〜9%"
  小口: "約 7〜10%"
gutter: "段間はほぼ使わない（1 段組）。表内のセル内余白は左右約 1% ／ 地図とサイドバーの間は約 1%"
photo_ratios:
  - "写真はほぼ使わない。表紙にほぼ正方形（幅:高さ ≒ 1.1:1）のモノクロイラストが 1 点（ページ面積の約 17%）"
  - "フォームに証明写真の貼付枠（縦長、幅:高さ ≒ 3:4）を繰り返し配置"
  - "交通案内に線画の地図（幅:高さ ≒ 0.8:1、面積比約 32%）"
heading_hierarchy:
  - { level: "表紙タイトル", 書体: "太ゴシック", 相対サイズ: "本文の約 4 倍", 字送り: "1 文字分以上の大きな字間", 色: "黒ベタ帯に白抜き" }
  - { level: "ページ見出し（情報ページ）", 書体: "太ゴシック", 相対サイズ: "本文の約 1.8〜2 倍", 配置: "中央揃え" }
  - { level: "フォーム表題", 書体: "太明朝（一部太ゴシック）", 相対サイズ: "本文の約 2 倍", 字送り: "2〜4 文字分の極端な字間で版面幅の 30〜45% に広げる", 配置: "中央揃え（エントリーシート系は左揃え）" }
  - { level: "帯見出し", 書体: "太ゴシック", 相対サイズ: "本文の約 1.3〜1.8 倍", 表現: "グレーのグラデーション帯（情報ページ）／黒ベタ帯＋グレー帯の 2 段（黄色の別紙）" }
  - { level: "小見出し", 書体: "太ゴシック", 相対サイズ: "本文の約 1.1〜1.2 倍", 表現: "「」でくくる、● 付き、番号付き（1. ／ (1) ／ ①）、【 】ラベル" }
  - { level: "本文", 書体: "情報ページはゴシック、フォームは明朝", 相対サイズ: "基準（A4 と仮定すると約 8〜9pt 相当）", 行送り: "約 1.4〜1.5 倍" }
  - { level: "注記", 書体: "ゴシック／明朝", 相対サイズ: "本文の約 0.8 倍", 色: "条件・締切・注意は赤" }
colors:
  基調: "スミ（K）1 色＋赤 1 色の 2 色刷りが中心。地は白（本文用紙）"
  赤の役割: "条件・締切・金額・注意書き（※・注））の強調に限定。面積は文字量の約 5% 以下。推定 #c0392b 付近"
  グレー: "情報ページの見出し帯（K 20〜55% のグラデーション）、交通案内のタブ帯（K 約 60%、推定 #707072）"
  色紙: "別紙（オープンキャンパス日程）と交通案内は黄色系の色上質紙（推定 #fbf6c8〜#fbf8e0）。紙色そのものを地色として使う"
  表紙: "アイボリー系の紙にスミ 1 色。黒ベタ帯（面積約 5%）が唯一の強いマス"
  面積: "白地 85〜90% ／ スミ文字・罫 8〜12% ／ 赤 1% 未満 ／ グレー帯 1〜3%（情報ページ）"
rules:
  - "表の外枠は約 0.75〜1pt、内側の区切りは約 0.3〜0.5pt（太さの差で表の入れ子を表現）"
  - "フォームの記入行は約 0.3pt の細罫を一定ピッチ（ページ高さの約 2.2%）で並べる"
  - "記入補助の点線リーダー（学校名・年月日の書き込み位置）"
  - "切り取り線は細い破線＋中央に小さなラベル（字間を空けた 4〜5 文字）。ページ高さの約 1/3、2/3 の位置で横断"
  - "領収書・納入方法の囲みは装飾的な破線枠（ミシン目風）"
  - "表紙は細罫 2 本で年度表示をはさみ、細罫の枠をロゴと標語で上下に切り欠く"
cards:
  - "角丸・影は使わない。すべて直角の罫線囲み"
  - "情報ページの強調ブロックは 0.75pt の囲み（例: page_003 の学費優遇制度一覧）"
  - "フォームの小ボックス（希望学科の選択、受験日、受付番号、写真貼付欄）は 0.5〜1pt の枠で記入欄と同じ文法"
density:
  全体: "高（情報ページ・表ページ）／中（フォーム）／低（表紙・注意事項ページ）"
  目安: "表ページは 1 ページ 40〜50 行相当＋入れ子の表。フォームは記入欄が主体で文字量は少ない"
page_type: "募集要項（冊子）: cover / data（募集概要・入試一覧表）/ message（入試制度の説明）/ other（各種申込用紙・受験票・領収書）/ access"
eye_flow: "情報ページは上から下へ 1 本の流れ（見出し → 番号付き項目 → 囲みの強調）。見開き表は行（入試区分）ごとに左ページ → ノドを越えて右ページへ横に読む。フォームは表題 → 宛先 → 選択欄 → 個人情報表 → 自由記述の順"
background: "全ページ紙の地色のみ（白／アイボリー／黄色の色紙）。グラデーション・写真背景・質感表現はない。Layer 1 が必要なのは表紙のイラストだけ"
image_crop: "裁ち落としの画像はない。表紙のイラストは細罫枠の内側に余白を取って置く（枠から約 6% 内側）"
rhythm:
  - "前半（p.1〜6）が説明・一覧の情報ページ、後半（p.7〜14）が切り取って提出するフォーム"
  - "フォームは右ページ（奇数ページ）に置き、裏面は白紙か、切り取り後も手元に残す情報（受験上の注意）を背中合わせに置く"
  - "黄色の別紙（日程）と黄色の交通案内が冊子の前後をはさみ、白い本文と紙色で区別する"
  - "ノンブルは「-n-」形式、ページ下中央"
table_form_design:
  入試一覧表: "行 = 入試区分（4 区分、縦書きの行見出し＋丸数字）、列 = 出願資格 / 出願手続 / 日程・選考方法。右ページのセルの中に「次 × 受付期間・試験日・発表日」の小表や、3 段階の流れ（登録 → 面接・審査 → 許可・合格）を矢印でつないだ小表を入れ子にする"
  ラベル: "【 】でくくった太字ラベル（試験科目・合否判定・募集定員 など）＋本文。条件は赤"
  フォーム共通部品: "受付番号欄（※印・記入不要の注記付き）、写真貼付欄（縦長、注意 3 項目を小さく内包）、○ を付ける選択欄、ふりがな付き氏名欄、縦書きのグループ見出し（本人／保証人）、点線リーダー、押印位置（㊞・印）、右上の大きな円（受付印の位置）"
  表題: "字間を大きく空けた太明朝の表題を中央に置くのが共通の型。発行者名を右寄せで添える"
page_map:
  page_001: { 内容: "表紙（表 1）", 形: "単ページ", page_type: cover }
  page_002: { 内容: "正誤表（別紙）を p.1 に重ねて撮影。左に黄色の別紙、手が写り込み", 形: "合成写真", page_type: other }
  page_003: { 内容: "左: 黄色の別紙（説明会日程）／右: p.1 募集概要・学費優遇制度", 形: "見開き", page_type: data }
  page_004: { 内容: "p.2〜3 入試一覧表（手で隠れ・ぶれ。page_005 と同じ見開き）", 形: "見開き", page_type: data }
  page_005: { 内容: "p.2〜3 入試一覧表（鮮明）", 形: "見開き", page_type: data }
  page_006: { 内容: "p.6〜7（手で隠れ・ぶれ。page_007 と同じ見開き）", 形: "見開き", page_type: message }
  page_007: { 内容: "p.6 入試制度の説明と手順／p.7 エントリーシート（フォーム）", 形: "見開き", page_type: message }
  page_008: { 内容: "p.8 志望理由書（罫線の記入用紙）／p.9 入学願書（フォーム）", 形: "見開き", page_type: other }
  page_009: { 内容: "左: 白紙（フォームの裏面）／右: p.10 受験票・領収書・納入方法（切り取り線で 3 分割）", 形: "見開き", page_type: other }
  page_010: { 内容: "p.11 受験上の注意（上 1/4 のみ）／p.12 推薦書（フォーム）", 形: "見開き", page_type: other }
  page_011: { 内容: "p.13 特待生試験の申込書＋切り取り式の受験票", 形: "単ページ", page_type: other }
  page_012: { 内容: "左: p.13 の裏面（下 1/3 に受験上の注意）／右: p.14 面接シート（フォーム）", 形: "見開き", page_type: other }
  page_013: { 内容: "交通案内（黄色の色紙。連絡先・QR・地図・最寄り駅）", 形: "単ページ", page_type: access }
phase5_candidates:
  - page: page_001
    理由: "構造が明快（細罫 2 本・黒ベタ帯・切り欠き枠・中央揃えの縦一列）で、Layer 1（イラスト）／Layer 2（罫・帯・枠）／Layer 3（文字）の切り分けを最小構成で検証できる。募集要項の表紙の型として自社版にそのまま使える"
  - page: page_005
    理由: "募集要項の核である入試一覧表。見開きをまたぐ表（左右で行の高さをそろえる）、入れ子の小表、矢印の流れ図、赤の注記と、表組みの CSS 部品をまとめて検証できる。手が写っておらず鮮明。片ページだけなら右の p.3 で検証してもよい"
  - page: page_008
    理由: "入学願書（p.9）と罫線の記入用紙（p.8）。フォーム部品（写真貼付欄・選択欄・縦書きグループ見出し・点線リーダー・押印位置）が一通りそろい、ほかの申込用紙（p.7・p.12・p.13・p.14）へ再利用できる共通部品を作れる"
  - page: page_013
    理由: "交通案内の型（連絡先ブロック＋QR＋線画地図＋タブ見出しのサイドバー）。地図を Layer 2 の SVG、地名を Layer 3 で組む練習になり、紙色を CSS の地色で表現する検証にもなる"
  - 代替: "page_003 の右ページ（p.1: 定義リスト＋囲みの強調ブロック）、page_007 の左ページ（p.6: グレー帯見出し＋番号付き手順）"
notes: |
  - 判型: 実寸は不明。ページの縦横比は約 1:1.41（A4・B5 系）。寸法はすべてページ幅・高さに対する比率（%）で記し、
    pt 表記は「A4 と仮定した場合の参考値」として一部だけ添えた。撮影の傾き・パースで ±2% 程度の誤差がある
  - 画像の向き: 13 枚すべて、ページの上が画像の左側に来ている（反時計回りに 90° 回転した状態）。目視・比較の前に
    時計回りに 90° 回転させる。page_011 は台形のゆがみ（パース）も大きい
  - 見開き: page_003〜010、page_012 は 2 ページ見開き（片ページずつ比較する場合は切り出しが必要）。page_001・011・013 は単ページ
  - 欠け: p.4〜5 は画像に含まれない（p.1 から参照されている）。p.12 の裏面なども未撮影。page_002・004・006 は手の写り込み・ぶれがあり比較には使えない（同じ見開きの鮮明版は page_005・007）
  - 裏写り: 本文用紙が薄く、白地の部分に裏ページの表や文字が薄く透けている。再現対象ではない（比較時はノイズとして扱う）
  - 全体の性格: 写真・色をほぼ使わない「事務書類型」の募集要項。デザインの学びどころは表組み・フォーム部品・
    字間を空けた表題・赤の使い方の抑制。Layer 1 が必要なのは表紙のイラストだけで、ほぼ全ページが Layer 2（罫・枠・帯）＋ Layer 3（文字）で再現できる
  - 自社版への変換時、日付・金額・定員・入試区分名・制度名は company-data から差し込む（参考資料の値・名称は使わない）
