background: "白地のみ"
image_crop: null
rhythm: "提出フォームの連続の途中。片面印刷のフォームを切り離す前提のため、裏（左ページ）が白紙になる"
notes: |
  - 向き: 反時計回りに 90° 回転した状態（ページの上が画像の左）。時計回りに 90° 回転して見る。左端に黄色の別紙の端
  - 1 ページを切り取り線で 3 枚の書類に分ける構成。区画の高さはほぼ等分（各 H 約 26〜27%）
  - Layer 1: なし
  - Layer 2: 罫・破線・装飾破線枠（border-style: dashed か SVG の stroke-dasharray）、写真貼付欄
  - Layer 3: 表題・金額・発行者名・注記・納入方法。金額・口座などは company-data から（参考資料の値は使わない）
  - 再現の注意: 切り取り線の位置を mm で固定し、区画内の要素がまたがらないこと
  - Phase 5 の候補外（部品は page_008・page_011 で検証できる）
