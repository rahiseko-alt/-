# kokusai-igaku-gijutsu / admissions / page_009（見開き: 左 = 白紙〔フォームの裏面〕／右 p.10 = 受験票・領収書・納入方法）
# 寸法は各片ページの幅（W）・高さ（H）に対する %。判型の実寸は不明
# 文章・固有名詞・金額・口座情報は書き写さない

grid:
  左: "白紙（ノンブルなし）"
  右（p.10）:
    段組: "1 段。版面 W 6〜93%"
    3 分割: "切り取り線で上下 3 区画に分ける。区画 1 = 受験票（H 3〜30%）／切り取り線 H 約 33% ／区画 2 = 領収書（H 35〜59%）／切り取り線 H 約 62% ／区画 3 = 納入方法（H 64〜89%）"
    受験票: "表題（中央）→ 選択欄 1 行（学科 2 つ＋受験日）→ 受付番号・ふりがな・氏名の 3 行（項目名列 W 約 14%）＋右端に写真貼付欄のセル（W 約 15%、3 行分の高さ）→ 注記と発行者名の行（発行者名は右寄せで大きく）"
    領収書: "表題（中央）＋日付（右）→ 宛名の下線（W 約 45%、末尾に敬称）→ 金額（中央、大）→ 受領文 1 行（中央）→ 注記 2 行（左）＋発行者名（右）"
    納入方法: "表題（中央）→ 定義リスト 3 項目（均等割りの方法名 W 約 14% ＋ 三点リーダー ＋ 内容。内容は 1〜6 行のぶら下げ）"
margins:
  右（p.10）: { 上: "約 3%（表題まで）", 下: "約 11%（区画 3 の下端）／ノンブル 下端から約 7%", ノド: "約 6%", 小口: "約 7%" }
