# kokusai-igaku-gijutsu / admissions / page_013（単ページ: 交通案内。黄色の色紙）
# 寸法はページ幅（W）・高さ（H）に対する %。判型の実寸は不明
# 住所・電話・URL・駅名・施設名などの固有情報は書き写さない

grid:
  上段（H 9〜36%）:
    構成: "表題（中央）→ 学校名（左、W 約 17% から）→ 学科ごとの連絡先ブロック 2 つ（山かっこの学科名見出し＋ 3 行。郵便番号の列 W 約 22%、住所・電話・URL の列 W 約 33% から）"
    QR: "右上（W 約 88〜96%、H 約 13〜19%）。下に小さなキャプション"
  下段（H 38〜90%）:
    構成: "2 段: 地図の枠（W 約 12〜74%）＋右サイドバー（W 約 75〜97%）。段間 W 約 1%"
    サイドバー: "交通手段ごとのブロック 3 つ（各 H 約 13〜15%）。濃グレーのタブ見出し（高さ H 約 2.5%）→ 下車駅（太字）→ 方角・距離・所要時間（字下げ）→ 括弧書きの補足"
margins:
  上: "約 9〜11%（表題まで）"
  下: "約 10%（地図の枠の下端）"
  左: "約 11%"
  右: "約 3%（サイドバーが小口近くまで寄る。撮影で右端が少し切れている可能性あり）"
gutter: "地図とサイドバーの間 W 約 1%"
photo_ratios:
  - "線画の地図（枠の幅:高さ ≒ 0.8:1、ページ面積の約 32%）"
  - "QR コード（正方形、W 約 8%）"
heading_hierarchy:
  - { level: "表題", 書体: "太ゴシック", 相対サイズ: "本文の約 1.8 倍", 表現: "山かっこでくくって中央" }
  - { level: "学科名の見出し", 書体: "太ゴシック", 相対サイズ: "本文の約 1.5 倍", 表現: "山かっこでくくる" }
  - { level: "学校名", 書体: "太ゴシック", 相対サイズ: "本文の約 1.4 倍" }
  - { level: "連絡先（住所・電話・URL）", 書体: "ゴシック（細〜中）", 相対サイズ: "本文の約 1.3 倍", 表現: "字間を広めに取り、数字を等幅に揃える" }
  - { level: "タブ見出し", 書体: "ゴシック・白抜き", 相対サイズ: "本文の約 1.4 倍", 表現: "1 文字ずつ大きく空ける" }
  - { level: "下車駅", 書体: "太ゴシック", 相対サイズ: "本文の約 1.1 倍" }
  - { level: "地図のキャプション", 書体: "太ゴシック", 相対サイズ: "本文の約 1.1 倍", 配置: "地図の枠内の上部" }
  - { level: "地図内のラベル", 書体: "ゴシック", 相対サイズ: "本文の約 0.75 倍（学校の位置は太字で約 1.1 倍）" }
colors:
  地: "黄色の色上質紙（推定 #fbf8e0）。紙色そのものが地色"
  文字: "スミ"
  グレー: "地図の道路（K 約 50%）、タブ見出しの帯（K 約 60%、推定 #707072）、施設の丸印（K 約 70%）"
  面積: "紙色 約 75% ／ 地図のグレー 約 12% ／ 文字・罫 約 10% ／ タブ帯 約 2%"
rules:
  - "地図の枠 約 0.75pt"
  - "地図: 道路はグレーの太線（W 約 1.2%）、鉄道は白黒の縞の太線、地下鉄は濃い破線、高速道路は矢印付きの線、施設は丸印、学校は黒い四角＋太字ラベル、方位記号（N ＋細い矢印）"
  - "タブ見出し: 濃グレーの帯の上辺・右辺に明るい細線（浮き出し風の縁取り）"
cards: null
density: "中（連絡先 6 行＋サイドバー 15 行＋地図ラベル 30 前後）"
page_type: access
eye_flow: "表題 → 学校名 → 連絡先 2 ブロック → QR（右上）→ 地図のキャプション → 地図（学校の位置）→ サイドバーの交通手段（上から下）"
background: "紙色（黄色）だけ。グラデーション・質感なし"
image_crop: "裁ち落としなし。地図は枠の内側で完結"
rhythm: "冊子の最後（裏表紙側）に置く案内ページ。黄色の紙色で、前方の黄色の別紙（日程）と対になり、白い本文をはさむ"
notes: |
  - 向き: 反時計回りに 90° 回転した状態（ページの上が画像の左）。時計回りに 90° 回転して見る。単ページ
  - 紙色の再現: 色上質紙の黄色は Layer 1 ではなく、ページ地色の CSS（ブランドカラーの淡色）で表現する
  - Layer 1: なし（地図も生成しない。地名・駅名を含むため正確性が必要）
  - Layer 2: 地図の線画（SVG。道路・鉄道・破線・丸印・四角）、地図の枠、タブ見出しの帯、連絡先ブロックのグリッド
  - Layer 3: 表題・学校名・連絡先・地図内のラベル・交通案内の文・QR（{{qr}} で生成）。住所・電話・URL・アクセスはすべて company-data/facts/school.yaml から
  - 再現の注意: 地図は自社の所在地で描き直す（参考資料の地図の形・地名は使わない）。サイドバーの右余白が小さいので、自社版では安全領域（--safe）を守る
  - Phase 5 の候補（access ページの型。地図の SVG 化と紙色の地色の検証）
