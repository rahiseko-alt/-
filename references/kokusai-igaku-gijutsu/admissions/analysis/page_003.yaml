notes: |
  - 向き: 反時計回りに 90° 回転した状態（ページの上が画像の左）。時計回りに 90° 回転して見る
  - 見開き: 左は冊子のページではなく、黄色の別紙（差し込み）が重なっている可能性が高い（page_002・005・007 の左端にも黄色の紙が見える）。右が本文 p.1
  - 右ページの上半分の白地に、裏ページ（p.2 の表）が薄く透けている。再現対象ではない
  - Layer 1: なし（写真・質感なし）
  - Layer 2: 黒帯・グレーのグラデーション帯（CSS）、細罫の囲み、定義リストのグリッド、日付一覧の 7 列グリッド
  - Layer 3: すべての文字。日付・金額・定員・制度名は company-data から（書き写さない）。赤の強調は CSS クラスで
  - 再現の注意: 均等割りの項目名（text-align-last: justify など）、日付一覧の列ぞろえ（等幅数字）
  - Phase 5 の代替候補（右の p.1 は定義リスト＋囲みの強調ブロックの型）
