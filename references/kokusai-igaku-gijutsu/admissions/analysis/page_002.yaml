# kokusai-igaku-gijutsu / admissions / page_002（正誤表の別紙を p.1 に重ねて撮影した合成写真）
# 寸法は正誤表の用紙の幅・高さに対する %（用紙の端が手と別紙で隠れているため概算）
# 文章・固有名詞は書き写さない

grid:
  段組: "1 段。表題（小）→ 2 列 × 3 行の表 → 日付と発行者（右寄せ）"
  表: "表幅は用紙幅の約 60%、用紙の中央。左列（項目名）約 20%、右列（内容）約 80%"
margins: "用紙の端が隠れていて計測不可。表は用紙の上から約 40% の位置"
gutter: null
photo_ratios: null
heading_hierarchy:
  - { level: "表題（正誤表であることの表示）", 書体: "明朝（細）", 相対サイズ: "本文の約 1.1 倍", 配置: "表の上・中央" }
  - { level: "本文（表内）", 書体: "明朝", 相対サイズ: "基準" }
  - { level: "日付・発行者名", 書体: "明朝", 相対サイズ: "本文の約 0.9 倍", 配置: "表の右下に右揃え 2 行" }
colors:
  役割: "スミ＋赤（訂正後の文言だけ赤）"
  地: "白の薄紙（下の p.1 が透けて見える）"
rules:
  - "表の外枠・内罫とも約 0.5pt。左列は項目名を中央揃え"
cards: null
density: "低（表 3 行のみ）"
page_type: other
eye_flow: "表題 → 対象箇所 → 誤 → 正（赤）→ 日付・発行者"
background: "白の薄紙。裏写り・下の紙の透けあり"
image_crop: null
rhythm: "冊子本体ではなく、後から差し込まれた訂正用の別紙。冊子のページ順には入らない"
notes: |
  - 向き: 反時計回りに 90° 回転した状態（ページの上が画像の左）。時計回りに 90° 回転して見る
  - 合成写真: 正誤表（薄紙）を p.1 の上に重ね、左に黄色の別紙（説明会日程。page_003 の左と同じ）、右下から手が写り込んでいる。ページとしての完コピ検証には使えない
  - 学べる点: 訂正表の最小構成（項目名列＋内容列、訂正後の文言を赤）。自社で正誤表を出す場合の部品として、Layer 2（2 列の表）＋ Layer 3（文字）で作れる
  - Layer 1: なし ／ Layer 2: 表の罫 ／ Layer 3: 全文字
  - Phase 5 の候補外（手の写り込み・重なり）
