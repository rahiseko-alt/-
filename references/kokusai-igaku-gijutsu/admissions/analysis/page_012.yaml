notes: |
  - 向き: 反時計回りに 90° 回転した状態（ページの上が画像の左）。時計回りに 90° 回転して見る
  - 左ページはノンブルなしの裏面。表（p.13）の切り取り線と同じ高さで区切り、切り離す部分の裏にだけ情報を刷る
  - 右ページは設問の多いアンケート型フォーム。注記の赤は「誰が書くか」の条件表示に使う
  - Layer 1: なし
  - Layer 2: 記入枠・横罫・囲み・小表
  - Layer 3: すべての文字（設問文は自社の入試制度に合わせて新しく書く。参考資料の設問文は使わない）
  - Phase 5 の候補外
