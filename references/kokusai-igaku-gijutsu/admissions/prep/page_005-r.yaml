#   左下 (1189, 1738.5) … ノドの折り目と地の端の延長
# 天の右寄り（x≥1900）は紙が反り上がり、表の上端の罫が右端で約 9px 上へ曲がる。4 点の射影補正では取り除けない（残差 ±3px）
# 判型: 写真上の片ページの縦横比は 約 0.67（1156×1732px）だが、ノド側が背の湾曲で横に縮んで写っている
