# 右ページ（p.3。日程の小表・流れ図・【 】ラベルの段落が入る側）だけを切り出す
# 回転後の画像は 2349×1755px。四隅は画素の実測（回転後の座標）:
#   左上 (1189, 13.5)  … ノドの折り目（x=1188〜1190 の暗い縦線。y=250〜1550 でほぼ垂直）と天の端
#                        （天の上の灰色の帯が終わる位置。x=1300〜1500 で y≈12.5、x=1700 で 11 → ノドへ延長）
#   右上 (2345, 0.5)   … 小口の端（y=800〜1700 で x=2344〜2346 に細い影の線）と天の端の延長（x=2230 で y≈2.5、x≥2300 で撮影範囲の外）
