notes: |
  Google Drive「専門学校パンフレット参考資料」の「国際医学技術専門学校 学生募集要項.pdf」（https://drive.google.com/file/d/1S2JDxxjQGzIHuSRf95_aanrO_a-kO_JA/view）を 2026-10-08 に取り込み。Drive への格納日は 2026-10-07。実際の入手日は【要確認】
  元 PDF は印刷物の写真・スキャン（文字情報なし、埋め込み画像は 72ppi）。ページ画像は同じ解像度の 72dpi・JPEG（品質 85）
  ページ: 写真撮影。冊子を見開きで撮っており、すべて90°回転している（時計回り90°で正立）。page_001=表紙（クリーム色、IIMT ロゴと単色イラスト）。page_002=黄色の内表紙（OC・説明会日程）と p.1 の上に正誤表（令和8年4月付）の紙片を手で押さえた写真。page_003=黄色の内表紙裏（OC・個別説明会の日程）+ p.1（学科・年限・定員・資格・学費優待）。page_004=p.2-3（出願資格・出願手続／願書受付・試験日・合格発表日）で、手により左ページの大半が隠れる。page_005=同じ見開きの再撮影（手なし）。p.4-5 は画像なし。page_006=p.6-7（AO入試について／AOエントリーシート）で、手により一部が隠れる。page_007=同じ見開きの再撮影。page_008=p.8-9（志望理由・自己推薦書／入学願書）。page_009=p.10（受験票・領収書・納入方法）+ 白紙ページ。page_010=p.11-12（受験上の注意／推薦書）。page_011=p.13（高校生特待生試験受験申込書・受験票、横長の写真）。page_012=p.14（入学試験用面接シート）+ 受験上の注意（p.11 と同内容の重複）。page_013=裏表紙の内側（黄色、本校への交通機関・地図・QR）。
  禁止語に未登録の候補（一般名詞と重なるため人間が判断）【要確認】: 1354811（入学検定料・学費の振込口座番号（三菱UFJ銀行 金山支店、理学療法学科）。固有の識別子だが数字だけなので、登録の要否を判断してほしい）、3538314（振込口座番号（作業療法学科）。数字だけなので要判断）、高校生特待生選考試験（その学校の選考試験名だが、一般的な命名で自社でも使う可能性がある）、高校生特待生試験受験申込書（様式名。一般的）、則武新町（他校所在地の町名（番地付きは登録済み）。自社が近隣なら衝突しうる）、451-0051（郵便番号。地区共通のため衝突しうる）、ピラティスインストラクター資格講座（外部資格講座の名称で一般的。自社が同種の講座を設ける可能性がある）、家族（親子・兄弟姉妹・夫婦）の入学優待制度（制度名。一般的）
