# 参考資料の出自（system/rules/references.md）
# npm run ref:ingest で 2026-10-08 に作成。title / obtained / forbidden_terms / notes を人間が記入する
# source / kind は references/<source>/<kind>/ と同じ
source: kokusai-igaku-gijutsu
kind: admissions
title: "2027年度 学生募集要項（国際医学技術専門学校）"
# 入手日（YYYY-MM-DD）
obtained: null
# 元資料（PDF）のパス。画像だけで取り込んだ場合は null
original: "references/kokusai-igaku-gijutsu/admissions/original/kokusai-igaku-gijutsu-admissions.pdf"
# ページ画像の枚数（page_001 〜）
pages: 13
# 固定値。制作の参考以外に使わない
usage: reference-only
# 【必須】自社の BOOK・company-data・shared に絶対に出てはいけない語。取り込み直後に必ず記入する
#   学校名・法人名・略称・英語名、固有の学科名・コース名、固有のキャッチコピー、人物名、企業名、
#   独自の制度名・イベント名、URL・ドメイン・電話番号の特徴的な部分 など
#   一般的な語（「学科」「就職」「オープンキャンパス」など）は登録しない
#   発行元のディレクトリ名（kokusai-igaku-gijutsu）が他校名そのものなら、それも登録する
#   （references/kokusai-igaku-gijutsu/... の形のパスは照合から除外されるので、references.yaml や生成記録の reference_inputs・source_refs の参照には影響しない）
