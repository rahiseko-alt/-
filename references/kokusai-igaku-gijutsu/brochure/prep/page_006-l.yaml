# 比較用の補正指定（Phase 5 / npm run ref:prep）。system/rules/references.md §4
# 元画像 1628×2254px。見開き（冊子の 07-08）を 90° 反時計回りに回転して撮影（文書の天が画像の左）→ 90° 時計回りに戻す（回転後 2254×1628px）
# 左ページ（07: 学科名のタブ・写真を回り込む本文 2 段・科目リスト）だけを切り出す
# 四隅は回転後の画像の画素の明暗から実測（左辺 = 紙の端の影の線、天 = 裁ち落とし写真の上端、地 = 紙の端の影、右 = ノドの谷線）
#   左上 (35.5, 8.5) ／ 右上 (1122, 1) ／ 右下 (1127, 1621) ／ 左下 (12, 1618)
#   左辺は上 35px → 下 12px と傾き、地はノド寄りで下へ 0.5% ほどたわむ（ノドの手前 x = 900px 付近で 1626px）
# 右下だけ実測（y = 1621px = 0.9957）から 0.9865 に上げている: 実測どおりだとページ中ほど（科目リストの帯・ラベル下の細罫）が
#   ノドに向かって 約 0.45° 右上がり（9〜10px）に写るため。0.9865 で帯・細罫が水平（±1px）になる。ノド側の地は白地なので切れても比較に影響しない
image: references/kokusai-igaku-gijutsu/brochure/page_006.jpg
rotate: 90
corners:
  - [0.01575, 0.00522]
  - [0.49778, 0.0006]
  - [0.5, 0.9865]
  - [0.00532, 0.99386]
aspect: 0.7071
height_px: 2000
notes: >-
  紙の端から測ると縦横比は 約 0.68（ノド側が紙の反りで縮んで写る）。表紙のフラットなスキャン（page_002）の縦横比 1:1.413 から
  判型を √2 比と判断し、aspect を A4 縦（0.7071）とした。紙の反りによる局所的なゆがみ（ノド側の 約 1.5% の横の縮み、
  写真の下端のノド寄りの波打ち 0.5〜1mm）は射影変換では取りきれず残る。books/replica/c-course が使用
