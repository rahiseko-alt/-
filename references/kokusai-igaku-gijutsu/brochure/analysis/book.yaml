# 参考資料の解析結果: 資料全体（Phase 4。system/rules/references.md §4）
# 対象: references/kokusai-igaku-gijutsu/brochure/（page_001〜page_014、72dpi JPEG。印刷物を撮影・スキャンした画像で文字レイヤーなし）
# 固有名詞・文章は書き写さない。学校名は（学校名）、2 つの学科は（学科A）（学科B）と伏せる
#
# 【寸法の表記】実寸不明のため、寸法は判型に対する比率で書く
#   - W = 単ページの幅、H = 単ページの高さ（表紙スキャン page_002 の縦横比 1:1.413 → A4 または B5 の √2 比。実寸は不明）
#   - 見開きの位置は「見開き幅に対する比率」（x: 0 = 左ページ小口、0.5 = ノド、1 = 右ページ小口）と「高さに対する比率」（y: 0 = 天、1 = 地）
#   - 参考として A4（210×297mm）と仮定した換算値を「A4換算」で併記する。文字サイズも A4 換算の推定 pt
#   - 撮影画像のため遠近・紙のたわみがあり、比率は ±1〜2% 程度の誤差を含む

grid:
  基本: "単ページ 12 段相当の基準グリッド。実際の運用は 2 段（本文）・3 段（写真カード・ステップ）・4 段（リスト・カード）を同じ版面幅で切り替える"
  版面: "単ページの版面幅 ≈ 86〜88% W。左右ページで版面を対称に取る（見開き単位で設計）"
  よく使う分割:
    - "本文 2 段（段間 ≈ 4% W）: 学科の説明ページ左（page_006・page_008）"
    - "写真カード 3 列 × 2 行（列間 ≈ 3.5% W）: 実習紹介（page_006・page_008 右）"
    - "4 列カード / 4 列リスト: 支援制度・就職先（page_012）"
    - "3 ステップ横並び（破線の区切り + » 記号）: 学年ごとの流れ（page_005・page_008）"
    - "石組み（masonry）写真グリッド 3〜4 列: 施設紹介（page_010）"
  見開きをまたぐ要素: "大きな写真・色面・パネルはノドをまたいで配置する（page_003・page_004・page_005・page_012）。文字はノドをまたがない"
margins:
  単位: "W / H に対する比率（A4換算 mm）"
  top: "≈ 6〜7% H（A4換算 18〜21mm）。見出しの上端"
  bottom: "≈ 5〜7% H（A4換算 15〜21mm）。ノンブルは地から ≈ 2.5% H"
  inside: "≈ 6〜8% W（A4換算 13〜17mm）"
  outside: "≈ 5〜7% W（A4換算 11〜15mm）"
  ノンブル: "小さな欧文セリフ数字（2 桁ゼロ埋め）を地の小口寄りに置く。≈ 6pt"
gutter: "本文段間 ≈ 4% W（A4換算 ≈ 8mm）、カード列間 ≈ 3.5% W（≈ 7mm）、写真グリッドの間隔 ≈ 1.5% W（≈ 3mm）"
photo_ratios:
  - "4:3 横位置が主（実習カード・施設・教員の顔写真）"
  - "3:4〜2:3 縦位置（人物インタビュー・代表者の肖像）"
  - "見開き幅の 60〜80% × 高さ 35〜60% の横長大判写真（ノドまたぎ、天・小口に裁ち落とし）"
  - "クローズアップ（手・腕・器具）の大判写真を背景・導入に使う。人物の顔を写さない写真で質感を作る"
  - "表紙は全面写真（空 + 4 人の集合写真）"
heading_hierarchy:
  - { level: "表紙の学校名", size_pt: "≈ 36〜40", weight: "ゴシック Medium", note: "中央揃え。上に法人名（小）、下に学科名（中）と罫線ではさんだ分野名" }
  - { level: "ディスプレイ見出し（明朝）", size_pt: "≈ 28〜32", weight: "明朝 Regular〜Light", note: "見開きの導入コピー 2〜3 行。page_003・page_004・page_013" }
  - { level: "学科名（縦組み）", size_pt: "≈ 48〜54", weight: "明朝 Regular", note: "色面上に白抜き縦組み + 斜体セリフの大きな通し番号 + 欧文の縦サブタイトル。page_005" }
  - { level: "見開きタイトル", size_pt: "≈ 20〜24", weight: "ゴシック Medium〜Bold", note: "中央揃え + 下に長い細罫、右に学科名を淡色明朝で。page_007・page_009 右" }
  - { level: "セクション見出し（最頻）", size_pt: "≈ 13〜15", weight: "ゴシック Bold", note: "左に学科色の縦棒（幅 ≈ 1mm、高さ = 文字高）。全ページ共通の部品" }
  - { level: "小見出し・カード見出し", size_pt: "≈ 11〜12", weight: "ゴシック Bold", note: "写真カードの見出し、データ項目の小見出し" }
  - { level: "ラベル", size_pt: "≈ 7〜9", weight: "ゴシック Bold", note: "黄色の蛍光ペン風タグ / 学科色の帯（白抜き中央揃え）/ 角丸ピル / リボン形の縦ラベル" }
  - { level: "データ数字", size_pt: "≈ 70〜90", weight: "高コントラストのディドン系セリフ", note: "単位は ≈ 20pt の明朝・ゴシックで数字の右下にベースライン揃え。page_004" }
  - { level: "本文", size_pt: "≈ 8.5〜9.5", weight: "ゴシック Regular", note: "行送り ≈ 1.8〜1.9、やや広めの字間。注記 ≈ 6〜7pt" }
  - { level: "欧文アクセント", size_pt: "≈ 8〜30", weight: "字間を広げたサンセリフ / クラシックなセリフ", note: "表紙のタブ、学科名の英語併記、見開きタイトルの欧文" }
colors:
  方針: "白地が主役。学科ごとに色を切り替えるカラーコード + 黄色の蛍光ペン風アクセント。実際の色は自社ブランドカラーに置き換える（下の 16 進値は撮影画像からの参考推定）"
  base: { role: "紙面の地色（白）", ref: "#ffffff", 面積: "本文ページの 60〜80%" }
  text: { role: "本文・見出し（黒〜濃いグレー）", ref: "#222222" }
  dept_a: { role: "学科A のテーマ色（青系）。縦の色面、帯見出し、表のヘッダ、インデックスタブ、円グラフ", ref: "色面 #6b9ab4 前後 / 帯・表ヘッダ #2c6b9b 前後", 面積: "学科A のページで 5〜25%" }
  dept_b: { role: "学科B のテーマ色（深緑系）。帯見出し、ステップ見出しの淡色、インデックスタブ、円グラフ", ref: "濃 #366b54 前後 / 淡 #dde6e2 前後", 面積: "学科B のページで 5〜15%" }
  accent: { role: "黄色の蛍光ペン風マーカー（データのラベル、見出しの下線、Q&A の強調）", ref: "#f3e14a 前後", 面積: "1〜3%" }
  surface: { role: "クリーム色のパネル（制度紹介）、淡グレーのパネル（裏表紙の情報）", ref: "クリーム #fcefc8 前後 / 淡グレー #eef1f3 前後", 面積: "見開きの 15〜25%（使うページのみ）" }
  sub_accent: { role: "金茶（理念の語）、赤（土曜日の列・小さなリボン）、オレンジ茶（制度カードの見出し文字）", 面積: "1% 未満" }
  cover: { role: "表紙は空の水色グラデーション（左上 #c4ddfb 前後 → 中央以下で白）+ 白い大欧文。裏表紙は白地 + 淡い青灰の大欧文" }
  関連資料: "page_001 のチラシは青・黄・赤・クリームの高彩度配色、募集要項の表紙はクリーム色の紙 + 黒 1 色刷りで、冊子本体とトーンが異なる"
rules:
  - "細罫（≈ 0.25〜0.3pt、グレー〜黒）: 見出しの下、データ数字の下、人名の下、リスト見出しの横に長く引く"
  - "セクション見出し左の縦棒（≈ 1mm 幅、学科色）"
  - "破線（≈ 0.5pt）: ステップ間の区切り、円グラフを囲む枠"
  - "点線のリーダー罫: 所要時間の表（裏表紙）"
  - "罫線ではさむラベル: 中央にラベル、左右に細罫（page_003 の理念、page_013 のタイトル）"
  - "枠の上辺を文字が切る見出し（fieldset の legend 風）: page_006・page_008 右下のボックス"
  - "四隅に斜めの線が飛び出す枠: インタビューのカード（page_007・page_009 右）"
  - "ページ下端の多重細罫（3〜4 本の平行線）: インタビューページの下飾り"
cards:
  - "吹き出しボックス: 白地 + 細い枠線 + 上辺に小さな三角の尻尾。代表者・教員のコメント"
  - "写真カード: 4:3 写真 + 太字見出し + 本文 4 行。枠・影なし。写真の左下に角丸ピルのタグを重ねる場合あり"
  - "フローティングカード: 大判写真の下端に白いカード（影なし・角丸なし）を重ね、ステップ図を入れる（page_005）"
  - "制度カード: クリーム色パネル上に白い見出しボックス（わずかな影）+ その下に本文を直接置く（page_012）"
  - "インタビューカード: 細枠 + 角の斜線、縦写真、縦組みキャッチを白い短冊で写真に重ねる、リボン形の縦ラベル（下端が V 字に切れた帯）"
  - "ポラロイド風写真: 白フチ + ドロップシャドウ + ±2° の傾き（page_013 右）"
  - "角丸なしが基本。角丸は表紙のタブ（片側）とピル形タグのみ"
density:
  全体: "中〜高。導入（表紙・理念・データ）は中、学科ページ・就職先一覧は高"
  目安: "写真の多いページで 1 ページあたり写真 3〜13 点。本文ページは 1 ページ 800〜1,500 字相当。就職先一覧は 1 ページ 60 項目以上"
page_type: "brochure（学校案内）。表紙 + 本文 22 ページ（01〜22）+ 裏表紙と推定（計 24 ページ、中綴じ相当）。01 は表紙の裏（表 2）、22 は表 3 にあたると推定"
eye_flow: "見開き単位で設計。導入は大判写真 → 明朝のディスプレイ見出し → 本文。学科ページは色面の学科名（左上）→ 大判写真 → 右ページのモジュール（ステップ・表・カード）と Z 型に流れる"
background:
  - "Layer 1 にすべき表現: 表紙の空 + 人物の全面写真、データ見開きの全面ぼかし写真（手のクローズアップ、低彩度）、教員紹介の背景写真（低彩度の布・手）"
  - "大半のページは白地で、写真は枠内に置く。背景表現は導入部と表紙に集中"
  - "Layer 2 で作れる面: 学科色の色面、クリーム・淡グレーのパネル、白の半透明パネル（不透明度 80〜90%）、方眼紙（page_013 右）"
image_crop:
  - "大判写真は天・小口に裁ち落とし、ノドをまたぐ。人物は腰〜膝で切る"
  - "クローズアップ写真（手・腕）は大胆にトリミングし、顔を入れない"
  - "顔写真は肩までのバストアップ、頭上に少し余白"
  - "版面内の写真グリッドは裁ち落とさない"
rhythm:
  構成: "導入（表紙 → 理念・メッセージ → データ）→ 学科A ブロック（扉 → 学び・実習 → 教員・学生の声）→ 学科B ブロック（同じテンプレートを色だけ変えて反復）→ 共通情報（施設 → 支援制度・就職 → 学校生活・Q&A）→ 裏表紙（アクセス・オープンキャンパス・連絡先）"
  交互: "写真主体の見開き（扉・施設）と文字主体の見開き（学び・就職）が交互に来る"
  索引: "右ページ天の小口側に学科色の小さなバー（インデックスタブ）を裁ち落としで置き、どの学科のページかを示す。共通ページは左右両端に 2 色"
  反復: "学科ブロックは 3 見開き × 2 学科で完全に同じ構成。テンプレート化（色の差し替え）の参考に向く"
notes:
  - "【画像の状態】page_001 は 3 点の印刷物（オープンキャンパスのチラシ・募集要項の表紙・冊子の表紙）をまとめて撮った 1 枚で、どれも 90° 反時計回りに回転している（文書の天が画像の左）。page_002 は表紙のフラットなスキャン（正立）。page_003〜page_013 は見開きを 90° 反時計回りに回転した状態で撮影。page_014 は裏表紙で、同じく 90° 反時計回り"
  - "【ページの欠け・重複】冊子の 11〜12 ページ（学科B の扉にあたる見開きと推定。page_008 の左端に前ページの緑の色面が覗いている）は画像に含まれていない。page_011 と page_012 は同じ見開き（19〜20）の撮り直しで、page_011 は左ページの文字の一部がにじんでいる。解析は page_012 を正とする"
  - "【画像とページの対応】page_002 = 表紙、page_003 = 01-02、page_004 = 03-04、page_005 = 05-06、page_006 = 07-08、page_007 = 09-10、（11-12 欠）、page_008 = 13-14、page_009 = 15-16、page_010 = 17-18、page_011 / page_012 = 19-20、page_013 = 21-22、page_014 = 裏表紙"
  - "【Phase 5 の比較】npm run compare には正立した画像が必要。比較前に 90° 時計回りに回転し、見開きは左右ページに分割、遠近を補正した一時画像を用意する（一時画像は references/ や books/ に置かない）。撮影画像なので画素差は大きく出る。レイアウトの位置関係の確認を主にする"
  - "【流用の注意】数字（データ見開き）・人物写真・学科名・コピーは流用禁止。構造（グリッド、色の役割、部品の形）だけを使う。forbidden_terms は source.yaml に別途記入する（この解析では未記入のまま）"
page_map:
  page_001: { type: other, content: "関連資料 3 点の合成写真（チラシ・募集要項の表紙・冊子の表紙）", layout: "それぞれ単ページ縦。90° 反時計回り" }
  page_002: { type: cover, content: "表紙（表 1）", layout: "単ページ、全面写真" }
  page_003: { type: message, content: "理念・代表者メッセージ（01-02）", layout: "見開き、写真 2 点の対角配置" }
  page_004: { type: data, content: "数字で見る特長（03-04）", layout: "見開き、全面ぼかし写真 + 半透明パネル + 9 項目のデータ" }
  page_005: { type: course, content: "学科A の扉（05-06）", layout: "見開き、縦の色面 + 大判写真 + 円の図 + ステップ + 時間割" }
  page_006: { type: course, content: "学科A の学び・実習（07-08）", layout: "見開き、本文 2 段 + 科目リスト / 写真カード 3×2 + 囲み" }
  page_007: { type: interview, content: "学科A の教員紹介 + 在校生・卒業生の声（09-10）", layout: "見開き、教員カード 3-2-3 / インタビュー 2 本" }
  page_008: { type: course, content: "学科B の学び・実習（13-14）", layout: "page_006 と同型（緑）" }
  page_009: { type: interview, content: "学科B の教員紹介 + 在校生・卒業生の声（15-16）", layout: "page_007 と同型（緑）、左は教員カード 3×2 + 写真列" }
  page_010: { type: other, content: "施設紹介（17-18、左右で学科別）", layout: "見開き、石組み写真グリッド" }
  page_011: { type: data, content: "支援制度・就職状況（19-20）の撮り直し前の画像", layout: "page_012 と同一。左ページの文字がにじむ" }
  page_012: { type: data, content: "支援制度・就職状況・就職先一覧（19-20）", layout: "見開き、写真の帯 + クリーム色パネルに 8 カード + 円グラフ + 4 列リスト" }
  page_013: { type: other, content: "学校生活の年間行事 + Q&A（21-22）", layout: "見開き、縦タイムライン / 方眼紙背景のジグザグ Q&A" }
  page_014: { type: back-cover, content: "裏表紙（表 4）: アクセス・オープンキャンパス日程・連絡先", layout: "単ページ、左端に大欧文 + 情報パネル 2 枚 + 奥付" }
phase5_candidates:
  - page: page_006
    priority: 1
    reason: "学科ページの最頻出部品（縦棒付き見出し、写真を回り込む本文 2 段、学科色の帯見出し + 箇条リスト、4:3 写真カード 3×2 とピル形タグ、legend 付き囲み）がそろう。ほぼすべて Layer 2/3 で作れ、Layer 1 は写真枠のプレースホルダで足りる。page_008 と同型なのでテンプレート化（色の差し替え）の検証にもなる"
  - page: page_004
    priority: 2
    reason: "3 層構造の典型。Layer 1 = 全面のぼかし写真（生成で再現しやすい低彩度の抽象的な写真）、Layer 2 = 白の半透明パネル・細罫・黄色タグ、Layer 3 = ディドン系の大きな数字と単位。数字の組版（ベースライン揃え・単位の大きさ）の検証に向く。数字は company-data かダミーで置く"
  - page: page_007
    priority: 3
    reason: "教員紹介（吹き出しボックス付きカードの千鳥配置）と、インタビュー（角の斜線付き枠・縦組みキャッチの白い短冊・リボン形ラベル）の 2 種類のテンプレートを 1 見開きで検証できる。縦組み（writing-mode）の確認にもなる"
  - page: page_005
    priority: 4
    reason: "学科の扉。縦の色面に白抜き縦組みの学科名、ノドをまたぐ大判写真、SVG の円の図（4 分割ドーナツ + 円弧に沿う文字）、写真に重ねたステップカード、時間割の表と、Layer 2 の難しい部品が多い。難度は高いが、再利用価値が高い"
  - page: page_013
    priority: 5
    reason: "代替候補。方眼紙の背景（CSS のグリッド模様）、縦タイムライン、ポラロイド風写真、蛍光ペン風マーカーなど、Layer 2 だけで作れる装飾の検証に向く"
