page_type: "other（関連資料: a = オープンキャンパスのチラシ、b = 募集要項の表紙、c = 冊子の表紙の重複）"
eye_flow:
  a_チラシ: "上端の学校名 → 集合写真 → 青帯の見出し → 日程（大きな日付）→ 申込の赤帯と QR → 地図・連絡先 → 下端の URL"
  b_募集要項の表紙: "黒帯のタイトル → イラスト → 学校名（中央の縦一直線）"
background:
  - "a: 写真 + クリームの平塗り。人物のイラスト（ゆるいタッチ）を帯の両端や余白に散らす"
  - "b: 色紙そのもの（クリーム）。背景表現なし。イラストは 1 色のフラットなタッチ"
image_crop:
  - "a: 集合写真は左右に裁ち落とし、人物は膝下で切る。帯が写真の下端に重なる"
  - "b: イラストは枠の内側に余白をとって収める"
rhythm: "冊子とは別の配布物。冊子（page_002〜page_014）とはトーンが違う（チラシは高彩度・高密度、募集要項は 1 色刷り）"
notes:
  - "寸法は各文書の幅 W・高さ H に対する比率。撮影画像で遠近がある。チラシは文書の天側が画角の外にあり、全体の縦横比は不明"
  - "Layer の切り分け（a_チラシ）: Layer 1 = 集合写真（自社の写真）・人物イラスト（生成可。文字なし）、Layer 2 = クリームの地、青帯、赤い角丸帯、丸バッジ、日程ラベルの枠、地図の枠、下端の青帯、Layer 3 = 見出し・キャッチ・日付・曜日・取り消し線（CSS の line-through か SVG の線）・QR・住所・URL。地図は文字を含むため SVG で描き、ラベルは Layer 3 にする"
  - "Layer の切り分け（b_募集要項の表紙）: Layer 1 = モノクロイラスト（生成可。欧文の文字は入れない）、Layer 2 = クリームの地（または用紙色に任せる）、細罫、黒帯、イラストの枠、Layer 3 = 年度・タイトル・ロゴタイプ（自社ロゴの正式データ）・タグライン・学科名・学校名"
  - "b は 1 色刷りの募集要項の表紙として、自社の募集要項 BOOK の参考になる（低コスト・高い可読性）"
  - "c（冊子の表紙）は page_002 のほうが鮮明なので、解析は page_002 を使う"
  - "チラシの日程・定員・住所・URL・電話番号などの固有情報は書き写していない"
