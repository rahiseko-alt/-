  b_募集要項の表紙: { base: "クリーム〜淡黄の紙（#f6efb0 前後）", ink: "黒 1 色（イラストもグレースケール）", 面積: "地 85% / 黒 15%" }
rules:
  - "b: 天側の年度を上下 2 本の細罫ではさむ（≈ 0.3pt、幅 ≈ 75% W）"
  - "b: イラストを細い矩形の枠で囲み、上辺をロゴタイプ、下辺をタグラインが切る"
  - "a: 地図・入力欄風の白い枠（細罫）"
cards:
  - "a: 定員を示す白い丸バッジ 2 つ（写真の右下に重ねる。縁は細い緑系）"
