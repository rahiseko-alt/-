#   (b) 画像中央: 募集要項の表紙（クリーム色の紙、単ページ縦）
#   (c) 画像下部: 冊子の表紙（page_002 と同じもの。斜めから撮影）
# 寸法は各文書の幅 W・高さ H に対する比率（正立に直した状態）。実寸不明

grid:
  a_チラシ: "1 段の縦積み。上 55% が写真、下 45% がクリーム地の情報エリア。情報エリアは左 60%（日程・申込・連絡先）と右 40%（地図）の 2 列"
  b_募集要項の表紙: "中央揃えの 1 軸。上から 細罫 / 年度 / 細罫 / 黒帯のタイトル / 枠囲みのイラスト / 学科名 / 学校名"
  c_表紙: "page_002 を参照"
margins:
