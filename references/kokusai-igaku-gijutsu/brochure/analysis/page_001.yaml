  - { level: "a: 帯見出し", note: "青い帯の中に黄色の極太ゴシック（≈ 5% W の文字高）" }
  - { level: "a: 日付", note: "黒の極太ゴシック数字（大）+ 曜日を青い丸の中に白抜き。終わった日付は赤い取り消し線" }
  - { level: "b: タイトル", note: "黒帯に白抜きの太ゴシック 6 文字、字間を大きく広げる（≈ 8% W の文字高）" }
  - { level: "b: ロゴタイプ", note: "枠の上辺を切る白抜き（輪郭線）のセリフ欧文大文字" }
  - { level: "b: 学科名・学校名", note: "黒のゴシック Medium（中）を 2 段、中央揃え" }
colors:
