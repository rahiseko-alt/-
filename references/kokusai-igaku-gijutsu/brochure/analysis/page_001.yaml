  b_募集要項の表紙: "左右 ≈ 12〜14% W（罫と枠の端）、天 ≈ 9% H、地 ≈ 12% H。ゆったりとした余白"
gutter: "a_チラシの情報エリア 2 列間 ≈ 3% W"
photo_ratios:
  - "a_チラシ: 横長の集合写真（幅 100% W × 高さ ≈ 50% H、≈ 2:1）。人物 6 人が横一列"
  - "b_募集要項の表紙: 写真なし。ほぼ正方形のモノクロイラスト（≈ 55% W 幅）"
heading_hierarchy:
