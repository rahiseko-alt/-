# 参考資料の解析結果: page_010（system/rules/references.md §4）
# 画像: 見開き（冊子の 17-18）。90° 反時計回りに回転して撮影（文書の天が画像の左）。1520×2181px
# 寸法: 位置は見開き幅に対する比率 x（0 = 左小口、0.5 = ノド、1 = 右小口）と高さに対する比率 y。W = 単ページ幅、H = ページ高さ

grid:
  構成: "左ページ = 学科A の施設、右ページ = 学科B の施設。各ページとも 学科見出し（y 0.04〜0.065）→ ラベル + 細罫（y 0.095〜0.105）→ 写真グリッド（y 0.115〜0.95）"
  写真グリッド: "石組み（masonry）。基準は 3 列（各 ≈ 27% W）で、大きな写真は 2 列分を占める。左ページ 11 点、右ページ 12 点"
  左ページの例: "1 行目 = 建物外観（1 列・縦長）+ 大判の室内（2 列）、2 行目 = 玄関（1 列）、3 行目 = 小 3 点、4 行目 = 中 2 点（1.5 列ずつ）、5 行目 = 小 3 点"
  右ページの例: "1 行目 = 建物外観（1 列・縦長）+ 大判の室内（2 列）、2〜3 行目 = 左に小 2 点を縦積み + 右に中 1 点（2 列）、4〜5 行目 = 小 3 点 × 2 行"
margins:
  左ページ: "小口 ≈ 10% W、ノド ≈ 5% W、天 ≈ 8% H（見出しの上端）、地 ≈ 5% H"
  右ページ: "ノド ≈ 6% W、小口 ≈ 5% W"
  ノンブル: "地の小口寄り、≈ 6pt"
gutter: "写真の間隔 ≈ 1% W（A4換算 ≈ 2mm）。左右ページの写真グリッドはノドで分かれる"
photo_ratios:
  - "建物外観: ≈ 5:6 縦位置（1 列幅）"
  - "大判の室内: ≈ 4:3 横位置（2 列幅、高さ ≈ 31% H）"
  - "小さな室内: ≈ 4:3〜3:2 横位置（1 列幅）"
  - "中くらいの室内: ≈ 4:3 横位置（1.5〜2 列幅）"
  - "面積比: 写真 ≈ 80% / 白地 + 文字 ≈ 20%"
heading_hierarchy:
  - { level: "学科見出し", size_pt: "≈ 20", weight: "ゴシック Bold、学科色（左 = 青、右 = 深緑）", note: "右に字間を広げた欧文の学科名（≈ 9pt、黒）を同じベースラインで併記" }
  - { level: "ラベル", size_pt: "≈ 10", weight: "ゴシック Medium、学科色", note: "下に版面幅の細罫" }
  - { level: "写真のキャプション", size_pt: "≈ 7", weight: "ゴシック Medium、黒", note: "写真の左下に重ねた白いタブ（階数 + 部屋名）" }
colors:
  base: { role: "白地", 面積: "≈ 20%" }
  photo: { role: "写真（白い床・天井、明るい室内）", 面積: "≈ 80%" }
  dept_a: { role: "左ページの学科見出し・ラベル・左上のインデックスタブ（青）" }
  dept_b: { role: "右ページの学科見出し・ラベル・右上のインデックスタブ（深緑）" }
rules:
  - "ラベルの下に版面幅の細罫（≈ 0.3pt、グレー）"
cards:
  - "キャプションのタブ: 白い長方形（角丸なし・影なし）を写真の左下隅に重ね、中にキャプション 1 行"
  - "インデックスタブ: 左ページの天の小口側に青、右ページの天の小口側に深緑のバー（両学科共通のページなので 2 色）"
density: "高（写真）。1 ページに写真 11〜12 点、文字は見出しとキャプションだけ"
page_type: other
eye_flow: "左上の学科見出し → 建物外観 → 大判の室内 → グリッドを上から下へ。右ページも同じ順"
background: "白地。背景表現なし。写真グリッドが面を埋める"
image_crop:
  - "室内写真は広角で、天井と床が入る構図に統一（グリッドの見た目がそろう）"
  - "建物外観は見上げの縦位置"
  - "裁ち落としなし。すべて版面内"
rhythm: "学科ブロック（文字の多い見開き）の後に来る写真主体の見開き。左右で学科を分け、同じ構成を鏡のように並べる。この後の page_012（支援制度・就職）で再び文字主体になる"
notes:
  - "寸法は見開き幅・ページ高さに対する比率。撮影画像のため ±2% 程度の誤差"
  - "Layer の切り分け: Layer 1 = 施設写真 23 点（自社の写真。生成した施設写真を学校の写真として使わない）、Layer 2 = 写真グリッド（CSS grid の span で石組みを作る）、キャプションのタブ、細罫、インデックスタブ、Layer 3 = 学科見出し・欧文の学科名・ラベル・キャプション・ノンブル"
  - "Phase 5 ではすべて写真枠のプレースホルダ（比率を合わせる）で再現できる。グリッドの寸法合わせの検証には向くが、見た目の情報が写真に依存するため優先度は低い"
  - "部屋名・階数・建物の文字は書き写していない"
