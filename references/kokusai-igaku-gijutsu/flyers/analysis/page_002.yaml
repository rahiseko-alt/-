# flyers / page_002（裏面: 学校の特長 4 項目）
# 寸法はページ幅（W）・高さ（H）に対する %。判型の実寸は不明（縦横比 約 1:1.46）
# 文章・固有名詞・数字は書き写さない

grid:
  ゾーン:
    - "タイトル帯（H 0〜8.7%）: プラムの全幅帯＋その下に淡いピンクの細い帯（H 8.7〜9.3%）の 2 段。中央に（学校名）と特長の数を示す 1 行の見出し、右端に小さな飾りイラスト"
    - "特長ゾーン（H 9.3〜68.5%）: 白地に行モジュール 4 段"
    - "写真ゾーン（H 68.5〜94.5%）: 全幅の裁ち落とし写真"
    - "フッター帯（H 94.5〜100%）: プラムの全幅帯。法人名（小）＋（学校名）（大）＋角丸のピル型バッジ"
  行モジュール:
    列: "番号の円 W 5〜19.5% ／ 本文 W 21.5〜77% ／ 画像 W 77〜95%（補足ボックスは W 21.5〜95% の全幅）"
    段の位置: "第 1 段 H 11〜27%、第 2 段 H 29〜41%、第 3 段 H 43〜54%、第 4 段 H 56〜67%（補足ボックス付きの段が高い）"
    内訳: "見出し 1〜2 行 → 本文 2〜3 行 → （任意）補足ボックス 1 つ。画像は右列に縦位置で中央揃え、見出しの横に小さなイラストを添える段もある"
margins:
  上: "タイトル帯が天から裁ち落とし。特長ゾーンの最初の要素まで H 約 11%"
  下: "フッター帯が地まで裁ち落とし"
  左右: "約 5%（円・本文・画像）。帯と写真は左右裁ち落とし"
gutter: "円と本文の間 W 約 2%、本文と画像の間 W 約 1.5%、段と段の間 H 約 2%"
photo_ratios:
  - "下部のパノラマ写真: 幅:高さ ≒ 2.6:1（面積の約 26%）。実習風景の群像、人物は全身〜膝上"
  - "特長 3・4 の写真: 幅:高さ ≒ 1.15:1 と 1.3:1、W 約 17%（角は直角、枠なし）"
  - "特長 1・2: 背景を切り抜いた機器の写真（輪郭で抜く。W 約 20%）"
  - "小さなフラットイラスト（人物の机上作業・建物）を見出しの右に添える"
heading_hierarchy:
  - { level: "タイトル（帯）", 書体: "極太ゴシック（丸み）", 相対サイズ: "文字高 H 約 3.3%", 色: "白。数字だけ黄で約 1.4 倍" }
  - { level: "番号", 書体: "極太ゴシック", 相対サイズ: "数字 H 約 5%、数字の前に置く小さな前置き語は H 約 1.3%", 色: "プラム（淡黄の円の中）" }
  - { level: "特長の見出し", 書体: "極太ゴシック", 相対サイズ: "文字高 H 約 2.2%、1〜2 行", 色: "プラム" }
  - { level: "本文", 書体: "ゴシック", 相対サイズ: "文字高 H 約 1.15%", 行送り: "約 1.6 倍", 表現: "キーワードを太字（色は同じダークグレー）" }
  - { level: "補足ボックスのラベル", 書体: "太ゴシック", 相対サイズ: "文字高 H 約 1%", 色: "オレンジ茶。【 】でくくった語＋問いかけ" }
  - { level: "補足ボックスの本文", 書体: "ゴシック", 相対サイズ: "文字高 H 約 0.9%", 色: "グレー" }
  - { level: "フッター", 書体: "ゴシック", 相対サイズ: "（学校名）H 約 1.6%、法人名・バッジ H 約 0.9%", 色: "白（バッジはプラム文字）" }
colors:
  プラム: "推定 #94296a。タイトル帯・フッター帯・見出し・番号・円の縁（面積 約 12%）"
  淡いピンク: "タイトル帯の下の細帯（推定 #c58aa8 前後）"
  淡黄: "推定 #fff6b0。番号の円の塗り（約 3%）"
  黄: "タイトル内の数字"
  生成り: "補足ボックスの地（ベージュ）"
  オレンジ茶: "補足ボックスのラベル"
  本文: "ダークグレー（推定 #333〜#444）"
  地: "白（約 55%）"
  写真: "約 30%"
rules:
  - "罫線なし。区切りは帯と余白だけ"
cards:
  - "番号の円: 直径 W 約 14%、淡黄の塗り＋プラムの太い縁（W 約 0.6%、A4 なら約 1.2mm 相当）"
  - "補足ボックス: 生成り色、角丸 約 1%、柔らかいドロップシャドウ、高さ H 約 3.5%（2 行）"
  - "フッターのバッジ: 淡いピンクの角丸ピル＋プラムの文字"
density: "中（4 モジュール × 見出し 1〜2 行＋本文 2〜3 行＋補足 2 行）"
page_type: other
eye_flow: "タイトル帯 → 特長 1（円 → 見出し → 本文 → 補足 → 画像）→ 特長 2 → 3 → 4（左上から右へ、上から下へジグザグ）→ 実習写真 → フッター"
background: "白の平らな地（Layer 2）。下 1/4 が写真（Layer 1）。グラデーション・質感なし。白地に表面の文字が薄く透けている（再現対象外）"
image_crop: "下部写真は左右と下（フッター帯まで）を裁ち落とし。特長の写真は版面内に直角でトリミング、切り抜き写真は余白なしで輪郭のまま置く"
rhythm: "表面の裏。表は写真が上、裏は写真が下で、表裏の重心を入れ替える。4 段の同形モジュールの繰り返しで読みやすいリズムを作る"
notes: |
  - 向き: 正立（回転不要）。単ページ。軽い傾きあり
  - 再利用部品: 「番号の円＋見出し＋本文＋補足ボックス＋画像」の行モジュール。shared/components に 1 つのパーシャルとして作り、段数・画像の有無を引数で切り替える
  - Layer 1: 下部の実習写真、特長の写真・切り抜き写真（自社写真。なければ文字なしの生成画像）、小さなイラスト（shared/generated-assets）
  - Layer 2: タイトル帯（2 段）・フッター帯・番号の円・補足ボックス（角丸＋影）・フッターのバッジ（すべて CSS、色はブランドカラー変数）
  - Layer 3: タイトル・番号・見出し・本文・補足・フッターの（学校名）。特長の内容は自社の事実（company-data）から新しく書く。参考資料の特長・数字は使わない
  - 再現の注意: 見出しが 1 行／2 行のどちらでも段の高さが追従すること（段は固定高にせず、画像列は align-items: center）
  - Phase 5 の第一候補（構造が明快で部品化しやすい）
