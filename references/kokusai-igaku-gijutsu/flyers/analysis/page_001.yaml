# flyers / page_001（表面: オープンキャンパス告知）
# 寸法はページ幅（W）・高さ（H）に対する %。判型の実寸は不明（縦横比 約 1:1.44）
# 文章・固有名詞・日付・定員・住所・電話・URL は書き写さない

grid:
  ゾーン:
    - "ヘッダー（H 0〜6.5%）: 白地。左にキャッチ（赤茶）、右に（学校名）（紺・大）を 1 行でベースライン揃え"
    - "写真（H 6.5〜45.5%）: 全幅の裁ち落とし。上部中央にキャッチコピー 1 行、右下に丸バッジ 2 つ（W 68〜80%・81〜93%、H 35〜43%）、左下にイラスト"
    - "見出し帯（H 45.5〜50.5%）: 紺の全幅帯。中央に見出し（黄）、両端にイラストを帯の上へはみ出して重ねる"
    - "情報ゾーン（H 50.5〜94.5%）: クリームの地"
    - "フッター帯（H 94.5〜100%）: 紺の全幅帯。中央に（URL）を白で大きく字間を空けて"
  情報ゾーンの内訳:
    - "導入文 2 行（W 5〜95%、H 52〜56%）"
    - "日程: 左に年のラベル箱（W 5〜18.5%、高さ H 約 9% と 6%）、右に日付の流し組み（W 21〜95%、1 行 5〜6 件、3 行＋2 行）と補足 1 行"
    - "申込バー（W 5〜62%、H 73.5〜76%）"
    - "QR 列（H 77〜87%）: QR 3 つ（各 W 約 10.5%）＋中央にイラストと吹き出しタグ 2 つ。各 QR の上に山かっこのラベル 1〜2 行"
    - "連絡先 2 行（W 5〜62%、H 87.5〜90% と 90.5〜93%）: 左に学科色のラベル帯（W 約 14%）＋白地の細枠に住所・電話"
    - "地図パネル（W 65〜95%、H 65〜92.5%）＋左下に重なる丸バッジ（W 63〜74%、H 84〜92%）"
margins:
  上: "約 2%（ヘッダー文字まで）。写真は H 6.5% から"
  下: "フッター帯が地まで裁ち落とし。情報ゾーンの最下要素は H 約 93%"
  左右: "約 5%（文字・パネル）。写真・帯は裁ち落とし"
gutter: "情報ゾーンの左ブロックと地図パネルの間 W 約 3%。QR 同士の間 W 約 2〜3%"
photo_ratios:
  - "ヒーロー写真: 幅:高さ ≒ 16:9（1.78:1）、ページ面積の約 39%。人物 6 名の集合写真、腰〜膝から上、頭上に約 15% の余白"
  - "人物イラスト 4 点（フラット・線なし）: 写真の左下、帯の両端、日付の右、QR 列の中央"
  - "QR コード 3 点（正方形、W 約 10.5%）"
heading_hierarchy:
  - { level: "見出し帯の見出し", 書体: "極太ゴシック（丸み）", 相対サイズ: "文字高 H 約 2.6%", 字送り: "やや広め", 色: "黄（紺地）" }
  - { level: "学校名（ヘッダー）", 書体: "太ゴシック", 相対サイズ: "文字高 H 約 2.7%", 色: "紺" }
  - { level: "ヘッダーのキャッチ", 書体: "太ゴシック", 相対サイズ: "文字高 H 約 2.2%", 色: "赤茶" }
  - { level: "写真上のキャッチコピー", 書体: "太ゴシック", 相対サイズ: "文字高 H 約 1.8%", 色: "スミ（写真の明るい壁の上）" }
  - { level: "日付", 書体: "太ゴシック（欧文数字）", 相対サイズ: "文字高 H 約 2.2%", 表現: "曜日は紺（一部は青緑）の円に白抜き。終了分は赤の打ち消し線" }
  - { level: "年ラベル", 書体: "太ゴシック", 相対サイズ: "文字高 H 約 1.8%（下の時間表示は約 0.9%）", 色: "紺" }
  - { level: "申込バー・ラベル", 書体: "太ゴシック", 相対サイズ: "文字高 H 約 1.1%", 色: "白（バー）／赤茶（山かっこのラベル）" }
  - { level: "本文（導入文）", 書体: "ゴシック", 相対サイズ: "文字高 H 約 1.1%", 表現: "後半を赤茶で強調" }
  - { level: "丸バッジ", 書体: "ゴシック", 相対サイズ: "学科名 H 約 1% ／ 数字 H 約 2%", 色: "学科色" }
colors:
  紺: "推定 #2353aa。学校名・見出し帯・フッター帯・年ラベル・曜日の円（面積 約 10%）"
  黄: "見出し帯の文字"
  赤茶: "推定 #be371a。キャッチ・申込バー・強調文・打ち消し線（約 2%）"
  クリーム: "推定 #faebc2。情報ゾーンの地（約 40%）"
  学科色: "青緑（推定 #389090）・黄緑（推定 #7a9b13）。丸バッジの縁と文字、連絡先のラベル帯、地図内の学科ラベル"
  オレンジ: "推定 #c6803e。駅近を示す丸バッジ"
  写真: "約 39%"
rules:
  - "日付の打ち消し線: 赤茶の直線（約 1pt）を日付行の中央に通す"
  - "連絡先の行: 白地の細枠（約 0.5pt、灰色）"
cards:
  - "年のラベル箱: 白地・濃色の細枠・右下にずらした灰色の影（ぼかしなしのドロップシャドウ）"
  - "地図パネル: 白地・角丸 約 2%・灰色の細枠"
  - "QR 枠: 白地・細い色枠（赤茶／青緑／黄緑）"
  - "申込バー: 赤茶の全丸ピル（高さ H 約 2.5%）"
  - "丸バッジ（写真上）: 白地の正円（直径 W 約 11.5%）＋学科色の細い縁"
  - "丸バッジ（地図上）: オレンジの正円（直径 W 約 11%）、中に細い白線で上下 2 段に分割"
  - "吹き出しタグ: 黄色の角丸＋しっぽ"
density: "高（日付 18 前後、QR 3、地図 1、連絡先 2 行、バッジ 3、イラスト 4）"
page_type: other
eye_flow: "（学校名）→ 写真とキャッチ → 見出し帯 → 導入文 → 年ラベルと日程 → 申込バー → QR（左から右）→ 地図とバッジ → 連絡先 → URL 帯"
background: "上半分は写真（Layer 1）、下半分はクリームの平らな色面（Layer 2）。グラデーション・質感なし"
image_crop: "写真は左右裁ち落とし、上はヘッダーの白帯、下は見出し帯で区切る。人物は座位 4 名＋立位 2 名を横一列に、腰〜膝から上で切り、頭上に余白を残してキャッチを載せる"
rhythm: "表裏の表。写真を上に置き（裏は下）、行動（日程・申込）を下半分に集める"
notes: |
  - 向き: 正立（回転不要）。単ページ。軽い傾きあり
  - Layer 1: ヒーロー写真（自社写真 company-data/photos、なければ文字なしの生成画像）。人物イラスト（shared/generated-assets に文字なしで生成。元イラストの英字は入れない）
  - Layer 2: ヘッダー白帯・見出し帯・フッター帯・クリームの地（CSS の色面、塗り足しまで）、年ラベル箱のずらし影、地図パネル、QR 枠、申込ピル、丸バッジ、吹き出しタグ、地図の線画（SVG）
  - Layer 3: （学校名）・キャッチ・見出し・導入文・日付・打ち消し線（CSS の text-decoration か擬似要素）・ラベル・住所・電話・URL・QR（{{qr}}）・バッジ内の文字。日付・定員・連絡先はすべて company-data から
  - 再現の注意: 日付リストは件数が変わっても折り返しで崩れないこと（flex-wrap）。終了日付の打ち消しは日常編集でデータ側のフラグから付け外しできる設計にする
  - 写真上のキャッチは写真の明るい部分に依存するので、自社写真では背景の明度を確認する（必要なら Layer 2 の半透明パネル）
  - Phase 5 の候補（チラシ表面の型）
