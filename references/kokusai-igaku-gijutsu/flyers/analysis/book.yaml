# 参考資料の解析結果（資料全体）— kokusai-igaku-gijutsu / flyers（オープンキャンパス案内チラシ・表裏 2 面）
# Phase 4。system/rules/references.md §4。2 枚とも画像として目視して記述（OCR・テキスト抽出は不使用）
# 寸法はすべて「ページの幅（W）・高さ（H）に対する比率（%）」。判型の実寸は不明（notes 参照）
# 文章・固有名詞・数字（日付・定員・住所・電話・URL など）は書き写さない。必要な箇所は（学校名）（学科A）のように伏せる

grid:
  基本: "1 枚もの・縦位置。左右の余白 約 5% の版面に、水平の帯（ヘッダー帯・見出し帯・フッター帯）で上下をゾーン分けする"
  表面: "上: 全幅の写真ゾーン（H 約 39%）→ 見出し帯 → 下: 情報ゾーン。情報ゾーンは左 約 60%（日程・申込・連絡先）＋右 約 30%（地図）"
  裏面: "上: タイトル帯 → 特長の行モジュール 4 段（番号の円 W 5〜19.5% ／ 本文 W 21.5〜77% ／ 画像 W 78.5〜95%）→ 下: 全幅の写真（H 約 26%）→ フッター帯"
margins:
  単位: "ページ幅・高さに対する %"
  左右: "約 5%（文字要素）。写真と帯は左右とも裁ち落とし"
  上: "表: ヘッダーの文字まで約 2% ／裏: タイトル帯が天から裁ち落とし"
  下: "フッター帯が地まで裁ち落とし（H 約 94.5〜100%）"
gutter: "表面の情報ゾーン 左右の間 W 約 3〜5%。裏面の行モジュール 円と本文の間 W 約 2%、本文と画像の間 W 約 1.5%"
photo_ratios:
  - "表: ヒーロー写真 1 点、全幅・幅:高さ ≒ 16:9（ページ面積の約 39%）。人物の集合写真"
  - "裏: 下部に全幅のパノラマ写真 1 点、幅:高さ ≒ 2.6:1（面積の約 26%）。実習風景"
  - "裏: 特長ごとの小さい写真（約 1.15:1〜1.3:1、W 約 17%）、背景を切り抜いた機器の写真（輪郭で抜く）"
  - "両面に小さな人物イラスト（フラット・線なし）を帯や写真の端に重ねる"
heading_hierarchy:
  - { level: "帯見出し（表の見出し帯／裏のタイトル帯）", 書体: "極太ゴシック（やや丸み）", 相対サイズ: "文字高 H 約 2.6〜3.3%（本文の約 3 倍）", 色: "濃色の帯に黄色（表）／白＋黄色の数字（裏）" }
  - { level: "学校名（表のヘッダー）", 書体: "太ゴシック", 相対サイズ: "文字高 H 約 2.7%", 色: "紺" }
  - { level: "キャッチコピー（写真上）", 書体: "太ゴシック", 相対サイズ: "文字高 H 約 1.8%", 色: "スミ" }
  - { level: "特長の見出し（裏）", 書体: "極太ゴシック", 相対サイズ: "文字高 H 約 2.2%、1〜2 行", 色: "プラム" }
  - { level: "日付（表）", 書体: "太ゴシック（欧文数字）", 相対サイズ: "文字高 H 約 2.2%", 表現: "曜日は円の中に白抜き" }
  - { level: "本文", 書体: "ゴシック", 相対サイズ: "文字高 H 約 1.1%（基準）", 行送り: "約 1.6 倍", 表現: "強調語を太字" }
  - { level: "補足・ラベル", 書体: "ゴシック", 相対サイズ: "本文の約 0.85 倍" }
colors:
  表面: { 主色: "紺（推定 #2353aa。学校名・見出し帯・フッター帯）", 強調: "黄（帯見出しの文字）、赤茶（推定 #be371a。キャッチ・申込バー・注意）", 地: "クリーム（推定 #faebc2。情報ゾーン全面）", 学科色: "青緑（推定 #389090）と黄緑（推定 #7a9b13）で 2 学科を色分け", 補助: "オレンジ（推定 #c6803e。駅近訴求の丸バッジ）" }
  裏面: { 主色: "プラム（推定 #94296a。タイトル帯・フッター帯・見出し・番号）", 強調: "黄（タイトルの数字）", 円の塗り: "淡黄（推定 #fff6b0）", 補足ボックス: "生成り（ベージュ）＋オレンジ茶のラベル", 地: "白" }
  面積: "表: 写真 39% ／ クリーム 40% ／ 紺 10% ／ その他の色 5% ／ 白 6%。裏: 白 55% ／ 写真 30% ／ プラム 12% ／ 淡黄 3%"
  方針: "面ごとに主色を 1 色決め（表 = 紺、裏 = プラム）、帯とフッターで面を囲む。学科は 2 色で一貫して色分け"
rules:
  - "罫線はほぼ使わない。区切りは色帯と面の切り替えで行う"
  - "表の打ち消し線（終了した日付に赤の線）"
  - "連絡先の行: 色付きのラベル帯＋白地の細枠"
cards:
  - "表: 年のラベル箱（白地・細い濃色の枠・右下に灰色のずらし影）"
  - "表: 地図パネル（白地・角丸 約 2%・細い灰色の枠）、QR の白い枠（細い色枠）"
  - "表: 申込への誘導バー（赤茶の全丸のピル形、白抜き文字）"
  - "裏: 補足ボックス（生成り色・角丸 約 1%・柔らかい影）"
  - "裏: 番号の円（淡黄の塗り＋プラムの太い縁、直径 W 約 14%）"
density: "表: 高（要素 20 以上、日付 18 前後・QR 3・地図・連絡先 2 行）／裏: 中（4 モジュール × 3〜6 行）"
page_type: "チラシ: 表 = other（イベント告知）、裏 = other（特長紹介）"
eye_flow: "表: 学校名 → 写真とキャッチ → 見出し帯 → 日程 → 申込バー → QR → 地図・連絡先 → URL。裏: タイトル帯 → 特長 1〜4（番号の円から右へ、上から下）→ 実習写真 → フッター"
background: "写真（Layer 1）と平らな色面（Layer 2）の組み合わせ。グラデーション・質感の背景はない。裏の白地に表面が薄く透けている（再現対象外）"
image_crop: "大きな写真は左右裁ち落とし（表は上下を帯で区切り、裏はフッター帯に接する）。人物は腰〜膝から上でトリミングし、頭上に余白を残す（表はその余白にキャッチを載せる）"
rhythm: "表 = 写真が上・情報が下、裏 = 情報が上・写真が下と、写真の位置を表裏で反転させている。表は行動（日程・申込）、裏は理由（特長）"
page_map:
  page_001: { 内容: "表面: オープンキャンパス告知（ヒーロー写真・日程・QR・地図・連絡先）", 向き: "正立", page_type: other }
  page_002: { 内容: "裏面: 学校の特長 4 項目＋実習写真", 向き: "正立", page_type: other }
phase5_candidates:
  - page: page_002
    理由: "同じ行モジュール（番号の円＋見出し＋本文＋補足ボックス＋画像）の 4 回の繰り返しで、グリッドが明快。shared/components に置ける再利用部品（番号付き特長行）を作れる。写真はプレースホルダか生成画像で代替しやすい"
  - page: page_001
    理由: "チラシ表面の典型（全幅写真＋見出し帯＋日程リスト＋申込バー＋QR＋地図＋連絡先）。Layer 1（写真）と Layer 2（帯・パネル・ピル・ずらし影）と Layer 3（日付・打ち消し線・QR）の重なりを一通り検証できる。日付の打ち消し線は日常編集（Phase 9）の型としても有用"
notes: |
  - 判型: 実寸は不明。縦横比は約 1:1.44（A4 縦 1:1.414 に近い。撮影の傾きで少し伸びている）。寸法はページ比（%）で記した
  - 画像の向き: 2 枚とも正立（回転不要）。単ページ（見開きではない）。軽い傾き・パースあり（±2%）
  - 4 色フルカラー。冊子の募集要項（admissions）とは対照的に、写真・色帯・イラストで訴求する
  - 自社版では主色（紺／プラム）を company-data のブランドカラーに置き換え、学科の色分けも自社の学科数に合わせる
  - 写真の人物・機器・建物は参考資料の写真を使わない（自社写真か、文字なしの生成画像）
