# 入手経路・利用上の注意・見開きの扱い（例: page_002 は 2〜3 ページの見開き）
notes: |
  Google Drive「専門学校パンフレット参考資料」の「国際医学技術専門学校 オープンキャンパス チラシ.pdf」（https://drive.google.com/file/d/15LJ1FwLUAWFaq7av9pRrx-ywEWmrNDoo/view）を 2026-10-08 に取り込み。Drive への格納日は 2026-10-07。実際の入手日は【要確認】
  元 PDF は印刷物の写真・スキャン（文字情報なし、埋め込み画像は 72ppi）。ページ画像は同じ解像度の 72dpi・JPEG（品質 85）
  ページ: A4 縦チラシの両面。page_001=表面、page_002=裏面で、いずれも正立の写真（台形補正あり、端がわずかに切れる）。表面: キャッチ・学生の集合写真・定員バッジ・OC日程（実施済みの日付に取り消し線）・申込QR・Instagram QR・地図・連絡先・URL帯。裏面: 4つの特長（その1〜4）と実習風景の大写真、フッターに法人名・校名。同じ表面が brochure/page_001 の上部にも写っている。
  禁止語に未登録の候補（一般名詞と重なるため人間が判断）【要確認】: ピラティス講座開講（特長その1の見出し。一般的な語の組み合わせ）、最終ゴールまでアシスト（本文の強調句。やや一般的）、一人暮らしを応援（特長その4の見出し。一般的で自社コピーと衝突しうる）、名古屋駅のすぐ近く（地図のバッジ。一般的な表現）、則武新町（住所の町名（番地付きは登録済み）。自社が近隣なら衝突しうる）
