# source / kind は references/<source>/<kind>/ と同じ
source: kokusai-igaku-gijutsu
kind: flyers
title: "オープンキャンパス開催予定（名古屋で“リハビリ”を学ぶなら 国際医学技術専門学校）／国際医学技術専門学校の4つの特長"
# 入手日（YYYY-MM-DD）
obtained: null
# 元資料（PDF）のパス。画像だけで取り込んだ場合は null
